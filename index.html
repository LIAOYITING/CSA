些儲存裝置的存取速度比固態硬碟快？", "o": ["快取記憶體", "藍光光碟", "隨機存取記憶體", "USB TYPE-C 隨身碟"], "e": "題庫答案 (1)(3)(4)。快取記憶體與 RAM 屬記憶體層級，速度遠快於 SSD；題庫也將 USB Type-C 隨身碟列入。藍光光碟需雷射讀取，最慢。"}, {"n": 327, "code": "2-1", "ans": "4", "multi": false, "q": "在 Word 中，下列哪一個段落對齊會調整字元間距，讓左邊界和右邊界都對齊？", "o": ["置中對齊", "靠左對齊", "靠右對齊", "左右對齊"], "e": "左右對齊（Ctrl+J）會自動調整字元間距，使每行左右兩側都貼齊邊界（段落最後一行除外）。"}, {"n": 328, "code": "2-2", "ans": "3", "multi": false, "q": "在 Word 中，若在表格中選取多個儲存格後，再按一下「Delete」鍵會執行以下哪一個動作？", "o": ["刪除儲存格", "刪除表格", "刪除儲存格內容", "刪除儲存格格式"], "e": "在表格中選取儲存格按 Delete 只會清除內容；按 Backspace（選取整個表格時）或用「刪除」指令才會刪除儲存格/表格。"}, {"n": 329, "code": "2-3", "ans": "1", "multi": false, "q": "在 Word 中，使用「Ctrl+Home」快速鍵，可完成何種工作？", "o": ["移到文件的起始端", "移到游標所在的句首", "至上一頁", "移到文件最尾端"], "e": "Ctrl+Home 移到文件開頭；Ctrl+End 移到文件結尾；Home/End 只移到該行行首/行尾。"}, {"n": 330, "code": "2-4", "ans": "4", "multi": false, "q": "在 Word 中，如果想要對一份文件加以保護時，下列敘述何者錯誤？", "o": ["要控制文件的開啟，可以設定保護密碼", "要控制文件的修改，可以設定防寫密碼", "當將文件另存為另一個檔案時，保護密碼仍可以延用", "如果已設定防寫密碼，將無法複製文件的內容"], "e": "防寫密碼只限制「修改並存回原檔」，不知道密碼仍可以唯讀方式開啟並複製內容，故 (4) 錯。"}, {"n": 331, "code": "2-5", "ans": "1", "multi": false, "q": "在 Word 中，按下列何種組合鍵，可以插入分頁符號？", "o": ["Ctrl+Enter", "Shift+Tab", "Alt+Tab", "Shift+Enter"], "e": "Ctrl+Enter 插入分頁符號；Shift+Enter 是手動換行（分行符號，不分段）；Alt+Tab 切換視窗。"}, {"n": 332, "code": "2-6", "ans": "3", "multi": false, "q": "在 Word 中，如果要複製一小段文字到一個位置，下列哪一種作法可以完成？", "o": ["複製文字後，在新的位置上按一下 Ctrl+X", "複製文字後，在新的位置上按一下 Ctrl+C", "選取要複製的文字，按著 Ctrl 鍵並拖曳至新的位置", "選取要複製的文字，按著 Alt 鍵並拖曳至新的位置"], "e": "按住 Ctrl 拖曳＝複製；直接拖曳＝搬移。貼上應按 Ctrl+V，Ctrl+X 是剪下、Ctrl+C 是複製。"}, {"n": 333, "code": "2-7", "ans": "3", "multi": false, "q": "在 Word 中，要刪除圖片的裁剪區域，可透過下列哪一項功能來執行？", "o": ["重設圖片", "移除背景", "壓縮圖片", "變更圖片"], "e": "「壓縮圖片」中有「刪除圖片的裁剪區域」選項，可真正刪掉被裁掉的部分以縮小檔案。"}, {"n": 334, "code": "2-8", "ans": "4", "multi": false, "q": "在 Word 中，如果要設定整頁文件的「花邊」，則下列設定的動作何者可以完成？", "o": ["在版面設定的邊界中設定", "在頁面色彩中設定", "在浮水印中設定", "在頁面框線中設定"], "e": "「設計 → 頁面框線」中的「花邊」下拉選單可為整頁加上圖案框線。"}, {"n": 335, "code": "2-9", "ans": "2", "multi": false, "q": "在 Word 中，關於「範本」之敘述，下列何者錯誤？", "o": ["normal.dotx 為一個共用範本", "範本只能用來建立文件，不能用於建立範本", "範本決定文件的基本資料結構和文件設定", "範本文件所含設定僅適用於以該範本為基礎的文件"], "e": "可以用現有範本修改後再另存成新的範本（.dotx），故 (2) 錯。"}, {"n": 336, "code": "2-10", "ans": "4", "multi": false, "q": "在 Word 中，關於頁面檢視的描述，下列敘述何者錯誤？", "o": ["如果要將整個版面都顯示在視窗中，則要選取「整頁」", "如果選取「頁寬」，則依視窗的寬度自動縮小或放大來調整版面的寬度", "使用者可以自訂檢視的比例", "設定檢視的比例將會影響列印的結果"], "e": "縮放比例只改變螢幕顯示大小，不影響列印結果。"}, {"n": 337, "code": "2-11", "ans": "4", "multi": false, "q": "在 Word 中，下列敘述何者錯誤？", "o": ["可以從 Word 或 Access 等外部檔案匯入資料執行合併列印", "使用巨集功能可以較少的動作完成複雜的工作", "使用文字方塊可使一份文件同時直書與橫書", "不具有繪圖功能，必須以插入物件的方式插入繪圖物件"], "e": "Word 內建「圖案」、SmartArt、繪製畫布等繪圖功能，可直接繪圖，故 (4) 錯。"}, {"n": 338, "code": "2-12", "ans": "1", "multi": false, "q": "在 Word 中，下列敘述何者正確？", "o": ["可以使用書籤快速跳至所定義的位置", "無法製作引文與書目", "無法自行控制字形大小", "有網站管理的功能"], "e": "插入書籤後可用「到」（Ctrl+G）或超連結快速跳到該位置。Word 有「參考資料 → 引文與書目」，也能自訂字型大小；網站管理不是 Word 的功能。"}, {"n": 339, "code": "2-13", "ans": "4", "multi": false, "q": "在 Word 中，以滑鼠在文件左方的選取區上連按滑鼠左鍵三次，可以完成以下哪一個功能？", "o": ["選取一句話", "選取一列", "選取一段", "選取整份文件"], "e": "在左側選取區：按一下＝選一列（行），按兩下＝選一段，按三下＝選整份文件。（在文字上按三下則是選一段。）"}, {"n": 340, "code": "2-14", "ans": "3", "multi": false, "q": "在 Word 中，若要透過「取代」功能將文件中所有“”符號改為「」符號，如“丙級”改為「丙級」，若在「尋找目標」輸入「(“)(*)(”)」，則在「取代為」應輸入為下列哪一項？", "o": ["(「)(*)(」)", "「*」", "「\\2」", "「/2」"], "e": "勾選「使用萬用字元」時，小括號會把尋找內容分組：第 1 組是“、第 2 組是 *（中間文字）、第 3 組是”。取代時用 \\n 引用第 n 組，所以輸入「\\2」，就是用新括號包住原本中間的文字。"}, {"n": 341, "code": "2-15", "ans": "4", "multi": false, "q": "在 Word 中，關於「表格」之敘述，下列何者錯誤？", "o": ["可以對表格中的數字排序", "允許將一個表格分割為二個表格", "可以設定跨頁標題重覆", "可以將表格內容及表格框線轉成文字檔"], "e": "「表格轉換為文字」只會把內容以定位點、逗點等分隔符號轉成文字，框線會消失，無法連框線一起轉成文字。"}, {"n": 342, "code": "2-16", "ans": "1", "multi": false, "q": "在 Word 中，關於「複製」之敘述，下列何者錯誤？", "o": ["可以複製另一文件的版面配置", "如果複製一段文字，在貼上時不想要連格式一起貼上，則可以使用貼上選項的「只保留文字」", "可以從試算表軟體中複製一個表格並貼在文件中", "可以從影像處理軟體中複製一個圖片貼在文件中"], "e": "複製/貼上只能複製內容（文字、表格、圖片、格式），文件的版面配置（邊界、紙張方向等）無法用複製功能複製，要用範本或版面設定。"}, {"n": 343, "code": "2-17", "ans": "4", "multi": false, "q": "在 Word 中，預設下列資訊何者會出現在狀態列中？", "o": ["日期", "輸入法", "檔案大小", "字數統計"], "e": "Word 狀態列預設顯示頁碼（第 x 頁，共 y 頁）、字數統計、語言、檢視模式與縮放比例。"}, {"n": 344, "code": "2-18", "ans": "4", "multi": false, "q": "在 Word 中，關於「快速鍵」之敘述，下列何者錯誤？", "o": ["輸入建立不分行空格：Ctrl+Shift+Space", "移除段落格式：Ctrl+Q", "放大字型：Ctrl+Shift+>", "重複上一個動作：F3"], "e": "重複上一個動作是 F4（或 Ctrl+Y）。F3 用於插入快速組件/自動圖文集。"}, {"n": 345, "code": "2-19", "ans": "1", "multi": false, "q": "在 Word 中，如果要在尺規上拖曳定位點符號時顯示距離左右邊界的距離，應配合按著哪一個按鍵？", "o": ["Alt", "Ctrl", "Shift", "Tab"], "e": "拖曳尺規上的定位點或邊界時按住 Alt，尺規會顯示精確的距離數值，並可微調位置。"}, {"n": 346, "code": "2-20", "ans": "1", "multi": false, "q": "在 Word 中關於「進階尋找」與「取代」的敘述，下列何者錯誤？", "o": ["無法以「格式」來尋找", "使用 Ctrl+PageDown 可以尋找下一個", "可以區隔半形和全形", "可以使用 \"*\" 和 \"?\" 等萬用字元"], "e": "「尋找及取代」的「其他」選項中有「格式」按鈕，可依字型、段落、樣式等格式尋找，故 (1) 錯。"}, {"n": 347, "code": "2-21", "ans": "2", "multi": false, "q": "在 Excel 中，在欄 A 和欄 B 之間的邊線上按二下，可以設定以下哪一項？", "o": ["設定欄 A 和欄 B 一樣寬", "欄 A 設定自動調整欄寬", "欄 B 設定自動調整欄寬", "設定欄 A 的寬度等於欄 B 寬度"], "e": "欄的寬度由右邊界線控制，在 A、B 之間的邊線（A 欄的右邊界）按兩下，會讓 A 欄依內容自動調整成最適欄寬。"}, {"n": 348, "code": "2-22", "ans": "4", "multi": false, "q": "在 Excel 中，下列哪一種方式無法切換工作表？", "o": ["在標籤捲軸上按一下右鍵，再選取一個工作表", "在工作表索引標籤上想要的工作表上按一下", "使用 Ctrl+PageUp 鍵切換", "按一下 Alt+Tab 鍵"], "e": "Alt+Tab 是 Windows 切換「應用程式視窗」的快速鍵。切換工作表用 Ctrl+PageUp/PageDown 或點選工作表標籤。"}, {"n": 349, "code": "2-23", "ans": "4", "multi": false, "q": "在 Excel 中，外部資料所接受的檔案格式不包括下列哪一種？", "o": ["Office 資料庫（*.odc）", "Access 專案（*.ade）", "Web 查詢（*.iqy）", "PowerPoint（*.ppt）"], "e": "「取得外部資料」可匯入資料庫連線檔、Access、Web 查詢、文字檔等資料來源；PowerPoint 簡報不是資料來源。"}, {"n": 350, "code": "2-24", "ans": "3", "multi": false, "q": "在 Excel 中，在選取工作表中的一個圖表後，按一下「列印」按鈕，會產生以下哪一個結果？", "o": ["列印整個活頁簿", "列印整個工作表", "只列印這個圖表", "列印儲存格的內容"], "e": "選取內嵌圖表後列印，Excel 的列印範圍會自動變成「列印選取的圖表」，只印出該圖表。"}, {"n": 351, "code": "2-25", "ans": "4", "multi": false, "q": "在 Excel 中，下列哪一種方法無法列印整本活頁簿內容？", "o": ["選取所有工作表成為一個群組，再按一下「列印」按鈕", "開啟「列印」對話框，選取「列印整本活頁簿」選項，按「確定」", "選取所有工作表成為一個群組，開啟「列印」對話框，選取「列印使用中的工作表」選項，按「確定」", "開啟檔案後，直接按一下「列印」按鈕"], "e": "開檔後直接列印，預設只會列印「使用中的工作表」（目前那一張）。把所有工作表設為群組後列印使用中的工作表，或選列印整本活頁簿，才會印出全部。"}, {"n": 352, "code": "2-26", "ans": "1", "multi": false, "q": "在 Excel 中，在公式中的儲存格參照運算子「:」表示為下列何者？", "o": ["一段儲存格範圍", "兩個儲存格範圍取聯集", "兩個儲存格範圍取交集", "一個儲存格"], "e": "參照運算子：冒號「:」表示連續範圍（A1:B5）；逗號「,」表示聯集（A1:A5,C1:C5）；空格表示交集。"}, {"n": 353, "code": "2-27", "ans": "2", "multi": false, "q": "在 Excel 中，若在公式中要使用文字聯結的運算子，應使用下列哪一個字元？", "o": ["^", "&", "$", "%"], "e": "& 用於串接文字，例如 =\"台北\"&\"市\" 得到「台北市」。^ 是次方；$ 是絕對參照；% 是百分比。"}, {"n": 354, "code": "2-28", "ans": "1", "multi": false, "q": "在 Excel 中，關於「複製」之敘述，下列何者錯誤？", "o": ["當選取工作表中所有儲存格，複製並貼到另一個工作表時，也包含複製其版面配置", "可以從文書處理軟體（例如 Word）複製一個表格", "可以複製一個儲存格的格式到另一個儲存格上", "可以複製一個公式，但只貼上公式的結果"], "e": "複製全部儲存格只會複製內容、格式、欄寬列高，不包含頁面設定（版面配置，如邊界、頁首頁尾）。要連版面一起複製應使用「移動或複製工作表」。"}, {"n": 355, "code": "2-29", "ans": "3", "multi": false, "q": "在 Excel 中，關於「視窗」的敘述，下列何者正確？", "o": ["只能將視窗垂直分割，無法將視窗水平分割", "凍結窗格後，固定不動的儲存格無法修改其內容", "不管分割為幾個視窗，只要在其中一個視窗做修改，每個分割視窗中的內容均會同步被修改", "分割視窗後，可以使用滑鼠來改變分割視窗的大小，而分割的窗格無法改變所要顯示的儲存格"], "e": "分割視窗只是同一份工作表的不同檢視窗格，修改任何一處都會同步反映。分割可水平也可垂直；凍結的儲存格仍可編輯；各窗格可以各自捲動。"}, {"n": 356, "code": "2-30", "ans": "1", "multi": false, "q": "在 Excel 中，運用 Ctrl 鍵選取多個區塊後，要在這些已選取區塊的儲存格之間移動，可以運用哪一個按鍵來達成？", "o": ["Tab", "PageUp", "方向鍵", "Enter"], "e": "依題庫答案為 Tab：在選取範圍內按 Tab 會往右逐格移動並保留選取狀態（Enter 也可在選取範圍內往下移動）；按方向鍵、PageUp 會取消選取。"}, {"n": 357, "code": "2-31", "ans": "2", "multi": false, "q": "在 Excel 中，另存成 HTML 時也選取了「加入互動功能」，即表示發布的網頁具有下列哪一特性？", "o": ["具有影音效果", "以試算表形式顯示工作表", "資料工作表將被轉成圖案型式", "提供線上問答"], "e": "加入互動功能後，網頁會以試算表元件呈現，瀏覽者可以在網頁上輸入、修改資料與計算。"}, {"n": 358, "code": "2-32", "ans": "2", "multi": false, "q": "在 Excel 中，關於「儲存格位址」之敘述，下列何者錯誤？", "o": ["若要設定欄或列為絕對位址則加上「$」符號", "設定相對位址的欄或列，在複製公式時不會被改變其位址", "儲存格位址的表示法為「欄名列號」", "在公式中使用儲存格位址，也可以一個「名稱」來取代"], "e": "「相對位址」在複製公式時會隨位置改變（如 A1 往下複製變 A2）；不會改變的是絕對位址（$A$1）。"}, {"n": 359, "code": "2-33", "ans": "4", "multi": false, "q": "在 Excel 中，關於「儲存格格式」的敘述，下列何者錯誤？", "o": ["如果要隱藏儲存格的內容不顯示，則設定為「;;;」", "如果要表示分數，則整數和分數之間要以一個「空格」分隔", "如果要設定顏色要以「[ ]」含括", "若只要顯示有效位數，則使用「%」"], "e": "自訂格式中只顯示有效位數用「#」（不顯示無意義的 0）；「%」是把數值乘 100 並加上百分比符號。;;; 代表正、負、零、文字四區段都空白，可隱藏內容；[紅色] 設定顏色；分數如 1 1/2。"}, {"n": 360, "code": "2-34", "ans": "2", "multi": false, "q": "在 Excel 中，設定「保護工作表」範圍不包含以下哪一個項目？", "o": ["內容", "顯示比例", "分析藍本", "物件"], "e": "保護工作表可保護「內容、物件、分析藍本」。顯示比例屬檢視設定，不在保護範圍內。"}, {"n": 361, "code": "2-35", "ans": "3", "multi": false, "q": "在 Excel 中，關於「保護活頁簿」之敘述，下列何者錯誤？", "o": ["可以保護活頁簿使之無法插入新的工作表", "可以保護活頁簿使視窗無法改變大小", "活頁簿中各個工作表的儲存格內容無法修改", "密碼可以設定為空的（沒有任何字元）"], "e": "保護活頁簿只保護「結構」（新增、刪除、移動、重新命名工作表）與「視窗」；儲存格內容要用「保護工作表」才能鎖住。"}, {"n": 362, "code": "2-36", "ans": "1", "multi": false, "q": "在 Excel 中，關於資料「篩選」之敘述，下列何者錯誤？", "o": ["可以依特定公式篩選記錄", "可以篩選出某一個數值或文字的記錄", "可以依色彩來篩選資料", "可以使用邏輯運算「且」、「或」來進行篩選"], "e": "依題庫答案，自動篩選可依數值、文字、色彩與「且/或」條件篩選，但無法直接以自訂公式當篩選條件（需用進階篩選的準則範圍）。"}, {"n": 363, "code": "2-37", "ans": "4", "multi": false, "q": "在 Excel 中，關於「合併活頁簿」之敘述，下列何者錯誤？", "o": ["開啟要合併的活頁簿標題欄會顯示「共用」", "在建立活頁簿副本前必須設定「標示編修處」", "在活頁簿副本中有變動的儲存格左上角會有一個三角形記號", "若合併的結果不滿意，只要按一下「復原」按鈕即可以還原"], "e": "合併活頁簿後無法用「復原」還原，若結果不滿意只能另外處理（如事先備份），故 (4) 錯。"}, {"n": 364, "code": "2-38", "ans": "4", "multi": false, "q": "在 Excel 中，關於「小數點問題」之敘述，下列何者錯誤？", "o": ["如果儲存格的小數位數過長，會顯示四捨五入的結果", "如果將一個數代入 Int() 函數，其結果為等於或小於該數之整數", "允許使用者設定在運算時以顯示值為準", "使用 RAND() 函數可以將具有小數的數值四捨五入"], "e": "RAND() 產生 0～1 之間的亂數；四捨五入要用 ROUND() 函數。INT() 會無條件捨去成不大於原數的整數（INT(-2.5)=-3）。"}, {"n": 365, "code": "2-39", "ans": "1", "multi": false, "q": "在 Excel 中，下列敘述何者錯誤？", "o": ["如果要設定起始頁碼，則應在頁首和頁尾中設定", "在版面設定的「縮放比例」功能，可以將 A4 版面的內容放大為 B4 的大小", "在版面設定中可以將文件設定列印結果要佔幾頁", "在版面設定中可以設定「循欄列印」或「循列列印」"], "e": "起始頁碼是在「版面設定 → 頁面」索引標籤的「起始頁碼」欄位設定，不是在頁首/頁尾中設定。"}, {"n": 366, "code": "2-40", "ans": "4", "multi": false, "q": "在 Excel 中，關於「工作表版面設定」之敘述，下列何者錯誤？", "o": ["可以設定列印格線", "可以設定列印欄名列號", "可以設定每面重複的標題列或標題欄", "可以設定只列印儲存格中的公式，而不列印公式的結果"], "e": "版面設定的「工作表」索引標籤沒有「列印公式」選項；要印公式需先切換「顯示公式」（Ctrl+`）再列印。"}, {"n": 367, "code": "2-41", "ans": "1", "multi": false, "q": "在 Excel 中，關於「列印一段儲存格範圍或圖表」之敘述，下列何者錯誤？", "o": ["選取一段儲存格範圍後按一下「列印」按鈕", "在版面設定中的工作表標籤中設定列印範圍", "選取一段儲存格範圍後，在「列印」對話框中選取「列印選定範圍」", "選取一個圖表後按一下「列印」按鈕，則只會列印該圖表"], "e": "只選取儲存格範圍就直接按「列印」按鈕，會列印整個使用中的工作表；必須設定列印範圍或選「列印選取範圍」才只印選取區。"}, {"n": 368, "code": "2-42", "ans": "2", "multi": false, "q": "在 Excel 中，關於「統計圖表」之敘述，下列何者錯誤？", "o": ["若要將一個快取圖案置於統計圖表中，則應先選取統計圖表，然後再插入該圖案，否則該圖案不會在統計圖表中", "相同數列無法在統計圖表中設定顯示兩次", "若要在統計圖表中顯示一個儲存格中的內容，則應先選取該儲存格，並拖曳至統計圖表中即可", "若要在統計圖表中新增一個數列，可以先選取數列所在之儲存格，再拖曳至統計圖表中"], "e": "同一個數列資料可以重複加入圖表（例如一次用直條圖、一次用折線圖顯示），故 (2) 錯。"}, {"n": 369, "code": "2-43", "ans": "4", "multi": false, "q": "在 Word 中，關於「合併列印」之敘述，下列何者正確？", "o": ["可併入 Word 表格的字型格式設定", "可併入 Excel 工作表的儲存格數值設定", "合併輸出可指定至 Access 資料庫", "資料來源如果是 Excel 檔案，則只能指定一個工作表"], "e": "合併列印的資料來源若是 Excel，一次只能選擇一個工作表（或命名範圍）。合併只帶入資料值，不會帶入來源的格式；輸出目的地是新文件、印表機或電子郵件，不能輸出到 Access。"}, {"n": 370, "code": "2-44", "ans": "3", "multi": false, "q": "在 Excel 中，如果想要在一個公式中設定運算結果，而反求其中一個變數的值，則可以使用下列何種功能？", "o": ["規劃求解", "運算列表", "目標搜尋", "合併彙算"], "e": "目標搜尋（Goal Seek）給定公式的目標結果，反推「一個」變數應為多少。規劃求解可處理多個變數與限制條件；運算列表做假設分析表。"}, {"n": 371, "code": "2-45", "ans": "2", "multi": false, "q": "在 Excel 中，關於「函數中引數」之敘述，下列何者錯誤？", "o": ["引數可以是一段儲存格範圍", "引數可以是一個巨集", "引數可以是一個邏輯值", "引數可以是另一個函數"], "e": "函數的引數可以是數值、文字、邏輯值、儲存格參照、範圍或另一個函數（巢狀函數），但不能是巨集。"}, {"n": 372, "code": "2-46", "ans": "1", "multi": false, "q": "在 Excel 中，關於「儲存格錯誤值」之敘述，下列何者錯誤？", "o": ["公式無法運算時顯示錯誤值「#####」", "公式或函數中的號碼有問題時會顯示錯誤值「#NUM!」", "使用的引數或運算元的類型錯誤時，會顯示「#VALUE!」", "使用不知明的函數會顯示錯誤值「#NAME?」"], "e": "「#####」表示欄寬不足以顯示內容（或日期時間為負值），不是公式無法運算。其他常見錯誤：#DIV/0!（除以 0）、#REF!（參照無效）、#N/A（找不到值）。"}, {"n": 373, "code": "2-47", "ans": "4", "multi": false, "q": "在 Excel 中，關於「日期和時間」之敘述，下列何者錯誤？", "o": ["日期中的年月日以「/」符號分隔", "時間中的時分秒以「:」符號分隔", "使用 NOW() 函數可以在每次開啟工作表時，自動更新為當下的日期和時間", "按一下 Ctrl+Alt+Space 可以產生目前的時間"], "e": "輸入目前時間的快速鍵是 Ctrl+Shift+;（分號），目前日期是 Ctrl+;。"}, {"n": 374, "code": "2-48", "ans": "4", "multi": false, "q": "在 PowerPoint 中，所編輯的內容通常無法被儲存成何種檔案格式？", "o": ["PDF", "簡報執行檔", "GIF 圖形交換檔", "WAV 聲音檔"], "e": "PowerPoint 可另存為 PDF、播放檔（.ppsx）、圖片（JPG/PNG/GIF）、影片（MP4），但不能存成純聲音檔 WAV。"}, {"n": 375, "code": "2-49", "ans": "4", "multi": false, "q": "在 PowerPoint 中，下列何者不是其主要的應用目的？", "o": ["強化溝通效果", "提高簡報效率", "縮短簡報製作過程", "儲存大量資料"], "e": "簡報軟體用於呈現、溝通與展示；儲存大量資料是資料庫或試算表的用途。"}, {"n": 376, "code": "2-50", "ans": "2", "multi": false, "q": "在 PowerPoint 中，關於「一般的操作」，下列敘述何者正確？", "o": ["每次播放簡報都必須重新設定一次播放效果", "簡報檔案可以產生獨立播放的檔案，不需進入簡報系統即可播放", "簡報可以設定成自動播放，但無法循環播放多次", "播放簡報投影片必須依照固定的次序，無法改變次序來播放"], "e": "可另存為播放檔（.ppsx）或封裝成影片/光碟，直接開啟就播放。效果設定會存在檔案中；可設定「連續循環播放直到按 Esc」；可用超連結或自訂放映改變順序。"}, {"n": 377, "code": "2-51", "ans": "2", "multi": false, "q": "在 PowerPoint 中，下列物件何者不可以插入簡報投影片中？", "o": ["JPG 圖片", "資料庫的表單", "連結至網際網路上的超連結", "MPEG 影音"], "e": "投影片可插入圖片、影音、超連結、表格、圖表等，但無法插入可運作的資料庫表單（如 Access 表單）。"}, {"n": 378, "code": "2-52", "ans": "2", "multi": false, "q": "在 PowerPoint 中，關於「投影片放映」之敘述，下列何者錯誤？", "o": ["可以隱藏某張投影片不播放", "設定自動播放時，每張投影片只能設定一樣的時間", "可以設定在投影片切換顯示動畫", "可以設定加入聲音旁白"], "e": "自動換頁時間可以每張投影片分別設定（或用「排練計時」記錄各張時間），不必相同。"}, {"n": 379, "code": "2-53", "ans": "4", "multi": false, "q": "資料庫軟體 Microsoft Access 係採用何種資料庫設計方式？", "o": ["階層式資料庫", "網狀式資料庫", "分離式資料庫", "關聯式資料庫"], "e": "Access 是關聯式資料庫管理系統，以資料表儲存資料，並以關聯連接各資料表。"}, {"n": 380, "code": "2-54", "ans": "1", "multi": false, "q": "在 Access 中，若主資料表以「一對多」關聯對應到關聯資料表，當使用者不想在刪除關聯資料表記錄前，就先將主資料表的欄位刪除，則可以設定下列哪一個功能？", "o": ["設定強迫參考完整性", "設定主索引", "設定驗證規則屬性", "設定為查詢精靈資料類型"], "e": "「強迫參考完整性」會阻止刪除仍有相關子記錄的主記錄，也不允許子資料表出現主表不存在的外來鍵值，確保關聯資料一致。"}, {"n": 381, "code": "2-55", "ans": "2", "multi": false, "q": "在 Access 中，下列敘述何者錯誤？", "o": ["每一筆資料在輸入後，立即會被儲存在資料庫中，不必按一下「儲存」按鈕", "當刪除一個資料表後，無法藉由按一下「復原」按鈕找回刪除的資料表", "只要在資料表間建立一對多關聯後，可以在資料表中以樹狀方式顯示多層子資料工作表", "一個資料庫可擁有七種物件"], "e": "本題依題庫答案為 (2)。（Access 刪除資料表時會詢問確認，題庫認定刪除資料表後仍可用「復原」找回；但刪除「記錄」後則無法復原。）其他：資料在離開記錄時自動儲存；一對多關聯可顯示子資料工作表。"}, {"n": 382, "code": "2-56", "ans": "4", "multi": false, "q": "在 Windows 的應用軟體中，當使用「開啟舊檔」功能時，下列何者無助於減少顯示出來的檔案個數，可以快速找到想要的檔案？", "o": ["直接輸入檔案名稱", "選擇檔案類型", "在最近異動選項上輸入條件", "由我的文件夾開始找起"], "e": "輸入檔名、篩選檔案類型、設定修改日期條件都能縮小顯示範圍；從「我的文件」開始找只是換一個起始資料夾，並不會減少檔案數量。"}, {"n": 383, "code": "2-57", "ans": "1", "multi": false, "q": "在 Windows 的應用軟體中，文件如果不想要讓人任意修改，可以設定何種屬性？", "o": ["唯讀", "固定", "隱藏", "凍結"], "e": "「唯讀」屬性使檔案只能開啟閱讀，不能直接修改存回原檔。「隱藏」只是讓檔案不顯示。"}, {"n": 384, "code": "2-58", "ans": "1", "multi": false, "q": "在 Word 中，關於「改變分割視窗中任一個視窗的內容」之敘述，下列何者為正確？", "o": ["分割的兩個視窗內容同時改變", "儲存檔案時，另一個視窗內容才會改變", "只有正在修改的視窗會改變內容", "另一個視窗內容不受影響"], "e": "分割視窗顯示的是同一份文件的兩個區段，在任一窗格修改，另一窗格會同步改變。"}, {"n": 385, "code": "2-59", "ans": "3", "multi": false, "q": "在 Word 中，若要設定一個圖案在每一頁的相同位置重複顯示，則下列哪一種做法可以達成？", "o": ["在整頁模式下插入圖案", "在本文中插入圖案後再設定其格式", "在頁首/頁尾中插入圖案", "在開啟該圖案時設定"], "e": "頁首/頁尾的內容會出現在（同一節的）每一頁，把圖案放在頁首/頁尾編輯狀態中，即可在每頁相同位置重複出現（浮水印也是這個原理）。"}, {"n": 386, "code": "2-60", "ans": "3", "multi": false, "q": "在 Word 中所建立之 B4 大小的文件，若要直接將其全部內容列印至 A4 大小的紙張內部，則可利用下列哪一種方法來完成？", "o": ["直接按「快速列印」即可", "選「檔案」→「列印」→再按「列印」即可", "選「檔案」→「列印」→在「配合紙張調整大小」對話框處選「A4」→再按「列印」即可", "無法直接完成，而必須再重新排版為 A4 大小的文件才可"], "e": "列印設定中的「配合紙張調整大小」（縮放至紙張大小）選 A4，會自動把 B4 版面等比例縮小印在 A4 紙上，不需重新排版。"}, {"n": 387, "code": "2-61", "ans": "1", "multi": false, "q": "在 Word 中，若要使用二種不同格式的頁碼時，必須在不同頁碼之文件中插入下列何種符號？", "o": ["分節", "分頁", "欄", "分段"], "e": "頁碼格式、頁首頁尾、紙張方向等設定以「節」為單位，插入分節符號後，各節才能使用不同頁碼格式（如目錄用 i、ii，內文用 1、2）。"}, {"n": 388, "code": "2-62", "ans": "3", "multi": false, "q": "在 Word 中，若要同時選取某一段文章的第二行第 2 至第 8 個字與第三行第 2 至第 8 個字，可先按下哪一個鍵，再將滑鼠移至第二行第 2 個字按住滑鼠，並拉動滑鼠至第三行第 8 個字即可完成選取的動作？", "o": ["Ctrl 鍵", "Shift 鍵", "Alt 鍵", "Tab 鍵"], "e": "按住 Alt 拖曳是「矩形（垂直區塊）選取」，可選取跨多行的同一欄位區塊。Ctrl 用於選取不連續的多段文字；Shift 用於連續範圍。"}, {"n": 389, "code": "2-63", "ans": "2", "multi": false, "q": "有關 Word 2016 之敘述，下列何者錯誤？", "o": ["使用「插入」「圖例」上的「圖案」，可以繪製基本、流程圖及各樣式的線條", "即使將文件製作成大綱，仍無法將它匯入 PowerPoint 2010 內轉成一張張的投影片", "所建立的表格，可以使用「排序」功能，將表格中的資料根據第一階、第二階及第三階的設定進行排序", "可以利用「合併列印」的功能製作大量的郵遞標籤或信封列印，同時還具有篩選資料的能力"], "e": "Word 使用大綱層級（標題樣式）的文件，可以在 PowerPoint 用「從大綱插入投影片」匯入，每個第一層標題會變成一張投影片，故 (2) 錯。"}, {"n": 390, "code": "2-64", "ans": "1", "multi": false, "q": "在 Excel 中，若執行「複製」動作後，要取消被選取複製後的虛線框，下列哪一個鍵無法達成？", "o": ["Tab 鍵", "Delete 鍵", "Enter 鍵", "Esc 鍵"], "e": "Esc 會取消複製選取框；按 Enter 會貼上並結束複製模式；依題庫，按 Delete（刪除內容）也會結束虛線框。Tab 只是移動儲存格，虛線框仍保留。"}, {"n": 391, "code": "2-65", "ans": "2", "multi": false, "q": "在 Excel 中，若要將二個已開啟在不同檔案的工作表，以左右並排的方式呈現，可選擇下列哪一種功能項目來達成？", "o": ["水平並排", "垂直並排", "階梯式並排", "磚塊式並排"], "e": "「檢視 → 並排顯示」中，垂直並排會讓視窗左右排列（每個視窗是直立的長條）；水平並排則是上下排列。"}, {"n": 392, "code": "2-66", "ans": "3", "multi": false, "q": "在 Excel 中，若要檢查該文件中「英文單字是否有拼錯」之處，可選擇下列哪一種功能項目來達成？", "o": ["「校訂/自動校正選項」", "「校閱/追蹤修訂」", "「校閱/拼字檢查」", "「校閱/翻譯」"], "e": "「校閱 → 拼字檢查」（F7）會檢查英文單字拼寫並提供建議。"}, {"n": 393, "code": "2-67", "ans": "4", "multi": false, "q": "在 Excel 中，若要列印「活頁簿內所有工作表的內容」時，下列哪一項動作可以達成？", "o": ["無法一次列印", "「Office 按鈕/列印/列印範圍」之「全部」", "「版面配置/版面設定」之「工作表」", "「Office 按鈕/列印/列印內容」之「整本活頁簿」"], "e": "在列印的「列印內容」（列印什麼）中選「整本活頁簿」即可一次印出所有工作表。「列印範圍：全部」是指全部頁數。"}, {"n": 394, "code": "2-68", "ans": "1", "multi": false, "q": "在 PowerPoint 中，下列敘述何者正確？", "o": ["簡報檔案可以產生獨立播放的檔案，播放時可不必進入 PowerPoint", "播放效果必須於每次播放簡報前重新設定一次", "簡報播放時必須依照投影片排列的固定順序被播放，並無法改變順序來播放", "簡報可以設定成自動播放模式，但無法被設定成循環播放模式"], "e": "同第 376 題：可另存成播放檔（.ppsx）直接放映。效果設定會保存；可用超連結/自訂放映改變順序；可設定循環播放。"}, {"n": 395, "code": "2-69", "ans": "4", "multi": false, "q": "在 PowerPoint 中，其所編輯的內容無法被儲存成下列哪一種檔案格式？", "o": [".rtf", ".gif", ".pptx", ".dotx"], "e": ".dotx 是 Word 範本格式。PowerPoint 可存成 .pptx、.potx（簡報範本）、.rtf（大綱）、.gif/.jpg/.png（圖片）等。"}, {"n": 396, "code": "2-70", "ans": "1", "multi": false, "q": "在 PowerPoint 中，下列哪一種「檢視模式」可以「提供層次式，並以條列方式來顯示投影片之文字內容」？", "o": ["大綱模式", "標準模式", "投影片瀏覽模式", "投影片放映模式"], "e": "大綱模式以階層條列方式只顯示各投影片的標題與文字內容，便於編修整份簡報架構。投影片瀏覽模式則以縮圖顯示所有投影片。"}, {"n": 397, "code": "2-71", "ans": "3", "multi": false, "q": "有關「關聯式資料庫」之「正規化」之敘述，下列何者正確？", "o": ["所有正規化的觀念均基於「Relational 屬性間之功能的相依性」來發展者", "「第一正規化（1NF）」處理允許有多重值之屬性", "若「Relational R」中的每一個非主鍵之屬性都「完全功能相依」於「R」的主鍵，則該「R」滿足第二正規化", "若「Relational R」中的非主要屬性都「完全功能相依、且遞移相依」於「每一個 R」的鍵值，則該「R」滿足第三正規化"], "e": "2NF 的定義：已符合 1NF，且所有非主鍵屬性都「完全功能相依」於主鍵（消除部分相依）。1NF 要求每個欄位都是單一值（不允許多重值）；3NF 要求「不可有遞移相依」，(4) 說成「遞移相依」是錯的；第四正規化之後是處理多值相依，並非全基於功能相依。"}, {"n": 398, "code": "2-72", "ans": "2", "multi": false, "q": "有關 Microsoft Access「資料庫」之敘述，下列何者錯誤？", "o": ["UNC 在 Windows 的指令格式為 \\\\<server name>\\<share point>\\<path to resource>", "在主要鍵欄位中，可允許出現「重複性的資料」", "在資料欄位型態中，具有「超連結」與「OLE 物件」之型態", "若主資料表被設定為以「一對多」方式關聯對應到關聯資料表，當使用者不想在刪除關聯資料表記錄前，就先將該主資料表之欄位刪除，此時必須設定「強迫參考完整性」"], "e": "主索引鍵（主要鍵）的值必須唯一且不可空白，不允許重複。"}, {"n": 399, "code": "2-73", "ans": "3", "multi": false, "q": "有關 Microsoft Office 之敘述，下列何者正確？", "o": ["在 Word 環境中所建立的表格並不具有「排序」的功能", "在 PowerPoint 中若需使用表格時，必須在 PowerPoint 的操作環境中自行建立，並無法由 Word 先行建立後再貼上", "Word、Excel 與 PowerPoint 的操作環境都可以進行 VBA（Visual Basic for Application）的程式撰寫", "「複製格式」只適用於 Word 與 Excel，至於 PowerPoint 則無此功能"], "e": "Office 各應用程式都內建 VBA 編輯器（Alt+F11），可撰寫巨集程式。Word 表格可排序；表格可跨軟體複製貼上；複製格式（格式刷）三者都有。"}, {"n": 400, "code": "2-74", "ans": "1", "multi": false, "q": "在 Word 環境中，可於「檔案/選項/進階/顯示」內設定所使用的「度量單位」，下列何者不是可使用的選項？", "o": ["行", "公分", "公釐", "Picas"], "e": "度量單位的選項有英吋、公分、公釐、點、Picas。「行」不是度量單位選項（中文版可另外勾選「以字元寬度為度量單位」）。"}, {"n": 401, "code": "2-75", "ans": "4", "multi": false, "q": "在 Word 環境中，有關字型格式的設定的使用，下列何者正確？", "o": ["對英文字套用「細明體」與套用「新細明體」時，其結果是相同的", "「字型大小」可設定的最大值是 72", "字型色彩中「自動」與「黑色」是相同的", "「圍繞字元」每次操作只能作用一個中文字"], "e": "圍繞字元（如把字圈起來）每次只能套用在一個中文字（或兩個半形字元）上。字型大小下拉清單最大 72，但可直接輸入到 1638；「自動」色彩會隨背景變化（深色背景變白字），與黑色不同；細明體與新細明體英文字形不同。"}, {"n": 402, "code": "2-76", "ans": "3", "multi": false, "q": "在 Word 環境中，繪製「垂直文字方塊」並輸入 12pt 中文字 3 個，製作出「趙」字大、「得助」兩字並列的印章樣式文字方塊，下列何者正確？", "o": ["「得助」2 字元，設定為「常用/段落/亞洲方式配置/並列文字」", "「得助」2 字元，設定為「常用/段落/亞洲方式配置/組排文字」", "「趙」這個字元，在「常用/段落/亞洲方式配置」的字元比例，設為 200%", "「趙」這個字元，在「格式工具列」的字型大小設為 24pt、字元比例設為 50%"], "e": "圖中「趙」字被橫向拉寬，佔滿一半寬度，是以「亞洲方式配置 → 字元比例 200%」放寬字形；「得助」兩字上下排在另一半。依題庫答案為 (3)。"}, {"n": 403, "code": "2-77", "ans": "2", "multi": false, "q": "在 Word 環境中，按下列哪個組合鍵可開啟空白文件？", "o": ["Ctrl+A", "Ctrl+N", "Ctrl+V", "Ctrl+O"], "e": "Ctrl+N（New）開新文件；Ctrl+O（Open）開啟舊檔；Ctrl+A 全選；Ctrl+V 貼上。"}, {"n": 404, "code": "2-78", "ans": "4", "multi": false, "q": "在 Word 環境中，有關「並列文字」之敘述，下列何者正確？", "o": ["上列與下列的字數必須相等", "完成「並列文字」的設定後，文字即不能修改", "完成「並列文字」設定後，字型即不能修改", "完成「並列文字」後，字型大小會減為原來的一半"], "e": "並列文字把多個字分上下兩列擠在一行高度中，因此每個字大約縮小為原來的一半。上下列字數不必相等；設定後文字與字型仍可修改。"}, {"n": 405, "code": "2-79", "ans": "2", "multi": false, "q": "在 Word 環境中，下列哪一種情況可以不需手動插入「分節符號」？", "o": ["設定不同的頁面框線", "設定不同的欄數", "設定不同的紙張方向", "在頁尾設定不同的頁碼"], "e": "選取部分文字後設定「欄」，Word 會自動在前後插入「分節符號（接續本頁）」，所以不必手動插入。其他項目通常需先自行分節。"}, {"n": 406, "code": "2-80", "ans": "3", "multi": false, "q": "當某位員工於網頁上複製一段文字，其中包含有文字超連結，於 Word 貼上此段文字後，若不想保有文字超連結，在完成貼上動作後，可在「貼上選項」按鈕中，選取哪一個選項？", "o": ["保持來源的格式設定", "符合目前的格式設定", "保留純文字", "移除超連結"], "e": "「只保留文字」（純文字）會去除所有格式、圖片與超連結，只貼上文字內容。"}, {"n": 407, "code": "2-81", "ans": "3", "multi": false, "q": "在 Word 環境中，若有一張圖片在文字之上，造成部分文字被圖片遮住，希望在不影響文字排版的情況下，將圖片置於文字之下，請問應在「圖片工具」進行何種操作即可完成？", "o": ["排列/移到最下層/下移一層", "排列/移到最下層", "文繞圖/文字在前", "文繞圖/文字在後"], "e": "依題庫答案為 (3)「文字在前」：把文繞圖設為文字在前，圖片就位於文字之下，文字照原排版顯示在圖片上方。（「文字在後」則是圖片蓋在文字上。）"}, {"n": 408, "code": "2-82", "ans": "1", "multi": false, "q": "在 Word 的環境中，大部分的快取圖案可以轉成文字方塊，下列何者不能轉成文字方塊？", "o": ["手繪多邊形", "向右箭頭", "禁止標誌", "流程圖"], "e": "封閉的基本圖案（箭頭、流程圖、禁止標誌等）都能「新增文字」變成文字方塊；手繪多邊形、線條類圖案不能加入文字。"}, {"n": 409, "code": "2-83", "ans": "3", "multi": false, "q": "在 Word 的環境中，可設定顯示格線，以輔助流程圖的繪製；下列何者操作可顯示「格線」？", "o": ["表格工具/繪製框線", "表格工具/設計/框線/檢視隔線", "檢視/勾選格線", "版面配置/分隔設定"], "e": "在「檢視」索引標籤勾選「格線」，頁面就會顯示格線協助對齊圖案。(2) 是顯示表格的虛線格線，與繪圖無關。"}, {"n": 410, "code": "2-84", "ans": "1", "multi": false, "q": "在 Word 的環境中，強制表格在特定的列進行分頁，可於要在下一頁顯示的列上按下列哪個組合鍵？", "o": ["Ctrl+Enter", "Shift+Enter", "Alt+Enter", "Alt+Shift"], "e": "在表格中把游標放在要移到下一頁的列，按 Ctrl+Enter 插入分頁，表格會從該列分到下一頁。"}, {"n": 411, "code": "2-85", "ans": "4", "multi": false, "q": "在 Word 環境中，有關「儲存格對齊」之敘述，下列何者錯誤？", "o": ["可以單獨設定儲存格的垂直對齊", "可以單獨設定儲存格的水平對齊", "可以同時設定儲存格的垂直及水平對齊", "分散對齊只能用於儲存格的水平對齊"], "e": "依題庫答案 (4) 錯：分散對齊在直書等情況下也能用於垂直方向，不是只能用於水平對齊。"}, {"n": 412, "code": "2-86", "ans": "4", "multi": false, "q": "在 Word 環境中，關於「目錄」之敘述，下列何者錯誤？", "o": ["目錄項目來源可為自訂的樣式", "目錄項目來源可為標示大綱階層的段落", "選取目錄，再按「F9」鍵，可更新目錄", "選取目錄，再按「Ctrl」+「F9」鍵，可取消目錄的功能變數，使目錄成為獨立的文字"], "e": "取消功能變數連結（把目錄變成一般文字）是 Ctrl+Shift+F9；Ctrl+F9 是插入一組空白功能變數大括號。F9 更新功能變數。"}, {"n": 413, "code": "2-87", "ans": "3", "multi": false, "q": "在 Excel 環境中，若要在「一個儲存格」中輸入兩列以上的資料，執行強迫換列的動作，需按下列哪一個組合鍵？", "o": ["Shift+Enter", "Ctrl+Enter", "Alt+Enter", "Ctrl+F10"], "e": "Excel 中 Alt+Enter 在同一儲存格內換行。Ctrl+Enter 是把輸入內容同時填入所有選取的儲存格。"}, {"n": 414, "code": "2-88", "ans": "2", "multi": false, "q": "在 Excel 環境中，如果在儲存格中需要顯示日期「109/11/10」，應該如何輸入？", "o": ["c109/11/10", "r109/11/10", "t109/11/10", "y109/11/10"], "e": "中文版 Excel 在年份前加 r（ROC，民國）即可輸入民國年日期，例如 r109/11/10 會被視為 2020/11/10。"}, {"n": 415, "code": "2-89", "ans": "4", "multi": false, "q": "在 Excel 預設環境中，輸入適當資料後拖曳填滿控制點，可自動填滿遞增資料；但輸入下列何者無法達成上述功能？", "o": ["週一", "正月", "甲", "一"], "e": "「週一」「正月」「甲」都在 Excel 內建的自訂清單中（週一～週日、正月～臘月、甲乙丙丁…），可自動遞增。單獨的「一」不在清單內，拖曳只會複製。"}, {"n": 416, "code": "2-90", "ans": "3", "multi": false, "q": "在 Excel 中，A1 及 A2 分別輸入 2026/5/4 及 2026/5/7 後，選取 A1:A2 拖曳填滿控制點至 A4，再選自動填滿選項「以工作日填滿」，試問 A3 及 A4 的資料是？（2026/5/4 是星期一）", "o": ["2026/5/10 及 2026/5/13", "2026/5/8 及 2026/5/9", "2026/5/11 及 2026/5/14", "2026/5/7 及 2026/5/7"], "e": "兩個起始值相差 3 天，所以每次加 3 天，若遇週末就順延到週一：5/7(四)＋3＝5/10（星期日）→ 改為 5/11(一)；5/11＋3＝5/14(四)。"}, {"n": 417, "code": "2-91", "ans": "1", "multi": false, "q": "在 Excel 中，在儲存格中輸入「10-9-6」，並設定儲存格的格式為「m/d (aaa)」，則該儲存格如何顯示？", "o": ["9/6 (週一)", "9/6 (星期一)", "10/6 (週一)", "10/9 (星期一)"], "e": "「10-9-6」被視為 2010 年 9 月 6 日（星期一）。m/d 顯示月/日＝9/6；aaa 顯示簡短中文星期「週一」（aaaa 才是「星期一」）。"}, {"n": 418, "code": "2-92", "ans": "1", "multi": false, "q": "在 Excel 中，A1 及 A2 的格式設定為數值、A3 的格式設定為貨幣（NT$5,802），造成 3 個儲存格的數字右側沒對齊；如何修改 A3 的格式設定才能對齊？", "o": ["NT$#,##0_-", "NT$#,##0*-", "NT$#,##0**", "NT$##,#0?"], "e": "格式碼中「_」加一個字元，會保留該字元寬度的空白。數值格式右側預留了一個空白，所以 A3 也加上「_-」在右側留出一個字元寬，三格的數字就能對齊。「*」則是用後面的字元重複填滿儲存格。"}, {"n": 419, "code": "2-93", "ans": "1", "multi": false, "q": "在 Excel 中，學員成績資料在 A1:E5（E 欄為平均），如果希望當學員「平均」小於 60，則該學員整列的圖樣變成灰-25%；A2 至 E5 之「設定格式化的條件」中，公式應為何？", "o": ["=$E2<60", "=E2<60", "=$E$2<60", "=E$2<60"], "e": "每一列都要看「同一列的 E 欄」：欄要固定（$E），列要隨列變動（2 不加 $），所以是 =$E2<60。若寫 E2，套用到 B 欄時會變成 F2；寫 $E$2 則每列都只看第 2 列。"}, {"n": 420, "code": "2-94", "ans": "4", "multi": false, "q": "在 Excel 中，A1、B1、C1 分別為 2020、7、15，要在 D1 組合成日期並設定格式為 [e/m/d] 顯示 109/7/15；下列公式何者無法達成要求？", "o": ["=DATE(A1,B1,C1)", "=DATEVALUE(A1&\"-\"&B1&\"-\"&C1)", "=VALUE(A1&\"-\"&B1&\"-\"&C1)", "=A1&\"/\"&B1&\"/\"&C1"], "e": "& 串接的結果是「文字」\"2020/7/15\"，日期格式對文字無效，只會顯示 2020/7/15。(1)(2)(3) 都會得到日期序列值，套用民國格式後顯示 109/7/15。"}, {"n": 421, "code": "2-95", "ans": "4", "multi": false, "q": "在 Excel 中，如果單一儲存格已建立超連結，若要對此儲存格進行設定或修改，應如何選取此儲存格？", "o": ["按住 Shift 鍵不放，再用滑鼠點選此儲存格", "按住 Alt 鍵不放，再用滑鼠點選", "按住 Ctrl 鍵不放，再用滑鼠點選", "在此儲存格按滑鼠右鍵"], "e": "直接點選會開啟超連結；在該儲存格按右鍵會選取它並出現快顯功能表，可編輯或移除超連結（也可按住滑鼠左鍵不放約 1 秒來選取）。"}, {"n": 422, "code": "2-96", "ans": "1", "multi": false, "q": "在 Excel 中，資料表中第 2、4 列為「所得稅」、第 3、5 列為「所得」，如果希望與「所得稅」有關的儲存格圖樣為灰-25%；則 B2 至 E5 之「設定格式化的條件」中，公式應為何？", "o": ["=MOD(ROW(),2)=0", "=MOD(ROW(),2)=1", "=MOD(ROW(),4)=0", "=MOD(ROW(),4)=1"], "e": "所得稅在第 2、4 列，都是偶數列。ROW() 傳回列號，MOD(列號,2)=0 表示偶數列，所以用 =MOD(ROW(),2)=0。"}, {"n": 423, "code": "2-97", "ans": "4", "multi": false, "q": "在 Excel 中，有關「非 ASCII 碼排序」之敘述，下列何者錯誤？", "o": ["需先在「自訂清單」內定義排列順序", "每次排序至多只能有一個非 ASCII 碼", "非 ASCII 碼排序必須指定在主要鍵", "排序至多不能超過 3 次"], "e": "依題庫，(1)(2)(3) 為自訂清單排序的限制；排序的次數沒有限制，可以重複執行多次，故 (4) 錯。（新版 Excel 一次可設定多達 64 個排序層級。）"}, {"n": 424, "code": "2-98", "ans": "2", "multi": false, "q": "下列何者是 Excel 所提供的功能？", "o": ["分割儲存格", "同時搬移連續多欄", "調整選取單一儲存格的寬度", "於儲存格的文字段落中插入嵌入式圖片"], "e": "Excel 可以選取連續多欄一起剪下/拖曳搬移。Excel 不能分割儲存格（只能合併後再取消合併）；欄寬是整欄調整，不能只調單一儲存格。"}, {"n": 425, "code": "2-99", "ans": "4", "multi": false, "q": "在 Excel 中，有關「進階篩選」之敘述，下列何者錯誤？", "o": ["篩選資料輸出處，系統會自動產生欄位名稱", "準則範圍中，列與列之間是 OR 的篩選組合關係", "被篩選的資料與篩選結果必須屬於同一張工作表", "篩選準則不能使用函數"], "e": "進階篩選的準則可以使用公式與函數（計算準則）。準則同一列為 AND、不同列為 OR。"}, {"n": 426, "code": "2-100", "ans": "1", "multi": false, "q": "在 Excel 中，提供自動輸入公式對相同鍵值的數值資料作計算的功能稱之為「小計」。在執行「小計」功能之前，資料必須先經過何種處理？", "o": ["排序", "篩選", "資料剖析", "合併彙算"], "e": "小計是依「分組欄位」值改變時插入小計列，所以必須先依該欄位排序，讓相同鍵值的資料排在一起。"}, {"n": 427, "code": "2-101", "ans": "2", "multi": false, "q": "在 Excel 中，B2 輸入公式「A2*C$2」並設定格式為數值、小數位數 0、使用千分位，再拖曳至 B4，B5 輸入 =SUM(B2:B4)，結果發生四捨五入之誤差問題（顯示值加總與合計不符），該如何解決？", "o": ["B2 修改為 =INT(A2)*C$2 再填滿", "B2 修改為 =INT(A2*C$2) 再填滿", "B5 修改為 =ROUND(SUM(B2:B4),0)", "B5 修改為 =ROUND(SUM(A2:A4)*C2,0)"], "e": "格式只改變顯示，儲存格內仍保留小數，合計是用真實值相加，所以和畫面上看到的整數加總不同。把每一格的「計算結果」取整數 =INT(A2*C$2)，實際值與顯示值一致，合計就不會有誤差。"}, {"n": 428, "code": "2-102", "ans": "1", "multi": false, "q": "在 Excel 中，下列哪一種圖表只適用在「僅有一個資料數列」的情況？", "o": ["圓形圖", "折線圖", "雷達圖", "直條圖"], "e": "圓形圖表示「一個數列」中各項目佔整體的比例，只能呈現一個資料數列；多數列要用環圈圖。"}, {"n": 429, "code": "2-103", "ans": "2", "multi": false, "q": "在 PowerPoint 中，若要設定播放時，「標題飛入、內文淡出」，則下列哪項功能可以完成設定？", "o": ["動作設定", "動畫", "自訂動畫", "動畫配置"], "e": "在「動畫」索引標籤可以針對個別物件（標題、內文）分別套用飛入、淡出等進入效果。"}, {"n": 430, "code": "2-104", "ans": "4", "multi": false, "q": "在 PowerPoint 中，如果想將多張圖片一次新增到簡報中，並指定每張投影片配置的圖片數，以自動分配圖片至各投影片中，應如何操作？", "o": ["檔案/匯入", "插入/圖片", "插入/從掃描器或照相機", "插入/相簿"], "e": "「插入 → 相簿」可一次選取多張圖片，設定每張投影片放 1、2、4 張圖片等配置，自動產生相簿簡報。"}, {"n": 431, "code": "2-105", "ans": "4", "multi": false, "q": "在 PowerPoint 中，關於「封裝成光碟」功能之敘述，下列何者錯誤？", "o": ["可以包含連結的檔案", "可以內嵌 True Type 字型", "不需使用 PowerPoint 即可播放簡報", "必需使用燒錄光碟片"], "e": "「封裝成光碟」也可以選擇「複製到資料夾」，把簡報與相關檔案存到硬碟或隨身碟，不一定要燒錄光碟。"}, {"n": 432, "code": "2-106", "ans": "1", "multi": false, "q": "在 PowerPoint 中，其中範本檔的副檔名為？", "o": [".potx", ".ppax", ".pptx", ".ppsx"], "e": ".potx＝範本（Template）；.pptx＝簡報；.ppsx＝播放檔（Show）；.ppam 是增益集。"}, {"n": 433, "code": "2-107", "ans": "2", "multi": false, "q": "在 PowerPoint 中，如要「變更投影片編號的位置」，應在哪裡設定？", "o": ["檢視/頁首及頁尾", "檢視/投影片母片", "檔案/版面設定", "插入/投影片編號"], "e": "投影片編號的位置與格式由投影片母片中的版面配置區決定，在「檢視 → 投影片母片」中移動編號框即可套用到所有投影片。「插入 → 投影片編號」只能決定是否顯示。"}, {"n": 434, "code": "2-108", "ans": "4", "multi": false, "q": "在 PowerPoint 中，有關「插入聲音檔案」之敘述，下列何者錯誤？", "o": ["可設定投影片播放時隱藏聲音圖示", "wav 音效檔大小超過設定值會自動以連結方式處理", "可設定聲音檔重複播放的次數", "mp3 檔可設定以內嵌方式插入"], "e": "依題庫（舊版 PowerPoint）只有 WAV 檔可以內嵌，MP3 等格式一律以「連結」方式插入，故 (4) 錯。（PowerPoint 2010 之後已可內嵌 MP3。）"}, {"n": 435, "code": "2-109", "ans": "1", "multi": false, "q": "在 PowerPoint 中，下列何者的文字可於「大綱模式」中直接編輯？", "o": ["版面配置區", "快取圖案", "文字方塊", "文字藝術師"], "e": "大綱模式只顯示版面配置區（標題、內文預留位置）中的文字；自行插入的文字方塊、圖案、文字藝術師文字不會出現在大綱中。"}, {"n": 436, "code": "2-110", "ans": "1", "multi": false, "q": "下列何種檔案不可匯入至 Microsoft Access 成為資料表？", "o": ["Word", "Exchange", "dBASE", "Outlook"], "e": "Access 可匯入 Excel、文字檔、XML、dBASE、Outlook/Exchange 資料夾、ODBC 等；Word 文件不能直接匯入成資料表（需先另存為文字檔）。"}, {"n": 437, "code": "2-111", "ans": "4", "multi": false, "q": "在 Access 中，關於「資料表主索引鍵」之敘述，下列何者錯誤？", "o": ["每個資料表只能有一個主索引鍵", "主索引鍵最多可由 10 個欄位組成", "資料表允許沒有主索引鍵", "主索引鍵可以使用任何資料類型的欄位"], "e": "備忘（長文字）、OLE 物件、附件等資料類型的欄位不能設為主索引鍵。"}, {"n": 438, "code": "2-112", "ans": "1", "multi": false, "q": "在 Access 中，使用「交叉資料表查詢」時，需搭配下列何項功能？", "o": ["合計", "排序", "準則", "參數"], "e": "交叉資料表查詢需指定列標題、欄標題與「值」，值必須用合計函數（加總、計數、平均等）計算，所以要搭配「合計」。"}, {"n": 439, "code": "2-113", "ans": "1", "multi": false, "q": "在 Access 表單視窗中，下列哪一個控制項無法與資料來源結合？", "o": ["標籤", "文字方塊", "下拉式方塊", "清單方塊"], "e": "標籤是「非結合」控制項，只顯示固定文字；文字方塊、下拉式方塊、清單方塊都能結合欄位資料。"}, {"n": 440, "code": "2-114", "ans": "4", "multi": false, "q": "在 Access 資料庫關聯圖視窗中，執行關聯編輯時，下列何者無法設定？", "o": ["強迫參考完整性", "重疊顯示刪除相關欄位", "連接類型", "關聯類型"], "e": "「關聯類型」（一對一、一對多）是 Access 依兩邊欄位是否為主索引鍵/唯一索引自動判斷的，無法手動設定；強迫參考完整性、串聯刪除（重疊顯示刪除相關欄位）、連接類型都可以設定。"}, {"n": 441, "code": "2-115", "ans": "4", "multi": false, "q": "在 Access 查詢視窗中，下列哪一個準則絕對無法找到符合「台東縣長濱鄉」文字的資料？", "o": ["台*鄉", "台東縣??鄉", "台*長?鄉", "台?鄉"], "e": "萬用字元：* 代表任意多個字元，? 代表恰好一個字元。「台?鄉」只能比對 3 個字的字串，而「台東縣長濱鄉」有 6 個字，所以絕對找不到。(2) ?? 對應「長濱」；(3) * 對應「東縣」、? 對應「濱」。"}, {"n": 442, "code": "2-116", "ans": "3", "multi": false, "q": "在 Access 查詢視窗中，有關 SQL 語法「SELECT TOP 10 訂單明細.訂單代號, Sum(數量*價格) AS 總金額 FROM 訂單明細 GROUP BY 訂單明細.訂單代號 ORDER BY Sum(數量*價格);」之敘述，下列何者錯誤？", "o": ["資料表名稱是「訂單明細」", "「總金額」為自訂欄位名稱", "最後一列改為「ORDER BY 總金額;」，並不影響查詢結果", "1 個訂單代號只會出現 1 筆資料"], "e": "在 Access 中，ORDER BY 不能直接引用 SELECT 中以 AS 取的別名（彙總運算欄位），改成「ORDER BY 總金額」會被當作參數要求輸入，查詢結果會改變，故 (3) 錯。GROUP BY 訂單代號使每個訂單代號只有 1 筆。"}, {"n": 443, "code": "2-117", "ans": "4", "multi": false, "q": "在 Adobe Photoshop 環境中，影像合成後，若要「保留影像的所有圖層」，應儲存成何類型檔案？", "o": ["JPEG", "GIF", "TIF", "PSD"], "e": "PSD 是 Photoshop 原生格式，可完整保留圖層、色版、遮色片等編輯資訊。JPEG、GIF 會合併圖層。"}, {"n": 444, "code": "2-118", "ans": "4", "multi": false, "q": "在 Photoshop 工具箱中，選取「套索工具」後，下列何者不是選項列所提供的功能？", "o": ["增加至選取範圍", "從選取範圍中減去", "與選取範圍相交", "反轉選取"], "e": "選取工具的選項列有：新增選取範圍、增加至選取範圍、從選取範圍中減去、與選取範圍相交。「反轉選取」在「選取」功能表中（Shift+Ctrl+I）。"}, {"n": 445, "code": "2-119", "ans": "2", "multi": false, "q": "在 Excel 中，若儲存格格式設定為會計專用，小數位數為 2 位數，符號為 $，並於該儲存格輸入「=sin(5)」（約 -0.95892），則出現結果應為？", "o": ["-0.96", "-$ 0.96", "-0.96$", "$ -0.96"], "e": "會計專用格式把貨幣符號靠左對齊在儲存格最左側，負號放在符號前面，小數 2 位四捨五入：-$ 0.96。"}, {"n": 446, "code": "2-120", "ans": "2", "multi": false, "q": "在 Excel 中，若在「工作表 1」中的 D3 儲存格定義公式「=A$1+$B2*C$1」，將該儲存格複製至「工作表 3」中的 F8 儲存格內，則 F8 內的公式為下列何者？", "o": ["=C$1+工作表1!$B7*E$1", "=C$1+$B7*E$1", "=工作表1!C$1+$B7*工作表1!E$1", "=工作表1!C$1+工作表1!$B7*工作表1!E$1"], "e": "D3→F8，欄位移 2 欄（D→F）、列位移 5 列（3→8）。有 $ 的部分不變：A$1→C$1（欄變、列固定）；$B2→$B7（欄固定、列變）；C$1→E$1。原公式沒有工作表名稱，複製後會參照新工作表（工作表 3）自己的儲存格，不會自動加上「工作表1!」。"}, {"n": 447, "code": "2-121", "ans": "4", "multi": false, "q": "在 Google 分享文件的試算表功能中，下列哪一個是 Microsoft Excel 所無法完成的？", "o": ["資料排序", "圖表製作", "函數運算", "線上問卷"], "e": "Google 試算表可與 Google 表單整合，製作線上問卷並自動收集回覆；排序、圖表、函數 Excel 都能做。"}, {"n": 448, "code": "2-122", "ans": "1", "multi": false, "q": "在 Excel 中，若「A1、A2、A3」儲存格中之值分別為「100、book、小明」，且 A6 儲存格內所定義之公式為「=Max(A1:A3)」，則 A6 之值應為下列何者？", "o": ["100", "book", "小明", "#VALUE!"], "e": "MAX 以範圍參照時會忽略文字，只比較數值，所以結果是 100。"}, {"n": 449, "code": "2-123", "ans": "4", "multi": false, "q": "在 Excel 中，若「A1、A2、A3」儲存格中之值分別為「book、BOOK、大明」，且 A6 儲存格內所定義之公式為「=Min(A1:A3)」，則 A6 之值應為下列何者？", "o": ["book", "BOOK", "大明", "0"], "e": "MIN 會忽略範圍中的文字；範圍內完全沒有數值時，MIN（及 MAX）傳回 0。"}, {"n": 450, "code": "2-124", "ans": "1", "multi": false, "q": "下列何者不是以 XML 為基礎的文件檔案？", "o": [".doc", ".docx", ".odm", ".odt"], "e": ".doc 是 Word 97-2003 的二進位格式。.docx（Office Open XML）、.odt/.odm（OpenDocument）都是以 XML 為基礎、經 ZIP 壓縮的格式。"}, {"n": 451, "code": "2-125", "ans": "4", "multi": false, "q": "關於 Office Open XML 的描述，下列何者錯誤？", "o": ["是 Microsoft 所研發的檔案格式", "以 XML 為基礎", "通過成為 ISO/IEC 29500 國際標準", "Microsoft PowerPoint 不支援 Office Open XML"], "e": "PowerPoint 2007 以後的 .pptx 就是 Office Open XML 格式（Word 為 .docx、Excel 為 .xlsx）。"}, {"n": 452, "code": "2-126", "ans": "1", "multi": false, "q": "下列何者是 ISO 所通過的 ODF 國際標準？", "o": ["ISO/IEC 26300", "ISO/IEC 29500", "ISO/IEC 27002", "ISO/IEC 646"], "e": "ODF（開放文件格式）＝ISO/IEC 26300；OOXML＝ISO/IEC 29500；ISO/IEC 27002 是資訊安全控制措施；ISO/IEC 646 是 7 位元字元集。"}, {"n": 453, "code": "2-127", "ans": "3", "multi": false, "q": "若在 Excel 的 A1、A2、A3 分別存放 -1、-2、-3，B1、B2、B3 分別存放 1、2、3，則執行 =COUNT(A1:B3) 的結果為下列何者？", "o": ["0", "2", "6", "COUNT(A1:B3)"], "e": "COUNT 計算範圍中「包含數值」的儲存格個數，不管正負。A1:B3 共 6 格都是數值，結果 6。"}, {"n": 454, "code": "2-128", "ans": "123", "multi": true, "q": "下列應用軟體哪些屬於文書處理軟體？", "o": ["Writer", "Pages", "Microsoft Word", "Dropbox"], "e": "答案 (1)(2)(3)。Writer（LibreOffice/OpenOffice）、Pages（Apple）、Word 都是文書處理；Dropbox 是雲端儲存服務。"}, {"n": 455, "code": "2-129", "ans": "123", "multi": true, "q": "下列應用軟體哪些屬於試算表軟體？", "o": ["Calc", "Numbers", "Microsoft Excel", "Pages"], "e": "答案 (1)(2)(3)。Calc（LibreOffice）、Numbers（Apple）、Excel 是試算表；Pages 是文書處理。"}, {"n": 456, "code": "2-130", "ans": "134", "multi": true, "q": "下列應用軟體哪些屬於簡報軟體？", "o": ["Keynote", "Google Chrome", "Microsoft PowerPoint", "Impress"], "e": "答案 (1)(3)(4)。Keynote（Apple）、PowerPoint、Impress（LibreOffice）是簡報軟體；Chrome 是瀏覽器。"}, {"n": 457, "code": "2-131", "ans": "1234", "multi": true, "q": "下列哪些應用軟體可以支援 XML 格式的文件檔？", "o": ["Microsoft Word 2016", "Microsoft Excel 2016", "Mac Pages 10.1", "Apache OpenOffice 4.1.7 Writer"], "e": "答案 (1)(2)(3)(4)。現代辦公軟體的文件格式（OOXML、ODF）都是 XML 基礎，這些軟體都能開啟或儲存。"}, {"n": 458, "code": "2-132", "ans": "34", "multi": true, "q": "關於 Word 的排版間距說明，下列哪些不正確？", "o": ["段落內兩行空白間隔＝行距－字高", "段落間空白間隔＝與下段距離＋段落內兩行空白間隔", "行距是指一行文字底端到下一行文字的頂端", "同時按下 Shift+Enter 鍵與按下 Enter 鍵一樣都可以加入段落間空白間隔"], "e": "答案 (3)(4)。行距是指一行文字的「基線（或頂端）到下一行同一位置」的距離（包含字高），不是底端到頂端。Shift+Enter 是分行（同一段落內換行），不會產生段落間距；Enter 才是分段。"}, {"n": 459, "code": "2-133", "ans": "24", "multi": true, "q": "關於 Word 避頭尾字元的標準預設值，下列哪些字元不能置於行首？", "o": ["左括號", "問號", "左引號", "冒號"], "e": "答案 (2)(4)。不能放在行首的是結尾性標點：問號、冒號、逗號、句號、右括號、右引號等。左括號、左引號則是「不能放在行尾」。"}, {"n": 460, "code": "2-134", "ans": "14", "multi": true, "q": "在 Word 中要製作一個統計折線圖，下列哪些作法無法完成？", "o": ["使用繪圖工具", "插入圖表", "複製 Excel 製作之圖表", "利用快取圖案"], "e": "答案 (1)(4)。統計圖表需依資料數值繪製，要用「插入圖表」或貼上 Excel 圖表；用繪圖工具或快取圖案只能手繪線條，不是統計圖表。"}, {"n": 461, "code": "2-135", "ans": "234", "multi": true, "q": "在 Word 中，下列哪些可以強迫換頁？", "o": ["按下 Shift 鍵", "插入分節符號的下一頁選項", "插入分頁符號", "按下 Ctrl+Enter 鍵"], "e": "答案 (2)(3)(4)。分節符號（下一頁）、分頁符號、Ctrl+Enter 都會讓後面的內容從新的一頁開始。"}, {"n": 462, "code": "2-136", "ans": "1234", "multi": true, "q": "下列哪些是 Word 使用大綱模式與標題樣式來編輯長篇報告的好處？", "o": ["可以使用大綱工具列調整、調換章節順序所在處", "可以使用大綱模式檢視指定的標題階層", "可以完成目次製作、更改", "能與 Microsoft PowerPoint 整合，製作報告的簡報"], "e": "答案 (1)(2)(3)(4)。套用標題樣式後，可在大綱模式中摺疊/展開層級、上下移動整個章節；可依標題自動產生目錄；也能匯入 PowerPoint 成為投影片。"}, {"n": 463, "code": "2-137", "ans": "1234", "multi": true, "q": "下列哪些是 PowerPoint 投影片內物件的動畫觸發時機？", "o": ["按一下", "設定前動畫完成後 1 秒", "與前動畫同時", "接續前動畫"], "e": "答案 (1)(2)(3)(4)。動畫「開始」可選按一下、與前動畫同時、接續前動畫，並可再設定「延遲」秒數。"}, {"n": 464, "code": "2-138", "ans": "23", "multi": true, "q": "下列哪些是 Microsoft Word 與 Mac Pages 共同具有的功能？", "o": ["定義頁面邊框", "浮水印", "插入註腳", "插入數學公式"], "e": "依題庫答案 (2)(3)：浮水印與註腳兩者都有。"}, {"n": 465, "code": "2-139", "ans": "134", "multi": true, "q": "在 Word 中，哪些鍵的組合是開啟「索引項目標記」視窗的快速鍵？", "o": ["Shift 鍵", "Ctrl 鍵", "Alt 鍵", "X 鍵"], "e": "答案 (1)(3)(4)。標記索引項目的快速鍵為 Alt+Shift+X。（標記目錄項目為 Alt+Shift+O。）"}, {"n": 466, "code": "2-140", "ans": "1234", "multi": true, "q": "下列哪些是 Microsoft Word 與 Apache OpenOffice 共同具有的功能？", "o": ["合併列印", "定義頁面邊框", "插入註腳", "插入數學公式"], "e": "答案 (1)(2)(3)(4)。OpenOffice Writer 也具備合併列印、頁面框線、註腳、公式編輯器（Math）等功能。"}, {"n": 467, "code": "2-141", "ans": "13", "multi": true, "q": "Word 的預設書籤位置分為相對位置與絕對位置，下列哪些是絕對位置？", "o": ["\\StartOfDoc", "\\StartOfSel", "\\EndOfDoc", "\\Page"], "e": "答案 (1)(3)。文件開頭、文件結尾是固定不變的絕對位置。"}, {"n": 468, "code": "2-142", "ans": "234", "multi": true, "q": "Word 的預設書籤位置分為相對位置與絕對位置，下列哪些是相對位置？", "o": ["\\StartOfDoc", "\\StartOfSel", "\\Cell", "\\Page"], "e": "答案 (2)(3)(4)。選取範圍開頭、目前儲存格、目前頁面都會隨游標位置改變，屬相對位置。"}, {"n": 469, "code": "2-143", "ans": "23", "multi": true, "q": "Word 的自動圖文集功能，可以改用下列哪些功能變數來套用？", "o": ["AutoNumOut", "AutoText", "AutoTextList", "Compare"], "e": "答案 (2)(3)。{AUTOTEXT} 插入指定的自動圖文集；{AUTOTEXTLIST} 顯示自動圖文集清單供選擇。AutoNumOut 是大綱式自動編號；Compare 是比較兩值。"}, {"n": 470, "code": "2-144", "ans": "123", "multi": true, "q": "Word 標號設定所使用的功能變數是 SEQ，最適用於文章報告中哪些物件的標示？", "o": ["方程式", "表格", "圖形", "參考文獻"], "e": "答案 (1)(2)(3)。「插入標號」使用 {SEQ} 為圖、表、方程式自動依序編號（圖 1、表 1）。參考文獻用引文與書目功能處理。"}, {"n": 471, "code": "2-145", "ans": "1234", "multi": true, "q": "Excel 2019 資料分析中的敘述統計包含下列哪些函數？", "o": ["平均值", "標準差", "變異數", "平均信賴度"], "e": "答案 (1)(2)(3)(4)。「資料分析 → 敘述統計」會輸出平均數、標準誤、中位數、眾數、標準差、變異數、峰度、偏態、範圍、最小、最大、總和、個數，並可勾選平均數信賴度。"}, {"n": 472, "code": "2-146", "ans": "134", "multi": true, "q": "在 Excel 的函數中，下列哪些是常態分布類型的函數？", "o": ["NORMDIST", "NOMINAL", "NORMSDIST", "NORMSINV"], "e": "答案 (1)(3)(4)。NORMDIST（常態分配）、NORMSDIST（標準常態分配）、NORMSINV（標準常態反函數）。NOMINAL 是計算名目利率的財務函數。"}, {"n": 473, "code": "2-147", "ans": "134", "multi": true, "q": "下列哪些瀏覽器有開放原始碼？", "o": ["Opera", "Safari", "Firefox", "Chromium"], "e": "依題庫答案 (1)(3)(4)。Firefox（Mozilla）、Chromium（Chrome 的開源基礎）為開放原始碼；題庫將 Opera 列為正確（新版 Opera 以 Chromium 為核心）。Safari 是 Apple 專有瀏覽器。"}, {"n": 474, "code": "2-148", "ans": "1234", "multi": true, "q": "下列哪些瀏覽器可以在 Microsoft Windows 與 Mac 作業系統兩平台上執行？", "o": ["Opera", "Edge", "Firefox", "Google Chrome"], "e": "答案 (1)(2)(3)(4)。新版 Edge 改用 Chromium 核心後也推出 Mac 版；Opera、Firefox、Chrome 都是跨平台。"}, {"n": 475, "code": "2-149", "ans": "234", "multi": true, "q": "下列應用軟體中，何者屬於資料庫軟體？", "o": ["Pages", "Oracle", "Microsoft SQL Server", "MySQL"], "e": "答案 (2)(3)(4)。Pages 是文書處理軟體。"}, {"n": 476, "code": "2-150", "ans": "123", "multi": true, "q": "下列應用軟體中，何者屬於影像處理軟體？", "o": ["Photoshop", "Illustrator", "Painter", "Access"], "e": "答案 (1)(2)(3)。Photoshop（點陣影像）、Illustrator（向量繪圖）、Painter（數位繪畫）；Access 是資料庫。"}, {"n": 477, "code": "2-151", "ans": "234", "multi": true, "q": "在關聯式資料庫系統中，SELECT…FROM… 句型是主要的資料搜尋指令，下列哪些子句是可以使用在 SELECT 句型中的語法？", "o": ["SET", "WHERE", "ORDER BY", "GROUP BY"], "e": "答案 (2)(3)(4)。SELECT 可搭配 WHERE（條件）、GROUP BY（分組）、HAVING（分組條件）、ORDER BY（排序）。SET 是 UPDATE 用來設定新值的子句。"}, {"n": 478, "code": "2-152", "ans": "34", "multi": true, "q": "在電子郵件寄送時進行加密，沒有收件者的私鑰解密將無法看到內容，下列何者是被郵件加密所保護的內容？", "o": ["收件者帳號", "主旨", "附加檔案", "郵件內容"], "e": "答案 (3)(4)。S/MIME 等郵件加密只加密內文與附件；收件者地址、主旨等表頭必須以明文傳送，郵件伺服器才能投遞。"}, {"n": 479, "code": "2-153", "ans": "12", "multi": true, "q": "小明收到一封被列為密件副本的電子郵件，則小明可以看到這份郵件的哪些收件者？", "o": ["正本收件者", "副本收件者", "小明自己的郵件地址", "其他密件副本的收件者"], "e": "答案 (1)(2)。密件副本（BCC）收件者可以看到正本（To）與副本（CC）名單，但看不到任何 BCC 名單（包括自己在 BCC 欄中的位址）。"}, {"n": 480, "code": "2-154", "ans": "124", "multi": true, "q": "在關聯式資料庫系統中，SQL 語言包含哪些類型？", "o": ["DDL", "DML", "DHL", "DCL"], "e": "答案 (1)(2)(4)。DDL（資料定義：CREATE/ALTER/DROP）、DML（資料操作：SELECT/INSERT/UPDATE/DELETE）、DCL（資料控制：GRANT/REVOKE）。沒有 DHL。"}, {"n": 481, "code": "2-155", "ans": "124", "multi": true, "q": "在關聯式資料庫系統中，資料表的主鍵（Primary Key）應具備哪些特性？", "o": ["識別記錄的唯一性", "非空值（Not Null）", "必須是數值", "不可以重複"], "e": "答案 (1)(2)(4)。主鍵必須唯一、不重複、不可為空值；資料型態可以是文字，不一定是數值（如身分證字號）。"}, {"n": 482, "code": "2-156", "ans": "123", "multi": true, "q": "在關聯式資料庫系統中，哪些指令會造成資料表紀錄的刪除？", "o": ["DELETE TABLE", "DROP TABLE", "TRUNCATE TABLE", "ERASE TABLE"], "e": "依題庫答案 (1)(2)(3)。DELETE 刪除記錄；DROP TABLE 刪除整個資料表（含所有記錄）；TRUNCATE TABLE 清空所有記錄、保留結構。SQL 沒有 ERASE 指令。"}, {"n": 483, "code": "2-157", "ans": "124", "multi": true, "q": "對於關聯式資料庫中的視界（View），下列哪些敘述是正確的？", "o": ["可以合併多個資料表成為一個視界", "可以選擇使用不同資料表中的不同欄位組成視界", "視界只能從資料表中取得資料", "視界可以隱藏來源資料表的欄位資訊"], "e": "答案 (1)(2)(4)。視界是由查詢定義的虛擬表格，可合併多表、挑選欄位、隱藏敏感欄位以提升安全性。視界的來源也可以是其他視界，不只資料表。"}, {"n": 484, "code": "2-158", "ans": "123", "multi": true, "q": "Microsoft Word 中，儲存格無法填入下列哪些網底？", "o": ["圖片", "漸層", "材質", "佈景主題色彩"], "e": "答案 (1)(2)(3)。Word 表格儲存格網底只能填入單一色彩（含佈景主題色彩）與圖樣，不能填入圖片、漸層、材質。"}, {"n": 485, "code": "2-159", "ans": "134", "multi": true, "q": "下列何者是物件導向資料庫管理系統的特性？", "o": ["資料獨立性", "資料正規化", "定義類別屬性", "封裝"], "e": "答案 (1)(3)(4)。物件導向資料庫以類別、物件、屬性、方法、封裝、繼承來描述資料。「正規化」是關聯式資料庫的設計方法。"}, {"n": 486, "code": "2-160", "ans": "234", "multi": true, "q": "在 Photoshop 中，在選取內容範圍時，哪些工具不會使用顏色接近方法來做判別？", "o": ["魔術棒工具", "套索工具", "矩形工具", "筆刷工具"], "e": "答案 (2)(3)(4)。魔術棒依「容許度」選取顏色相近的像素；套索、矩形選取以手動形狀選取，筆刷是繪圖工具，都不依顏色判斷。"}, {"n": 487, "code": "2-161", "ans": "123", "multi": true, "q": "在一般的影像處理軟體中，有哪些色彩屬性？", "o": ["色相（Hue）", "飽和度（Saturation）", "亮度（Lightness）", "解析度（Resolution）"], "e": "答案 (1)(2)(3)。色彩三屬性（HSL/HSB）為色相、飽和度、亮度。解析度是影像精細度（像素密度），不是色彩屬性。"}, {"n": 488, "code": "2-162", "ans": "12", "multi": true, "q": "對於影像的處理及使用，哪些影像處理模式的描述為正確？", "o": ["Photoshop 是點陣影像為主，向量影像為輔", "Illustrator 是向量影像為主，點陣影像為輔", "Photoshop 是向量影像為主，點陣影像為輔", "Illustrator 是點陣影像為主，向量影像為輔"], "e": "答案 (1)(2)。Photoshop 主要處理點陣圖（相片修圖），也有路徑、形狀等向量功能；Illustrator 主要繪製向量圖（標誌、插畫），也能置入點陣圖。"}, {"n": 489, "code": "2-163", "ans": "234", "multi": true, "q": "下列何者是 P2P 下載軟體？", "o": ["FTP", "eMule", "Bit Torrent", "FOXY"], "e": "答案 (2)(3)(4)。eMule、BitTorrent、FOXY 是點對點（Peer-to-Peer）檔案分享軟體；FTP 是主從式架構的檔案傳輸協定。"}, {"n": 490, "code": "2-164", "ans": "134", "multi": true, "q": "當使用者連上網路後，打開瀏覽器時，發現不斷跳出國外廣告內容，下列何者非造成這個現象的可能原因？", "o": ["硬碟剩餘空間不足", "首頁綁架", "網路頻寬不足", "網路守門員"], "e": "答案 (1)(3)(4)。不斷跳出廣告通常是中了廣告軟體或瀏覽器首頁被綁架。硬碟空間、頻寬不足不會產生廣告；「網路守門員」是過濾不當網站的防護軟體，也不會造成廣告。"}, {"n": 491, "code": "2-165", "ans": "234", "multi": true, "q": "下列哪些是 Microsoft Word 可以編修檔案的副檔名？", "o": ["docs", "docx", "doc", "rtf"], "e": "答案 (2)(3)(4)。Word 可開啟編修 .docx、.doc、.rtf（以及 .txt、.odt 等）；沒有 .docs 這種格式。"}, {"n": 492, "code": "2-166", "ans": "134", "multi": true, "q": "網站上的網頁可以包含下列哪些項目？", "o": ["Javascript", "向量圖檔", "超連結（Hyper Links）", "CSS"], "e": "依題庫答案 (1)(3)(4)。網頁由 HTML 加上 JavaScript（程式）、CSS（樣式）與超連結組成。"}, {"n": 493, "code": "2-167", "ans": "134", "multi": true, "q": "關於 Microsoft Access 表單設計之敘述，下列哪些正確？", "o": ["切換至版面配置檢視可以修改表單", "在資料表欄位名稱按一下即可修改其名稱", "可以自由變更欄位大小", "可以套用佈景主題以變更樣式"], "e": "答案 (1)(3)(4)。表單可在版面配置檢視或設計檢視中修改，可調整控制項大小、套用佈景主題。表單中按一下欄位標籤不會直接修改資料表的欄位名稱。"}, {"n": 494, "code": "2-168", "ans": "23", "multi": true, "q": "有關藍芽（Bluetooth）技術之敘述，下列哪些正確？", "o": ["主要使用紫外線傳輸", "常應用於手機或筆記型電腦", "可作為短距離無線傳輸媒介", "具有傳輸夾角的限制"], "e": "答案 (2)(3)。藍牙使用 2.4GHz 無線電波，可穿透障礙物、沒有方向夾角限制；有夾角限制的是紅外線。"}, {"n": 495, "code": "2-169", "ans": "234", "multi": true, "q": "資料庫交易管理所提之 ACID 包含下列哪些項目？", "o": ["Automatic", "Consistency", "Durability", "Isolation"], "e": "答案 (2)(3)(4)。ACID＝Atomicity（不可分割性）、Consistency（一致性）、Isolation（隔離性）、Durability（持久性）。A 不是 Automatic。"}, {"n": 496, "code": "2-170", "ans": "123", "multi": true, "q": "下列哪些不是概念資料模型？", "o": ["網路式資料庫模型", "階層式資料庫模型", "關聯式資料庫模型", "實體關聯模型"], "e": "答案 (1)(2)(3)。實體關聯模型（ER Model）是概念資料模型，用於分析設計階段；網路式、階層式、關聯式是邏輯（實作）資料模型。"}, {"n": 497, "code": "2-171", "ans": "123", "multi": true, "q": "下列哪些是關聯式資料庫的組成要素？", "o": ["資料表", "Meta Data", "索引", "管理軟體"], "e": "依題庫答案 (1)(2)(3)。關聯式資料庫由資料表、描述資料結構的中繼資料（Meta Data／資料字典）與索引等組成；管理軟體（DBMS）是用來管理資料庫的系統，不算資料庫本身的組成要素。"}, {"n": 498, "code": "2-172", "ans": "134", "multi": true, "q": "下列哪些是資料庫正規化的目的？", "o": ["除去重複性資料", "資料不分類別集中在一起處理", "以數個不重複的資料表儲存資料", "確保資料的相依關係"], "e": "答案 (1)(3)(4)。正規化把資料依主題分解成多個資料表，去除重複、避免異常並確保正確的相依關係；(2) 正好相反。"}, {"n": 499, "code": "2-173", "ans": "123", "multi": true, "q": "下列哪些是 Web Page 的開發技術？", "o": ["ASP.Net", "JavaScript", "PHP", "ISP"], "e": "答案 (1)(2)(3)。ISP 是網際網路服務提供者（如中華電信），不是開發技術。"}, {"n": 500, "code": "2-174", "ans": "124", "multi": true, "q": "Microsoft Word 中，下列哪些情況可以進行兩表格合併？", "o": ["表格寬度不一致", "表格欄數不一致", "文繞圖的表格", "表格欄寬不一致"], "e": "答案 (1)(2)(4)。只要刪除兩表格之間的段落，表格就會接合，寬度、欄數、欄寬不同都可以。設定為文繞圖的表格是浮動的，無法合併。"}, {"n": 501, "code": "2-175", "ans": "134", "multi": true, "q": "下列哪些圖檔格式可應用於網站？", "o": ["GIF", "PSD", "JPEG", "PNG"], "e": "答案 (1)(3)(4)。瀏覽器支援 GIF、JPEG、PNG（及 WebP、SVG）；PSD 是 Photoshop 原始檔，瀏覽器無法顯示。"}, {"n": 502, "code": "2-176", "ans": "123", "multi": true, "q": "下列哪些是資料探勘（Data Mining）的應用？", "o": ["根據過去屬性觀察值來預測該屬性之未來值", "按照屬性分門別類建立類組", "使用統計分析方法尋找資料中有用的特徵及關連性", "協助尋找遺漏的歷史資料"], "e": "答案 (1)(2)(3)。資料探勘的功能有預測、分類/分群、關聯規則等；它是從現有資料找出規律，不是用來找回遺漏的資料。"}, {"n": 503, "code": "2-177", "ans": "1234", "multi": true, "q": "在 Microsoft Excel 中，下列哪些是可以執行復原的動作？", "o": ["刪除物件", "設定儲存格格式", "刪除儲存格", "另存新檔"], "e": "依題庫答案 (1)(2)(3)(4)。（補充：實務上刪除工作表、儲存檔案等動作無法復原，作答依題庫。）"}, {"n": 504, "code": "3-1", "ans": "2", "multi": false, "q": "在 Windows 作業系統的「控制台」中，印表機設定應該是在？", "o": ["系統及安全性", "硬體和音效", "網路和網際網路", "外觀及個人化"], "e": "「控制台 → 硬體和音效 → 裝置和印表機」可新增、設定印表機。"}, {"n": 505, "code": "3-2", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，有關「裝置管理員」之敘述，下列何者錯誤？", "o": ["可以顯示所安裝的軟體", "如果某種硬體的圖示上有一個叉號，則代表該硬體不正確", "如果硬體圖示上有一個帶有圓圈的驚嘆號，則代表該硬體有故障", "可以更新硬體的驅動程式"], "e": "裝置管理員只管理「硬體裝置」與其驅動程式；查看已安裝的軟體要到「程式和功能」（新增/移除程式）。"}, {"n": 506, "code": "3-3", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，有關「檔案副檔名」之敘述，下列何者不正確？", "o": ["組態設定值檔案的副檔名為 .INI", "系統檔案的副檔名為 .SYS", "輔助說明檔案的副檔名為 .HLP", "驅動程式檔案的副檔名為 .DDL"], "e": "驅動程式常見副檔名為 .SYS、.DRV；動態連結程式庫為 .DLL（不是 .DDL）。"}, {"n": 507, "code": "3-4", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，想要變更貨幣符號表示方式，應該是在「控制台」中的哪個選項變更？", "o": ["時鐘和區域", "外觀及個人化", "硬體和音效", "系統及安全性"], "e": "「時鐘和區域 → 地區 → 其他設定」可變更數字、貨幣符號、日期時間格式。"}, {"n": 508, "code": "3-5", "ans": "2", "multi": false, "q": "在 Windows 作業系統的「裝置管理員」，若某裝置出現三角黃底驚嘆號的圖示，下列何者處理無法排除此異常？", "o": ["按滑鼠右鍵，選擇\"解除安裝\"", "重新開機", "若是 USB 藍芽裝置，將 USB 藍芽接收器拔下來，再重新接上電腦", "重新安裝驅動程式"], "e": "黃色驚嘆號表示驅動程式有問題或裝置衝突，需解除安裝後重新偵測、重新插拔或重新安裝驅動程式；單純重新開機不會修正驅動程式問題。"}, {"n": 509, "code": "3-6", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，關於「將電腦設定為多使用者使用」之敘述，下列何者錯誤？", "o": ["可以對不同使用者顯示不同的「我的最愛」資料夾中的項目", "可以將本機電腦上的印表機分享給其他使用者", "對於共用的資料夾，則只能以唯讀方式使用該資料夾", "允許其他使用者從遠端電腦管理本機電腦的檔案和印表機"], "e": "共用資料夾可設定「讀取」或「讀取/寫入（變更、完全控制）」權限，不是只能唯讀。"}, {"n": 510, "code": "3-7", "ans": "1", "multi": false, "q": "在 Windows 作業系統的「工作排程器」中，設定「安排的工作」，下列敘述何者錯誤？", "o": ["工作可以安排在關機時同時執行", "工作可以安排在每天、每星期、每月的固定時刻執行", "工作可以安排在電腦啟動或空閒時執行", "提供檢視安排工作執行情形的記錄檔"], "e": "工作排程器的觸發條件有時間排程、開機、登入、閒置、事件等；電腦關機後系統停止運作，無法安排「關機時執行」的工作。"}, {"n": 511, "code": "3-8", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，如果容易發生系統資源不足，下列何者無法改善這種現象？", "o": ["降低色彩顯示模式", "增加記憶體", "增加硬碟空間", "選用電源選項中的「省電計畫」"], "e": "增加記憶體、硬碟空間（虛擬記憶體）、降低顯示負擔都能紓解資源不足；省電計畫反而會降低 CPU 效能，無法改善。"}, {"n": 512, "code": "3-9", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，關於「尋找」功能，下列敘述何者錯誤？", "o": ["可以尋找特定資料夾", "可以尋找網際網路上的社群好友", "可以依電腦名稱尋找特定電腦", "可以尋找通訊錄中的特定人員"], "e": "Windows 搜尋可找檔案、資料夾、網路上的電腦、通訊錄人員，但無法搜尋社群網站上的好友。"}, {"n": 513, "code": "3-10", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果要依條件尋找檔案，下列敘述何者錯誤？", "o": ["可以依日期尋找", "可以依檔案大小尋找", "可以依檔案屬性尋找", "可以依檔案類型尋找"], "e": "依題庫答案，搜尋篩選條件有修改日期、大小、類型、名稱等，不能依檔案屬性（唯讀、隱藏等）尋找。"}, {"n": 514, "code": "3-11", "ans": "2", "multi": false, "q": "下列何者是一種使用者可自行訂閱、下載及發布的網路廣播技術？", "o": ["RTSP", "Podcast", "Flv", "RTP"], "e": "Podcast（播客）透過 RSS 訂閱，自動下載最新一集的音訊/影片節目，任何人都可以製作發布。RTSP、RTP 是串流傳輸協定；FLV 是影片格式。"}, {"n": 515, "code": "3-12", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，用來搜尋硬碟，並列出可以安全刪除的暫時檔、Internet 快取檔與不必要的程式檔，以協助釋放硬碟空間，應該執行下列哪一個程式？", "o": ["磁碟清理", "磁碟掃描工具", "磁碟壓縮工具", "磁碟重組程式"], "e": "磁碟清理（cleanmgr）找出暫存檔、網路快取、資源回收筒等可刪除檔案以釋放空間。磁碟掃描檢查錯誤；磁碟重組整理檔案片段以提升速度。"}, {"n": 516, "code": "3-13", "ans": "2", "multi": false, "q": "關於 Windows 作業系統中 BitLocker 之敘述，下列何者錯誤？", "o": ["可以針對磁碟機加密", "可以針對檔案加密", "可以針對隨身碟加密（BitLocker To Go）", "Windows 10 Professional 版就有提供此功能"], "e": "BitLocker 是「整個磁碟區」加密；針對個別檔案、資料夾加密的是 EFS（加密檔案系統）。"}, {"n": 517, "code": "3-14", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果按一次 Ctrl+Alt+Del，會發生下列何種狀況？", "o": ["重新開機", "關機", "出現「鎖定」、「切換使用者」、「登出」、「工作管理員」等", "出現工作管理員視窗"], "e": "現行 Windows 按 Ctrl+Alt+Del 會進入安全性畫面，提供鎖定、切換使用者、登出、變更密碼、工作管理員等選項。直接開工作管理員是 Ctrl+Shift+Esc。"}, {"n": 518, "code": "3-15", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，用來偵測本端主機和遠端主機間的網路是否為連通狀態，可以使用下列哪一個指令？", "o": ["ping", "ipconfig", "telnet", "route"], "e": "ping 送出 ICMP Echo 封包並等待回應，用於測試連通性與延遲。"}, {"n": 519, "code": "3-16", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，要查詢本機電腦在網路上的 TCP/IP 組態設定值，應使用下列哪一個指令？", "o": ["ping", "route", "telnet", "ipconfig"], "e": "ipconfig（/all）顯示 IP 位址、子網路遮罩、預設閘道、DNS、MAC 位址等 TCP/IP 設定。route 檢視路由表。"}, {"n": 520, "code": "3-17", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，通常觀察光碟片中檔案的屬性，必具備以下哪一種屬性？", "o": ["唯讀", "保存", "隱藏", "系統"], "e": "光碟（CD-ROM）是唯讀媒體，其中的檔案都具有唯讀屬性（複製到硬碟時也常會保留唯讀）。"}, {"n": 521, "code": "3-18", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，如果檔案是屬於系統檔案，則該檔案的預設屬性，下列何者不正確？", "o": ["系統", "唯讀", "隱藏", "保留"], "e": "Windows 檔案屬性有唯讀（R）、隱藏（H）、系統（S）、封存（A）；沒有「保留」屬性。系統檔通常具有系統、隱藏、唯讀屬性。"}, {"n": 522, "code": "3-19", "ans": "4", "multi": false, "q": "關於 Windows 作業系統的動態磚管理之敘述，下列何者錯誤？", "o": ["動態磚大小可分為大寬中小四種大小", "動態磚可以依據自己需求群組化，並自訂群組名稱", "動態磚可以以名稱與副檔名排序", "動態磚位置無法搬移"], "e": "動態磚可以用滑鼠拖曳任意搬移位置與群組。"}, {"n": 523, "code": "3-20", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，關於「螢幕解析度」之敘述，下列何者錯誤？", "o": ["解析度的設定值和電腦所插的顯示卡有關", "設定解析度愈高，則螢幕上的物件愈小", "解析度 640X480，後一個數值 480 是指水平方向的像素個數", "設定解析度愈小，則螢幕上的物件愈少"], "e": "解析度表示法為「水平×垂直」，640×480 中 640 是水平像素數、480 是垂直像素數。"}, {"n": 524, "code": "3-21", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果要對不同使用者設定個人化的項目，下列何者不在設定範圍？", "o": ["桌面資料夾", "「我的最愛」資料夾", "所顯示的字型", "「文件」資料夾"], "e": "每個使用者有自己的設定檔資料夾（桌面、我的最愛、文件等）；字型是安裝在系統中所有使用者共用的。"}, {"n": 525, "code": "3-22", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，於動態磚上按滑鼠右鍵出現的選單，下列何者不是選單中會出現的選項？", "o": ["移動動態磚", "調整大小", "解除安裝", "關閉動態磚"], "e": "右鍵選單有「從開始畫面取消釘選、調整大小、解除安裝、關閉動態磚、更多」；移動是用滑鼠拖曳，不在選單中。"}, {"n": 526, "code": "3-23", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，如果要針對不同使用者設定個人化的項目，可在「控制台」的哪一個項目中設定？", "o": ["網路", "外觀及個人化", "密碼", "資料夾選項"], "e": "「外觀及個人化」可設定桌面背景、佈景主題、色彩、螢幕保護程式等，每個使用者可各自設定。"}, {"n": 527, "code": "3-24", "ans": "4", "multi": false, "q": "下列何者是 Windows 專業版作業系統直接支援的虛擬機系統？", "o": ["VMWare", "Xen", "VBox", "Hyper-V"], "e": "Hyper-V 是微軟內建於 Windows 專業版/企業版/伺服器版的虛擬化技術。VMware、VirtualBox、Xen 都是第三方軟體。"}, {"n": 528, "code": "3-25", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，如果想要切換使用中的應用軟體，可以使用下列哪一個按鍵？", "o": ["Alt+Tab", "Shift+Alt", "Ctrl+Alt", "Ctrl+Shift"], "e": "Alt+Tab 在開啟的應用程式視窗之間切換。Ctrl+Shift 常用於切換輸入法。"}, {"n": 529, "code": "3-26", "ans": "2", "multi": false, "q": "在 Windows 專業版作業系統啟動虛擬機前，必須啟動 BIOS 中何項方可使用 Hyper-V 虛擬機？", "o": ["ECP DMA Select", "Intel VT（Virtualization Technology）", "Processor Core Disable", "HW Prefetcher"], "e": "Hyper-V 需要 CPU 的硬體虛擬化支援，必須在 BIOS 啟用 Intel VT-x（AMD 為 AMD-V/SVM）。"}, {"n": 530, "code": "3-27", "ans": "3", "multi": false, "q": "RPM 是 RedHat 所提出的檔案包裝規格，對於一個名稱為 rpptfoes-8.1-1.1.1.noarch.rpm 的 RPM 檔案，下列敘述何者正確？", "o": ["是 PowerPC 系統專用", "是 64 位元主機專用安裝檔", "不限特定主機皆可安裝", "是 Intel 相容指令集專用"], "e": "RPM 檔名格式：名稱-版本-發行版.架構.rpm。架構「noarch」（no architecture）表示與硬體架構無關（如腳本、文件），任何主機都可安裝。x86_64 才是 64 位元、ppc 是 PowerPC。"}, {"n": 531, "code": "3-28", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，有關系統的日期與時間之敘述，下列何者正確？", "o": ["每次開機要重新設定", "當機後才要重新設定", "只能使用人工修正日期時間", "內定網際網路時間與 time.windows.com 同步處理"], "e": "Windows 預設會透過 NTP 與網際網路時間伺服器 time.windows.com 自動同步；日期時間由主機板 CMOS 電池保存，不必每次設定。"}, {"n": 532, "code": "3-29", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，如果要設定電腦在連續 15 分鐘未被使用時，會自動進入睡眠模式，應該在何處設定？", "o": ["硬體和音效", "系統", "外觀及個人化", "使用者帳戶和家庭安全"], "e": "依題庫答案在「系統」中設定（Windows 10/11：設定 → 系統 → 電源與睡眠）。（傳統控制台中「電源選項」位於硬體和音效之下，作答依題庫。）"}, {"n": 533, "code": "3-30", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，要對 Registry 進行本機或遠端編輯，應使用下列哪一種軟體？", "o": ["系統原則編輯程式", "登錄編輯程式", "系統資源程式", "資源監視程式"], "e": "Registry（登錄檔）以「登錄編輯程式」regedit 編輯，可「連線網路登錄」編輯遠端電腦。"}, {"n": 534, "code": "3-31", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，如果執行「命令提示字元」後，要關閉、並回到 Windows 中，則應輸入下列哪一個指令？", "o": ["stop", "exit", "windows", "end"], "e": "在命令提示字元輸入 exit 會結束 cmd 並關閉視窗。"}, {"n": 535, "code": "3-32", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，若覺得電腦的執行效率不理想，想追蹤哪個地方出了問題，可以使用下列何者作為偵錯的監視器？", "o": ["硬體監視器", "工作管理員", "磁碟監視器", "資源監視器"], "e": "依題庫答案為工作管理員：可查看各程式的 CPU、記憶體、磁碟、網路使用量，找出拖慢效能的程式並結束它。"}, {"n": 536, "code": "3-33", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果要使您的電腦具備「隨插即用」的功能，電腦必須使用「隨插即用」的哪一個元件去設定？", "o": ["ROM", "RAM", "BIOS", "CPU"], "e": "隨插即用需要硬體、BIOS（PnP BIOS）與作業系統三者配合，由 BIOS 在開機時偵測裝置並分配資源。"}, {"n": 537, "code": "3-34", "ans": "1", "multi": false, "q": "下列何者不是 Windows 專業版支援 Hyper-V 虛擬機系統的虛擬機映像檔？", "o": ["v2v", "vhd", "vhdx", "vdi"], "e": "依題庫答案為 v2v：v2v（Virtual to Virtual）是一種虛擬機轉換的「作業方式」，不是映像檔格式。VHD/VHDX 是 Hyper-V 的虛擬硬碟格式（VDI 為 VirtualBox 格式，題庫將其列為映像檔格式）。"}, {"n": 538, "code": "3-35", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果要設定一個使用者帳戶可以改變檔案內容及刪除檔案，則應由下列何者中設定？", "o": ["使用者網域", "使用者群組", "使用者權限", "使用者權利原則"], "e": "檔案的讀取、寫入、修改、刪除等是在檔案/資料夾的「安全性」中設定使用者權限（NTFS 權限）。"}, {"n": 539, "code": "3-36", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，如果要設定使用者可以查看檔案內容、執行程式、改變檔案的內容、刪除檔案、改變檔案使用權限及變更所有權，應設定為下列哪一種權限？", "o": ["完全控制", "不允許存取", "變更", "讀取"], "e": "「完全控制」包含所有權限，且能變更權限與取得擁有權。"}, {"n": 540, "code": "3-37", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果要設定使用者可以查看檔案內容、執行程式、改變檔案的內容、刪除檔案，但無法改變檔案使用權限及變更所有權，應設定為下列哪一種權限？", "o": ["完全控制", "不允許存取", "變更", "讀取"], "e": "「變更（修改）」可讀取、寫入、執行、刪除，但不能變更權限與擁有權；這是與「完全控制」的差別。"}, {"n": 541, "code": "3-38", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，如果在使用 TCP/IP 通訊協定時，要動態管理 IP 位址，則應架設下列哪一種系統？", "o": ["視窗網際網路名稱服務 WINS", "網域名稱伺服器 DNS", "動態主機配置協定 DHCP", "應用伺服器"], "e": "DHCP 伺服器自動分配與回收 IP 位址。DNS 把網域名稱解析成 IP；WINS 把 NetBIOS 名稱解析成 IP。"}, {"n": 542, "code": "3-39", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，下列哪一種系統負責整個網域中所有帳號和資源的管理中心？", "o": ["動態主機配置協定 DHCP", "網域名稱伺服器 DNS", "網域備份控制站 BDC", "網域主控制站 PDC"], "e": "網域主控制站（PDC）集中管理網域中的帳號、密碼與資源，負責登入驗證；BDC 保存 PDC 資料的備份副本。"}, {"n": 543, "code": "3-40", "ans": "1", "multi": false, "q": "Android 開發工具不支援下列哪一個作業系統？", "o": ["FreeBSD", "Linux", "Windows", "macOS"], "e": "Android Studio 只提供 Windows、macOS、Linux（及 ChromeOS）版本，不支援 FreeBSD。"}, {"n": 544, "code": "3-41", "ans": "2", "multi": false, "q": "下列何者是 Google 所提供的 Android 開發工具？", "o": ["Android Programming Editor", "Android Development Toolkit", "Android Programming Toolkit", "Android Development Editor"], "e": "ADT（Android Development Tools/Toolkit）是 Google 早期提供給 Eclipse 的 Android 開發外掛（現已由 Android Studio 取代）。"}, {"n": 545, "code": "3-42", "ans": "2", "multi": false, "q": "在 Unix 作業系統中，如果想要更改某一個檔案的名稱，可以使用下列哪一個命令？", "o": ["rm", "mv", "more", "ls"], "e": "mv（move）可以搬移檔案，也可以用來改名：mv 舊檔名 新檔名。"}, {"n": 546, "code": "3-43", "ans": "1", "multi": false, "q": "在 Unix 作業系統中，如果想要刪除某一個檔案，可以使用下列哪一個命令？", "o": ["rm", "mv", "del", "erase"], "e": "rm（remove）刪除檔案。del、erase 是 Windows/DOS 的刪除指令。"}, {"n": 547, "code": "3-44", "ans": "1", "multi": false, "q": "在 Unix 作業系統中，欲列出目前已 LOGIN 系統的使用者，可使用下列哪一個指令？", "o": ["who", "ls", "pwd", "mv"], "e": "who 顯示目前登入的使用者；ls 列出檔案；pwd 顯示目前所在目錄。"}, {"n": 548, "code": "3-45", "ans": "1", "multi": false, "q": "在 Unix 作業系統中，想要列出所有檔案（包括隱藏檔），應使用下列哪一個命令？", "o": ["ls -a", "DIR/a", "ls -1", "ls -c"], "e": "Unix 中以「.」開頭的檔案為隱藏檔，ls -a（all）會連同隱藏檔全部列出。"}, {"n": 549, "code": "3-46", "ans": "1", "multi": false, "q": "在 Unix 作業系統中，想要搜尋某個或多個指定的檔案，可使用下列哪一個指令？", "o": ["find", "DIR", "more", "cp"], "e": "find 依名稱、大小、時間等條件搜尋檔案，例如 find / -name test.txt。"}, {"n": 550, "code": "3-47", "ans": "2", "multi": false, "q": "在 Unix 作業系統中，如果想要瀏覽某一文書檔的內容，可以使用下列哪一個命令？", "o": ["type", "more", "dir", "ls"], "e": "more（以及 cat、less）可顯示文字檔內容，more 會分頁顯示。type 是 DOS 指令。"}, {"n": 551, "code": "3-48", "ans": "1", "multi": false, "q": "在 Linux 作業系統中，下列哪一個指令可列出目錄的內容？", "o": ["ls", "pwd", "cp", "ln"], "e": "ls 列出目錄內容；pwd 顯示目前路徑；cp 複製；ln 建立連結。"}, {"n": 552, "code": "3-49", "ans": "2", "multi": false, "q": "關於「Linux 作業系統」之敘述，下列何者錯誤？", "o": ["Linux 作業系統與 UNIX 作業系統相容", "不支援 TCP/IP 通訊協定", "Linux 作業系統有提供免費的原始程式碼", "可以在 IBM-PC 及相容的個人電腦上被安裝並執行"], "e": "Linux 完整支援 TCP/IP，網際網路上大量伺服器都使用 Linux。"}, {"n": 553, "code": "3-50", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，下列哪一個指令可新增使用帳號？", "o": ["passwd", "su", "pwd", "adduser"], "e": "adduser（或 useradd）新增使用者帳號；passwd 修改密碼；su 切換使用者身分。"}, {"n": 554, "code": "3-51", "ans": "1", "multi": false, "q": "在 Linux 作業系統中，下列哪一個指令可顯示網路介面的情形？", "o": ["ifconfig", "dmesg", "hostname", "cat"], "e": "ifconfig（新版為 ip addr）顯示網路介面的 IP、MAC 與狀態。dmesg 顯示核心訊息；hostname 顯示主機名稱。"}, {"n": 555, "code": "3-52", "ans": "4", "multi": false, "q": "當開啟電腦後，將作業系統載入記憶體中的是下列何者？", "o": ["組譯程式（Assembler）", "編譯程式（Compiler）", "使用者開發程式", "啟動程式（Initial Program Loader）"], "e": "開機時由 ROM 中的啟動程式（IPL／Bootstrap Loader）把作業系統從磁碟載入主記憶體。"}, {"n": 556, "code": "3-53", "ans": "1", "multi": false, "q": "關於「作業系統」之敘述，下列何者錯誤？", "o": ["作業系統通常燒錄在主機板中", "作業系統也是一套程式", "作業系統的目的在於讓使用者可以更有效的使用計算機系統", "使用者可以透過作業系統執行低階的操作"], "e": "作業系統通常安裝在硬碟（或 SSD）中，開機時才載入記憶體；燒錄在主機板 ROM 中的是 BIOS/UEFI 韌體。"}, {"n": 557, "code": "3-54", "ans": "2", "multi": false, "q": "在系統軟體中，透過下列何種技術可以使用軟體與記憶體來提供快速的儲存裝置？", "o": ["抽取式硬碟", "虛擬磁碟機（Virtual Disk）", "延伸記憶體", "虛擬記憶體"], "e": "虛擬磁碟（RAM Disk）是以軟體把一部分記憶體模擬成磁碟機，存取速度極快。注意與「虛擬記憶體」（以硬碟模擬記憶體）方向相反。"}, {"n": 558, "code": "3-55", "ans": "4", "multi": false, "q": "Open Office 套裝軟體的「Impress 簡報軟體」存檔的預設副檔名為何？", "o": [".ppt", ".txt", ".sxw", ".odp"], "e": "ODF 格式副檔名：.odt（文書 Writer）、.ods（試算表 Calc）、.odp（簡報 Impress，presentation）。.sxw 是舊版 StarOffice Writer 格式。"}, {"n": 559, "code": "3-56", "ans": "3", "multi": false, "q": "下列何者不是作業系統的功能？", "o": ["輸出/入裝置的管理", "處理的管理", "輸入法的管理", "記憶體的管理"], "e": "OS 核心功能是處理器（行程）、記憶體、I/O 裝置、檔案管理。輸入法是附加的應用軟體，不是作業系統的核心功能。"}, {"n": 560, "code": "3-57", "ans": "3", "multi": false, "q": "銀行的每半年一次的計息工作，適合使用下列哪一種作業式？", "o": ["即時處理作業", "交談式處理作業", "批次處理作業", "平行式處理作業"], "e": "定期、大量、不需立即回應的工作（計息、薪資、帳單）適合把資料累積起來一次處理的批次作業。"}, {"n": 561, "code": "3-58", "ans": "1", "multi": false, "q": "同時處理多個使用者的要求，但每個使用者輪流分配到 CPU 一小部分時間，這種處理作業是屬於下列何項？", "o": ["分時處理作業", "平行處理作業", "分散式處理作業", "批次處理作業"], "e": "分時處理把 CPU 時間切成時間片段，輪流分給各使用者，使每個人都感覺獨佔電腦。"}, {"n": 562, "code": "3-59", "ans": "4", "multi": false, "q": "依照磁碟的結構，各種單元所佔的空間大小，下列何者正確？", "o": ["磁軌＞磁柱＞磁區＞叢集", "磁柱＞叢集＞磁軌＞磁區", "叢集＞磁柱＞磁軌＞磁區", "磁柱＞磁軌＞叢集＞磁區"], "e": "磁柱（各碟面同一位置的磁軌集合）＞磁軌（一圈）＞叢集（數個磁區組成，檔案配置單位）＞磁區（最小存取單位）。"}, {"n": 563, "code": "3-60", "ans": "2", "multi": false, "q": "硬碟結構中的系統區，檔案的真實位置被完整記錄在下列哪一區中？", "o": ["硬碟分割區", "檔案配置區", "根目錄區", "啟動區"], "e": "檔案配置表（FAT）記錄每個檔案佔用了哪些叢集及其串連順序，即檔案的真實位置；根目錄區記錄檔名、大小與起始叢集。"}, {"n": 564, "code": "3-61", "ans": "4", "multi": false, "q": "有一部電腦作為伺服器，扮演中央控制的角色，伺服器負責管理與控制所有的通訊動作的網路拓樸邏輯，這是下列哪一種網路架構？", "o": ["環狀（Ring）架構", "網狀（Netware）架構", "匯流排（Bus）架構", "星狀（Star）架構"], "e": "星狀拓樸所有節點連到中央節點（伺服器/集線器），由中央負責控制所有通訊；缺點是中央故障全網癱瘓。"}, {"n": 565, "code": "3-62", "ans": "1", "multi": false, "q": "下列何者是將所有電腦經由一條主幹線連接起來的網路拓樸邏輯？", "o": ["匯流排（Bus）架構", "星狀（Star）架構", "環狀（Ring）架構", "網狀（Netware）架構"], "e": "匯流排拓樸以一條主幹電纜連接所有電腦，兩端需加終端電阻；主幹故障則全網中斷。"}, {"n": 566, "code": "3-63", "ans": "3", "multi": false, "q": "由內、外兩層導體和一層絕緣材料所組成，最外層再包裹著保護的外皮，這是下列哪一種傳輸媒介？", "o": ["光纖", "雙絞線", "同軸電纜", "單芯線"], "e": "同軸電纜結構：中心銅導線 → 絕緣層 → 外層金屬網（屏蔽導體）→ 保護外皮。內外導體同一軸心，故稱同軸。"}, {"n": 567, "code": "3-64", "ans": "2", "multi": false, "q": "作為信號放大與整波之用，只管網路的電氣部分，對於所傳輸的資料並不在意，只要在線上傳輸的訊號皆會被放大，並送往另一個區段的是下列哪一種裝置？", "o": ["集線器（HUB）", "訊號增益器（Repeater）", "橋接器（Bridge）", "路由器（Router）"], "e": "中繼器（Repeater）運作於實體層，只負責把衰減的訊號放大、整形後轉送，延長傳輸距離，不判讀資料內容。"}, {"n": 568, "code": "3-65", "ans": "1", "multi": false, "q": "用來管理網路設備的最小單位，可以將網路設備集中管理，避免有問題的區段影響整個網路運作的是下列哪一種裝置？", "o": ["集線器（HUB）", "訊號增益器（Repeater）", "橋接器（Bridge）", "路由器（Router）"], "e": "集線器把多台電腦集中連接成星狀，單一線路故障只影響該台電腦，不會像匯流排拓樸一樣影響全網。"}, {"n": 569, "code": "3-66", "ans": "3", "multi": false, "q": "下列哪一種裝置可以讓二個相同類型的網路互相通訊？", "o": ["集線器（HUB）", "訊號增益器（Repeater）", "橋接器（Bridge）", "路由器（Router）"], "e": "橋接器運作於資料鏈結層，連接兩個相同類型（相同通訊協定）的區域網路，並依 MAC 位址過濾。連接不同類型網路要用路由器或閘道器。"}, {"n": 570, "code": "3-67", "ans": "4", "multi": false, "q": "下列哪一種裝置可以建立路徑選擇表，以記錄相關網路工作站的位址，幫助子網路內的封包以最有效率的方式選擇路徑？", "o": ["集線器（HUB）", "訊號增益器（Repeater）", "橋接器（Bridge）", "路由器（Router）"], "e": "路由器維護路由表（Routing Table），為封包選擇最佳傳送路徑。"}, {"n": 571, "code": "3-68", "ans": "4", "multi": false, "q": "下列何者不屬於區域網路標準？", "o": ["Ethernet", "Token Ring", "ARCnet", "Seednet"], "e": "Ethernet、Token Ring、ARCnet 都是區域網路技術；Seednet（數位聯合電信）是台灣的網際網路服務提供者（ISP）。"}, {"n": 572, "code": "3-69", "ans": "1", "multi": false, "q": "關於電子郵件（Email）之敘述，下列何者錯誤？", "o": ["郵件一經寄出，即使郵件伺服器有問題，也不會被退信", "可以一次將一封郵件同時發送給多個收件者", "寄件伺服器可以是任一部郵件伺服器，收件伺服器必須是郵件帳號所屬的伺服器", "寄送郵件是指將郵件寄至收件者所屬的伺服器而非電腦中"], "e": "若收件伺服器故障、地址錯誤或信箱已滿，郵件會被退回（退信）。"}, {"n": 573, "code": "3-70", "ans": "3", "multi": false, "q": "關於 HTML 之敘述，下列何者錯誤？", "o": ["HTML 檔中的指令是在文件中插入標註", "HTML 檔是以標準文字檔格式儲存", "HTML 檔是供新聞群組 news 使用的", "HTML 檔可供 client 端瀏覽器使用顯示網頁之用"], "e": "HTML 是撰寫網頁的標記語言，供瀏覽器顯示網頁；新聞群組使用 NNTP 協定，與 HTML 無關。"}, {"n": 574, "code": "3-71", "ans": "1", "multi": false, "q": "關於 WWW 之敘述，下列何者錯誤？", "o": ["無法顯示本機中資料夾的網頁", "可以顯示多媒體資訊", "在超連結點上按一下滑鼠左鍵，可以連結到別的網頁", "在 WWW 網頁上所顯示的內容，是使用 HTML 檔案格式"], "e": "瀏覽器可以用 file:/// 開啟本機資料夾中的 HTML 檔案。"}, {"n": 575, "code": "3-72", "ans": "3", "multi": false, "q": "下列哪一項與網際網路 Web 程式設計無關？", "o": ["超文件標示語言 HTML", "可擴展標示語言 XML", "資料操作語言 DML", "標準通用標示語言 SGML"], "e": "DML 是資料庫的資料操作語言（SELECT、INSERT 等）。HTML、XML 都源自 SGML，屬網頁標示語言。"}, {"n": 576, "code": "3-73", "ans": "4", "multi": false, "q": "ANSI-SPARC Architecture for DataBases 為一種資料庫管理系統（DBMS）架構，下列哪一層不是該架構所制定的資料庫系統架構層？", "o": ["外部層（External Level）", "概念層（Conceptual Level）", "內部層（Internal Level）", "實體層（Physical Level）"], "e": "ANSI-SPARC 三層架構為外部層（使用者視界）、概念層（整體邏輯結構）、內部層（實際儲存結構）；沒有獨立的「實體層」。"}, {"n": 577, "code": "3-74", "ans": "1", "multi": false, "q": "有關 SQL 之敘述，下列何者不是其可表達的語言？", "o": ["資料迴圈語言 DLL（Data Loop Language）", "資料控制語言 DCL", "資料操作語言 DML", "資料定義語言 DDL"], "e": "SQL 包含 DDL、DML、DCL 三類；沒有「資料迴圈語言」。"}, {"n": 578, "code": "3-75", "ans": "2", "multi": false, "q": "某系內每一位教授可教多門課程，且每一門課程也可由多名教授授課，則「教授與課程之間的對應關係」應屬於下列哪一種關係？", "o": ["一對一", "多對多", "一對多", "多對一"], "e": "兩邊都是「一個對應多個」，所以是多對多（M:N），實作時需建立中介資料表（如授課表）拆成兩個一對多。"}, {"n": 579, "code": "3-76", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，其「相片」的功能為何？", "o": ["檢視、編輯、組織與共用您的圖片及視訊", "使用視訊、數位圖片以及音樂製作您的電影", "存放電子郵件地址和其他關於人與機構的資訊", "控制這部電腦的圖形硬體功能"], "e": "「相片」App 可瀏覽、簡易編輯、整理與分享相片和影片。(2) 是影片編輯器；(3) 是連絡人；(4) 是顯示卡控制台。"}, {"n": 580, "code": "3-77", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，「控制台」中「Windows Defender 防火牆」的功能為何？", "o": ["設定防火牆安全選項，保護電腦不受駭客及惡意軟體的侵害", "變更此電腦的主題設定", "掃描您的電腦是否有垃圾軟體、排程掃描，並且取得最新的垃圾軟體定義", "為共用這部電腦的人變更使用者帳戶設定和密碼"], "e": "防火牆依規則允許或封鎖網路連線，防止駭客與惡意程式入侵。(3) 是 Windows Defender 防毒（防間諜軟體）的功能。"}, {"n": 581, "code": "3-78", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，「Windows Update」的功能為何？", "o": ["Windows 版本升級", "檢查是否有軟體及驅動程式更新、選擇自動更新設定，或是檢視已安裝的更新", "解除安裝或變更您電腦上的程式", "變更搜尋時 Windows 建立檔案索引的方式"], "e": "Windows Update 下載安裝安全性修補、功能更新與驅動程式，並可檢視更新記錄、設定自動更新。"}, {"n": 582, "code": "3-79", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，「效能監視器」的功能為何？", "o": ["檢視關於您電腦的詳細資料，以及變更硬體、效能及遠端連線的設定", "即時或從紀錄檔檢視效能資料", "便利和經濟的 Windows 升級", "檢視和更新硬體的設定及驅動程式軟體"], "e": "效能監視器（perfmon）可即時監看各種效能計數器，或從記錄檔回顧分析效能資料。(1) 是「系統」；(4) 是「裝置管理員」。"}, {"n": 583, "code": "3-80", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，檢閱問題報告的功能為何？", "o": ["備份並還原您的檔案和系統設定", "取得有關您電腦的速度及效能的詳細資料", "檢查線上是否有軟體問題的解決方案、選擇報告設定，並且查看電腦的問題報告", "檢視關於您電腦的詳細資料，以及變更硬體、效能及遠端連線的設定"], "e": "「問題報告」（安全性與維護）會記錄程式當機等問題，並可上網查詢解決方案。"}, {"n": 584, "code": "3-81", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，Windows 安全性的功能為何？", "o": ["備份並還原您的檔案和系統設定", "檢查線上是否有軟體問題的解決方案、選擇報告設定，並且查看電腦的問題報告", "檢視及管理裝置安全性和健康狀況的中心", "設定防火牆安全選項，保護電腦不受駭客及惡意軟體的侵害"], "e": "「Windows 安全性」是整合中心，可檢視與管理病毒防護、防火牆、帳戶保護、裝置安全性與裝置效能及健康狀況。"}, {"n": 585, "code": "3-82", "ans": "1", "multi": false, "q": "在 Windows 作業系統中，預設應用程式的功能為何？", "o": ["選擇要讓 Windows 使用哪些程式來瀏覽網頁、編輯照片、傳送電子郵件及播放音樂", "檢查是否有軟體及驅動程式更新", "同步處理您的電腦與其他電腦、裝置及網路資料夾之間的資訊", "設定您的電腦，以加入像是 Windows 會議空間這類活動"], "e": "「預設應用程式」設定各類檔案或用途（瀏覽器、郵件、音樂、相片）預設用哪個程式開啟。"}, {"n": 586, "code": "3-83", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，其「控制台」中何者具備「變更佈景主題」的功能？", "o": ["裝置管理員", "Tablet PC 設定", "個人化", "使用者帳戶"], "e": "「個人化」可變更佈景主題、桌面背景、色彩、音效、螢幕保護程式。"}, {"n": 587, "code": "3-84", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，何者具備變更搜尋時 Windows 建立檔案索引的功能？", "o": ["預設程式", "資料夾選項", "程式和功能", "索引選項"], "e": "「索引選項」可設定哪些位置、檔案類型要建立索引，以加快搜尋速度，也可重建索引。"}, {"n": 588, "code": "3-85", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，下列何者具備檢視和更新硬體的設定及驅動程式軟體的功能？", "o": ["新增硬體", "裝置管理員", "Windows Defender", "程式和功能"], "e": "裝置管理員列出所有硬體裝置，可檢視狀態、更新/回復/解除安裝驅動程式、停用裝置。"}, {"n": 589, "code": "3-86", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，下列何者可以解除安裝或變更您電腦上的程式？", "o": ["預設程式", "程式和功能", "系統", "系統管理工具"], "e": "「程式和功能」（新增或移除程式）可解除安裝、變更或修復已安裝的應用程式，並開啟或關閉 Windows 功能。"}, {"n": 590, "code": "3-87", "ans": "1", "multi": false, "q": "在 Linux 作業系統中，下列何者可用來查看路由表（Routing table）？", "o": ["route", "netstate-n", "netstate", "view"], "e": "route（或 route -n、netstat -r、ip route）可顯示核心路由表。選項中的 netstate 拼法錯誤（正確指令是 netstat）。"}, {"n": 591, "code": "3-88", "ans": "3", "multi": false, "q": "在 Linux 作業系統中，當 DHCP Server 架設完成後，只用 /etc/rc.d/init.d/dhcpd start 啟動，若系統重新開機，下列何者為 DHCP Server 的狀態？", "o": ["Runlevel 3 為啟動，Runlevel 5 為停止", "Runlevel 3 為停止，Runlevel 5 為啟動", "停止", "啟動"], "e": "手動 start 只在本次開機有效；沒有用 chkconfig dhcpd on（或 systemctl enable）設定開機自動啟動，重新開機後服務就是停止狀態。"}, {"n": 592, "code": "3-89", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，TCP/IP 的埠號（port）22 為何服務所使用？", "o": ["Telnet Server", "SSH Server", "SMTP Server", "FTP Server"], "e": "常用埠號：FTP 20/21、SSH 22、Telnet 23、SMTP 25、DNS 53、HTTP 80、POP3 110、HTTPS 443。"}, {"n": 593, "code": "3-90", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，要檢查本端與遠端機器間的路徑，可使用下列哪一個命令？", "o": ["/sbin/route", "/bin/ping", "/usr/sbin/tracert", "/usr/sbin/traceroute"], "e": "Linux 用 traceroute 追蹤封包經過的每一個路由器；tracert 是 Windows 的指令名稱。"}, {"n": 594, "code": "3-91", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，想知道哪些有效網路介面可用時，應使用下列哪一個命令？", "o": ["netcfg", "ifconfig", "cat /net.status", "netstate -r"], "e": "ifconfig（或 ip link/ip addr）列出目前啟用中的網路介面與設定。"}, {"n": 595, "code": "3-92", "ans": "3", "multi": false, "q": "在 Linux 作業系統中，下列何者可將路徑加入 Linux 的路由表中？", "o": ["netstat", "net", "route", "addroute"], "e": "route add 可新增路由，例如 route add -net 192.168.2.0 netmask 255.255.255.0 gw 192.168.1.1；route del 刪除路由。"}, {"n": 596, "code": "3-93", "ans": "3", "multi": false, "q": "在 Linux 作業系統中，架設 NFS Server 的用途為何？", "o": ["動態分配 IP", "作為時間伺服器", "檔案分享給 Linux/Unix/BSD 用戶", "檔案分享給 Windows 用戶"], "e": "NFS（Network File System）讓 Unix-like 系統之間透過網路掛載、共享檔案。分享給 Windows 用戶要用 Samba（SMB）；動態分配 IP 是 DHCP；時間伺服器是 NTP。"}, {"n": 597, "code": "3-94", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，NFS 是透過何種協定來存取遠端主機的檔案？", "o": ["MMS", "SMB", "Appletalk", "RPC"], "e": "NFS 建立在 RPC（遠端程序呼叫）之上，需要 rpcbind（portmap）服務。SMB 是 Windows 網路分享協定。"}, {"n": 598, "code": "3-95", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，Samba 的各種安全等級中，何者不需檢驗帳號密碼？", "o": ["user", "share", "server", "domain"], "e": "security = share 時，共用資源不需帳號密碼即可存取（類似 Windows 匿名分享）；user、server、domain 都要驗證帳密。"}, {"n": 599, "code": "3-96", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，欲把 Samba Server 加入 Windows 網域中，應採哪種安全等級？", "o": ["share", "domain", "server", "user"], "e": "security = domain 會把 Samba 加入 Windows 網域，由網域控制站（DC）負責驗證帳號密碼。"}, {"n": 600, "code": "3-97", "ans": "3", "multi": false, "q": "在 Linux 作業系統中，下列何者為 bind 的工作環境設定檔？", "o": ["named.local", "localhost.zone", "named.conf", "named.ca"], "e": "BIND（DNS 伺服器，服務名稱 named）的主設定檔是 /etc/named.conf；named.ca 是根伺服器提示檔；*.zone 是區域資料檔。"}, {"n": 601, "code": "3-98", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，欲建置郵件伺服器時，何者不是硬體應考量的條件？", "o": ["RAM 容量", "CPU 速度", "硬碟的效能", "螢幕解析度"], "e": "伺服器在背景提供服務，效能取決於記憶體、CPU、硬碟（郵件儲存）；螢幕解析度與郵件服務無關。"}, {"n": 602, "code": "3-99", "ans": "1", "multi": false, "q": "在 Linux 作業系統中，Apache 啟用 SSL 加密傳輸協定 https 時，所佔用的 port 為何？", "o": ["443", "22", "80", "143"], "e": "HTTPS 預設 port 443；HTTP 80；SSH 22；IMAP 143。"}, {"n": 603, "code": "3-100", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，下列哪種伺服器可加速 web 伺服器的服務？", "o": ["DHCP", "NTP", "NNTP", "squid"], "e": "Squid 是 Proxy 快取伺服器，會快取網頁內容，可加速瀏覽並減輕 web 伺服器負擔。"}, {"n": 604, "code": "3-101", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，欲新增群組的指令為何？", "o": ["addgroups", "groupadd", "addgrp", "grpadd"], "e": "groupadd 新增群組；groupdel 刪除群組；useradd 新增使用者。"}, {"n": 605, "code": "3-102", "ans": "4", "multi": false, "q": "在網域名稱系統中，關於「反向解析」，下列敘述何者正確？", "o": ["由 IP 查 DNS Server", "由名稱查 DNS Server", "由名稱查 IP", "由 IP 查名稱"], "e": "正向解析：網域名稱 → IP；反向解析：IP → 網域名稱（使用 PTR 記錄）。"}, {"n": 606, "code": "3-103", "ans": "3", "multi": false, "q": "在 ISO 的 OSI 模型中，下列何者的任務是精確、可靠執行調節來源到目的地的資訊流？", "o": ["網路層", "會談層", "傳輸層", "展示層"], "e": "第 4 層傳輸層負責端對端（來源到目的）的可靠傳輸、流量控制、錯誤控制與分段重組，例如 TCP。"}, {"n": 607, "code": "3-104", "ans": "3", "multi": false, "q": "對於 Linux 作業系統而言，下列敘述何者錯誤？", "o": ["具視窗圖形界面", "多重開機管理功能", "單人多工系統", "具網路能力"], "e": "Linux 是多人多工（Multi-user, Multi-tasking）作業系統，可同時讓多個使用者登入使用。"}, {"n": 608, "code": "3-105", "ans": "2", "multi": false, "q": "在 Linux 作業系統中，如對某指令的功能不太清楚，可以使用下列何種指令查詢？", "o": ["ls", "man", "chmod", "find"], "e": "man（manual）顯示指令的說明手冊，例如 man ls。"}, {"n": 609, "code": "3-106", "ans": "4", "multi": false, "q": "在 Linux 作業系統中，對於目錄之敘述，下列何者錯誤？", "o": ["「.」表示目前目錄", "「..」表示上一層目錄", "「/」表示系統根目錄", "「~」表示管理者目錄"], "e": "「~」表示「目前使用者的家目錄」（如 /home/user），不是管理者目錄；root 的家目錄是 /root。"}, {"n": 610, "code": "3-107", "ans": "3", "multi": false, "q": "下列何種協定可配合 DNS 及 Active Directory 在 IP 網路上使用，讓使用者免於指定及追蹤靜態的 IP 位址？", "o": ["BOOTP", "TCP/IP", "DHCP", "PPP"], "e": "DHCP 自動配發 IP，可搭配動態 DNS 與 AD 更新名稱記錄，管理者不必手動設定及追蹤靜態 IP。"}, {"n": 611, "code": "3-108", "ans": "3", "multi": false, "q": "管理 Windows 用戶端時，最好不要使用何種類型檔案，因為它會導致一些意料之外，且無法改變的登錄設定？", "o": [".exe", ".ini", ".adm", ".tmp"], "e": ".adm 是群組原則的系統管理範本檔，若使用不當會在登錄檔中留下無法回復的設定（俗稱 tattooing 刺青效應）。"}, {"n": 612, "code": "3-109", "ans": "4", "multi": false, "q": "下列何種語言是用於包含結構資訊的文件的非標準化標示語言，並提供了一種定義標示以及它們之間結構關係的工具？", "o": ["ASP", "C++", "VB", "XML"], "e": "XML（可延伸標示語言）讓使用者自行定義標籤與結構（以 DTD/Schema 描述），用來描述與交換結構化資料。"}, {"n": 613, "code": "3-110", "ans": "3", "multi": false, "q": "為解決日益增加的網路人口 IP 分配不足的問題，推行使用下列何種技術？", "o": ["IPv2", "IPv4", "IPv6", "IPv8"], "e": "IPv4 只有 32 位元（約 43 億個位址）已不敷使用；IPv6 擴充為 128 位元，位址數量近乎無限。"}, {"n": 614, "code": "3-111", "ans": "2", "multi": false, "q": "在 UNIX 系統中，欲對檔案建立捷徑，可使用下列何種指令？", "o": ["ls", "ln", "cat", "rm"], "e": "ln 建立連結；ln -s 建立符號連結（Symbolic Link），相當於 Windows 的捷徑。"}, {"n": 615, "code": "3-112", "ans": "1", "multi": false, "q": "有關「TCP 協定」之敘述，下列何者正確？", "o": ["TCP 是連接導向（Connection-Oriented）的協定，會進行資料的分割、重組及確認", "TCP 是非連接導向的協定，會進行資料的分割與重組，但不需要進行確認", "TCP 是新版本 UDP 協定", "TCP 只用於 Web 瀏覽器上"], "e": "TCP 先以三向交握建立連線，把資料分段、編序號、確認（ACK）與重送，接收端再依序重組，確保可靠傳輸。UDP 是非連接導向、不確認。"}, {"n": 616, "code": "3-113", "ans": "2", "multi": false, "q": "下列哪一種協定負責維護網際網路（Internet）的路由表（Routing Table）？", "o": ["TCP", "IP", "ICMP", "UDP"], "e": "依題庫答案為 IP：路由屬於網路層 IP 的工作。（實務上路由表由 RIP、OSPF、BGP 等路由協定建立維護。）"}, {"n": 617, "code": "3-114", "ans": "4", "multi": false, "q": "下列何者為 TCP/IP 協定中 ARP（Address Resolution Protocol）的主要功能？", "o": ["負責路由表的維護", "負責路由器的交通控制", "負責將主機名稱解析為 IP 位址", "負責將 IP 位址解析為硬體位址（MAC Address）"], "e": "ARP 把 IP 位址轉成 MAC 位址；RARP 則反過來。把主機名稱解析成 IP 是 DNS 的工作。"}, {"n": 618, "code": "3-115", "ans": "3", "multi": false, "q": "有關「IPv4 位址類別（Class）」之敘述，下列何者正確？", "o": ["Class A 和 Class B 用於擁有電腦數量較少的公司中；Class C 則用於擁有數千部電腦的大公司", "InterNIC 只負責指派 Class A，其餘類別則由各國政府負責", "Class A 使用第一個 octet 為網路 ID，Class B 使用前二個 octet 為網路 ID，Class C 使用前三個 octet 為網路 ID", "Class A 使用前三個 octet 為網路 ID，Class B 使用前二個，Class C 使用第一個"], "e": "Class A：1 個位元組網路 ID＋3 個主機 ID（主機數最多，給大型組織）；Class B：2＋2；Class C：3＋1（每網路最多 254 台主機，給小型網路）。"}, {"n": 619, "code": "3-116", "ans": "4", "multi": false, "q": "有關「子網路遮罩（Subnet Mask）功能」之敘述，下列何者正確？", "o": ["路由器決定框架（Frame）最佳傳送路徑的唯一依據", "僅用於有路由器（Router）存在的區域網路中", "遮掉網路 ID，以做為主機（Host）位址", "遮掉主機（Host）ID，以做為網路位址"], "e": "IP AND 子網路遮罩時，遮罩為 0 的主機部分被清成 0，只留下網路位址，用以判斷是否在同一網段。"}, {"n": 620, "code": "3-117", "ans": "1", "multi": false, "q": "在 Windows Server 中，下列哪一項服務可以讓電腦自動取得 IP 位址？", "o": ["DHCP", "WINS", "IPConfig", "PING"], "e": "DHCP 伺服器自動分配 IP 給用戶端。IPConfig 是查看設定的指令。"}, {"n": 621, "code": "3-118", "ans": "3", "multi": false, "q": "下列哪一項服務可以將 www.facebook.com 轉譯為 IP 位址？", "o": ["WINS", "DHCP", "DNS", "LMHOSTS"], "e": "DNS 把網域名稱解析成 IP 位址。WINS、LMHOSTS 解析的是 NetBIOS 電腦名稱。"}, {"n": 622, "code": "3-119", "ans": "4", "multi": false, "q": "下列何種設備可以切割網路，以限制網路封包傳送，並提升傳送效率？", "o": ["集線器（Hub）", "訊號增強器（Repeater）", "無線基地台（Access Point）", "橋接器（Bridge）"], "e": "橋接器把網路切成不同網段，只有目的地在另一網段的訊框才會轉送，減少不必要流量與碰撞。Hub、Repeater 只會把訊號轉送到所有埠。"}, {"n": 623, "code": "3-120", "ans": "3", "multi": false, "q": "下列何者是「無線基地台（Access Point）識別名稱」的縮寫？", "o": ["WISP", "APID", "SSID", "AP"], "e": "SSID（Service Set Identifier）是無線網路名稱，也就是搜尋 Wi-Fi 時看到的名稱。"}, {"n": 624, "code": "3-121", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，哪一種無線網路連線設定會限制使用相同無線基地台的其他電腦連線到你的電腦？", "o": ["私人", "公司", "住家", "公共場所"], "e": "網路位置設為「公共場所（公用網路）」時，Windows 會關閉網路探索與檔案共用，其他電腦無法看到或連到你的電腦。"}, {"n": 625, "code": "3-122", "ans": "3", "multi": false, "q": "在 Windows 作業系統中，連線到無線基地台時，若設定使用網路位置為「公共場所」，則會關閉下列何種功能？", "o": ["省電", "無線網路連接", "網路探索", "自動備份"], "e": "公用網路會關閉「網路探索」（以及檔案及印表機共用），以保護電腦安全。"}, {"n": 626, "code": "3-123", "ans": "2", "multi": false, "q": "有一些網站會以文字檔的型式在使用者電腦中儲存資訊，當使用者再次進入該網站時，利用這個文字檔可以提供個人化資訊，這種文字檔稱為？", "o": ["W3C", "Cookie", "Sign-in Seal", "Session"], "e": "Cookie 是網站存在使用者瀏覽器端的小型文字資料（登入狀態、偏好設定）。Session 則存放在伺服器端。"}, {"n": 627, "code": "3-124", "ans": "2", "multi": false, "q": "一顆硬碟以 MBR 分割表分割，最多可以設定成幾個主要分割區（Primary Partition）？", "o": ["3", "4", "5", "6"], "e": "MBR 分割表只有 4 個項目，最多 4 個主要分割區（或 3 主要＋1 延伸分割區，延伸分割區內可再切邏輯磁碟）。GPT 則可達 128 個。"}, {"n": 628, "code": "3-125", "ans": "3", "multi": false, "q": "Linux 作業系統中的 man page 資料通常放在 /usr/share/man 的目錄內，可透過修改下列哪一個 configuration file 來變更 man page 的存放位置？", "o": ["/var/man.conf", "/etc/man.conf", "/etc/man.config", "/var/man.config"], "e": "設定檔放在 /etc 目錄。依題庫答案為 /etc/man.config（舊版 Red Hat/CentOS 使用此檔名；其他發行版可能是 /etc/man.conf 或 /etc/manpath.config）。"}, {"n": 629, "code": "3-126", "ans": "2", "multi": false, "q": "Linux 作業系統中的指令「ls -l」可以顯示檔案的 10 個詳細屬性，第一個屬性若是顯示為「b」，則表示該檔案為？", "o": ["連結", "週邊設備", "一般檔案", "目錄"], "e": "第一個字元表示檔案類型：- 一般檔案、d 目錄、l 連結、b 區塊裝置（如硬碟，週邊設備）、c 字元裝置（如鍵盤）。"}, {"n": 630, "code": "3-127", "ans": "1", "multi": false, "q": "在 Linux 的 ext2 檔案系統中，一個分割區（Partition）所能容納的最大檔案數與下列何者有關？", "o": ["inode 數量", "block size", "block 數量", "inode size"], "e": "每個檔案（或目錄）都需佔用一個 inode 記錄屬性與區塊位置，所以 inode 的數量決定最多能存幾個檔案。"}, {"n": 631, "code": "3-128", "ans": "3", "multi": false, "q": "在 Linux 的 ext2 檔案系統中，若 block size 為 1024 bytes，則檔案大小的上限為？", "o": ["64GB", "1TB", "16GB", "2TB"], "e": "ext2 的單一檔案上限依 block size 而定：1KB → 16GB、2KB → 256GB、4KB → 2TB。"}, {"n": 632, "code": "3-129", "ans": "2", "multi": false, "q": "在 Linux 的 Bash shell 環境中，「命令與檔案補全功能」的快速鍵為？", "o": ["Alt 鍵", "Tab 鍵", "Esc 鍵", "Ctrl 鍵"], "e": "輸入部分指令或檔名後按 Tab 自動補全；按兩下 Tab 列出所有可能的選項。"}, {"n": 633, "code": "3-130", "ans": "1", "multi": false, "q": "在 Linux 中，使用 /etc/passwd 記錄使用者資料，每個使用者有 7 個欄位，欄位之間以何種符號隔開？", "o": ["冒號", "分號", "逗號", "句號"], "e": "格式為「帳號:密碼:UID:GID:說明:家目錄:Shell」，例如 root:x:0:0:root:/root:/bin/bash，以冒號分隔。"}, {"n": 634, "code": "3-131", "ans": "1", "multi": false, "q": "在 Linux 中，某個檔案權限為 755，對該檔案擁有者（Owner）而言，所代表的意義為何？", "o": ["可讀、可執行、可寫入", "可讀、可寫入、可寫入", "可讀、可執行、可執行", "可寫入、可讀、可讀"], "e": "r=4、w=2、x=1。755 中擁有者是 7＝4+2+1＝讀、寫、執行全有；群組與其他人是 5＝4+1＝讀、執行。"}, {"n": 635, "code": "3-132", "ans": "3", "multi": false, "q": "在 Linux 中，下列何種方式或指令可以有效且免費地建構防火牆系統？", "o": ["tcp_wrappers", "ipfliter", "iptables", "hosts.deny"], "e": "iptables 是 Linux 核心內建（netfilter）的封包過濾防火牆工具，免費且功能完整。tcp_wrappers/hosts.deny 只能控制部分服務的存取。"}, {"n": 636, "code": "3-133", "ans": "2", "multi": false, "q": "在 Linux 中，下列哪一個指令可以用來改變檔案/目錄的權限屬性？", "o": ["chown", "chmod", "chsh", "chpwd"], "e": "chmod 改變權限（如 chmod 755 file）；chown 改變擁有者；chsh 改變登入 shell。"}, {"n": 637, "code": "3-134", "ans": "4", "multi": false, "q": "在 OSI 網路協定架構中，下列哪一層負責確保網路服務品質（Quality of Service）？", "o": ["實體層", "資料連結層", "網路層", "傳輸層"], "e": "依題庫答案為傳輸層：負責端對端傳輸品質，例如可靠傳輸、流量控制、錯誤恢復。"}, {"n": 638, "code": "3-135", "ans": "2", "multi": false, "q": "每個標準 ASCII 字元、EBCDIC 字元及 Unicode 字元分別由多少位元所組成？", "o": ["7、7、16", "7、8、16", "16、8、7", "16、8、8"], "e": "標準 ASCII 為 7 位元（128 字元）；EBCDIC（IBM 大型主機）為 8 位元；Unicode（UCS-2/基本多文種平面）為 16 位元。"}, {"n": 639, "code": "3-136", "ans": "3", "multi": false, "q": "在 Linux 中，下列何者是「系統管理者」的預設帳號？", "o": ["administrator", "manager", "root", "super"], "e": "Linux/Unix 最高權限帳號為 root（UID 0）；Windows 則是 Administrator。"}, {"n": 640, "code": "3-137", "ans": "4", "multi": false, "q": "下列編碼中，何者具有傳輸錯誤更正的能力？", "o": ["同位元（parity bit）碼", "BCD 碼", "EBCDIC 碼", "漢明碼（Hamming code）"], "e": "漢明碼可偵測並更正單一位元錯誤；同位元只能偵錯不能更正；BCD、EBCDIC 是數字/字元編碼。"}, {"n": 641, "code": "3-138", "ans": "1", "multi": false, "q": "在 OSI 網路協定架構中，下列哪一層負責管理連線的傳輸方式和安全機制？", "o": ["表示層", "傳輸層", "會議層", "網路層"], "e": "表示層（第 6 層）負責資料格式轉換、壓縮與加密解密等安全機制。"}, {"n": 642, "code": "3-139", "ans": "3", "multi": false, "q": "在 Linux 作業系統中，下列哪一個指令可以用來備份檔案？", "o": ["pack", "queue", "tar", "zap"], "e": "tar 可把多個檔案/目錄打包成一個封存檔（常搭配 gzip 壓縮），常用於備份，例如 tar -czvf backup.tar.gz /home。"}, {"n": 643, "code": "3-140", "ans": "4", "multi": false, "q": "在公開金鑰加密法中，甲在傳給乙的資料中建立自己的數位簽章（Digital Signature），其加密方式為？", "o": ["以甲的公鑰加密", "以乙的公鑰加密", "以乙的私鑰加密", "以甲的私鑰加密"], "e": "數位簽章由「傳送者的私鑰」簽署，任何人用傳送者的公鑰驗證，證明是甲發出且未被竄改。若要保密（只有乙能看）則是用「乙的公鑰」加密。"}, {"n": 644, "code": "3-141", "ans": "2", "multi": false, "q": "在作業系統排程中，下列何者不是產生「死結（Deadlock）」的必要條件？", "o": ["循環等待（Circular Wait）", "可奪取（Preemption）", "互斥（Mutual Exclusion）", "持有並等待（Partial Allocation）"], "e": "死結四個必要條件：互斥、持有並等待、「不可奪取（No Preemption）」、循環等待。可以奪取資源就不會產生死結。"}, {"n": 645, "code": "3-142", "ans": "4", "multi": false, "q": "有關「DMA（Direct Memory Access）」之敘述，下列何者錯誤？", "o": ["DMA 利用到 Cycle-Stealing 的方法", "傳送大量資料時，DMA 比 Programmed I/O 和 Interrupt I/O 快", "DMA 需要 DMA Controller", "DMA 可增加上網的速度"], "e": "DMA 讓 I/O 裝置透過 DMA 控制器直接與記憶體交換資料，不經 CPU，以竊取週期方式使用匯流排。它提升的是電腦內部 I/O 效率，與上網速度無關。"}, {"n": 646, "code": "3-143", "ans": "3", "multi": false, "q": "採用存轉式（Store-and-Forward）傳輸資訊的方式是？", "o": ["路由交換", "電路交換", "分封交換（Packet Switching）", "信號交換"], "e": "同第 19 題：分封交換中每個節點先儲存封包，再選擇路徑轉送。"}, {"n": 647, "code": "3-144", "ans": "3", "multi": false, "q": "下列何者不是「高階語言編譯程式」所提供的功能？", "o": ["語句分析（Lexical Analysis）", "語法分析（Parsing）", "垃圾收集（Garbage Collection）", "目的碼的產生"], "e": "編譯過程：詞彙分析 → 語法分析 → 語意分析 → 最佳化 → 產生目的碼。垃圾收集是程式「執行時期」由執行環境（如 JVM）自動回收不用的記憶體。"}, {"n": 648, "code": "3-145", "ans": "4", "multi": false, "q": "在網路安全應用中，通常利用雜湊函數（Hash Function）來做為所傳送訊息的指紋（Fingerprint），以便進行訊息驗證；下列哪一個不是雜湊函數？", "o": ["MD4", "MD5", "SHA", "DES"], "e": "DES 是對稱式加密演算法（可解密還原）；MD4、MD5、SHA 是單向雜湊函數，產生固定長度的摘要。"}, {"n": 649, "code": "3-146", "ans": "4", "multi": false, "q": "在 Windows 的裝置管理員中，某個裝置出現黃色驚嘆號（！）時，是表示？", "o": ["該裝置尚未啟動", "無法辨識該裝置", "該裝置的相關設定已關閉", "該裝置驅動程式有問題"], "e": "黃色驚嘆號表示裝置驅動程式有問題（未安裝、損毀或資源衝突）。向下箭頭表示裝置已停用；問號表示未知裝置。"}, {"n": 650, "code": "3-147", "ans": "4", "multi": false, "q": "下列何者是沒有採用 P2P 技術的網際網路服務？", "o": ["Skype", "MSN", "BitTorrent", "Email"], "e": "電子郵件經由郵件伺服器轉送（主從式架構）。Skype、BitTorrent 使用 P2P；題庫也將 MSN 列為 P2P 服務。"}, {"n": 651, "code": "3-148", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，有關「剪貼簿」之敘述，下列何者錯誤？", "o": ["按一下 PrintScreen 鍵，可以將「整個螢幕畫面」複製到剪貼簿中", "按一下 Ctrl+PrintScreen 鍵，只將「作用中視窗畫面」複製到剪貼簿中", "執行 Ctrl+V 貼上時，只能使用最後一次所複製的內容", "在 Word 中加入「剪貼簿」的內容可以複製到 PowerPoint 和 Excel 中"], "e": "只擷取作用中視窗的快速鍵是 Alt+PrintScreen，不是 Ctrl+PrintScreen。"}, {"n": 652, "code": "3-149", "ans": "2", "multi": false, "q": "下列何種程式語言只能使用在微軟（Microsoft）的 SDK 開發環境中？", "o": ["Java", "C#", "Python", "Object-C"], "e": "依題庫答案為 C#：C# 是微軟為 .NET 平台設計的語言，主要在微軟的 Visual Studio/.NET SDK 中開發。（現已有跨平台的 .NET Core，作答依題庫。）"}, {"n": 653, "code": "3-150", "ans": "1", "multi": false, "q": "在 Android 系統中，SDK 開發環境主要使用的程式語言是？", "o": ["Java", "C#", "Python", "Object-C"], "e": "Android 傳統以 Java 開發（現在 Google 也主推 Kotlin）。"}, {"n": 654, "code": "3-151", "ans": "4", "multi": false, "q": "在 iPhone 系統中，SDK 開發環境主要使用的程式語言是？", "o": ["Java", "C#", "Python", "Object-C"], "e": "iOS 早期以 Objective-C 開發，2014 年後 Apple 推出 Swift。"}, {"n": 655, "code": "3-152", "ans": "4", "multi": false, "q": "下列何者不是雲端技術的服務層次？", "o": ["PaaS", "IaaS", "SaaS", "CaaS（Computing as a Service）"], "e": "雲端三大服務模式：IaaS（基礎設施即服務）、PaaS（平台即服務）、SaaS（軟體即服務）。"}, {"n": 656, "code": "3-153", "ans": "4", "multi": false, "q": "在 Linux 作業系統的環境變數「PATH」中，每個目錄路徑之間是以哪一種符號隔開？", "o": ["分號", "逗號", "句
