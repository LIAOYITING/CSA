號", "冒號"], "e": "Linux 的 PATH 以冒號分隔，例如 /usr/local/bin:/usr/bin:/bin。"}, {"n": 657, "code": "3-154", "ans": "1", "multi": false, "q": "在 Windows 作業系統的系統變數「Path」中，每個目錄路徑之間是以哪一種符號隔開？", "o": ["分號", "逗號", "句號", "冒號"], "e": "Windows 的 Path 以分號分隔，例如 C:\\Windows;C:\\Windows\\System32（冒號已被磁碟代號使用）。"}, {"n": 658, "code": "3-155", "ans": "4", "multi": false, "q": "有關螢幕解析度之敘述，下列何者正確？", "o": ["解析度越高，桌面上能顯示的色彩越多", "解析度不受螢幕和顯示卡的硬體限制", "解析度不受驅動程式的限制", "解析度越高，桌面的圖示就越小"], "e": "解析度越高，同樣大小的螢幕塞進越多像素，圖示與文字看起來就越小。色彩數由色彩深度決定；解析度受螢幕、顯示卡與驅動程式限制。"}, {"n": 659, "code": "3-156", "ans": "3", "multi": false, "q": "在 Linux 作業系統安裝時，下列何者一定要設定成單獨分割區的掛載點？", "o": ["/var", "/usr", "swap", "tmp"], "e": "依題庫答案為 swap：swap（置換空間）傳統上要用獨立的分割區（格式為 swap）；/var、/usr、/tmp 可以和根目錄放在同一分割區。（新版也可用 swap 檔，作答依題庫。）"}, {"n": 660, "code": "3-157", "ans": "1", "multi": false, "q": "在 Linux 中，安裝新硬碟分割區 /dev/hdb1 後，需要在下列哪一個檔案中設定開機時自動掛載該分割區？", "o": ["/etc/fstab", "/var/disktab", "/etc/inittab", "/usr/disktab"], "e": "/etc/fstab（檔案系統表）設定開機時自動掛載的裝置、掛載點、檔案系統類型與選項。/etc/inittab 是舊式 init 的執行等級設定。"}, {"n": 661, "code": "3-158", "ans": "4", "multi": false, "q": "在 Linux 中，有關執行列印檔案 readme.txt 之指令，下列何者正確？", "o": ["lpp readme.txt", "lpq readme.txt", "lpd readme.txt", "lpr readme.txt"], "e": "lpr 送出列印工作；lpq 查詢列印佇列；lprm 刪除列印工作；lpd 是列印服務的背景程式（daemon）。"}, {"n": 662, "code": "3-159", "ans": "4", "multi": false, "q": "在 Windows 作業系統中，有關「休眠」之敘述，下列何者錯誤？", "o": ["會將記憶體中的資料放到硬碟上", "比「待命」模式省電", "比「待命」模式需要更長的恢復時間", "進入「休眠」模式後，硬碟仍持續運轉"], "e": "休眠把記憶體內容寫入硬碟（hiberfil.sys）後完全斷電，硬碟也停止運轉；待命（睡眠）則持續供電給記憶體，恢復較快。"}, {"n": 663, "code": "3-160", "ans": "4", "multi": false, "q": "在 Linux 環境中，檔案 test.sh 的屬性為「-rwxr-xr--」，下列哪一個指令無法將檔案屬性改為「-rwxrwxr-x」？", "o": ["chmod 775 test.sh", "chmod g=rwx,o=rx test.sh", "chmod g+w,o+x test.sh", "chmod 755 test.sh"], "e": "目標 rwx rwx r-x ＝ 7 7 5，所以 chmod 775 正確。755 會變成 rwxr-xr-x（群組少了 w），無法達成。(2) 直接指定群組與其他人；(3) 原本群組 r-x 加 w、其他人 r-- 加 x，也能達成。"}, {"n": 664, "code": "3-161", "ans": "3", "multi": false, "q": "下列何種作業系統不屬於開放原始碼？", "o": ["Android", "Linux", "iOS", "FreeBSD"], "e": "iOS 是 Apple 專有的封閉原始碼系統；Android（AOSP）、Linux、FreeBSD 都是開源。"}, {"n": 665, "code": "3-162", "ans": "4", "multi": false, "q": "下列何者不屬於作業系統的任務？", "o": ["記憶體分配", "程序管理", "網路流量監控", "版本控制"], "e": "版本控制（如 Git）是軟體開發工具管理程式碼版本的功能，不是作業系統任務。"}, {"n": 666, "code": "3-163", "ans": "24", "multi": true, "q": "在 Windows 作業系統中，有關區域網路連線裝置之敘述，下列何者正確？", "o": ["每部電腦的作業系統必須是 Windows", "可彼此分享檔案及印表機", "每台電腦的記憶體容量必須相同", "公用資料夾是預設的分享資料夾"], "e": "答案 (2)(4)。區域網路中不同作業系統（Linux、Mac）也能互連；記憶體容量與能否連線無關。"}, {"n": 667, "code": "3-164", "ans": "134", "multi": true, "q": "在 Windows 作業系統中，具有進階安全性的 Windows 防火牆有下列哪些設定檔？", "o": ["網域", "區域", "私人", "公用"], "e": "答案 (1)(3)(4)。防火牆有三個設定檔：網域、私人、公用，可依連線的網路類型套用不同規則。"}, {"n": 668, "code": "3-165", "ans": "123", "multi": true, "q": "在 Windows 作業系統中，「本機安全性原則」可以設定哪些安全性項目？", "o": ["公開金鑰原則", "軟體限制原則", "網路清單管理員原則", "硬體相容原則"], "e": "答案 (1)(2)(3)。本機安全性原則包含帳戶原則、本機原則、具有進階安全性的防火牆、網路清單管理員原則、公開金鑰原則、軟體限制原則、應用程式控制原則等；沒有「硬體相容原則」。"}, {"n": 669, "code": "3-166", "ans": "234", "multi": true, "q": "下列何者為 WWW 瀏覽器？", "o": ["Writer", "Google Chrome", "Firefox", "Safari"], "e": "答案 (2)(3)(4)。Writer 是文書處理軟體。"}, {"n": 670, "code": "3-167", "ans": "23", "multi": true, "q": "下列何者是內送電子郵件之通訊協定？", "o": ["SMTP", "IMAP", "POP3", "SSL"], "e": "答案 (2)(3)。收信（內送）用 POP3 或 IMAP；寄信（外寄）用 SMTP；SSL 是加密協定。"}, {"n": 671, "code": "3-168", "ans": "14", "multi": true, "q": "有關「QR Code」之敘述，下列何者正確？", "o": ["二維空間條碼", "均為黑白兩色", "在 4 個角落，印有像「回」字的正方圖案", "可用於存貨管理"], "e": "答案 (1)(4)。QR Code 是二維條碼，可用於庫存、行動支付等。它也可以是彩色的；定位用的「回」字圖案只在 3 個角落（左上、右上、左下）。"}, {"n": 672, "code": "3-169", "ans": "12", "multi": true, "q": "下列何者屬於 OSI 模型中應用層之通訊協定？", "o": ["HTTP", "FTP", "TCP/IP", "ARP"], "e": "答案 (1)(2)。TCP/IP 是協定組合（傳輸層＋網路層）；ARP 屬網路層/資料鏈結層之間。"}, {"n": 673, "code": "3-170", "ans": "12", "multi": true, "q": "TCP 和 IP 分別對應到 OSI 模型中的哪些層？", "o": ["傳輸層", "網路層", "應用層", "表達層"], "e": "答案 (1)(2)。TCP 屬第 4 層傳輸層；IP 屬第 3 層網路層。"}, {"n": 674, "code": "3-171", "ans": "124", "multi": true, "q": "有關「IP」之敘述，下列何者正確？", "o": ["192.168.1.1 是一個虛擬 IP", "IPv6 使用 128 位元來表示 IP 位址", "192.168.1.256 是一個可用的 IP", "192.168.1.1 屬於 Class C"], "e": "答案 (1)(2)(4)。192.168.x.x 是私有（虛擬）IP，第一段 192 屬 Class C；每段最大 255，所以 256 不合法。"}, {"n": 675, "code": "3-172", "ans": "23", "multi": true, "q": "下列哪些 IP 位址屬於 Class C？", "o": ["181.23.45.67", "193.17.17.17", "201.255.255.2", "239.255.12.15"], "e": "答案 (2)(3)。Class C 第一段 192～223。181 屬 Class B（128～191）；239 屬 Class D（224～239，群播）。"}, {"n": 676, "code": "3-173", "ans": "134", "multi": true, "q": "下列何者為 IPv6 封包型式？", "o": ["Unicast", "Broadcast", "Multicast", "Anycast"], "e": "答案 (1)(3)(4)。IPv6 位址類型為單播、群播、任播；IPv6 取消了廣播（Broadcast），以群播取代。"}, {"n": 677, "code": "3-174", "ans": "12", "multi": true, "q": "下列何者為 IPv6 正確位址表示方式？", "o": ["BCE9::5241", "AB39::2", "1A7E::257D:39AC::3456", "5::25D:25::6"], "e": "答案 (1)(2)。「::」代表連續多組 0，但一個位址中只能出現一次，否則無法判斷各自省略幾組；(3)(4) 出現兩次「::」所以錯誤。"}, {"n": 678, "code": "3-175", "ans": "124", "multi": true, "q": "關於「IPv6」之敘述，下列何者正確？", "o": ["具自動設定機制", "整合 IPSec 加密協定", "封包的表頭長度固定為 32Bytes", "提供 2 的 128 次方的位址"], "e": "答案 (1)(2)(4)。IPv6 支援無狀態自動設定（SLAAC）、內建 IPSec、128 位元位址；基本表頭固定為 40 Bytes，不是 32 Bytes。"}, {"n": 679, "code": "3-176", "ans": "123", "multi": true, "q": "根據 IANA 的規定，有關通訊協定與常用埠號（Well-Known Port Number）之組合，下列何者正確？", "o": ["FTP:21", "DNS:53", "HTTP:80", "DHCP:76"], "e": "答案 (1)(2)(3)。DHCP 使用 UDP 67（伺服器）與 68（用戶端）。"}, {"n": 680, "code": "3-177", "ans": "124", "multi": true, "q": "在 Windows Server 中，有關「唯讀網域控制站」（RODC）之敘述，下列何者正確？", "o": ["RODC 只能接受複寫進來的資料", "AD 資料庫的內容不包含使用者的密碼", "AD 資料庫的內容具有可讀寫屬性", "可用本機系統管理員的身分管理 RODC"], "e": "答案 (1)(2)(4)。RODC 用於安全性較低的分支機構，AD 資料庫是唯讀的，只能從可寫入的 DC 單向複寫，預設不快取使用者密碼；可委派本機管理員管理。"}, {"n": 681, "code": "3-178", "ans": "124", "multi": true, "q": "在 Windows Server 中，有關網路存取保護（NAP）之敘述，下列何者正確？", "o": ["確認連線電腦的健康狀態是否符合健康原則", "可對於「不健康」的電腦進行修正", "所有「不健康」的電腦皆不能取得任何服務", "目的是保護網路和電腦安全"], "e": "答案 (1)(2)(4)。NAP 檢查連線電腦是否符合健康原則（更新、防毒、防火牆），不健康的電腦會被隔離到受限網路，仍可存取修正伺服器進行修正，不是完全不能取得服務。"}, {"n": 682, "code": "3-179", "ans": "124", "multi": true, "q": "在 Windows Server 中，有關「Hyper-V」技術之敘述，下列何者正確？", "o": ["採用 Intel VT 技術的 CPU 支援 Hyper-V 功能", "採用 AMD VT 技術的 CPU 支援 Hyper-V 功能", "一部電腦僅能模擬成 1 部虛擬機器", "能彈性改變虛擬機器的數量及配置"], "e": "答案 (1)(2)(4)。Hyper-V 需要 Intel VT 或 AMD-V 硬體虛擬化；一部實體機可同時執行多部虛擬機器。"}, {"n": 683, "code": "3-180", "ans": "14", "multi": true, "q": "在 Linux 環境中，要卸載或退出光碟機，可使用下列何者命令？", "o": ["umount", "unmount", "reject", "eject"], "e": "答案 (1)(4)。卸載指令拼法是 umount（沒有 n）；eject 會卸載並退出光碟。"}, {"n": 684, "code": "3-181", "ans": "124", "multi": true, "q": "在 Linux 環境中，要重新開機，可使用下列哪些指令？", "o": ["reboot", "shutdown -r", "shutdown -h", "init 6"], "e": "答案 (1)(2)(4)。shutdown -r（reboot）重新開機；shutdown -h（halt）是關機；init 6 切到執行等級 6（重新開機），init 0 是關機。"}, {"n": 685, "code": "3-182", "ans": "12", "multi": true, "q": "在 Linux 環境中，要查詢磁碟使用狀況，可使用下列哪些指令？", "o": ["df", "du", "dl", "freedisk"], "e": "答案 (1)(2)。df 顯示各檔案系統的總容量與剩餘空間；du 顯示目錄/檔案所佔用的空間。"}, {"n": 686, "code": "3-183", "ans": "234", "multi": true, "q": "在 Linux 環境中，要備份 Linux 系統本身或檔案，可使用下列哪些指令？", "o": ["tape", "tar", "dump", "cpio"], "e": "答案 (2)(3)(4)。tar、dump（檔案系統備份，搭配 restore 還原）、cpio 都是備份工具；沒有 tape 指令（磁帶操作是 mt）。"}, {"n": 687, "code": "3-184", "ans": "234", "multi": true, "q": "在 Linux 環境中，要顯示 CPU 使用狀況，可使用下列哪些指令？", "o": ["free", "top", "sar", "vmstat"], "e": "答案 (2)(3)(4)。top 即時顯示行程與 CPU 使用率；sar 收集系統活動報告；vmstat 顯示虛擬記憶體與 CPU 統計。free 只顯示記憶體使用量。"}, {"n": 688, "code": "4-1", "ans": "3", "multi": false, "q": "電腦病毒入侵後在未達觸發條件前，病毒潛伏在程式內會有部分徵兆，下列何種情況比較有可能是電腦病毒活動的徵兆？", "o": ["儲存檔案時硬碟產生大量噪音", "螢幕經常上下跳動", "程式執行時間逐漸變長", "硬碟產生刮痕"], "e": "病毒附著在程式中會增加程式大小與執行負擔，使執行時間變長、系統變慢。噪音、螢幕跳動、刮痕多為硬體問題。"}, {"n": 689, "code": "4-2", "ans": "1", "multi": false, "q": "資料錯誤檢核方式中，下列哪一項不常用？", "o": ["存取權限檢查（Access right verification）", "檢查號碼檢查（Check digit）", "型態檢查（Type check）", "範圍檢查（Range check）"], "e": "檢核資料「正確性」常用檢查碼、型態（是否為數字）、範圍（如月份 1～12）、格式檢查。存取權限檢查是「安全控管」機制，不是資料錯誤檢核。"}, {"n": 690, "code": "4-3", "ans": "3", "multi": false, "q": "有一程式設計師在某一系統中插了一段程式，只要他的姓名從公司的人事檔案中被刪除則該程式會將公司整個檔案破壞掉，這種電腦犯罪行為屬於？", "o": ["資料掉包（Data diddling）", "制壓（Superzapping）", "邏輯炸彈（Logic bombs）", "特洛依木馬（Trojan horse）"], "e": "邏輯炸彈在特定「條件」成立時（如某人被刪除、某個日期）觸發破壞。特洛伊木馬是偽裝成正常程式暗中執行惡意功能。"}, {"n": 691, "code": "4-4", "ans": "4", "multi": false, "q": "擅自變更程式以便從大批所選擇的交易中逐個剝削每個帳戶的微小金額，然後再將其全部儲存到另一個帳戶中，這種電腦犯罪行為屬於？", "o": ["資料掉包", "制壓", "邏輯炸彈", "義大利臘腸式詭計（Salami Methods）"], "e": "臘腸術像切臘腸一樣，從大量帳戶中各切下極小金額（如小數點以下的零頭），不易察覺，累積後轉入自己帳戶。"}, {"n": 692, "code": "4-5", "ans": "3", "multi": false, "q": "下列何者不是電腦病毒的特性？", "o": ["具有自我複製的能力", "具特殊之破壞技術", "關機再重新開機後會自動消失", "會常駐在主記憶體中"], "e": "病毒會感染檔案或開機磁區，重新開機後仍會再次載入，不會自動消失。"}, {"n": 693, "code": "4-6", "ans": "4", "multi": false, "q": "重要資料欄的更新作業，為保留其過程的相關資料，以供核驗防範不法行為，可以利用下列什麼檔案？", "o": ["密碼檔", "異動檔", "備份檔", "日誌檔"], "e": "日誌檔（Log）記錄誰在何時做了哪些更新（更新前後的值），可供稽核追蹤與資料回復。"}, {"n": 694, "code": "4-7", "ans": "4", "multi": false, "q": "下列敘述中何者不合乎資訊安全之概念？", "o": ["設定檔案存取權限，如只允許讀取，不准寫入", "設定檔案密碼保護", "隨時將檔案備份", "設定檔案資料公開，任何人皆可以使用"], "e": "資訊安全要確保機密性、完整性、可用性；任何人都能使用違反機密性與存取控制。"}, {"n": 695, "code": "4-8", "ans": "1", "multi": false, "q": "在國民身分證號碼的設計中，最後一碼為檢查碼，請問這種設計在應用系統控制方面屬於哪一種控制？", "o": ["處理控制", "資料檔案控制", "輸入控制", "輸出控制"], "e": "依題庫答案為處理控制：系統處理資料時以演算法驗算檢查碼是否正確，以發現錯誤。"}, {"n": 696, "code": "4-9", "ans": "2", "multi": false, "q": "電腦化作業之後，通常會將檔案複製三份，而且分散存放在不同建築物內，這種做法在應用系統控制方面屬於哪一種控制？", "o": ["處理控制", "資料檔案控制", "輸入控制", "輸出控制"], "e": "檔案備份、異地存放屬於資料檔案的保護控制，避免單一地點災害造成資料全部遺失。"}, {"n": 697, "code": "4-10", "ans": "4", "multi": false, "q": "一般而言要達到完善之終端機安全管制措施，則必須完整做到？", "o": ["在終端機上加鎖，限制使用人員", "經常派安全人員追蹤考核", "事前訂定防弊措施", "事前訂定完善防弊措施，事後做追蹤考核，並將終端機配合主機系統一起管制"], "e": "完整的安全管制需要事前預防、事後稽核，並且終端機與主機整體一起管制；其他選項都只做到其中一部分。"}, {"n": 698, "code": "4-11", "ans": "4", "multi": false, "q": "有關「資訊安全中電子簽名保密技術」之描述，下列何者正確？", "o": ["電子簽名之技術不需解碼", "若以設計問題的方法而論，電子簽名較公開鑰匙密碼法簡便", "電子簽名乃是採用光筆、滑鼠等工具簽名，以供辨識", "電子簽名乃是利用數字來代替票據必須由個人親自簽名的方法"], "e": "電子簽名（數位簽章）以數位資料（密碼學運算產生的數字）取代親筆簽名，用於確認身分與不可否認，不是用光筆手寫。"}, {"n": 699, "code": "4-12", "ans": "4", "multi": false, "q": "下列有關「資訊安全中存取管制（Access Control）方法」之描述，下列何者正確？", "o": ["為求系統安全顧慮不可銜接電腦網路", "為求存取方便不需提供存取控制碼之設定", "在系統存取時不必考慮安全問題", "系統應該提供網路存取控制碼之設定功能"], "e": "系統應提供帳號密碼、權限等存取控制設定，在可連網、方便使用的情況下兼顧安全。"}, {"n": 700, "code": "4-13", "ans": "1", "multi": false, "q": "有關「資訊安全中系統設備備援」之敘述，下列何者正確？", "o": ["重要系統設備（含軟、硬體）必須有備援措施", "備援方法必須以 1:1 對應的方式才可", "遠端備援方式由於需佔空間且人力支援不易，故不必考慮", "備援需花費更多費用，因此不必考慮備援"], "e": "重要系統應有備援以確保服務持續。備援方式可以是 1:1、N:1 等多種；異地（遠端）備援是重要的災難復原手段。"}, {"n": 701, "code": "4-14", "ans": "3", "multi": false, "q": "對於電腦及應用系統之備援措施，下列敘述何者正確？", "o": ["只需做軟體備援即可", "只需做硬體備援即可", "重要電子資料必須存放防火櫃並分置不同地點", "顧及製作權及版權，為求備援則購置雙套軟體即可"], "e": "軟硬體與資料都需要備援；重要資料要防火、防災並異地存放，避免同時毀損。"}, {"n": 702, "code": "4-15", "ans": "4", "multi": false, "q": "關於「防火牆」之敘述，下列何者錯誤？", "o": ["可以用軟體或硬體來實作防火牆", "可以管制企業內外電腦相互之間的資料傳輸", "可以隔絕來自外部網路的攻擊性網路封包", "無法封鎖來自內部網路的對外攻擊行為"], "e": "防火牆可以設定「對外（輸出）」規則，同樣能封鎖內部電腦對外的攻擊或連線。"}, {"n": 703, "code": "4-16", "ans": "3", "multi": false, "q": "為了避免資料庫破壞後無法回復，除了定期備份外，最重要還要做到下列哪項工作？", "o": ["管制使用", "人工記錄", "隨時記錄變動日誌檔", "修改程式"], "e": "從備份還原後，再依日誌檔重做（Redo）備份之後的異動，才能把資料庫回復到損壞前的最新狀態。"}, {"n": 704, "code": "4-17", "ans": "3", "multi": false, "q": "在做遠端資料傳輸時，為避免資料被竊取，我們可以採用何種保護措施？", "o": ["將資料壓縮", "將資料解壓縮", "將資料加密", "將資料解密"], "e": "加密後，即使資料在傳輸中被攔截，沒有金鑰也無法讀取內容。"}, {"n": 705, "code": "4-18", "ans": "4", "multi": false, "q": "有關「網路防火牆」之敘述，下列何者錯誤？", "o": ["外部防火牆無法防止內賊對內部的侵害", "防火牆能管制封包的流向", "防火牆可以阻隔外部網路進入內部系統", "防火牆可以防止任何病毒的入侵"], "e": "防火牆主要依位址、埠號過濾流量，無法完全防止病毒（例如透過隨身碟、合法郵件附件、加密連線傳入的病毒），仍需搭配防毒軟體。"}, {"n": 706, "code": "4-19", "ans": "2", "multi": false, "q": "完善的資訊安全系統，以足夠之關卡，防止使用者透過程式去存取不是他可以存取之資料，這種觀念為？", "o": ["監視性", "資料存取控制", "獨立性", "識別"], "e": "存取控制確保使用者只能存取其被授權的資料與功能。"}, {"n": 707, "code": "4-20", "ans": "1", "multi": false, "q": "下列何者是錯誤的「系統安全措施」？", "o": ["系統操作者統一保管密碼", "資料加密", "密碼變更", "公布之電子文件設定成唯讀檔"], "e": "密碼應由使用者個人保管並定期變更；由他人統一保管會造成洩漏風險，也無法追究責任。"}, {"n": 708, "code": "4-21", "ans": "1", "multi": false, "q": "若在使用個人電腦時，發現螢幕上有異常之反白、閃爍或電腦執行速度減慢等可能中毒之現象，此時使用者應做何種處置比較適宜？", "o": ["立即結束程式之執行，關掉電源，再以原版軟體開機", "將可能中毒之檔案刪除", "立即放入原版軟體並以 Ctrl+Alt+Del 重新開機", "立即結束原程式之執行，並用解毒軟體解毒"], "e": "病毒可能常駐在記憶體中，Ctrl+Alt+Del 暖開機不會清除記憶體，必須關掉電源（冷開機），再用未受感染的原版開機片開機，之後再掃毒。"}, {"n": 709, "code": "4-22", "ans": "3", "multi": false, "q": "Application Gateway 是用來限制對超過防火牆界限之服務，下列何者不是在 Internet 上普遍實作的 Application Gateway？", "o": ["Mail gateway", "Proxy", "Hub", "Server filter"], "e": "應用閘道運作在應用層，例如郵件閘道、Proxy 代理伺服器、伺服器過濾。Hub 是實體層的集線設備。"}, {"n": 710, "code": "4-23", "ans": "1", "multi": false, "q": "有關 RFC 1108 所說明之 IPSO（IP Security Options）之敘述，下列何者不正確？", "o": ["IPSO 是在網路通訊協定中之實體層運作", "IPSO 是美國國防部 DOD 所使用的一種安全性規格", "運用 IP datagram 標頭的變動長度 Options 欄位標記出 datagram 所裝載資料之機密性", "IPSO 之主要觀念為 datagram 安全性標記"], "e": "IPSO 是利用 IP 表頭的 Options 欄位標示機密等級，運作在網路層（IP 層），不是實體層。"}, {"n": 711, "code": "4-24", "ans": "3", "multi": false, "q": "關於「防火牆」之敘述，下列何者錯誤？", "o": ["防火牆乃是過濾器（Filter）與 Gateway 的集合", "防火牆用來將可信賴的網路保護在一個區域性管理的安全範圍內", "防火牆大量運用於區域網路中，無法運用於廣域網路", "防火牆可用來將外界無法信賴之網路隔開"], "e": "防火牆最常設在內部網路與網際網路（廣域網路）的交界處，當然可以運用在廣域網路。"}, {"n": 712, "code": "4-25", "ans": "2", "multi": false, "q": "關於「非對稱式密碼系統」之敘述，下列何者不正確？", "o": ["1976 年以後所發展出來之公開金匙密碼系統即是屬於非對稱式密碼系統", "非對稱式密碼系統之加密金匙及解密金匙都是可以公開的", "屬於雙密匙系統", "主要特性是系統的安全分析簡單明瞭，但加解密運算過程費時"], "e": "非對稱式加密有一對金鑰：公鑰可公開，私鑰必須保密；若兩把都公開就毫無安全性。"}, {"n": 713, "code": "4-26", "ans": "4", "multi": false, "q": "在分散式開放系統下的安全管理系統中，下列何者不是該系統至少須具備之功能？", "o": ["驗證（Authentication）", "授權（Authorization）", "稽查（Auditing）", "回答（Answering）"], "e": "安全管理的 AAA：Authentication（驗證身分）、Authorization（授權）、Accounting/Auditing（記錄稽核）。「回答」不是安全功能。"}, {"n": 714, "code": "4-27", "ans": "3", "multi": false, "q": "下列何者不是資訊安全的防護措施？", "o": ["備份軟體", "採用合法軟體", "小問題組合成大問題", "可確認檔案的傳輸"], "e": "「把小問題組合成大問題」與資訊安全防護無關；處理問題應該是把大問題切成小問題。"}, {"n": 715, "code": "4-28", "ans": "1", "multi": false, "q": "電腦犯罪中，一點一滴偷取金錢的方法稱為？", "o": ["義大利臘腸技術", "特洛依木馬", "藍領犯罪", "資料騙取"], "e": "臘腸術（Salami）每次只偷取極小金額，累積起來成大數目（同第 691 題）。"}, {"n": 716, "code": "4-29", "ans": "4", "multi": false, "q": "一部專門用來過濾內外部網路間通訊的電腦稱為？", "o": ["熱站", "疫苗", "冷站", "防火牆"], "e": "防火牆位於內外網路之間，依規則過濾通訊。熱站、冷站是災難備援用的備用場所。"}, {"n": 717, "code": "4-30", "ans": "3", "multi": false, "q": "為了避免硬體的破壞，每一電腦組織應有？", "o": ["生物技術", "編碼標準", "問題發現計劃", "活動標誌組"], "e": "依題庫答案，組織應訂定問題發現（預防/偵測）計畫，及早發現硬體異常與潛在問題。"}, {"n": 718, "code": "4-31", "ans": "1", "multi": false, "q": "所有電腦化系統中最弱的環節為？", "o": ["人", "密碼", "硬體", "軟體"], "e": "資訊安全中「人」是最弱的一環：疏忽、洩漏密碼、遭社交工程詐騙、內部人員犯罪等。"}, {"n": 719, "code": "4-32", "ans": "1", "multi": false, "q": "下列哪一項無法指向「無現金社會」？", "o": ["自動提款機", "信用卡", "編碼晶片", "電子資金轉帳"], "e": "自動提款機（ATM）的主要用途是提領「現金」，與無現金交易方向相反。信用卡、晶片卡、電子轉帳都能不用現金付款。"}, {"n": 720, "code": "4-33", "ans": "3", "multi": false, "q": "下列哪一項不是管制進入電腦系統的措施？", "o": ["名牌", "密碼", "不斷電系統", "門鎖"], "e": "不斷電系統（UPS）是在停電時提供電力、保護設備與資料，不是存取管制措施。名牌（識別證）、密碼、門鎖都是管制進入的手段。"}, {"n": 721, "code": "4-34", "ans": "4", "multi": false, "q": "「Taiwan-NO.1」是屬於哪一型病毒？", "o": ["檔案型", "開機型", "混合型", "巨集型"], "e": "Taiwan No.1 是台灣出現的 Word 巨集病毒，會跳出算術題要使用者作答，答錯就開啟大量視窗。"}, {"n": 722, "code": "4-35", "ans": "4", "multi": false, "q": "有關「防火牆」之敘述，下列何者錯誤？", "o": ["防火牆無法防止內賊對內的侵害", "防火牆基本上只管制封包的流向，它無法偵測出外界假造的封包", "防火牆無法確保連線的可信度，一旦連線涉及外界公眾網路，極有可能被竊聽或劫奪，除非連線另行加密保護", "防火牆可以防止病毒的入侵"], "e": "同第 705 題：防火牆不能完全防止病毒入侵，仍需防毒軟體。(1)(2)(3) 都是防火牆的限制。"}, {"n": 723, "code": "4-36", "ans": "1", "multi": false, "q": "下列何者是一個用來存放與管理通訊錄及我們在網路上付費的信用卡資料，以確保交易時各項資料的儲存或傳送時的隱密性與安全性？", "o": ["電子錢包", "商店伺服器", "付款轉接站", "認證中心"], "e": "電子錢包（SET 架構中的持卡人軟體）安全儲存持卡人的信用卡資料、憑證與通訊資料，交易時加密傳送。"}, {"n": 724, "code": "4-37", "ans": "1", "multi": false, "q": "一個成功的安全環境之首要部分是建立什麼？", "o": ["安全政策白皮書", "認證中心", "安全超文字傳輸協定", "BBS"], "e": "資訊安全要先有明確的安全政策（目標、規範、責任），再依政策選擇技術與措施。"}, {"n": 725, "code": "4-38", "ans": "1", "multi": false, "q": "下列何者不是存取無線網路 AP 的安全機制方法？", "o": ["SSID", "MAC Address Control", "WPA 加密", "WEP 加密"], "e": "SSID 只是無線網路名稱，用來識別網路，並無安全保護作用。MAC 位址過濾、WPA、WEP 加密才是安全機制。"}, {"n": 726, "code": "4-39", "ans": "4", "multi": false, "q": "目前資訊安全規範的目的，主要是為了保護組織或個人的重要資訊資產，當評鑑所擁有的資訊資產價值時，下列何者不是必要的評估準則？", "o": ["機密性（Confidentiality）", "完整性（Integrity）", "可用性（Availability）", "弱點性（Vulnerability）"], "e": "資產價值以資訊安全三要素 CIA 評估；弱點（Vulnerability）是風險評估中分析威脅與弱點的項目，不是資產價值的評估準則。"}, {"n": 727, "code": "4-40", "ans": "3", "multi": false, "q": "有關「字典攻擊法」之描述，下列何者正確？", "o": ["使用字典上有的字來測試密碼", "使用亂數測試密碼", "將常見的密碼當作字典資料庫來測試密碼", "使用各國語言測試密碼"], "e": "字典攻擊收集常用密碼（123456、password、生日等）建成清單逐一嘗試。逐一嘗試所有可能組合的是暴力破解法。"}, {"n": 728, "code": "4-41", "ans": "2", "multi": false, "q": "有關「在拍賣網站購物時防止詐欺的方法」，下列何者錯誤？", "o": ["應先仔細閱讀拍賣商品說明，並確認商品保存狀況", "與賣家私下交易，以獲取較便宜的價格", "可選擇較安全的付費方式", "應先了解買家與賣家相互應有的責任與義務"], "e": "私下交易就失去拍賣平台的交易保障與糾紛處理機制，是常見的詐騙手法。"}, {"n": 729, "code": "4-42", "ans": "3", "multi": false, "q": "有關「預防手機詐騙」之敘述，下列何者為最適宜的作法？", "o": ["注意是否有來電顯示", "將手機關機", "接到可疑電話，不隨便依照對方指示去做", "回撥電話給對方以求證是否為手機詐騙"], "e": "遇到可疑電話不依指示操作（如到 ATM 轉帳），應自行撥打 165 反詐騙專線查證。來電顯示可以偽造；回撥詐騙電話可能被收高額費用或繼續受騙。"}, {"n": 730, "code": "4-43", "ans": "2", "multi": false, "q": "我的電腦已經安裝了防火牆，所以不需要再安裝防毒軟體？", "o": ["是，不需要重複的功能", "不是，防火牆跟防毒軟體的主要功能不一樣", "不是，防毒軟體能阻擋垃圾郵件", "是，防毒軟體價格比較貴"], "e": "防火牆過濾網路連線；防毒軟體偵測、清除惡意程式（包括從隨身碟、下載檔案進來的病毒）。兩者功能不同，應同時使用。"}, {"n": 731, "code": "4-44", "ans": "1", "multi": false, "q": "「登入密碼」通常是用來滿足下列哪一項安全性之需求？", "o": ["身分識別（Authentication）", "機密性（Confidentiality）", "不可否認性（Non-repudiation）", "完整性（Integrity）"], "e": "密碼是「你知道的東西」，用來驗證使用者身分。"}, {"n": 732, "code": "4-45", "ans": "4", "multi": false, "q": "企業的可接受風險等級如何決定最恰當？", "o": ["由評鑑的同仁決定", "由臨時開會決定", "由資安公司的資安顧問建議決定", "事先定義好準則，由管理階層裁定"], "e": "可接受風險涉及經營決策與資源分配，應事先訂定評估準則，再由管理階層核定。"}, {"n": 733, "code": "4-46", "ans": "3", "multi": false, "q": "「系統在檢查使用者的密碼設定時，會作某些特性的限制或規定」，下列對於這些特性的敘述何者錯誤？", "o": ["密碼有效性", "禁止更新密碼時延用舊密碼", "禁止不同使用者的密碼相同", "密碼必須有一定困難度"], "e": "密碼原則包含有效期限、密碼歷程（不可重複使用舊密碼）、長度與複雜度；系統不會比對「不同使用者之間」密碼是否相同（密碼以雜湊儲存，且這樣做反而會洩漏他人密碼）。"}, {"n": 734, "code": "4-47", "ans": "1", "multi": false, "q": "下列有關於「弱點」的描述，何者錯誤？", "o": ["弱點是一種使用者操作上的錯誤或瑕疵", "弱點存在與暴露可能導致有心人士利用作為入侵途徑", "弱點可能導致程式運作出現非預期結果而造成損失或進一步的權益損害", "管理員若未能即時取得弱點資訊與修正檔將導致被入侵的可能性增加"], "e": "弱點（Vulnerability）是系統、軟體、設定或流程本身的缺陷，不是使用者操作上的錯誤。"}, {"n": 735, "code": "4-48", "ans": "3", "multi": false, "q": "「資訊安全」的三個面向不包含下列何者？", "o": ["機密性", "可用性", "透明性（Transparency）", "完整性"], "e": "資訊安全三要素 CIA：Confidentiality 機密性、Integrity 完整性、Availability 可用性。"}, {"n": 736, "code": "4-49", "ans": "2", "multi": false, "q": "請問下列哪一個網址有使用 SSL 加密？", "o": ["http://www.security.com/", "https://www.safe.com.tw/", "httpl://www.bank.com/", "httpd://www.tbank.com.tw/"], "e": "HTTPS（HTTP over SSL/TLS）表示連線經過加密；http 是明文傳輸；httpl、httpd 不是合法的協定。"}, {"n": 737, "code": "4-50", "ans": "4", "multi": false, "q": "執行資料備份時，最需要注意下列何項？", "o": ["電腦有沒有安裝燒錄機", "備份資料時，一定要連防毒軟體一起備份", "網路頻寬速度是不是夠快", "備份資料有沒有中毒"], "e": "若備份的資料已經中毒，還原時會把病毒一起還原回來，所以備份前要確認資料沒有中毒。"}, {"n": 738, "code": "4-51", "ans": "3", "multi": false, "q": "「社交工程」造成資訊安全極大威脅的原因在於下列何者？", "o": ["破壞資訊服務可用性，使企業服務中斷", "隱匿性高，不易追查惡意者", "惡意人士不需要具備頂尖的電腦專業技術即可輕易地避過了企業的軟硬體安全防護", "利用通訊埠掃描方式，無從防範"], "e": "社交工程利用人性弱點（信任、好奇、恐懼）騙取密碼或資料，不需高深技術，就能繞過防火牆等技術防護。"}, {"n": 739, "code": "4-52", "ans": "4", "multi": false, "q": "為保障電腦資料安全，備份動作是必要的執行措施；關於「資料備份」之敘述，下列何者正確？", "o": ["程式檔案一定要備份，資料檔案涉及個資不宜備份", "除非正在使用的檔案損毀，否則備份資料檔案絕對不能拿出來使用", "使用中的檔案與備份資料應該放在一起，便於時常進行備份更新", "備份資料檔案也是重要資產，在備份時進行加密是提高資料安全的作法"], "e": "備份資料同樣需要保護，加密可防止備份媒體遺失時資料外洩。資料檔案更需要備份；備份應異地存放；備份也可用於測試、稽核等。"}, {"n": 740, "code": "4-53", "ans": "4", "multi": false, "q": "關於「資訊環保」之敘述，下列何者錯誤？", "o": ["綠色電腦是指從產品的設計、製造、使用到丟棄的過程都符合環保要求", "能源之星計畫最初是以電腦產品為主，後來擴展至辦公設備與建築", "綠色軟體的特性是不需安裝或修改系統設定檔便可使用", "危害性物質限制指令（RoHS），是由美國所制定的一項環保指令"], "e": "RoHS（限制電子電機設備使用有害物質指令）是「歐盟」制定的，限制鉛、汞、鎘、六價鉻等物質。能源之星才是美國環保署的計畫。"}, {"n": 741, "code": "4-54", "ans": "4", "multi": false, "q": "有關「間諜軟體」的特性描述，下列何者錯誤？", "o": ["可能會監控你的電腦", "時常偽裝成合法的郵件附加檔四處散布", "可能會竊取電腦裡的資料", "必須經過你的同意才能安裝"], "e": "間諜軟體通常在使用者不知情、未同意的情況下偷偷安裝（例如綁在免費軟體中）。"}, {"n": 742, "code": "4-55", "ans": "1", "multi": false, "q": "在啟用 SSL 安全機制的安全認證網站上進行交易，下列敘述何者是可確保交易安全的？", "o": ["在交易過程中所傳輸的資料都是被加密的", "該網站不會將個人資料外流", "該網站的商品價格一定比市價便宜", "該網站不會被駭客入侵"], "e": "SSL 只保證「傳輸過程」加密、防止竊聽與竄改，無法保證網站本身不外流資料或不被入侵。"}, {"n": 743, "code": "4-56", "ans": "4", "multi": false, "q": "下列敘述何者錯誤？", "o": ["跨站指令碼不但影響伺服主機，甚至會導致瀏覽者受害", "SQL injection 是一種攻擊網站資料庫的手法", "跨目錄存取是因為程式撰寫不良", "存放網頁應用程式的系統安裝最新系統修補程式後，便不會存有弱點"], "e": "系統修補只修正作業系統的已知弱點，網頁應用程式本身的程式漏洞（如 SQL Injection、XSS）及未知的零時差弱點仍可能存在。"}, {"n": 744, "code": "4-57", "ans": "4", "multi": false, "q": "下列何者不是「資訊安全」所要確保的資訊特性？", "o": ["機密性", "完整性", "可用性", "可延伸性（Scalability）"], "e": "資訊安全確保 CIA 三特性；可延伸性是系統架構的效能特性。"}, {"n": 745, "code": "4-58", "ans": "2", "multi": false, "q": "資訊安全中的「社交工程」主要是透過什麼樣弱點，來達成對資訊安全的攻擊方式？", "o": ["技術缺憾", "人性弱點", "設備故障", "後門程式的掩護"], "e": "社交工程利用人性弱點（信任、貪小便宜、好奇、恐懼、助人心）來騙取資訊。"}, {"n": 746, "code": "4-59", "ans": "4", "multi": false, "q": "關於駭客透過電子郵件來達成「社交工程」手法的入侵，下列何者錯誤？", "o": ["電子郵件中的連結，可能會導引你到詐騙集團的網頁中", "駭客會使用情色或八卦主題，吸引你閱讀或下載電子郵件內容", "接到銀行寄來的緊急通知電子郵件，最好不要直接點選上面的超連結，而是自行連結到該銀行網站進行查詢", "只要不下載電子郵件的附檔，駭客就無法入侵你的電腦"], "e": "除了附件，點擊郵件中的惡意連結、甚至預覽含惡意程式碼的 HTML 郵件，都可能被入侵。"}, {"n": 747, "code": "4-60", "ans": "3", "multi": false, "q": "關於「零時差攻擊（Zero-day Attack）」之敘述，下列何者錯誤？", "o": ["主要針對原廠來不及提出修補程式弱點程式的時間差，進行資安攻擊方式", "因為是程式的漏洞，無法透過掃毒或防駭等軟體機制來確保攻擊不會發生", "因為是軟體程式出現漏洞，所以使用者無法做什麼事情來防止攻擊", "使用者看到軟體官方網站或資安防治單位發布警訊，應該儘快更新版本"], "e": "使用者仍可採取防範措施：注意資安警訊、暫停使用有漏洞的功能、採用替代軟體、修補檔一推出就立即更新等，並非無能為力。"}, {"n": 748, "code": "4-61", "ans": "2", "multi": false, "q": "下列何者不是「智慧財產權」的適用範圍？", "o": ["作文", "靈感點子", "音樂作曲", "繪畫"], "e": "著作權保護的是「具體表達」，不保護尚未表達出來的想法、點子、概念。作文、作曲、繪畫都是具體的著作。"}, {"n": 749, "code": "4-62", "ans": "4", "multi": false, "q": "繪畫大師在 95 年 7 月 30 日創作完成一幅畫，但不幸在 99 年 4 月 4 日死亡，請問這幅畫的著作財產權存續至哪一天？", "o": ["145 年 7 月 30 日", "145 年 12 月 31 日", "149 年 4 月 4 日", "149 年 12 月 31 日"], "e": "自然人著作財產權存續於著作人「生存期間及其死亡後 50 年」，期間計算到期滿當年的年底：99＋50＝149 年，存續至 149 年 12 月 31 日。"}, {"n": 750, "code": "4-63", "ans": "2", "multi": false, "q": "小明代表學校參加網站設計大賽，整個網站是由老師提出建議點子，由小明設計建置完成，這個網站設計的著作權是屬於誰的？", "o": ["老師", "小明", "學校", "老師與小明共享"], "e": "著作權歸實際完成「表達」的人；老師只提供點子（不受保護），網站由小明設計完成，所以著作權屬於小明。"}, {"n": 751, "code": "4-64", "ans": "2", "multi": false, "q": "關於「P2P（Peer to Peer）」之敘述，下列何者錯誤？", "o": ["Skype 是 P2P 的軟體工具之一", "P2P 檔案分享軟體是非法的軟體", "P2P 採取用戶與用戶的通訊模式，可以多點連線快速下載", "P2P 檔案分享軟體可能因為本身的漏洞，成為駭客攻擊入侵的工具"], "e": "P2P 軟體本身是合法的技術工具；違法的是用它分享未經授權的著作。"}, {"n": 752, "code": "4-65", "ans": "1", "multi": false, "q": "關於「保護個人資料」的行為，下列何者錯誤？", "o": ["透過手機或電話，未確認來電者身分，即給予個人身分證字號", "確認網路上的消費網站是可以信任的，才可以留下個人資料", "個人證件影本應註明僅限定特定用途使用", "不委託他人代辦貸款或信用卡"], "e": "未確認對方身分就提供身分證字號，容易被詐騙或冒用。"}, {"n": 753, "code": "4-66", "ans": "2", "multi": false, "q": "對於在路邊接受市場行銷單位訪談所留下的個人資料，下列受訪者的哪個行為是不正確的？", "o": ["可以限制該公司使用資料的範圍", "不能要求該公司影印或提供複製本", "可以要求刪除在該公司資料庫中的資料", "可以要求瀏覽或更正存在該公司資料庫中的個人資料"], "e": "依個人資料保護法，當事人有權查詢或請求閱覽、請求製給複製本、補充或更正、停止蒐集處理利用、請求刪除。所以「不能要求提供複製本」是錯的。"}, {"n": 754, "code": "4-67", "ans": "123", "multi": true, "q": "資訊安全的目的在於維護資訊的哪些特性？", "o": ["保密性（Confidentiality）", "完整性（Integrity）", "可用性（Availability）", "可讀性（Readability）"], "e": "答案 (1)(2)(3)。資訊安全三要素 CIA。"}, {"n": 755, "code": "4-68", "ans": "123", "multi": true, "q": "資訊安全威脅的種類繁多，但其攻擊目的可以歸類成哪幾種？", "o": ["以侵入為目的", "以竄改或否認為目的", "以阻斷服務為目的", "以獲得歸屬感為目的"], "e": "答案 (1)(2)(3)。分別威脅機密性（侵入竊取）、完整性（竄改、否認）、可用性（阻斷服務）。"}, {"n": 756, "code": "4-69", "ans": "123", "multi": true, "q": "下列何者為資料隱碼攻擊（SQL Injection）的防禦方法？", "o": ["對字串過濾並限制長度", "加強資料庫權限管理，不以系統管理員帳號連結資料庫", "對使用者隱藏資料庫管理系統回傳的錯誤訊息，以免攻擊者獲得有用資訊", "不要在程式碼中標示註解"], "e": "答案 (1)(2)(3)。過濾輸入（或使用參數化查詢）、最小權限原則、隱藏錯誤訊息都能防禦 SQL Injection；程式碼註解與 SQL Injection 無關。"}, {"n": 757, "code": "4-70", "ans": "123", "multi": true, "q": "下列何者為通關密碼的破解方法？", "o": ["窮舉攻擊（Brute-Force Attack）", "字典攻擊（Dictionary Attack）", "彩虹表攻擊（Rainbow Table Attack）", "RGB 攻擊"], "e": "答案 (1)(2)(3)。窮舉法嘗試所有組合；字典攻擊嘗試常用密碼；彩虹表以預先計算的雜湊值對照表反查密碼。RGB 是色彩模型。"}, {"n": 758, "code": "4-71", "ans": "134", "multi": true, "q": "依據題目所附之防火牆過濾規則（任何→HTTP 伺服器:HTTP 接受；任何→SMTP 伺服器:SMTP 接受；外部位址→防火牆位址:任何 拒絕；任何→任何:任何 拒絕），下列何者為正確？", "o": ["拒絕所有規則之外的封包", "允許外部與防火牆連結", "允許存取 HTTP Server", "拒絕存取 SQL Server"], "e": "答案 (1)(3)(4)。規則只開放 HTTP 與 SMTP 伺服器；最後一條「任何→任何 拒絕」表示其餘封包一律拒絕，所以 SQL Server 也被拒絕。第三條明確拒絕外部連到防火牆，所以 (2) 錯。"}, {"n": 759, "code": "4-72", "ans": "1234", "multi": true, "q": "下列何者為入侵偵測與防禦系統（IDPS）提供之安全能力？", "o": ["識別可能的安全威脅", "記錄安全威脅相關資訊", "防禦安全威脅", "將安全威脅通報予安全管理人員"], "e": "答案 (1)(2)(3)(4)。IDPS 能偵測、記錄、阻擋威脅並發出警報通知管理人員。"}, {"n": 760, "code": "4-73", "ans": "34", "multi": true, "q": "下列何種磁碟陣列（RAID）有冗餘（Redundancy）功能？", "o": ["RAID 一定會有冗餘", "RAID 0", "RAID 1", "RAID 10"], "e": "答案 (3)(4)。RAID 0 只做條帶化（Striping）提升速度，沒有冗餘，一顆壞就全毀；RAID 1 鏡像備份；RAID 10 是先鏡像再條帶化，兼具速度與冗餘。"}, {"n": 761, "code": "4-74", "ans": "23", "multi": true, "q": "下列哪些身分認證方法以「所具之形（Something You Are）」為基礎？", "o": ["智慧卡", "指紋比對", "視網膜比對", "通關密碼"], "e": "答案 (2)(3)。生物特徵（指紋、視網膜、臉部）屬於「你是誰」；智慧卡屬於「你擁有的」；密碼屬於「你知道的」。"}, {"n": 762, "code": "4-75", "ans": "13", "multi": true, "q": "組織內部的區域網路切割為數段虛擬區域網路（VLAN），可得到哪些好處？", "o": ["提高網路效能", "免用防火牆", "強化資訊安全管理", "免用防毒軟體"], "e": "答案 (1)(3)。VLAN 縮小廣播網域、提升效能，並可隔離不同部門以強化安全；但仍需要防火牆與防毒軟體。"}, {"n": 763, "code": "4-76", "ans": "123", "multi": true, "q": "智慧財產權包括哪些項目？", "o": ["商標專用權", "專利權", "著作權", "隱私權"], "e": "答案 (1)(2)(3)。智慧財產權包括著作權、專利權、商標權、營業秘密等；隱私權屬人格權。"}, {"n": 764, "code": "4-77", "ans": "12", "multi": true, "q": "下列何者為常見的中間人攻擊（Man-in-the-Middle Attack）型式？", "o": ["重放攻擊（Replay Attack）", "欺騙攻擊（Spoofing Attack）", "後門攻擊（Backdoor Attack）", "字典攻擊（Dictionary Attack）"], "e": "答案 (1)(2)。中間人攔截通訊後，可冒充（欺騙）任一方，或把攔截到的封包重新送出（重放）。"}, {"n": 765, "code": "4-78", "ans": "123", "multi": true, "q": "下列何者為後門攻擊（Backdoor Attack）所需之後門的可能產生途徑？", "o": ["軟體開發者忘記移除的維護後門（Maintenance Hook）", "攻擊者植入的後門", "管理人員安裝的遠端控制軟體", "軟體開發者打開的客廳後門"], "e": "答案 (1)(2)(3)。(4) 是實體房屋的門，與資訊安全的後門無關。"}, {"n": 766, "code": "4-79", "ans": "1234", "multi": true, "q": "下列哪些作為可以降低通關密碼猜測攻擊（Password Cracking）的成功率？", "o": ["設定較長之通關密碼", "選擇冷門的通關密碼", "通關密碼夾雜字母與數字", "經常更換通關密碼"], "e": "答案 (1)(2)(3)(4)。長度越長、組合越複雜、越不常見，破解所需時間越長；定期更換可降低被破解後的風險。"}, {"n": 767, "code": "4-80", "ans": "123", "multi": true, "q": "下列何者是入侵偵測與防禦系統（IDPS）的安全事件偵測方法？", "o": ["比對惡意攻擊的特徵", "分析異常的網路活動", "偵測異常的通訊協定狀態", "確認使用者的權限"], "e": "答案 (1)(2)(3)。IDPS 的偵測方法：特徵比對（Signature-based）、異常行為偵測（Anomaly-based）、狀態協定分析（Stateful Protocol Analysis）。確認權限是存取控制的工作。"}, {"n": 768, "code": "4-81", "ans": "123", "multi": true, "q": "下列何者為網路安全漏洞的可能來源？", "o": ["軟體的瑕疵", "使用者的不良使用習慣", "多種軟/硬體結合而產生的問題", "圍牆與機房之間的距離很大"], "e": "答案 (1)(2)(3)。程式缺陷、使用者疏忽（弱密碼、亂點連結）、系統整合時的設定問題都會造成漏洞；圍牆距離與網路漏洞無關。"}, {"n": 769, "code": "4-82", "ans": "123", "multi": true, "q": "下列何種作法可以強化網頁伺服器的安全？", "o": ["伺服器只安裝必要的功能模組", "封鎖不良使用者的 IP", "使用防火牆使其只能於組織內部存取", "組織的所有電腦均使用 AMD CPU"], "e": "答案 (1)(2)(3)。減少不必要的模組可降低攻擊面；封鎖惡意 IP、以防火牆限制存取範圍都能強化安全。CPU 品牌與安全無關。"}, {"n": 770, "code": "4-83", "ans": "123", "multi": true, "q": "有關實體安全防禦措施之說明，下列何者正確？", "o": ["在事前，實體安全防禦措施要達到嚇阻效果，讓攻擊者知難而退", "在事件發生中，實體安全防禦措施應能儘量拖延入侵者的行動", "在偵測到入侵事件後，實體安全防禦措施須能儘量記錄犯罪證據，以為事後追查與起訴的憑據", "在事件發生中，實體安全防禦措施要達到嚇阻效果，讓攻擊者知難而退"], "e": "答案 (1)(2)(3)。實體安全分階段：事前嚇阻、事中延遲、事後記錄證據。嚇阻是「事前」的目標，(4) 時機錯誤。"}, {"n": 771, "code": "4-84", "ans": "1234", "multi": true, "q": "下列何者是資訊安全風險的可能處置方法？", "o": ["規避風險", "降低風險", "轉移風險", "接受風險"], "e": "答案 (1)(2)(3)(4)。風險處理四策略：避免（不做該活動）、降低（加強控制措施）、轉移（保險、委外）、接受（成本過高時承擔）。"}, {"n": 772, "code": "4-85", "ans": "12", "multi": true, "q": "下列何者包含於資訊安全管理應該兼顧的 3 個 P 之中？", "o": ["People", "Process", "Price", "Place"], "e": "答案 (1)(2)。資訊安全的 3P 為 People（人員）、Process（流程）、Product/Technology（產品/技術）。"}, {"n": 773, "code": "4-86", "ans": "124", "multi": true, "q": "企業的防火牆通常應該拒絕下列哪些封包？", "o": ["外部進入的 telnet 封包", "外部進入但位址標示為內部的封包", "外部進入的 HTTP 封包", "外部進入且目的位址是防火牆的封包"], "e": "答案 (1)(2)(4)。Telnet 以明文傳輸不安全；從外部來卻標示內部位址的是偽造 IP 封包；直接攻擊防火牆的封包也要拒絕。HTTP 封包通常需要允許，對外提供網站服務。"}, {"n": 774, "code": "4-87", "ans": "124", "multi": true, "q": "下列哪些是發生電腦系統記憶體滲漏（Memory Leak）的可能肇因？", "o": ["作業系統有錯誤", "應用程式有錯誤", "網路卡故障", "驅動程式有錯誤"], "e": "答案 (1)(2)(4)。記憶體滲漏是程式配置記憶體後未釋放，屬於軟體錯誤（OS、應用程式、驅動程式），不是硬體故障。"}, {"n": 775, "code": "4-88", "ans": "13", "multi": true, "q": "減少電腦系統發生記憶體滲漏（Memory Leak）情況的方法有哪些？", "o": ["使用垃圾收集（Garbage Collection）機制", "不要使用無線網路", "更謹慎地設計程式，釋放不再需要的記憶體", "使用封包過濾型防火牆"], "e": "答案 (1)(3)。自動回收或在程式中確實釋放記憶體都能減少滲漏；無線網路、防火牆與記憶體滲漏無關。"}, {"n": 776, "code": "4-89", "ans": "12", "multi": true, "q": "若以瀏覽器瀏覽網站，發現只能以 IP 連線，無法以 Domain Name 連線，經判斷是 DNS 伺服器的負載太重，其可能遭受下列哪些攻擊？", "o": ["DoS（Denial of Service）", "DNS Flooding", "XSS（Cross-Site Scripting）", "CSRF（Cross-Site Request Forgery）"], "e": "答案 (1)(2)。大量請求灌爆 DNS 伺服器使其無法服務，屬阻斷服務攻擊；XSS、CSRF 是攻擊網頁應用程式與使用者的手法。"}, {"n": 777, "code": "101-1", "ans": "2", "multi": false, "q": "在量販店內，商品包裝上所貼的「條碼（Barcode）」係協助結帳及庫存盤點之用，則該條碼在此方面之資料處理作業上係屬於下列何者？", "o": ["輸入設備", "輸入媒體", "輸出設備", "輸出媒體"], "e": "條碼是承載資料、供讀取的「媒體」；條碼掃描器才是輸入「設備」。"}, {"n": 778, "code": "101-2", "ans": "2", "multi": false, "q": "有關「CPU 及記憶體處理」之說明，下列何者「不正確」？", "o": ["控制單元負責指揮協調各單元運作", "I/O 負責算術運算及邏輯運算", "ALU 負責算術運算及邏輯運算", "記憶單元儲存程式指令及資料"], "e": "算術與邏輯運算由 ALU 負責；I/O 單元負責資料輸入與輸出。"}, {"n": 779, "code": "101-3", "ans": "2", "multi": false, "q": "有關二進位數的表示法，下列何者「不正確」？", "o": ["101", "1A", "1", "11001"], "e": "二進位只有 0 與 1 兩個數字，「A」是十六進位的數字，所以 1A 不是二進位數。"}, {"n": 780, "code": "101-4", "ans": "2", "multi": false, "q": "負責電腦開機時執行系統自動偵測及支援相關應用程式，具輸入輸出功能的元件為下列何者？", "o": ["DOS", "BIOS", "I/O", "RAM"], "e": "BIOS（基本輸入輸出系統）在開機時執行硬體自我測試（POST）、偵測裝置，並提供基本 I/O 服務。"}, {"n": 781, "code": "101-5", "ans": "4", "multi": false, "q": "在處理器中位址匯流排有 32 條，可以定出多少記憶體位址？", "o": ["512MB", "1GB", "2GB", "4GB"], "e": "2^32＝4×2^30＝4G 個位址（每址 1 Byte 即 4GB），這也是 32 位元系統記憶體上限為 4GB 的原因。"}, {"n": 782, "code": "101-6", "ans": "4", "multi": false, "q": "下列何者屬於揮發性記憶體？", "o": ["Hard Disk", "Flash Memory", "ROM", "RAM"], "e": "RAM 斷電資料會消失；硬碟、快閃記憶體、ROM 都是非揮發性。"}, {"n": 783, "code": "101-7", "ans": "2", "multi": false, "q": "下列技術何者為一個處理器中含有兩個執行單元，可以同時執行兩個並行執行緒，以提升處理器的運算效能與多工作業的能力？", "o": ["超執行緒（Hyper Thread）", "雙核心（Dual Core）", "超純量（Super Scalar）", "單指令多資料（SIMD）"], "e": "雙核心是一顆處理器內有兩個實體執行核心，真正同時執行兩個執行緒。超執行緒則是一個核心模擬成兩個邏輯處理器。"}, {"n": 784, "code": "101-8", "ans": "1", "multi": false, "q": "下列技術何者為將一個處理器模擬成多個邏輯處理器，以提升程式執行之效能？", "o": ["超執行緒（Hyper Thread）", "雙核心（Dual Core）", "超純量（Super Scalar）", "單指令多資料（SIMD）"], "e": "Intel 超執行緒（HT）讓一個實體核心呈現為兩個邏輯處理器，利用閒置的執行資源同時處理兩個執行緒。"}, {"n": 785, "code": "101-9", "ans": "2", "multi": false, "q": "有關記憶體的敘述，下列何者「不正確」？", "o": ["CPU 中的暫存器執行速度比主記憶體快", "快取磁碟（Disk Cache）是利用記憶體中的快取記憶體（Cache Memory）來存放資料", "透過軟體與輔助儲存體來擴展主記憶體容量的技術是虛擬記憶體", "個人電腦大都有 L1 及 L2 快取記憶體，其中 L1 快取的速度較快，但容量較小"], "e": "磁碟快取是在「主記憶體（RAM）」中劃出一塊區域，暫存磁碟常讀寫的資料；不是使用 CPU 的快取記憶體（Cache Memory）。"}, {"n": 786, "code": "101-10", "ans": "4", "multi": false, "q": "有關電腦衡量單位之敘述，下列何者「不正確」？", "o": ["衡量印表機解析度的單位是 DPI（Dots Per Inch）", "磁帶資料儲存密度的單位是 BPI（Bytes Per Inch）", "衡量雷射印表機列印速度的單位是 PPM（Pages Per Minute）", "通訊線路傳輸速率的單位是 BPS（Bytes Per Second）"], "e": "傳輸速率單位 bps 是 bits per second（每秒位元數），不是 Bytes。"}, {"n": 787, "code": "101-11", "ans": "1", "multi": false, "q": "有關電腦儲存資料所需記憶體的大小排序，下列何者正確？", "o": ["1TB＞1GB＞1MB＞1KB", "1KB＞1GB＞1MB＞1TB", "1GB＞1MB＞1TB＞1KB", "1TB＞1KB＞1MB＞1GB"], "e": "由大到小：TB ＞ GB ＞ MB ＞ KB，每級相差 1024 倍。"}, {"n": 788, "code": "101-12", "ans": "2", "multi": false, "q": "以微控制器為核心，並配合適當的周邊設備，以執行特定功能，主要是用來控制、監督或輔助特定設備的裝置，目前最常見的應用有 PDA、手機及資訊家電，這種系統稱為下列何者？", "o": ["伺服器系統", "嵌入式系統", "分散式系統", "個人電腦系統"], "e": "嵌入式系統把電腦嵌入設備中執行特定功能，如洗衣機、冷氣、路由器、車用電腦、手機。"}, {"n": 789, "code": "101-13", "ans": "4", "multi": false, "q": "有 A、B 兩個大小相同的檔案，A 檔案儲存在硬碟連續的位置，而 B 檔案儲存在硬碟分散的位置，因此 A 檔案的存取時間比 B 檔案少，下列何者為主要影響因素？", "o": ["CPU 執行時間", "記憶體存取時間", "傳送時間", "搜尋時間（Seek Time）"], "e": "分散儲存（磁碟破碎）時，讀寫頭必須多次移動到不同磁軌，累積更多搜尋時間。這也是「磁碟重組」能提升速度的原因。"}, {"n": 790, "code": "101-14", "ans": "3", "multi": false, "q": "有關資料表示，下列何者「不正確」？", "o": ["1Byte=8bits", "1KB=2^10 Bytes", "1MB=2^15 Bytes", "1GB=2^30 Bytes"], "e": "1MB＝2^20 Bytes（1024×1024），不是 2^15。（原題 210、215、230 是次方數 2^10、2^15、2^30 的排版誤植。）"}, {"n": 791, "code": "101-15", "ans": "4", "multi": false, "q": "有關資料儲存媒體之敘述，下列何者正確？", "o": ["儲存資料之光碟片，可以直接用餐巾紙沾水以同心圓擦拭", "MO 光碟機所使用的光碟片，外型大小及儲存容量均與 CD-ROM 相同", "RAM 是一個經設計燒錄於硬體設備之記憶體", "可消除及可規劃之唯讀記憶體的縮寫為 EPROM"], "e": "EPROM＝Erasable Programmable ROM（可抹除可程式唯讀記憶體）。(1) 光碟應由中心向外「放射狀」擦拭，避免同心圓刮痕沿資料軌道破壞資料；(2) MO 片外型與容量都不同；(3) 燒錄於硬體中的是 ROM。"}, {"n": 792, "code": "101-16", "ans": "1", "multi": false, "q": "下列何者為 RAID 技術的主要用途？", "o": ["儲存資料", "傳輸資料", "播放音樂", "播放影片"], "e": "RAID 把多顆硬碟組成陣列，用於資料儲存，提升速度與可靠度（冗餘）。"}, {"n": 793, "code": "101-17", "ans": "1", "multi": false, "q": "硬碟的轉速會影響下列何者磁碟機在讀取檔案時所需花的時間？", "o": ["旋轉延遲（Rotational Latency）", "尋找時間（Seek Time）", "資料傳輸（Transfer Time）", "磁頭切換（Head Switching）"], "e": "旋轉延遲是等待目標磁區轉到讀寫頭下的時間，轉速越快（如 7200rpm 比 5400rpm）延遲越短。搜尋時間則取決於讀寫臂移動速度。"}, {"n": 794, "code": "101-18", "ans": "3", "multi": false, "q": "微處理器與外部連接之各種訊號匯流排，何者具有雙向流通性？", "o": ["控制匯流排", "狀態匯流排", "資料匯流排", "位址匯流排"], "e": "資料匯流排要讀也要寫，所以是雙向；位址匯流排由 CPU 單向送出。"}, {"n": 795, "code": "101-19", "ans": "3", "multi": false, "q": "下列何者是「美國標準資訊交換碼」的簡稱？", "o": ["IEEE", "CNS", "ASCII", "ISO"], "e": "ASCII＝American Standard Code for Information Interchange。CNS 是中華民國國家標準；ISO 是國際標準化組織。"}, {"n": 796, "code": "101-20", "ans": "1", "multi": false, "q": "下列何者內建於中央處理器（CPU）做為 CPU 暫存資料，以提升電腦的效能？", "o": ["快取記憶體（Cache）", "快閃記憶體（Flash Memory）", "靜態隨機存取記憶體（SRAM）", "動態隨機存取記憶體（DRAM）"], "e": "CPU 內建 L1/L2/L3 快取記憶體暫存常用資料以提升效能。（快取是用 SRAM 製成，但題目問的功能名稱是快取記憶體。）"}, {"n": 797, "code": "102-1", "ans": "1", "multi": false, "q": "下列何者為制定網際網路（Internet）相關標準的機構？", "o": ["IETF", "IEEE", "ANSI", "ISO"], "e": "IETF（網際網路工程任務小組）以 RFC 文件制定 TCP/IP、HTTP 等網際網路標準。IEEE 制定 802.x 區域網路標準。"}, {"n": 798, "code": "102-2", "ans": "3", "multi": false, "q": "下列何者為專有名詞「WWW」之中文名稱？", "o": ["區域網路", "網際網路", "全球資訊網", "社群網路"], "e": "WWW（World Wide Web）＝全球資訊網；Internet＝網際網路；LAN＝區域網路。"}, {"n": 799, "code": "102-3", "ans": "4", "multi": false, "q": "下列何者不是合法的 IP 位址？", "o": ["120.80.40.20", "140.92.1.50", "192.83.166.5", "258.128.33.24"], "e": "IPv4 每一段是 8 位元，範圍 0～255；258 超出範圍。"}, {"n": 800, "code": "102-4", "ans": "1", "multi": false, "q": "有關網際網路之敘述，下列何者「不正確」？", "o": ["IPv4 之子網路與 IPv6 之子網路只要兩端直接以傳輸線相連即可互相傳送資料", "IPv4 之位址可以被轉化為 IPv6 之位址", "IPv6 之位址有 128 位元", "IPv4 之位址有 32 位元"], "e": "IPv4 與 IPv6 封包格式不相容，不能直接互通，需要雙堆疊、通道（Tunneling）或轉譯（NAT64）等過渡技術。"}, {"n": 801, "code": "102-5", "ans": "4", "multi": false, "q": "在 OSI 通信協定中，電子郵件的服務屬於下列哪一層？", "o": ["傳送層", "交談層", "表示層", "應用層"], "e": "電子郵件、FTP、WWW 等直接提供使用者的服務屬應用層。"}, {"n": 802, "code": "102-6", "ans": "4", "multi": false, "q": "有關藍芽（Bluetooth）技術特性之敘述，下列何者「不正確」？", "o": ["傳輸距離約 10 公尺", "低功率", "使用 2.4GHz 頻段", "傳輸速率約為 10Mbps"], "e": "依題庫答案，傳統藍牙速率約 1Mbps（藍牙 2.0+EDR 約 3Mbps），不是 10Mbps。"}, {"n": 803, "code": "102-7", "ans": "2", "multi": false, "q": "有關網際網路協定之敘述，下列何者「不正確」？", "o": ["TCP 是一種可靠傳輸", "HTTP 是一種安全性的傳輸", "HTTP 使用 TCP 來傳輸資料", "UDP 是一種不可靠傳輸"], "e": "HTTP 以明文傳輸，不具安全性；加上 SSL/TLS 加密的 HTTPS 才是安全傳輸。"}, {"n": 804, "code": "102-8", "ans": "1", "multi": false, "q": "下列何者是較為安全的加密傳輸協定？", "o": ["SSH", "HTTP", "FTP", "SMTP"], "e": "SSH（Secure Shell）全程加密，用於安全的遠端登入與檔案傳輸（SFTP）。HTTP、FTP、SMTP 預設都是明文傳輸。"}, {"n": 805, "code": "102-9", "ans": "4", "multi": false, "q": "物聯網（IoT）通訊物件通常具備移動性，為支援這樣的通訊特性，需求的網路技術主要為下列何者？", "o": ["分散式運算", "網格運算", "跨網域運算能力", "物件動態連結"], "e": "物件會移動並隨時加入、離開網路，所以需要能動態建立連結的網路技術。"}, {"n": 806, "code": "102-10", "ans": "1", "multi": false, "q": "若電腦教室內的電腦皆以雙絞線連結至某一台集線器上，則此種網路架構為下列何者？", "o": ["星狀拓樸", "環狀拓樸", "匯流排拓樸", "網狀拓樸"], "e": "所有電腦連到中央集線器（或交換器），呈放射狀，屬星狀拓樸。"}, {"n": 807, "code": "102-11", "ans": "2", "multi": false, "q": "下列設備，何者可以讓我們在只有一個 IP 的狀況下，提供多部電腦上網？", "o": ["集線器（Hub）", "IP 分享器", "橋接器（Bridge）", "數據機（Modem）"], "e": "IP 分享器以 NAT 技術讓內部多台使用私有 IP 的電腦共用一個公有 IP 上網。"}, {"n": 808, "code": "102-12", "ans": "2", "multi": false, "q": "當一個區域網路過於忙碌，打算將其分開成兩個子網路時，此時應加裝下列何種裝置？", "o": ["路徑器（Router）", "橋接器（Bridge）", "閘道器（Gateway）", "網路連接器（Connector）"], "e": "依題庫答案為橋接器：可把一個忙碌的區域網路切成兩段，只轉送跨段的訊框，減少流量與碰撞（同第 622 題）。"}, {"n": 809, "code": "102-13", "ans": "4", "multi": false, "q": "下列何種電腦通訊傳輸媒體之傳輸速度最快？", "o": ["同軸電纜", "雙絞線", "電話線", "光纖"], "e": "光纖頻寬最大、傳輸速度最快。"}, {"n": 810, "code": "102-14", "ans": "4", "multi": false, "q": "下列何者為真實的 MAC（Media Access Control）位址？", "o": ["00:05:J6:0D:91:K1", "10.0.0.1-255.255.255.0", "00:05:J6:0D:91:B1", "00:D0:A0:5C:C1:B5"], "e": "MAC 位址為 48 位元，以 6 組十六進位（0～9、A～F）表示。(1)(3) 含有 J、K 不是十六進位數字；(2) 是 IP 與子網路遮罩。"}, {"n": 811, "code": "102-15", "ans": "2", "multi": false, "q": "下列何種 IEEE Wireless LAN 標準的傳輸速率最低？", "o": ["802.11a", "802.11b", "802.11g", "802.11n"], "e": "理論最高速率：802.11b 11Mbps；802.11a、802.11g 54Mbps；802.11n 600Mbps。802.11b 最低。"}, {"n": 812, "code": "102-16", "ans": "3", "multi": false, "q": "NAT（Network Address Translation）的用途為下列何者？", "o": ["電腦主機與 IP 位址的轉換", "IP 位址轉換為實體位址", "組織內部私有 IP 位址與網際網路合法 IP 位址的轉換", "封包轉送路徑選擇"], "e": "NAT 在內部私有 IP 與外部公有 IP 之間轉換，讓多台電腦共用公有 IP，也能隱藏內部網路。(1) 是 DNS；(2) 是 ARP；(4) 是路由。"}, {"n": 813, "code": "102-17", "ans": "2", "multi": false, "q": "下列何種服務可將 Domain Name 對應為 IP 位址？", "o": ["WINS", "DNS", "DHCP", "Proxy"], "e": "DNS（網域名稱系統）把網域名稱解析為 IP 位址。"}, {"n": 814, "code": "102-18", "ans": "3", "multi": false, "q": "下列何者不是 NFC（Near Field Communication）的功用？", "o": ["電子錢包", "電子票證", "行車導航", "資料交換"], "e": "NFC 是 10 公分內的近距離感應，用於感應支付、電子票證、裝置配對與資料交換。行車導航需要 GPS。"}, {"n": 815, "code": "102-19", "ans": "2", "multi": false, "q": "有關 xxx@abc.edu.tw 之敘述，下列何者「不正確」？", "o": ["它代表一個電子郵件地址", "若為了方便，可以省略@", "xxx 代表一個電子郵件帳號", "abc.edu.tw 代表某個電子郵件伺服器"], "e": "「@」用來分隔帳號與網域，是電子郵件地址的必要部分，不能省略。"}, {"n": 816, "code": "102-20", "ans": "3", "multi": false, "q": "有關 OTG（On-The-Go）之敘述，下列何者正確？", "o": ["可以將兩個隨身碟連接複製資料", "可以提昇隨身碟資料傳送之速度", "可以將隨身碟連接到手機，讓手機存取隨身碟之資料", "可以讓隨身碟直接透過 WiFi 傳送資料到雲端"], "e": "USB OTG 讓手機、平板可以當 USB 主控端（Host），連接隨身碟、鍵盤、滑鼠等 USB 裝置。"}, {"n": 817, "code": "102-21", "ans": "1", "multi": false, "q": "根據 NIST 對雲端的定義，下列何者「不是」雲端運算之服務模式？", "o": ["內容即服務（Content as a Service, CaaS）", "基礎架構即服務（IaaS）", "平台即服務（PaaS）", "軟體即服務（SaaS）"], "e": "NIST 定義的三種雲端服務模式為 IaaS、PaaS、SaaS。"}, {"n": 818, "code": "102-22", "ans": "2", "multi": false, "q": "下列何種雲端服務可供使用者開發應用軟體？", "o": ["Software as a Service（SaaS）", "Platform as a Service（PaaS）", "Information as a Service", "Infrastructure as a Service（IaaS）"], "e": "PaaS 提供開發與執行環境（作業系統、程式語言執行環境、資料庫），讓開發者部署自己的應用程式，如 Google App Engine、Heroku。"}, {"n": 819, "code": "102-23", "ans": "4", "multi": false, "q": "下列何者為「B2C」電子商務之交易模式？", "o": ["公司對公司", "客戶對公司", "客戶對客戶", "公司對客戶"], "e": "B2C＝Business to Consumer（企業對消費者，如網路商店）；B2B 企業對企業；C2C 消費者對消費者（如拍賣）；C2B 消費者對企業（如團購）。"}, {"n": 820, "code": "102-24", "ans": "1", "multi": false, "q": "下列何者為 Class A 網路的內定子網路遮罩？", "o": ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255"], "e": "預設遮罩：Class A 255.0.0.0（/8）、Class B 255.255.0.0（/16）、Class C 255.255.255.0（/24）。"}, {"n": 821, "code": "102-25", "ans": "3", "multi": false, "q": "IPv6 網際網路上的 IP address，每個 IP address 總共有幾個位元組？", "o": ["4 Bytes", "8 Bytes", "16 Bytes", "20 Bytes"], "e": "IPv6 為 128 位元÷8＝16 Bytes。IPv4 是 32 位元＝4 Bytes。"}, {"n": 822, "code": "102-26", "ans": "4", "multi": false, "q": "下列何者為 DHCP 伺服器之功能？", "o": ["提供網路資料庫的管理功能", "提供檔案傳輸的服務", "提供網頁連結的服務", "動態的分配 IP 給使用者使用"], "e": "DHCP（動態主機設定協定）自動分配 IP 位址、子網路遮罩、閘道、DNS 等網路設定。"}, {"n": 823, "code": "102-27", "ans": "3", "multi": false, "q": "有關乙太網路（Ethernet）之敘述，下列何者「不正確」？", "o": ["是一種區域網路", "採用 CSMA／CD 的通訊協定", "網路長度可至 2500 公尺", "傳送時不保證服務品質"], "e": "依題庫答案為 (3)。（傳統 10Base5 乙太網路單段 500 公尺，加中繼器後最長約 2500 公尺；題庫將此敘述列為錯誤，作答依題庫。）"}, {"n": 824, "code": "102-28", "ans": "1", "multi": false, "q": "一個 Class C 類型網路可用的主機位址有多少個？", "o": ["254", "256", "128", "524"], "e": "Class C 主機位址 8 位元＝256 個，扣掉全 0（網路位址）與全 1（廣播位址），可用 254 個。"}, {"n": 825, "code": "102-29", "ans": "3", "multi": false, "q": "下列何者為正確的 Internet 服務及相對應的預設通訊埠？", "o": ["TELNET：21", "FTP：23", "SMTP：25", "HTTP：82"], "e": "SMTP 25 正確（題目印成 STMP）。Telnet 是 23、FTP 是 21、HTTP 是 80。"}, {"n": 826, "code": "103-1", "ans": "2", "multi": false, "q": "有關使用直譯程式（Interpreter）將程式翻譯成機器語言之敘述，下列何者正確？", "o": ["直譯程式與編譯程式翻譯方式一樣", "直譯程式每次轉譯一行指令後即執行", "直譯程式先執行再翻譯成目的程式", "直譯程式先翻譯成目的程式，再執行之"], "e": "直譯器逐行翻譯並立即執行，不產生目的程式（如早期 BASIC、Python）。編譯器則是整個程式先翻譯成目的程式再執行。"}, {"n": 827, "code": "103-2", "ans": "1", "multi": false, "q": "編譯程式將高階語言翻譯至可執行的過程中，下列何者是連結程式（Linker）負責連結的標的？", "o": ["目的程式與所需之副程式", "原始程式與目的程式", "副程式與可執行程式", "原始程式與可執行程式"], "e": "流程：原始程式 →（編譯器）→ 目的程式 →（連結器：連結目的程式與所需的副程式/函式庫）→ 可執行程式 →（載入器）→ 記憶體執行。"}, {"n": 828, "code": "103-3", "ans": "2", "multi": false, "q": "Linux 是屬何種系統？", "o": ["應用系統", "作業系統（Operation Systems）", "資料庫系統", "編輯系統"], "e": "Linux 是開放原始碼、類 Unix 的作業系統。"}, {"n": 829, "code": "103-4", "ans": "4", "multi": false, "q": "下列何種作業系統沒有圖形使用者操作介面？", "o": ["Linux", "Windows Server", "Mac OS", "MS-DOS"], "e": "MS-DOS 是純文字命令列介面（CLI），沒有 GUI。"}, {"n": 830, "code": "103-5", "ans": "3", "multi": false, "q": "下列何者「不是」多人多工之作業系統？", "o": ["Linux", "Solaris", "MS-DOS", "Windows Server"], "e": "MS-DOS 是單人單工作業系統；Linux、Solaris、Windows Server 都是多人多工。"}, {"n": 831, "code": "103-6", "ans": "3", "multi": false, "q": "下列何者為 Linux 作業系統之「系統管理者」的預設帳號？", "o": ["administrator", "manager", "root", "supervisor"], "e": "Linux/Unix 系統管理者帳號是 root（UID 0）。"}, {"n": 832, "code": "103-7", "ans": "3", "multi": false, "q": "Windows 登入時，若鍵入的密碼其「大小寫不正確」會導致下列何種結果？", "o": ["仍可以進入 Windows", "進入 Windows 的安全模式", "要求重新輸入密碼", "Windows 將先關閉，並重新開機"], "e": "Windows 密碼有區分大小寫，大小寫錯誤就是密碼錯誤，系統會要求重新輸入。"}, {"n": 833, "code": "103-8", "ans": "3", "multi": false, "q": "下列何種技術是利用硬碟空間來解決主記憶體空間之不足？", "o": ["分時技術（Time Sharing）", "同步記憶體（Concurrent Memory）", "虛擬記憶體（Virtual Memory）", "多工技術（Multitasking）"], "e": "虛擬記憶體把部分硬碟空間（分頁檔/swap）當成記憶體的延伸，解決主記憶體不足。"}, {"n": 834, "code": "103-9", "ans": "4", "multi": false, "q": "電腦中負責資源管理的軟體是下列何種？", "o": ["編譯程式（Compiler）", "公用程式（Utility）", "應用程式（Application）", "作業系統（Operating System）"], "e": "作業系統負責管理 CPU、記憶體、I/O 裝置、檔案等系統資源。"}, {"n": 835, "code": "103-10", "ans": "2", "multi": false, "q": "下列何者為 Linux 系統所採用的檔案系統？", "o": ["NTFS", "XFS", "HTFS", "vms"], "e": "Linux 常用檔案系統：ext2/ext3/ext4、XFS（CentOS/RHEL 7 之後的預設）、Btrfs。NTFS 是 Windows 的檔案系統。"}, {"n": 836, "code": "104-1", "ans": "1", "multi": false, "q": "題目所附流程圖（先執行處理方塊，再判斷條件，條件為「真」時回到處理方塊重複執行，「假」時離開）所對應的 C/C++ 指令為何？", "o": ["do...while", "while", "switch...case", "if...then...else"], "e": "先執行、後判斷（迴圈內容至少執行一次），是 do { … } while (條件); 的結構。"}, {"n": 837, "code": "104-2", "ans": "4", "multi": false, "q": "題目所附流程圖（先判斷條件，「真」走左邊處理方塊、「假」走右邊處理方塊，兩邊最後匯合）所對應的 C/C++ 指令為何？", "o": ["do...while", "while", "switch...case", "if...then...else"], "e": "依條件二選一執行不同區塊後匯合，是 if … else 的雙向選擇結構。"}, {"n": 838, "code": "104-3", "ans": "2", "multi": false, "q": "題目所附流程圖（先判斷條件，「真」時執行處理方塊後回到判斷，「假」時離開）所對應的 C/C++ 指令為何？", "o": ["do...while", "while", "switch...case", "if...then...else"], "e": "先判斷、後執行（條件一開始就不成立時迴圈內容一次都不執行），是 while (條件) { … } 的結構。"}, {"n": 839, "code": "104-4", "ans": "2", "multi": false, "q": "題目所附流程圖（判斷 X>3：真則 PRINT A，假則 PRINT B，匯合後執行 X=X+1）所對應的 C/C++ 程式為何？", "o": ["X>3? cout<<B : cout<<A; X=X+1", "if (X>3) cout<<A; else cout<<B; X=X+1;", "switch(X) { case 1: cout<<A; case 2: cout<<A; case 3: cout<<A; default: cout<<B; }", "while (X>3) cout<<A; cout<<B; X=X+1;"], "e": "X>3 為真輸出 A、否則輸出 B，之後不論哪條路都執行 X=X+1，對應 (2)。(1) 三元運算子的 A、B 位置相反；(3) switch 判斷的是 X 等於 1、2、3（且沒有 break）；(4) 是迴圈。"}, {"n": 840, "code": "104-5", "ans": "3", "multi": false, "q": "有關題目所附 C/C++ 程式片段（流程圖）之敘述，下列何者正確？", "o": ["輸入三個變數", "找出輸入數值最小值", "找出輸入數值最大值", "輸出結果為 the output is:c"], "e": "依題庫答案為 (3)。原題庫的程式是讀入數值後，逐一比較並保留較大者，最後輸出最大值。（本份 PDF 此題顯示的圖與上一題相同，應是題庫網頁的圖片錯置，作答請記答案 (3)「找出輸入數值最大值」。）"}, {"n": 841, "code": "104-6", "ans": "3", "multi": false, "q": "下列何者「不是」C/C++ 語言基本資料型態？", "o": ["void", "int", "main", "char"], "e": "main 是程式進入點的函式名稱，不是資料型態。基本型態有 int、char、float、double、void、bool 等。"}, {"n": 842, "code": "104-7", "ans": "3", "multi": false, "q": "下列何者在 C/C++ 語言中視為 false？", "o": ["-100", "-1", "0", "1"], "e": "C/C++ 中只有 0 為 false，其他任何非 0 值（包括負數）都視為 true。"}, {"n": 843, "code": "104-8", "ans": "4", "multi": false, "q": "有關 C/C++ 語言中變數及常數之敘述，下列何者「不正確」？", "o": ["變數用來存放資料，以利程式執行，可以是整數、浮點、字串的資料型態", "程式中可以操作、改變變數的值", "常數存放固定數值，可以是整數、浮點、字串的資料型態", "程式中可以操作、改變常數值"], "e": "常數（如 const int N=10; 或字面常數）在程式執行中不能被改變，這正是常數與變數的差別。"}, {"n": 844, "code": "104-9", "ans": "3", "multi": false, "q": "下列 C/C++ 程式片段「While (sum <= 1000) sum = sum + 30;」，何者敘述正確？", "o": ["小括號應該改成大括號", "sum = sum + 30; 必須使用大括號括起來", "While 應該改成 while", "While (sum <= 1000) 之後應該要有分號"], "e": "C/C++ 區分大小寫，關鍵字一律小寫，While 必須寫成 while。迴圈本體只有一行時可以不加大括號；條件後加分號反而會變成空迴圈。"}, {"n": 845, "code": "104-10", "ans": "3", "multi": false, "q": "有關 C/C++ 語言結構控制語法，下列何者正確？", "o": ["while (x>0) do {y=5;}", "for (x<10) { y=5;}", "while (x>0 || x<5) { y=5;}", "do (x>0) { y=5 } while (x<1)"], "e": "while (條件) { 敘述; } 語法正確，|| 是邏輯 OR。(1) while 後不加 do；(2) for 需要 (初值; 條件; 增量) 三部分；(4) do 後面不接條件，且 y=5 少了分號、while 後少了分號。"}, {"n": 846, "code": "104-11", "ans": "4", "multi": false, "q": "C/C++ 語言指令 switch 的流程控制變數「不可以」使用何種資料型態？", "o": ["char", "int", "byte", "double"], "e": "switch 的判斷運算式必須是整數型別（int、char、short、long、enum 等）；浮點數 float、double 不能用，因為浮點數無法精確比對相等。"}, {"n": 847, "code": "104-12", "ans": "4", "multi": false, "q": "C/C++ 語言中限定一個主體區塊，使用下列何種符號？", "o": ["( )", "/* */", "\" \"", "{ }"], "e": "大括號 { } 界定程式區塊（函式本體、迴圈本體）。( ) 用於條件與參數；/* */ 是註解；\" \" 是字串。"}, {"n": 848, "code": "104-13", "ans": "4", "multi": false, "q": "下列 C/C++ 程式片段，輸出結果何者正確？int x = 3; int a[] = {1,2,3,4}; int *z; z = a; z = z + x; cout << *z << \"\\n\";", "o": ["1", "2", "3", "4"], "e": "z = a 讓 z 指向 a[0]；z = z + 3 讓指標往後移 3 個元素，指向 a[3]；*z 取得 a[3] 的值 4。"}, {"n": 849, "code": "104-14", "ans": "3", "multi": false, "q": "下列 C/C++ 程式片段，輸出結果何者正確？int x = 3; int a[] = {1,2,3,4}; int *z; z = &x; cout << *z << \"\\n\";", "o": ["1", "2", "3", "4"], "e": "z = &x 讓 z 指向變數 x，*z 取出 x 的值 3。陣列 a 在這裡沒有用到。"}, {"n": 850, "code": "104-15", "ans": "4", "multi": false, "q": "下列 C/C++ 程式片段，若 x = 2，則 y 值為何？int y = !(12 < 5 || 3 <= 5 && 3 > x) ? 7 : 9;", "o": ["2", "3", "7", "9"], "e": "&& 優先於 ||。12<5 為假；3<=5 為真、3>2 為真，真&&真＝真；假||真＝真；!真＝假。條件為假，取冒號後的值 9。"}, {"n": 851, "code": "104-16", "ans": "3", "multi": false, "q": "下列 C/C++ 程式片段，其 x 之輸出結果何者正確？int x; x = (5 <= 3 && 'A' < 'F') ? 3 : 4", "o": ["2", "3", "4", "5"], "e": "5<=3 為假，&& 左邊為假整個就為假（短路求值）；條件為假，取 4。"}, {"n": 852, "code": "104-17", "ans": "2", "multi": false, "q": "下列 C/C++ 程式片段，執行後 x 值為何？int a=0, b=0, c=0; int x=(a<b+4);", "o": ["0", "1", "2", "3"], "e": "算術優先於比較：b+4＝4，0<4 為真；關係運算的結果在 C/C++ 中真為 1、假為 0，所以 x＝1。"}, {"n": 853, "code": "104-18", "ans": "2", "multi": false, "q": "下列 C/C++ 程式片段，f(8, 3) 輸出為何？int f(int x, int y) { if (x == y) return 0; else return f(x-1, y) + 1; }", "o": ["3", "5", "8", "11"], "e": "遞迴展開：f(8,3)＝f(7,3)+1＝f(6,3)+2＝f(5,3)+3＝f(4,3)+4＝f(3,3)+5＝0+5＝5。實際上就是計算 x－y＝8－3＝5。"}, {"n": 854, "code": "104-19", "ans": "3", "multi": false, "q": "對於題目所附 C/C++ 程式（三層迴圈：for i<m、for j<p 時 c[i][j]=0，再 for k<n 執行 c[i][j]=c[i][j]+a[i][k]*b[k][j]），何者敘述正確？", "o": ["將 a 及 b 兩矩陣相加後，儲存至 c 矩陣", "若 a={{1,2},{3,4}} 及 b={{1,0},{2,-3}}，執行結束後 c={{5,6},{11,12}}", "若 a 及 b 均為 2x2 矩陣，最內層 for 迴圈執行 8 次", "若 a 及 b 均為 2x2 矩陣，最外層 for 迴圈執行 4 次"], "e": "這是矩陣「相乘」（不是相加）。2×2 時 i 有 2 次、j 有 2 次、k 有 2 次，最內層共執行 2×2×2＝8 次，(3) 正確；最外層只執行 2 次。(2) 實際結果是 c={{5,-6},{11,-12}}。"}, {"n": 855, "code": "104-20", "ans": "3", "multi": false, "q": "對於題目所附 C/C++ 程式片段（x1=2; y1=4; x2=6; y2=8; a=y2-y1; b=x2-x1; c=-a*x1+b*y1; cout<<a<<\"x+\"<<-b<<\"y+\"<<c<<\"=0\";），何者敘述有誤？", "o": ["程式輸出為 4x+-3y+8=0", "若 (x1,x2) 及 (y1,y2) 視為兩個二維平面座標，程式功能為計算直線方程式", "若 (x1,x2) 及 (y1,y2) 視為兩個二維平面座標，則直線方程式的斜率為 -4/3", "若 (x1,x2),(y1,y2) 及 (5,4) 視為三個二維平面座標，則會構成一個直角三角形"], "e": "依題庫答案為 (3)。計算 a＝8－4＝4、b＝6－2＝4、c＝－4×2＋4×4＝8，程式求的是直線 4x－4y＋8＝0，即 y＝x＋2，斜率＝a/b＝1，不是 -4/3。（補充：實際輸出應為 4x+-4y+8=0，作答依題庫選 (3)。）"}, {"n": 856, "code": "105-1", "ans": "1", "multi": false, "q": "有關電腦犯罪之敘述，下列何者「不正確」？", "o": ["犯罪容易察覺", "採用手法較隱藏", "高技術性的犯罪活動", "與一般傳統犯罪活動不同"], "e": "電腦犯罪手法隱密、技術性高、可遠端進行、證據容易被刪除，因此「不容易」察覺。"}, {"n": 857, "code": "105-2", "ans": "2", "multi": false, "q": "「訂定災害防治標準作業程序及重要資料的備份」是屬何種時期所做的工作？", "o": ["過渡時期", "災變前", "災害發生時", "災變復原時期"], "e": "擬定標準作業程序（SOP）與備份資料都是事前的預防準備工作。"}, {"n": 858, "code": "105-3", "ans": "2", "multi": false, "q": "下列何者為受僱來嘗試利用各種方法入侵系統，以發覺系統弱點的技術人員？", "o": ["黑帽駭客", "白帽駭客（White Hat Hacker）", "電腦蒐證專家", "密碼學專家"], "e": "白帽駭客經授權進行滲透測試，找出弱點協助修補；黑帽駭客則以惡意目的入侵。"}, {"n": 859, "code": "105-4", "ans": "1", "multi": false, "q": "下列何種類型的病毒會自行繁衍與擴散？", "o": ["電腦蠕蟲（Worms）", "特洛伊木馬程式", "後門程式", "邏輯炸彈"], "e": "蠕蟲不需依附宿主程式，可透過網路自我複製並主動擴散。木馬、後門、邏輯炸彈本身不會自我繁殖。"}, {"n": 860, "code": "105-5", "ans": "3", "multi": false, "q": "有關對稱性加密法與非對稱性加密法的比較之敘述，下列何者「不正確」？", "o": ["對稱性加密法速度較快", "非對稱性加密法安全性較高", "RSA 屬於對稱性加密法", "使用非對稱性加密法時，每個人各自擁有一對公開金匙與秘密金匙，欲提供認證性時，使用者將資料用自己的秘密金匙加密送給對方，對方再用相對的公開金匙解密"], "e": "RSA 是最著名的非對稱（公開金鑰）加密法；DES、AES 才是對稱式加密。"}, {"n": 861, "code": "105-6", "ans": "2", "multi": false, "q": "下列何種資料備份方式只有儲存當天修改的檔案？", "o": ["完全備份", "遞增備份", "差異備份", "隨機備份"], "e": "遞增（增量）備份只備份「上次任何備份之後」變動的檔案，所以每天只存當天修改的檔案。差異備份則備份「上次完整備份之後」所有變動的檔案，會一天天累積。"}, {"n": 862, "code": "105-7", "ans": "3", "multi": false, "q": "下列何種入侵偵測系統（IDS）是利用特徵（Signature）資料庫及事件比對方式，以偵測可能的攻擊或事件異常？", "o": ["主機導向（Host-Based）", "網路導向（Network-Based）", "知識導向（Knowledge-Based）", "行為導向（Behavior-Based）"], "e": "知識導向（又稱特徵導向、誤用偵測）用已知攻擊特徵資料庫比對；行為導向（異常偵測）則是比對正常行為基準。主機/網路導向是依「部署位置」分類。"}, {"n": 863, "code": "105-8", "ans": "4", "multi": false, "q": "下列何種網路攻擊手法是藉由傳遞大量封包至伺服器，導致目標電腦的網路或系統資源耗盡，服務暫時中斷或停止，使其正常用戶無法存取？", "o": ["偷窺（Sniffers）", "欺騙（Spoofing）", "垃圾訊息（Spamming）", "阻斷服務（Denial of Service）"], "e": "DoS（阻斷服務）以大量請求耗盡目標資源；由多台殭屍電腦同時發動的稱為 DDoS（分散式阻斷服務）。"}, {"n": 864, "code": "105-9", "ans": "2", "multi": false, "q": "下列何種網路攻擊手法是利用假節點號碼取代有效來源或目的 IP 位址之行為？", "o": ["偷窺（Sniffers）", "欺騙（Spoofing）", "垃圾資訊（Spamming）", "阻斷服務"], "e": "IP 欺騙（IP Spoofing）偽造封包的來源 IP 位址，冒充可信任的主機。"}, {"n": 865, "code": "105-10", "ans": "4", "multi": false, "q": "有關數位簽章之敘述，下列何者「不正確」？", "o": ["可提供資料傳輸的安全性", "可提供認證", "有利於電子商務之推動", "可加速資料傳輸"], "e": "數位簽章提供身分認證、資料完整性與不可否認性，但額外的運算反而增加負擔，不會加速傳輸。"}, {"n": 866, "code": "105-11", "ans": "4", "multi": false, "q": "下列何者為可正確且及時將資料庫複製於異地之資料庫復原方法？", "o": ["異動紀錄（Transaction Logging）", "遠端日誌（Remote Journaling）", "電子防護（Electronic Vaulting）", "遠端複本（Remote Mirroring）"], "e": "遠端鏡像（Remote Mirroring）把資料即時同步複製到異地的另一套系統，災難發生時可立即接手。遠端日誌只傳送異動記錄；電子防護是批次傳送備份。"}, {"n": 867, "code": "105-12", "ans": "1", "multi": false, "q": "字母 \"B\" 的 ASCII 碼以二進位表示為 \"01000010\"，若電腦傳輸內容為 \"101000010\"，以便檢查該字母的正確性，則下列敘述何者正確？", "o": ["使用奇數同位元檢查", "使用偶數同位元檢查", "使用二進位數檢查", "不做任何正確性的檢查"], "e": "原資料 01000010 有 2 個 1，前面多加的同位元是 1，總共 3 個 1（奇數），所以是奇同位檢查。若是偶同位，同位元應為 0。"}, {"n": 868, "code": "105-13", "ans": "4", "multi": false, "q": "下列何種方法「不屬於」資訊系統安全的管理？", "o": ["設定每個檔案的存取權限", "每個使用者執行系統時，皆會在系統中留下變動日誌（Log）", "不同使用者給予不同權限", "限制每人使用時間"], "e": "存取權限、日誌稽核、權限分級都是安全管理措施；限制使用時間屬於資源分配管理，依題庫不屬資訊安全管理。"}, {"n": 869, "code": "105-14", "ans": "4", "multi": false, "q": "有關資訊中心的安全防護措施之敘述，下列何者「不正確」？", "o": ["重要檔案每天備份三份以上，並分別存放", "加裝穩壓器及不斷電系統", "設置煙霧及熱度感測器等設備，以防止災害發生", "雖是不同部門，資料也可以任意交流，以便支援合作，順利完成工作"], "e": "不同部門之間的資料存取應依權限與職務需要控管，不可任意交流，以免資料外洩。"}, {"n": 870, "code": "105-15", "ans": "4", "multi": false, "q": "有關電腦中心的資訊安全防護措施之敘述，下列何者「不正確」？", "o": ["資訊中心的電源設備必須有穩壓器及不斷電系統", "機房應選用耐火、絕緣、散熱性良好的材料", "需要資料管制室，做為原始資料的驗收、輸出報表的整理及其他相關資料保管", "所有備份資料應放在一起以防遺失"], "e": "備份資料應分散存放（含異地存放），若全部放在一起，一場火災或水災就會同時毀損。"}, {"n": 871, "code": "105-16", "ans": "4", "multi": false, "q": "下列何種檔案類型較不會受到電腦病毒感染？", "o": ["含巨集之檔案", "執行檔", "系統檔", "純文字檔"], "e": "純文字檔（.txt）只有文字資料、不含可執行的程式碼，病毒無法依附執行。巨集檔、執行檔、系統檔都含有可執行程式碼。"}, {"n": 872, "code": "105-17", "ans": "3", "multi": false, "q": "有關重要的電腦系統如醫療系統、航空管制系統、戰情管制系統及捷運系統，在設計時通常會考慮當機的回復問題。下列何種方式是一般最常用的做法？", "o": ["隨時準備當機時，立即回復人工作業，並時常加以演習", "裝設自動控制溫度及防災設備，最重要應有 UPS 不斷電配備", "同時裝設兩套或多套系統，以俾應變當機時之轉換運作", "與同機型之電腦使用單位或電腦中心訂立應變時之支援合約"], "e": "關鍵系統不能中斷，最常見做法是建置備援系統（雙機或多機），主系統當機時自動切換到備援系統繼續運作。"}, {"n": 873, "code": "105-18", "ans": "4", "multi": false, "q": "有關資料保護措施，下列敘述何者「不正確」？", "o": ["定期備份資料庫", "機密檔案由專人保管", "留下重要資料的使用紀錄", "資料檔案與備份檔案保存在同一磁碟機"], "e": "備份與原始檔放在同一顆磁碟，磁碟一壞兩者同時毀損，失去備份意義。"}, {"n": 874, "code": "105-19", "ans": "3", "multi": false, "q": "如果一個僱員必須被停職，他的網路存取權應在何時關閉？", "o": ["停職後一週", "停職後二週", "給予他停職通知前", "不需關閉"], "e": "應在通知前就先關閉權限，避免員工得知後心生不滿而刪除、竊取或破壞資料。"}, {"n": 875, "code": "105-20", "ans": "2", "multi": false, "q": "有關資訊系統安全措施，下列敘述何者「不正確」？", "o": ["加密保護機密資料", "系統管理者統一保管使用者密碼", "使用者不定期更改密碼", "網路公用檔案設定成「唯讀」"], "e": "密碼應由使用者自行保管，即使是系統管理者也不應知道（同第 707 題）。"}, {"n": 876, "code": "105-21", "ans": "4", "multi": false, "q": "下列何種動作進行時，重新開機可能會造成檔案被破壞？", "o": ["程式正在計算", "程式等待使用者輸入資料", "程式從磁碟讀取資料", "程式正在對磁碟寫資料"], "e": "寫入到一半中斷，檔案內容或檔案系統結構可能不完整而損毀；讀取或計算時中斷不會破壞磁碟上的檔案。"}, {"n": 877, "code": "105-22", "ans": "2", "multi": false, "q": "下列何者「不是」資訊安全所考慮的事項？", "o": ["確保資訊內容的機密性，避免被別人偷窺 function chips(){
  const all=[["all","全部",""]].concat(SECTIONS);
  $("#chips").innerHTML=all.map(([k,a,b])=>{
    const n=k==="all"?DATA.length:DATA.filter(d=>secOf(d)===k).length;
    return `<button class="chip" data-k="${k}" aria-pressed="${k===sec}">${b?b:a} · ${n}</button>`}).join("");
  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;sec=b.dataset.k;chips();render()};
}
function card(d){
  const ans=d.ans.split("");
  const opts=d.o.map((t,i)=>`<li data-i="${i+1}" class="${ans.includes(String(i+1))?"right":""}"><span class="k">(${i+1})</span><span>${esc(t)}</span></li>`).join("");
  const ansTxt=ans.map(a=>`(${a})`).join("");
  return `<article class="q" data-n="${d.n}" data-ans="${d.ans}">
    <div class="meta"><span class="num">${d.n}</span><span>題號 ${d.code}</span>${d.multi?'<span class="tag">複選</span>':""}</div>
    <div class="stem">${esc(d.q)}</div><ol class="opts">${opts}</ol>
    ${d.multi?'<div class="multi-hint">複選題：點選所有你認為正確的選項，再按「看答案」。</div>':""}
    <button class="reveal">看答案與解析</button>
    <div class="ex"><span class="ans">答案 ${ansTxt}</span>${esc(d.e)}</div></article>`;
}
function render(){
  const t=term.trim().toLowerCase();
  const rows=DATA.filter(d=>(sec==="all"||secOf(d)===sec)&&(!onlyMulti||d.multi)&&
    (!t||(d.q+" "+d.o.join(" ")+" "+d.e+" "+d.code+" "+d.n).toLowerCase().includes(t)));
  $("#count").textContent=`顯示 ${rows.length} 題`;
  let html="",cur=null;
  for(const d of rows){const s=secOf(d);
    if(s!==cur){cur=s;const S=SECTIONS.find(x=>x[0]===s);html+=`<h2 class="sec">${S[2]}<small>${S[1]}</small></h2>`}
    html+=card(d)}
  $("#list").innerHTML=html||'<div class="empty">找不到符合的題目，試試其他關鍵字。</div>';
  document.body.classList.toggle("practice",practice);
  document.querySelectorAll(".q").forEach(q=>q.classList.toggle("show",!practice));
}
$("#list").addEventListener("click",e=>{
  const q=e.target.closest(".q"); if(!q||!practice) return;
  if(e.target.closest(".reveal")){reveal(q);return}
  const li=e.target.closest("li"); if(!li||q.classList.contains("show")) return;
  if(q.dataset.ans.length>1){li.classList.toggle("sel");li.style.borderColor=li.classList.contains("sel")?"var(--blue)":"";return}
  if(!li.classList.contains("right")) li.classList.add("picked-wrong");
  reveal(q);
});
function reveal(q){
  q.querySelectorAll("li.sel").forEach(li=>{li.style.borderColor="";if(!li.classList.contains("right"))li.classList.add("picked-wrong")});
  q.classList.add("show");
}
$("#q").addEventListener("input",e=>{term=e.target.value;clearTimeout(window._t);window._t=setTimeout(render,150)});
$("#onlyMulti").addEventListener("change",e=>{onlyMulti=e.target.checked;render()});
const modeBtn=$("#mode");
function setMode(){modeBtn.setAttribute("aria-pressed",practice);modeBtn.textContent=practice?"練習模式：開":"練習模式";}
modeBtn.onclick=()=>{practice=!practice;try{localStorage.setItem("ex-mode",practice?"1":"0")}catch(e){};setMode();render()};
stats();chips();setMode();render();
</script>

</body></html>
