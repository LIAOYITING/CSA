<script>
const DATA = [{"n": 1, "code": "1-1", "ans": "3", "multi": false, "q": "在數據通訊（Data Communication）系統中，線路兩端的電腦，彼此可同時交互傳送及接受資料的型態稱為？", "o": ["單工", "半雙工", "全雙工", "線上雙工"], "e": "線路兩端可「同時」雙向傳送與接收＝全雙工（如電話）。單工只能單向（如廣播）；半雙工可雙向，但同一時間只能一方傳（如無線對講機）。"}, {"n": 2, "code": "1-2", "ans": "4", "multi": false, "q": "在布林代數運算中，下列何者錯誤？", "o": ["A+A'=1", "AA'=0", "A+A'B'=A+B'", "A(A'+B)=A'B"], "e": "A(A'+B)=AA'+AB=0+AB=AB，不是 A'B，故 (4) 錯。(1) A+A'=1、(2) AA'=0 為互補律；(3) A+A'B'=(A+A')(A+B')=A+B'（分配律），皆正確。"}, {"n": 3, "code": "1-3", "ans": "2", "multi": false, "q": "如果電腦的位址匯流排（Address Bus）有 17 條線，則其儲存位置空間最多可達多少 Bytes？", "o": ["64K", "128K", "256K", "512K"], "e": "n 條位址線可定址 2^n 個位置：2^17＝131072＝128×1024＝128K Bytes。"}, {"n": 4, "code": "1-4", "ans": "3", "multi": false, "q": "下列敘述何者錯誤？", "o": ["一部電腦中有兩個以上 CPU 同時執行不同的程式，我們稱作是一種平行處理（Parallel Processing）", "掃描器（Scanner）適用於影像處理應用（ImageProcessing）", "C 語言可以撰寫 Recursive 程式，故適於大量資料處理應用", "CPU 中的控制單元乃負責各單元之間通道的建立"], "e": "C 語言確實可寫遞迴（Recursive），但遞迴每次呼叫都要在堆疊保存狀態，耗記憶體、效率差，「可寫遞迴」與「適合大量資料處理」沒有因果關係，故 (3) 錯。其餘皆正確。"}, {"n": 5, "code": "1-5", "ans": "4", "multi": false, "q": "電腦的五大單元中，何者專門負責整體系統的指揮控制？", "o": ["輸入單元", "算術/邏輯單元", "記憶單元", "控制單元"], "e": "五大單元：輸入、輸出、記憶、算術邏輯（ALU）、控制（CU）。負責指揮、協調各單元運作的是控制單元。"}, {"n": 6, "code": "1-6", "ans": "2", "multi": false, "q": "下列何者在網際網路（Internet）上屬於單一性不可重複？", "o": ["Subnet Mask", "IP Address", "Default Gateway", "Password"], "e": "IP Address 是網際網路上識別主機的位址，公有 IP 必須全球唯一。子網路遮罩、預設閘道各網路可以設成一樣，密碼更不需要唯一。"}, {"n": 7, "code": "1-7", "ans": "4", "multi": false, "q": "關於「分封交換（Packet Switching）」之敘述，下列何者錯誤？", "o": ["分封交換可彈性機動選擇資料傳送的路徑，減少延遲的現象", "在不同的傳輸速率或通信協定下，均可相互轉換傳送", "通信使用時間較分散的用戶適於使用", "分封交換的每個封包的長度是可變動的"], "e": "分封交換把資料切成固定長度（有最大長度上限）的封包，每個封包帶表頭獨立傳送，長度不是任意可變的，故 (4) 錯。(1)(2)(3) 為其優點：路徑彈性、可跨速率/協定轉換、適合間歇性傳輸的用戶。"}, {"n": 8, "code": "1-8", "ans": "1", "multi": false, "q": "有關「光纖」之敘述，下列何者錯誤？", "o": ["只適於傳送數位化的信號", "可使用的頻寬，比同軸電纜高出許多", "由玻璃纖維所組成，不受電磁干擾", "傳輸速率高，體積細小"], "e": "光纖用光訊號傳輸，類比與數位信號都能傳，「只適於數位信號」錯誤。其頻寬遠高於同軸電纜、玻璃纖維不受電磁干擾、速率高且體積小，皆正確。"}, {"n": 9, "code": "1-9", "ans": "4", "multi": false, "q": "關於「環狀（Ring）網路」之敘述，下列何者錯誤？", "o": ["環狀網路中，每一個端點的電腦是透過 Repeater 連接到封閉式環狀網路上", "資料在傳輸媒介上傳送時，是單向傳送", "Repeater 上分為聆聽、傳送與迂迴（Bypass）三種狀態", "環狀網路內由於傳輸距離較長，所以連接上網的端點站數也沒有限制"], "e": "資料在環上要經過每個節點的 Repeater 轉送，節點越多延遲越大、任一點故障影響全網，所以端點數是有限制的，(4) 錯。(1)(2)(3) 都是環狀網路的特性。"}, {"n": 10, "code": "1-10", "ans": "3", "multi": false, "q": "在排序的過程中，若由於資料量太大，而無法完全放在主記憶體中；必須借用輔助記憶體，此種排序方式稱之為？", "o": ["陣列排序（Sort of Array）", "內部排序（Internal Sorting）", "外部排序（External Sorting）", "快速排序（Quick Sorting）"], "e": "資料量大到需借用磁碟等輔助記憶體來完成排序＝外部排序。資料可全部放在主記憶體中排序的則為內部排序。"}, {"n": 11, "code": "1-11", "ans": "3", "multi": false, "q": "下列傳輸媒介中，何者在單位時間內的資料傳輸量最大？", "o": ["電話線", "同軸電纜", "光纖", "雙絞線"], "e": "頻寬（傳輸量）大小：光纖 ＞ 同軸電纜 ＞ 雙絞線 ≧ 電話線。光纖單位時間傳輸量最大。"}, {"n": 12, "code": "1-12", "ans": "4", "multi": false, "q": "在 CPU 中，下一個要被執行指令的位址是存放在？", "o": ["位址暫存器", "緩衝暫存器", "指令暫存器", "程式計數器"], "e": "程式計數器（PC）存放「下一個要執行的指令位址」；指令暫存器（IR）存放「目前正在執行的指令」，兩者常被拿來互考。"}, {"n": 13, "code": "1-13", "ans": "2", "multi": false, "q": "下列何者不是作業系統的主要功能？", "o": ["設備管理", "排序", "記憶體管理", "資源分配"], "e": "作業系統負責行程（CPU）管理、記憶體管理、設備（I/O）管理、檔案管理與資源分配。「排序」是應用程式的工作，不是 OS 主要功能。"}, {"n": 14, "code": "1-14", "ans": "4", "multi": false, "q": "下列儲存裝置中，何者存取速度最快？", "o": ["硬碟（Hard Disk）", "主記憶體（Main Memory）", "光碟（CD-ROM）", "快取記憶體（Cache Memory）"], "e": "速度：暫存器 ＞ 快取記憶體 ＞ 主記憶體 ＞ 硬碟 ＞ 光碟。選項中快取最快。"}, {"n": 15, "code": "1-15", "ans": "2", "multi": false, "q": "有關「中斷（Interrupt）」之敘述，下列何者正確？", "o": ["中斷的要求必定來自硬體", "硬體中斷，相對於 CPU 正在執行的程式，乃是一非同步事件（Asynchronous Event）", "當 CPU 在執行中斷時，就不能再執行其他的中斷", "可遮沒的中斷（Mask Interrupt）沒有優先權"], "e": "硬體中斷由外部裝置隨時發出，與 CPU 正在執行的指令時序無關，所以是非同步事件，(2) 正確。(1) 中斷也可來自軟體（如系統呼叫、例外）；(3) 較高優先權的中斷可以打斷正在處理的中斷（巢狀中斷）；(4) 中斷都有優先順序。"}, {"n": 16, "code": "1-16", "ans": "1", "multi": false, "q": "下列敘述何者正確？", "o": ["電腦的 CPU 其實只能執行機器語言", "所謂同步傳輸意指一次同時傳送兩個 Bytes 的資料", "即時系統（Real-time）一定是 On-line 系統，而 On-line 系統也一定是 Real-time 系統", "指令暫存器是用來表示下一個等待執行指令的位址"], "e": "CPU 只看得懂機器語言，其他語言都要經編譯、組譯或直譯轉成機器碼，(1) 正確。(2) 同步傳輸是以「區塊」為單位、靠時脈同步連續傳送；(3) 線上系統不一定即時；(4) 存下一個指令位址的是程式計數器。"}, {"n": 17, "code": "1-17", "ans": "4", "multi": false, "q": "關於「行動裝置作業系統」之敘述，下列何者錯誤？", "o": ["iPhone 與 iPad 均使用 iOS 作業系統", "Android 是一種以 Linux 為基礎的開放原始碼作業系統", "Windows Phone 是微軟視窗作業系統的行動裝置版本", "受限於硬體的能力，行動裝置作業系統一定是單工的作業系統"], "e": "現今手機作業系統（iOS、Android）都是多工系統，可同時執行多個 App（背景播放音樂、下載等），「一定是單工」錯誤。"}, {"n": 18, "code": "1-18", "ans": "1", "multi": false, "q": "下列何者不是資料庫管理系統的目的？", "o": ["可保持資料的重複性", "可確保資料的安全性", "可保持資料的一致性", "可提升資料處理的效率"], "e": "DBMS 的目的之一就是「減少」資料重複（冗餘），避免不一致；保持重複性與目的相反。安全性、一致性、效率都是 DBMS 的目的。"}, {"n": 19, "code": "1-19", "ans": "3", "multi": false, "q": "採用存轉式（Store-and-Forward）傳輸資訊的方式是？", "o": ["資料交換（Data Switching）", "電路交換（Circuit Switching）", "分封交換（Packet Switching）", "信號交換（Signal Switching）"], "e": "分封交換中，每個節點先把收到的封包「儲存」，再選擇路徑「轉送」出去，即存轉式（Store-and-Forward）。電路交換則是先建立專用線路再傳送。"}, {"n": 20, "code": "1-20", "ans": "4", "multi": false, "q": "編譯程式（Compiler）可以檢查出程式的？", "o": ["資料錯誤", "邏輯錯誤", "執行錯誤", "語法錯誤"], "e": "編譯器在翻譯時會依語法規則檢查，只能找出語法（Syntax）錯誤。邏輯錯誤與執行錯誤要到執行或測試時才會發現。"}, {"n": 21, "code": "1-21", "ans": "3", "multi": false, "q": "關於多工（Multitasking）作業系統之敘述，下列何者錯誤？", "o": ["需要有中斷處理的能力", "需要有排程（Scheduling）的能力", "需要有平行處理（Parallel Processing）的能力", "可以用分時（Time Sharing）處理技術達成"], "e": "多工在單一 CPU 上靠分時、排程與中斷快速切換即可達成，不一定需要多 CPU 的平行處理能力，故 (3) 錯。"}, {"n": 22, "code": "1-22", "ans": "3", "multi": false, "q": "所謂「流程圖（Flow Chart）」乃是指？", "o": ["程式之輸出或輸入的一種表現方法", "以各種次常式來描述程式的一種方法", "以圖型化的演繹邏輯來表達程式操作順序的方法", "程式編譯後的結果"], "e": "流程圖用標準圖形符號（開始/結束、處理、判斷、輸入輸出等）與箭頭，圖像化表達程式的邏輯與執行順序。"}, {"n": 23, "code": "1-23", "ans": "4", "multi": false, "q": "電腦 CPU 內部的「定址模式（Addressing Mode）」是用來當作什麼功用？", "o": ["指令解碼", "運算執行", "指令提取", "運算元提取"], "e": "定址模式決定「如何找到運算元（Operand）」的位置，例如立即、直接、間接、暫存器、索引定址等，所以用途是運算元提取。"}, {"n": 24, "code": "1-24", "ans": "1", "multi": false, "q": "下列何者不是控制單元的工作？", "o": ["運算執行", "時序控制", "指令提取", "指令解碼"], "e": "控制單元負責提取指令、解碼、時序控制與指揮各單元；實際的算術與邏輯運算由 ALU（算術邏輯單元）執行。"}, {"n": 25, "code": "1-25", "ans": "1", "multi": false, "q": "在「關聯式（Relational）資料庫」中，其擷取資料的方式為何？", "o": ["以資料的內容", "以資料的位址", "以資料的指標", "以資料的大小"], "e": "關聯式資料庫以「內容」查詢，例如 SQL 的 WHERE 姓名='王小明'，使用者不需知道資料存放的位址或指標（那是階層式、網狀式資料庫的方式）。"}, {"n": 26, "code": "1-26", "ans": "4", "multi": false, "q": "當 CPU 從主記憶體中提取指令、解碼、決定 Operands 的位址、以及下一個指令的位址，這些動作是屬於？", "o": ["程式週期", "記憶週期", "執行週期", "指令週期"], "e": "機器週期分為指令週期（I-cycle：提取、解碼、取得運算元位址）與執行週期（E-cycle：執行、存回結果）。題述動作屬指令週期。"}, {"n": 27, "code": "1-27", "ans": "2", "multi": false, "q": "在資料庫中，將資料的重複降低到最少的過程稱為？", "o": ["結構化", "正規化", "模組化", "關聯化"], "e": "正規化（Normalization）把資料表依 1NF、2NF、3NF… 規則分解，消除重複資料與異常（新增、刪除、更新異常）。"}, {"n": 28, "code": "1-28", "ans": "1", "multi": false, "q": "在作業系統中，下列何者負責處理程式中斷？", "o": ["監督程式", "啟動載入程式", "輸出入控制程式", "工作控制程式"], "e": "監督程式（Supervisor，常駐於記憶體的核心）負責監控系統運作、處理中斷並分派資源。啟動載入程式只負責開機載入 OS。"}, {"n": 29, "code": "1-29", "ans": "3", "multi": false, "q": "關於「結構化程式設計」之敘述，下列何者錯誤？", "o": ["應盡量採用模組化設計", "應減少 GO TO 指令的使用", "入口要少、出口要多", "包含循序（Sequence）、選擇（Selection）及重複（Repetition）三種結構"], "e": "結構化程式要求每個模組「單一入口、單一出口」，以利閱讀與除錯，「出口要多」錯誤。"}, {"n": 30, "code": "1-30", "ans": "3", "multi": false, "q": "能使電腦執行比主記憶體還大的程式時，可用下列哪一種技術？", "o": ["分時（Time Sharing）", "快取記憶（Cache Memory）", "虛擬記憶（Virtual Memory）", "多工作業（Multi-tasking）"], "e": "虛擬記憶體把部分硬碟空間當作記憶體延伸，程式分頁（Paging）後只把需要的部分載入主記憶體，因此能執行比實體記憶體大的程式。"}, {"n": 31, "code": "1-31", "ans": "1", "multi": false, "q": "關於 Compiler 之敘述，下列何者錯誤？", "o": ["可檢查程式邏輯錯誤", "可檢查程式語法（Syntax）錯誤", "可將程式原始碼變成目的碼", "無法產生執行檔"], "e": "編譯器只能檢查語法錯誤，無法檢查邏輯錯誤（要靠測試），故 (1) 錯。另外編譯器只產生目的碼，需經連結器（Linker）才產生執行檔，所以 (4) 是對的。"}, {"n": 32, "code": "1-32", "ans": "3", "multi": false, "q": "有關 WWW 之敘述，下列何者錯誤？", "o": ["「全球資訊網」是 World Wide Web 之縮寫", "讓企業可以將自己的產品或服務項目等訊息提供給大眾知道", "為使網路資訊自由流通，使用者在其上建立首頁（HomePage）時，可以不受智慧財產保護相關法令約束", "WWW 上之資訊不僅可顯示文字、圖形，還可以顯示聲音、影像"], "e": "網路不是法外之地，架設網頁使用他人文字、圖片、音樂仍受著作權等智慧財產權法規約束，(3) 錯。"}, {"n": 33, "code": "1-33", "ans": "1", "multi": false, "q": "在「OSI 通訊協定」中，提供檔案傳輸的是哪一層？", "o": ["應用層", "網路層", "實體層", "表達層"], "e": "直接提供使用者服務（檔案傳輸 FTP、電子郵件、網頁 HTTP、遠端登入）的是第 7 層應用層。"}, {"n": 34, "code": "1-34", "ans": "1", "multi": false, "q": "在「OSI 通訊協定」中，提供電子郵遞服務的是哪一層？", "o": ["應用層", "網路層", "實體層", "表達層"], "e": "電子郵件（SMTP、POP3）屬直接面向使用者的服務，由第 7 層應用層提供。"}, {"n": 35, "code": "1-35", "ans": "2", "multi": false, "q": "在「OSI 通訊協定」中，哪一層可安排資料傳輸路徑？", "o": ["應用層", "網路層", "實體層", "表達層"], "e": "第 3 層網路層負責邏輯定址（IP）與路由選擇（Routing），決定封包的傳輸路徑；路由器即運作於此層。"}, {"n": 36, "code": "1-36", "ans": "1", "multi": false, "q": "「程式計數器（Program Counter）」是屬於下列哪一單元？", "o": ["控制單元", "輸出入單元", "算術邏輯單元", "記憶單元"], "e": "程式計數器與指令暫存器、指令解碼器同屬控制單元，用來控制指令的執行順序。"}, {"n": 37, "code": "1-37", "ans": "4", "multi": false, "q": "「程式計數器（Program Counter）」的功能為何？", "o": ["記錄程式中執行完畢的指令", "記錄程式執行中的狀態", "記錄程式執行完成的時間", "記錄下一個指令的位址"], "e": "PC 存放下一個要執行的指令位址，每取一個指令就自動指向下一個。記錄執行狀態的是狀態暫存器（旗標）。"}, {"n": 38, "code": "1-38", "ans": "3", "multi": false, "q": "在資料庫管理系統中，用以定義資料型態、長度及關係的是？", "o": ["工作控制語言（Job Control Language）", "資料控制語言（Data Control Language）", "資料定義語言（Data Definition Language）", "資料處理語言（Data Manipulation Language）"], "e": "DDL 用來定義資料結構（CREATE、ALTER、DROP），包含欄位型態、長度、關聯。DML 操作資料（SELECT、INSERT、UPDATE、DELETE）；DCL 控制權限（GRANT、REVOKE）。"}, {"n": 39, "code": "1-39", "ans": "3", "multi": false, "q": "由全世界大大小小的網路連接而成的全球性網路稱為？", "o": ["區域網路", "企業網路", "網際網路", "環狀網路"], "e": "網際網路（Internet）是透過 TCP/IP 把全球各種網路互相連接而成的「網路的網路」。"}, {"n": 40, "code": "1-40", "ans": "3", "multi": false, "q": "有關搜尋（Search）之敘述，下列何者錯誤？", "o": ["循序搜尋法（Sequential Search）的儲存空間最有效率，方法容易，但平均搜尋速度較慢", "在二分搜尋法（Binary Search）中，被搜尋的檔案需先排序（Sort）好", "在區段搜尋法（Block Search）中，第 n 個 Block 中所有的資料項值，必須全部小於第 n+1 個 Block 中的所有資料項值，而每個 Block 中的資料也必須 Sort 好", "內插搜尋（Interpolation Search）的搜尋速度完全受鍵值分布的影響"], "e": "區段搜尋只要求「區段之間」有順序（前一區段的值都小於後一區段），區段「內部」不必排序，先找到區段後在區段內循序搜尋即可，故 (3) 錯。"}, {"n": 41, "code": "1-41", "ans": "1", "multi": false, "q": "下列何者不是「載入程式（Loader）」之功能？", "o": ["緊結（Binding）", "連結（Linking）", "重定位（Relocation）", "載入（Loading）"], "e": "載入程式的四大功能：配置（Allocation）、連結（Linking）、重定位（Relocation）、載入（Loading）。「緊結（Binding）」不是 Loader 的功能。"}, {"n": 42, "code": "1-42", "ans": "3", "multi": false, "q": "下列敘述何者正確？", "o": ["一個連線（On-Line）系統一定是即時系統（Real-Time）", "一個多程式（Multiprogramming）執行系統一定具有分時（Time-Sharing）功能", "一個分時（Time-Sharing）系統一定是多程式執行系統（Multiprogramming）", "一個多重處理器系統一定是多程式（Multiprogramming）執行系統"], "e": "分時系統讓多個使用者/程式輪流使用 CPU 時間片段，記憶體中必須同時存放多個程式，所以一定是多程式系統，(3) 正確。反過來多程式系統不一定採分時（可能用批次排程）；線上系統不一定即時；多處理器系統也不保證是多程式。"}, {"n": 43, "code": "1-43", "ans": "4", "multi": false, "q": "在作業系統處理程序執行順序排程（Process Scheduling）中，下列何者不屬於 Process Scheduling 的方法？", "o": ["First In First Out", "Shortest Job First", "Round Robin", "Race Condition"], "e": "FIFO（先到先做）、SJF（最短工作優先）、RR（循環輪流）都是 CPU 排程法。Race Condition（競爭情況）是多個行程同時存取共享資源造成結果不確定的問題，不是排程方法。"}, {"n": 44, "code": "1-44", "ans": "1", "multi": false, "q": "在電腦中，下列何者負責管理 CPU 及 I/O 設備？", "o": ["作業系統", "公用程式", "載入程式", "編譯程式"], "e": "作業系統是管理硬體資源（CPU、記憶體、I/O 設備、檔案）並提供使用者介面的系統軟體。"}, {"n": 45, "code": "1-45", "ans": "3", "multi": false, "q": "「全球資訊網（World Wide Web）」在程式架構上是採取什麼架構？", "o": ["Master Slave", "Peer to Peer", "Client Server", "File Sharing"], "e": "WWW 由瀏覽器（Client）向網站伺服器（Server）提出 HTTP 請求，伺服器回傳網頁，屬主從式（Client/Server）架構。"}, {"n": 46, "code": "1-46", "ans": "3", "multi": false, "q": "「快取記憶體（Cache Memory）」的主要功能是？", "o": ["作為輔助記憶體", "可以降低主記憶體的負擔和成本", "可以增進程式的整體執行速度", "可以減少輔助記憶體的空間需求"], "e": "快取記憶體介於 CPU 與主記憶體之間，存放常用的指令與資料，緩和兩者速度差距，提升整體執行速度。"}, {"n": 47, "code": "1-47", "ans": "1", "multi": false, "q": "結構化程式的缺點是？", "o": ["較浪費主記憶體空間", "開發程式的成本較高", "流程複雜，別人不易看懂", "程式測試不容易"], "e": "結構化、模組化後程式易讀、易維護、易測試、開發成本較低；缺點是模組呼叫與額外結構使程式碼較長、較佔記憶體空間。"}, {"n": 48, "code": "1-48", "ans": "2", "multi": false, "q": "下列敘述何者錯誤？", "o": ["電腦中的加法器為組合電路", "載入程式（Loader）可以將原始程式轉成可執行程式", "電腦內部對於整數和實數是以不同的方式儲存", "寫程式時，其實可以完全不用到 GO TO 指令"], "e": "把原始程式轉成目的碼的是編譯器/組譯器，再由連結器產生可執行檔；載入程式只負責把可執行程式載入主記憶體，故 (2) 錯。"}, {"n": 49, "code": "1-49", "ans": "3", "multi": false, "q": "何種網路協定可以自動設定使用者電腦的 IP Address？", "o": ["RIP", "TCP/IP", "DHCP", "IPX/SPX"], "e": "DHCP（動態主機設定協定）會自動分配 IP 位址、子網路遮罩、預設閘道、DNS 給用戶端。RIP 是路由協定。"}, {"n": 50, "code": "1-50", "ans": "2", "multi": false, "q": "資料儲存的功能是由下列哪一單元來執行？", "o": ["算術邏輯單元", "記憶單元", "控制單元", "輸出入單元"], "e": "記憶單元（主記憶體、輔助記憶體）負責儲存程式與資料。"}, {"n": 51, "code": "1-51", "ans": "2", "multi": false, "q": "下列哪一種服務可以存取 SQL 伺服器或 Access 的資料庫界面？", "o": ["Gopher Service", "WWW Service", "FTP Service", "Proxy Service"], "e": "網站伺服器（WWW Service，如 IIS）可透過 ASP、PHP 等網頁程式連接 SQL Server 或 Access 資料庫，讓使用者用瀏覽器存取資料。"}, {"n": 52, "code": "1-52", "ans": "3", "multi": false, "q": "有關「載入程式（Loader）」之敘述，下列何者正確？", "o": ["可檢查原始程式是否有語法（Syntax）上的錯誤", "將原始程式編譯成目的程式", "將目的程式載入主記憶體中", "執行目的程式"], "e": "Loader 負責把（連結好的）目的/執行程式載入主記憶體，準備交給 CPU 執行。檢查語法、編譯是編譯器的工作。"}, {"n": 53, "code": "1-53", "ans": "4", "multi": false, "q": "下列何者不是資料庫的資料結構之一？", "o": ["關聯式（Relational）", "網路式（Network）", "階層式（Hierachical）", "星狀式（Star）"], "e": "傳統資料庫模型有階層式、網路式、關聯式（另有物件導向式）。「星狀」是網路拓樸，不是資料庫結構。"}, {"n": 54, "code": "1-54", "ans": "1", "multi": false, "q": "下列敘述何者錯誤？", "o": ["動態隨機存取記憶體（DRAM）消耗功率比靜態隨機存取記憶體（SRAM）大", "SRAM 乃由正反器（Flip-Flop）構成基本記憶單元", "可程式唯讀記憶體（PROM）只能讓使用者自行規劃、並燒錄程式一次", "可抹除可程式唯讀記憶體（EPROM）中所寫入之程式，能夠用紫外線照射將之抹除"], "e": "本題依標準答案 (1) 為錯誤敘述：題庫的觀點是 DRAM 結構簡單（電容）、耗電較少、密度高、便宜；SRAM 用正反器、速度快但較耗電、較貴（常用作快取）。其餘 (2)(3)(4) 皆正確。"}, {"n": 55, "code": "1-55", "ans": "2", "multi": false, "q": "有關「非同步傳輸模式（ATM）」之敘述，下列何者錯誤？", "o": ["屬於一種星狀架構，以交換方式存取資料", "屬於一種高速網路，但是不同的速度無法相容", "屬於一種專屬網路，每一用戶端都可以享用自己全部的頻寬", "可以傳輸多媒體資料"], "e": "ATM 以固定長度 53 Bytes 的 Cell 傳輸，可支援並相容不同傳輸速率，且適合語音、影像等多媒體，故「不同速度無法相容」錯誤。"}, {"n": 56, "code": "1-56", "ans": "4", "multi": false, "q": "有關「路由器（Router）」之敘述，下列何者錯誤？", "o": ["它主要是 OSI 通訊協定標準第三層，亦即網路層的設備", "能夠整合不同的網路系統，例如讓乙太網路和記號環網路相連", "俱備了廣域網路的連線能力", "無法取代橋接器（Bridge）的功能"], "e": "路由器運作於第 3 層，功能涵蓋並高於第 2 層的橋接器（可分割網段、過濾流量），因此可以取代橋接器，(4) 錯。"}, {"n": 57, "code": "1-57", "ans": "4", "multi": false, "q": "有關「全球資訊網（WWW）」之敘述，下列何者錯誤？", "o": ["WWW 裡的文件都是用 HTML 撰寫的", "在網路存取上則採用 URL 來定義資料所在的位置", "使用者一般都用瀏覽器（Browser）閱讀資料", "無法傳遞多媒體資料"], "e": "WWW 是超媒體系統，可以呈現文字、圖片、聲音、影片等多媒體資料，(4) 錯。"}, {"n": 58, "code": "1-58", "ans": "1", "multi": false, "q": "下列哪一種是用於電子郵件的通訊協定？", "o": ["SMTP", "HTTP", "FTP", "Telnet"], "e": "SMTP（Simple Mail Transfer Protocol）用於寄送電子郵件；HTTP 用於網頁、FTP 用於檔案傳輸、Telnet 用於遠端登入。"}, {"n": 59, "code": "1-59", "ans": "2", "multi": false, "q": "關於「全球資訊網 WWW（World Wide Web）」之敘述，下列何者正確？", "o": ["只能在 Internet 中使用", "圖形和文件資源都可被連結在 web 網頁內", "它只能使用以圖形為介面的瀏覽器", "它不能加入表格"], "e": "WWW 以超連結把文字、圖形、文件等資源連結在網頁中，(2) 正確。WWW 技術也可用於企業內部網路（Intranet），也有文字型瀏覽器（如 Lynx），網頁可以加入表格。"}, {"n": 60, "code": "1-60", "ans": "3", "multi": false, "q": "收到一個副檔名為 .asp 的程式，該如何啟動它？", "o": ["可直接在瀏覽器執行", "需重新編譯方能執行", "需要連上具執行程式能力的網站伺服器方可執行", "要另存副檔名為 .bat 的新檔案方可被執行"], "e": "ASP（Active Server Pages）是伺服器端網頁程式，必須放在支援 ASP 的網站伺服器（如 IIS）上，由伺服器執行後把結果以 HTML 傳給瀏覽器。"}, {"n": 61, "code": "1-61", "ans": "1", "multi": false, "q": "下列四個 SQL 指令，何者不正確？", "o": ["INSERT INTO Table1（fa,fb,fc）（1,20,30）;", "DELETE FROM Table1 WHERE fa=1;", "UPDATE Table1 SET fb=fb*2 WHERE fa=1;", "SELECT * FROM Table1;"], "e": "INSERT 的正確語法是 INSERT INTO Table1 (fa,fb,fc) VALUES (1,20,30); 選項 (1) 少了關鍵字 VALUES。"}, {"n": 62, "code": "1-62", "ans": "3", "multi": false, "q": "公司的員工希望可以接收電子郵件（E-Mail），你要幫他設定哪一種伺服器？", "o": ["LDAP", "NNTP", "POP3", "DNS"], "e": "收信使用 POP3（或 IMAP），寄信使用 SMTP。LDAP 是目錄服務、NNTP 是新聞群組、DNS 是網域名稱解析。"}, {"n": 63, "code": "1-63", "ans": "2", "multi": false, "q": "「WWW 伺服器」預設使用 TCP 的哪一個 port number 傳送資料？", "o": ["21", "80", "70", "110"], "e": "常用預設埠：HTTP 80、HTTPS 443、FTP 21（控制）、SMTP 25、POP3 110、Telnet 23、Gopher 70。"}, {"n": 64, "code": "1-64", "ans": "3", "multi": false, "q": "使用瀏覽器瀏覽一部名為「www.myweb.com.tw」電腦，其「port number 為 8000」的 Web 虛擬主機，位址應如何輸入？", "o": ["http://www.myweb.com.tw/", "http://www.myweb.com.tw/default.htm", "http://www.myweb.com.tw:8000/", "http://www.myweb.com.tw/8000"], "e": "URL 中非預設埠要寫在主機名稱後面，以冒號分隔：協定://主機:埠號/路徑。(4) 的 /8000 會被當成路徑。"}, {"n": 65, "code": "1-65", "ans": "3", "multi": false, "q": "開機時螢幕電源指示燈已亮，但螢幕卻無畫面出現，則下列何者非檢查要項？", "o": ["螢幕訊號轉接頭不良", "主機板故障", "鍵盤接觸不良", "顯示卡故障"], "e": "無畫面與影像訊號路徑有關：訊號線/接頭、顯示卡、主機板。鍵盤接觸不良不會造成螢幕無畫面。"}, {"n": 66, "code": "1-66", "ans": "4", "multi": false, "q": "拆裝電腦時應先？", "o": ["進入測試軟體後再拆裝", "螢幕關機後再開機", "按 Reset 鍵後再拆裝", "關閉電腦電源後再拆裝"], "e": "為避免觸電與元件損壞，拆裝電腦前一定要先關機並拔除電源。"}, {"n": 67, "code": "1-67", "ans": "3", "multi": false, "q": "網際網路的傳送訊息封包成許多小包，下列何者不是其目的？", "o": ["改善網路傳遞時的速率", "保証資料傳遞正確沒有錯誤", "傳輸時間耗費較少", "便於檢查每一封包的正確性"], "e": "切成封包的目的是共享線路、提升效率、方便偵錯與重傳。但每個封包都要加上表頭並重新組合，總傳輸時間未必較少，故 (3) 不是目的。"}, {"n": 68, "code": "1-68", "ans": "2", "multi": false, "q": "程式設計時，若同一段敘述要重覆執行若干次，則採用？", "o": ["循序結構", "迴路結構", "選擇結構", "樹狀結構"], "e": "重複執行同一段程式要用迴路（重複）結構，例如 for、while。循序是由上往下執行；選擇是 if/switch。"}, {"n": 69, "code": "1-69", "ans": "2", "multi": false, "q": "CPU 的位址線匯流排對 CPU 而言為？", "o": ["僅能輸入", "僅能輸出", "輸出入皆可", "不能輸出入"], "e": "位址匯流排是單向的，由 CPU 送出要存取的記憶體位址，因此對 CPU 而言僅能輸出。資料匯流排才是雙向。"}, {"n": 70, "code": "1-70", "ans": "3", "multi": false, "q": "下列何者不是結構化程式設計所採用的基本結構？", "o": ["重覆結構", "選擇結構", "跳躍結構", "循序結構"], "e": "結構化程式三種基本結構為循序、選擇、重複。跳躍（GO TO）正是結構化程式要避免的。"}, {"n": 71, "code": "1-71", "ans": "2", "multi": false, "q": "在資料通訊系統中，資料傳輸時，為了避免資料被竊取，因而使資料外洩應做何種防範措施？", "o": ["將資料做錯誤檢查", "將資料加密", "將資料解密", "將資料解壓縮"], "e": "加密後即使資料被攔截，沒有金鑰也看不懂內容，可防止資料外洩。錯誤檢查只能確保正確性。"}, {"n": 72, "code": "1-72", "ans": "3", "multi": false, "q": "在 TCP/IP 網路裏，每一主機都有一個 IP 位址，而每個 IP 位址是幾個位元的資訊？", "o": ["8 位元", "16 位元", "32 位元", "64 位元"], "e": "IPv4 位址為 32 位元，分成 4 組各 8 位元，以點分十進位表示（如 192.168.1.1）。IPv6 則為 128 位元。"}, {"n": 73, "code": "1-73", "ans": "4", "multi": false, "q": "下列何者不是影響 PC（個人電腦）系統功能的因素？", "o": ["CPU 的時鐘頻率", "CPU 的主儲存體容量", "CPU 所能提供的指令集", "CPU 的配置模式"], "e": "時脈頻率、記憶體容量、指令集都直接影響電腦效能；「CPU 的配置模式」不是影響系統功能的因素。"}, {"n": 74, "code": "1-74", "ans": "2", "multi": false, "q": "下列敘述何者錯誤？", "o": ["任何十進位整數都可用二進位表示", "任何十進位小數都可用二進位表示", "任何二進位整數都可用十進位表示", "任何二進位小數都可用十進位表示"], "e": "有些十進位小數無法以有限位數的二進位精確表示，例如 0.1₁₀ = 0.0001100110011…₂（無限循環），故 (2) 錯。"}, {"n": 75, "code": "1-75", "ans": "2", "multi": false, "q": "若考慮正負號，1 個 Byte 的長度，它可以儲存的最大值？", "o": ["255", "127", "512", "36727"], "e": "1 Byte＝8 位元，有號數最高位元當符號位，範圍（2 的補數）為 -128～+127，最大值 2^7-1＝127。"}, {"n": 76, "code": "1-76", "ans": "1", "multi": false, "q": "若不考慮正負號，1 個 Byte 的長度，它可以儲存的最大值？", "o": ["255", "512", "128", "1024"], "e": "無號數 8 位元全部用來表示數值，範圍 0～2^8-1＝0～255。"}, {"n": 77, "code": "1-77", "ans": "2", "multi": false, "q": "在實作副程式（Subroutine）呼叫時，需使用何種資料結構來處理返回呼叫程式的位址？", "o": ["Queue", "Stack", "Tree", "Linked list"], "e": "副程式呼叫是「後呼叫先返回」，符合堆疊後進先出（LIFO）的特性，所以返回位址存放在堆疊（Stack）中，遞迴也是靠堆疊實現。"}, {"n": 78, "code": "1-78", "ans": "2", "multi": false, "q": "關於「雙核心 CPU」之敘述，下列何者正確？", "o": ["雙核心 CPU 就是指加入了 Hyper-Threading 技術的 CPU", "雙核心 CPU 是利用平行運算的概念來提高效能", "雙核心 CPU 就是 32 位元 x2，也就是所謂的 64 位元 CPU", "雙核心 CPU 的時脈是單核心 CPU 時脈的兩倍"], "e": "雙核心是一顆處理器內有兩個實體運算核心，可同時（平行）處理工作來提升效能。Hyper-Threading 是單核心模擬兩個邏輯處理器；位元數、時脈與核心數無關。"}, {"n": 79, "code": "1-79", "ans": "1", "multi": false, "q": "關於「雙核心 CPU」之敘述，下列何者錯誤？", "o": ["雙核心 CPU 因為有 2 個核心，所以耗電量是單核心 CPU 的 2 倍", "雙核心 CPU 所使用的程式必須經過特別設計，才能發揮效能", "雙核心 CPU 內，共有 2 組的控制單元和算術/邏輯運算單元", "雙核心 CPU 若加上了 Hyper-Threading 技術，作業系統會認為擁有四組處理器"], "e": "雙核心共用快取、匯流排等元件，並有省電設計，耗電量不會剛好是單核心的 2 倍，(1) 錯。程式需支援多執行緒才能發揮效能；雙核心加 HT 會呈現 4 個邏輯處理器。"}, {"n": 80, "code": "1-80", "ans": "3", "multi": false, "q": "下列何者是 Really Simple Syndication（RSS）所使用的語言技術？", "o": ["Java", "Object C", "XML", "HTML"], "e": "RSS 是以 XML 格式描述網站更新內容（標題、連結、摘要）的訂閱技術，閱讀器讀取 XML 檔即可取得最新消息。"}, {"n": 81, "code": "1-81", "ans": "2", "multi": false, "q": "關於「快取記憶體」之敘述，下列何者錯誤？", "o": ["配置在暫存器和主記憶體之間", "通常配置容量相當於主記憶體的容量", "由於 CPU 讀取需要的指令或資料時，會先到快取記憶體尋找，若找不到時才會再到主記憶體中讀取", "若 CPU 在快取記憶體就能找到需要的資料，便無需再到主記憶體讀取，故資料傳送的時間就能大幅縮短"], "e": "快取記憶體（SRAM）昂貴，容量遠小於主記憶體（例如 MB 級對 GB 級），不可能與主記憶體相當，(2) 錯。"}, {"n": 82, "code": "1-82", "ans": "4", "multi": false, "q": "為了避免實體主記憶體不足而無法執行程式，所發展出的技術為何？", "o": ["快取記憶體", "輔助記憶體", "快閃記憶體", "虛擬記憶體"], "e": "虛擬記憶體以硬碟空間模擬記憶體，讓程式可以超過實體主記憶體大小執行。"}, {"n": 83, "code": "1-83", "ans": "3", "multi": false, "q": "「編譯器」主要的功能為何？", "o": ["將組合語言程式碼轉譯成機器碼", "將程式重新定址", "將高階語言程式碼轉譯成機器碼", "連結互相呼叫的程式"], "e": "編譯器把高階語言（C、Java…）整個翻譯成機器碼（目的碼）。組合語言轉機器碼是組譯器；重新定址、連結是載入/連結程式的工作。"}, {"n": 84, "code": "1-84", "ans": "2", "multi": false, "q": "下列哪一種「排程演算法」，理論上能得到最短的平均等待時間？", "o": ["先到先做（FCFS）", "最短工作先做（SJF）", "優先權（Priority）", "循環分配（RR）"], "e": "SJF 讓執行時間短的工作先做，可使所有工作的平均等待時間最小（理論最佳）；缺點是長工作可能一直等待（飢餓）。"}, {"n": 85, "code": "1-85", "ans": "4", "multi": false, "q": "下列哪一種「排程演算法」具有時間配額的設計？", "o": ["先到先做（FCFS）", "最短工作先做（SJF）", "優先權（Priority）", "循環分配（RR）"], "e": "Round Robin 為每個行程分配固定的時間配額（Time Quantum），時間用完就換下一個行程，輪流使用 CPU。"}, {"n": 86, "code": "1-86", "ans": "4", "multi": false, "q": "下列哪一種「排程演算法」可以產生共享處理器現象？", "o": ["先到先做（FCFS）", "最短工作先做（SJF）", "優先權（Priority）", "循環分配（RR）"], "e": "RR 以時間片段讓所有行程輪流執行，切換快速，使用者感覺每個程式都同時擁有處理器，即「處理器共享」現象，是分時系統的基礎。"}, {"n": 87, "code": "1-87", "ans": "1", "multi": false, "q": "下列何者是動態 IP 位址的特色？", "o": ["連線時才取得 IP 位址", "IP 位址固定不變", "IP 位址為自己專用", "適合用來架站"], "e": "動態 IP 由 DHCP 或 ISP 在每次連線時才分配，每次可能不同；固定 IP 才適合架站。"}, {"n": 88, "code": "1-88", "ans": "3", "multi": false, "q": "在判斷發送端與目的地是否位於相同網路區段時，會執行下列哪一種邏輯運算？", "o": ["XOR", "OR", "AND", "NOT"], "e": "把 IP 位址與子網路遮罩做 AND 運算可得出網路位址（Network ID），兩端網路位址相同即在同一網段。"}, {"n": 89, "code": "1-89", "ans": "2", "multi": false, "q": "「TCP 協定」的主要功用不包含下列哪一項？", "o": ["錯誤處理", "加密", "重送", "控制流量"], "e": "TCP 提供可靠傳輸：連線建立、錯誤偵測、確認與重送、流量控制、壅塞控制。加密不是 TCP 的功能（要靠 SSL/TLS 等）。"}, {"n": 90, "code": "1-90", "ans": "2", "multi": false, "q": "下列敘述何者正確？", "o": ["IPv4 位址為 64bits", "IPv6 位址為 128bits", "IPv4 位址通常以「4 段式、16 進位」表示", "「203.74.205.256」為正確的 IPv4 位址"], "e": "IPv6 為 128 位元，(2) 正確。IPv4 為 32 位元，以 4 段十進位表示，每段範圍 0～255，所以 256 不合法。"}, {"n": 91, "code": "1-91", "ans": "2", "multi": false, "q": "通常在接收電子郵件時，使用下列哪一種協定？", "o": ["SMTP", "POP3", "FTP", "ARP"], "e": "收信用 POP3（或 IMAP），寄信用 SMTP。ARP 用於把 IP 位址轉成 MAC 位址。"}, {"n": 92, "code": "1-92", "ans": "1", "multi": false, "q": "若一個堆疊（Stack）可存放 5 個元素，連續 push 5 筆資料後，再繼續 push 1 筆資料會？", "o": ["失敗，不能再 push 資料進去", "將第 1 筆資料 pop 出來", "將第 5 筆資料 pop 出來", "將第 2 筆資料 pop 出來"], "e": "堆疊已滿時再 push 會發生溢位（Stack Overflow），無法再放入；堆疊不會自動 pop 資料。"}, {"n": 93, "code": "1-93", "ans": "3", "multi": false, "q": "關於「排序」之敘述，下列何者錯誤？", "o": ["要排序的資料量會影響排序的速度", "快速排序法使用分而治之的概念", "氣泡排序法不能用來將資料由大排到小", "快速排序法比氣泡排序法有較佳的效率"], "e": "氣泡排序只要把比較條件反過來（大的往前換），就能由大排到小，(3) 錯。快速排序平均 O(n log n)，優於氣泡排序 O(n²)。"}, {"n": 94, "code": "1-94", "ans": "3", "multi": false, "q": "下列何種應用不是使用「佇列（Queue）」資料結構？", "o": ["個人電腦的鍵盤緩衝區", "作業系統的處理工作排程", "呼叫函式時，儲存返回位址及傳遞參數", "印表機的列印工作排程"], "e": "函式呼叫的返回位址與參數使用「堆疊」（後進先出）。鍵盤緩衝、工作排程、列印佇列都是先進先出（FIFO）的佇列。"}, {"n": 95, "code": "1-95", "ans": "2", "multi": false, "q": "「將資料以表格的方式儲存，並透過參考的關係來查詢相關資料」，是屬於何種資料模型？", "o": ["階層式", "關聯式", "物件導向式", "表格式"], "e": "關聯式資料模型以二維表格（Table）儲存資料，透過主鍵與外來鍵建立表格間的關聯來查詢。"}, {"n": 96, "code": "1-96", "ans": "4", "multi": false, "q": "下列何者不是使用資料庫的優點？", "o": ["減少資料的重複性", "強化資料的保密性及安全性", "減少儲存資料的空間", "不需專人管理及維護資料庫"], "e": "資料庫需要資料庫管理師（DBA）負責管理、備份、權限與效能調校，「不需專人管理」錯誤。"}, {"n": 97, "code": "1-97", "ans": "3", "multi": false, "q": "下列何者不是建置管理資訊系統的目的？", "o": ["提供企業組織必要的資訊", "支援企業組織的管理及決策", "提供國稅局查核公司預算", "協助企業組織獲取更佳的績效"], "e": "MIS 的目的是提供管理者所需資訊，支援管理與決策、提升績效；供國稅局查核並不是建置 MIS 的目的。"}, {"n": 98, "code": "1-98", "ans": "1", "multi": false, "q": "下列何者為 WWW 的通訊協定？", "o": ["HTTP（Hyper Text Transfer Protocol）", "SMTP（Simple Mail Transfer Protocol）", "FTP（File Transfer Protocol）", "PPP（Point to Point Protocol）"], "e": "WWW 使用 HTTP（超文字傳輸協定）傳送網頁。SMTP 寄信、FTP 傳檔、PPP 為點對點撥接連線協定。"}, {"n": 99, "code": "1-99", "ans": "2", "multi": false, "q": "下列何者為規範網際網路上電子郵件傳遞的通訊協定？", "o": ["HTTP", "SMTP（Simple Mail Transfer Protocol）", "FTP", "PPP"], "e": "SMTP（簡易郵件傳輸協定）負責在郵件伺服器之間傳遞、寄送電子郵件。"}, {"n": 100, "code": "1-100", "ans": "2", "multi": false, "q": "在電子商務中，確認訊息來源的服務機制是？", "o": ["對稱式加密", "數位簽章", "Unicode", "資料探勘（Data Mining）"], "e": "數位簽章由傳送者以自己的私鑰簽署，接收者以其公鑰驗證，可確認來源（身分鑑別）、資料完整性與不可否認性。"}, {"n": 101, "code": "1-101", "ans": "2", "multi": false, "q": "下列何者是數位浮水印技術的主要應用範圍？", "o": ["上網撥接", "電子商務的安全查核", "網域名稱查詢", "使用者管理"], "e": "數位浮水印把版權或識別資訊嵌入圖片、影音等數位內容中，用於著作權保護與驗證真偽，屬電子商務的安全查核應用。"}, {"n": 102, "code": "1-102", "ans": "2", "multi": false, "q": "當接收到一密文為「YBIR」，而且知道它是將明文的英文字母所對應之次序數字（A=1，B=2，…，Z=26），經過以下公式：密文的字母次序數字＝((明文的字母次序數字＋13) mod 26)，原來的明文訊息應為哪一個？", "o": ["LIKE", "LOVE", "LONG", "LOST"], "e": "解密就是把密文往回推 13 個字母：Y(25)→L(12)、B(2)→O(15)、I(9)→V(22)、R(18)→E(5)，得 LOVE。驗算：L=12+13=25=Y。這就是 ROT13 加密。"}, {"n": 103, "code": "1-103", "ans": "3", "multi": false, "q": "下列何種機制使得 Java 能夠完成跨平台（Cross Platform）運作？", "o": ["例外處理", "物件導向", "虛擬機器", "多執行緒（Multi-thread）"], "e": "Java 原始碼編譯成與平台無關的 Bytecode，再由各平台的 Java 虛擬機器（JVM）執行，達成「一次編寫，到處執行」。"}, {"n": 104, "code": "1-104", "ans": "3", "multi": false, "q": "下列何者之功能是網路防火牆（Firewall）所無法提供的？", "o": ["流量管理稽核", "集中安全控管", "用戶身分管理", "阻絕異常存取"], "e": "防火牆依規則過濾封包、阻擋異常存取、集中控管並記錄流量；用戶帳號與身分管理屬於目錄服務/認證系統（如 AD、LDAP）的功能。"}, {"n": 105, "code": "1-105", "ans": "2", "multi": false, "q": "關於「網路服務」所通用的埠號（Port）之敘述，下列何者錯誤？", "o": ["HTTP 使用 port 80", "Telnet 使用 port 161", "POP3 使用 port 110", "SMTP 使用 port 25"], "e": "Telnet 使用 port 23；port 161 是 SNMP（簡易網路管理協定）。"}, {"n": 106, "code": "1-106", "ans": "1", "multi": false, "q": "下列可以偵測錯誤的編碼方法中，何者具錯誤更正能力？", "o": ["漢明碼（Hamming Code）", "同位元檢查（Parity Bit Check）", "循環冗餘檢查碼（CRC）", "檢查和（Checksum）"], "e": "漢明碼加入多個檢查位元，不只能偵測錯誤，還能找出錯誤位元的位置並更正（單一位元錯誤）。同位元、CRC、Checksum 只能偵錯。"}, {"n": 107, "code": "1-107", "ans": "3", "multi": false, "q": "下列「排序演算法」中，哪一種的平均速度最快？", "o": ["泡沫排序", "選擇排序", "快速排序", "插入排序"], "e": "快速排序平均時間複雜度 O(n log n)；泡沫、選擇、插入排序平均都是 O(n²)。"}, {"n": 108, "code": "1-108", "ans": "4", "multi": false, "q": "對於 SQL 語法的使用，下列何者有誤？", "o": ["透過 Like 運算子，可以查詢某一字串或字元的一部分", "使用四則運算在 SQL 查詢語法中是可行的", "就字串資料型態而言，「||」在查詢中可被用來串接兩個字串值", "使用 DESC 關鍵字可以達到查詢結果的遞增排序的效果"], "e": "ORDER BY 欄位 DESC 是「遞減」排序（由大到小）；遞增排序用 ASC（預設值），故 (4) 錯。"}, {"n": 109, "code": "1-109", "ans": "2", "multi": false, "q": "一般而言，路由表（Routing Table）中不會出現何種資訊？", "o": ["Next hop address", "MAC address", "Network address", "Metrics"], "e": "路由表記錄目的網路位址、下一站（Next hop）位址、介面與成本（Metrics）等第 3 層資訊；MAC 位址屬第 2 層，記錄在交換器的 MAC 表或 ARP 表中。"}, {"n": 110, "code": "1-110", "ans": "1", "multi": false, "q": "「路由器將鏈結狀態（link state）的資訊，送往相鄰路由器」，該遞送的過程稱為？", "o": ["flooding", "forwarding", "informing", "converging"], "e": "鏈結狀態路由協定（如 OSPF）會把 LSA（鏈結狀態通告）以氾濫（flooding）方式傳給所有相鄰路由器，讓全網路由器都得到相同的拓樸資訊。"}, {"n": 111, "code": "1-111", "ans": "1", "multi": false, "q": "電腦 A 經由乙太網路直接送一個 IP 封包給電腦 B，但電腦 B 的網路卡當掉無法運作，則該封包最有可能的下場為何？", "o": ["封包內部產生逾時（time out）錯誤，自行銷毀", "由電腦負責回收銷毀", "由網路內監控電腦（monitor）回收銷毀", "消失在末端的終端機（terminator）上"], "e": "IP 封包有 TTL（存活時間），沒有被接收或超過存活時限就會被丟棄，屬逾時自行銷毀。"}, {"n": 112, "code": "1-112", "ans": "3", "multi": false, "q": "下列哪一個指令可以告訴使用者 Ethernet 相關的通訊統計資訊？", "o": ["ipconfig", "tracert", "netstat", "ping"], "e": "netstat 顯示網路連線狀態與通訊統計（如 netstat -e 顯示乙太網路收送統計）。ipconfig 看 IP 設定；tracert 追蹤路徑；ping 測試連通。"}, {"n": 113, "code": "1-113", "ans": "3", "multi": false, "q": "某電腦的主記憶體為 640KB，但可執行 2MB 的程式，請問該電腦可能使用下列何者？", "o": ["快取記憶體", "關聯記憶體", "虛擬記憶體", "隨機存取記憶體"], "e": "程式大於實體記憶體仍可執行，是因為虛擬記憶體把硬碟空間當作記憶體延伸使用。"}, {"n": 114, "code": "1-114", "ans": "3", "multi": false, "q": "下列何者不是密碼學原理最主要的應用？", "o": ["數位簽章", "數位浮水印", "藍芽（Bluetooth）技術", "公開金鑰基礎建設（PKI）"], "e": "數位簽章、數位浮水印、PKI 都是以密碼學為核心的應用；藍牙是短距離無線傳輸技術，不是密碼學主要應用。"}, {"n": 115, "code": "1-115", "ans": "4", "multi": false, "q": "下列何者不是網頁上所使用的語言？", "o": ["HTML", "Java Script", "DHTML", "UML（Unified Modeling Language）"], "e": "UML 是物件導向系統分析與設計用的「塑模語言」（畫類別圖、使用案例圖等），不是網頁語言。"}, {"n": 116, "code": "1-116", "ans": "4", "multi": false, "q": "下列何者不是資料結構（Data Structure）所探討的課題？", "o": ["堆疊（Stack）", "排序（Sorting）", "搜尋（Searching）", "多工（Multitasking）"], "e": "資料結構探討堆疊、佇列、樹、圖及排序、搜尋等；多工是作業系統的課題。"}, {"n": 117, "code": "1-117", "ans": "1", "multi": false, "q": "資訊系統的轉換方式中，讓舊系統與新系統一起運作，直到新系統證明可靠了才停止舊系統的運作，是下列哪一種轉換方式？", "o": ["平行式（parallel）轉換", "直接式（direct）轉換", "引導式（pilot）轉換", "階段式（phased）轉換"], "e": "平行轉換新舊系統同時運作，最安全但成本最高。直接轉換立即換新；引導式先在一個單位試行；階段式按功能/模組分批導入。"}, {"n": 118, "code": "1-118", "ans": "3", "multi": false, "q": "范紐曼機（von Neumann Machine）CPU 的運作可以區分成四個階段，下列何者錯誤？", "o": ["提取（Fetch）", "解碼（Decode）", "重載（Reload）", "寫回（Writeback）"], "e": "指令執行四階段：提取（Fetch）→ 解碼（Decode）→ 執行（Execute）→ 寫回（Writeback）。沒有「重載」。"}, {"n": 119, "code": "1-119", "ans": "4", "multi": false, "q": "關於「分散式電腦系統（Distributed Computer System）」之敘述，下列何者錯誤？", "o": ["將多部獨立電腦以網路匯集而成", "使用者感覺上就像是在使用一部電腦", "具有優於大型主機（Mainframe）的延展性（Scalability）", "建置成本通常遠高於大型主機（Mainframe）"], "e": "分散式系統用多部一般電腦透過網路合作，成本通常比大型主機低，並可逐步擴充，「成本遠高於大型主機」錯。"}, {"n": 120, "code": "1-120", "ans": "2", "multi": false, "q": "關於「藍芽（Bluetooth）技術」之敘述，下列何者錯誤？", "o": ["是一種可以應用在電腦、行動電話、家電用品的無線傳輸技術", "傳輸距離有 50 公尺與 500 公尺兩種", "可以與其他藍芽裝置進行一對多連接", "傳輸無方向性"], "e": "藍牙是短距離無線技術，常見傳輸距離約 10 公尺（Class 2）或 100 公尺（Class 1），沒有 500 公尺，(2) 錯。"}, {"n": 121, "code": "1-121", "ans": "3", "multi": false, "q": "關於「藍光光碟（Blu-ray Disc，簡稱 BD）」之敘述，下列何者錯誤？", "o": ["BD 採用波長 405 奈米的藍色雷射光束來做讀寫", "相對於 DVD，BD 的容量大幅提升，將可以容納畫質更高、音效更佳的影音內容", "DVD 燒錄機可以進行 BD 的燒錄", "BD 採用 CDFS 檔案系統"], "e": "DVD 燒錄機使用 650 奈米紅光雷射，無法讀寫需要 405 奈米藍光雷射的 BD，故 (3) 錯（本題標準答案為 (3)）。"}, {"n": 122, "code": "1-122", "ans": "1", "multi": false, "q": "關於「DVD（Digital Versatile Disc）」之敘述，下列何者錯誤？", "o": ["DVD 採用波長 405 奈米的藍色雷射光束來做讀寫", "DVD-9 是單面雙層的 DVD 碟片，標稱容量 8.5GB", "DVD-RAM 是可以重覆寫入的 DVD 碟片", "DVD 區域碼是影音產品經銷商與代理商的權益保障機制"], "e": "DVD 使用約 650 奈米的紅色雷射；405 奈米藍光是藍光光碟（BD）。"}, {"n": 123, "code": "1-123", "ans": "4", "multi": false, "q": "關於「關聯代數（Relational Algebra）」之敘述，下列何者錯誤？", "o": ["關聯代數的運算元（Operand）皆為關聯（Relation）", "關聯代數的計算結果皆為關聯", "和關聯代數具備相同能力的查詢語言可以宣稱具有關聯完整性（Relationally-Complete）", "關聯式計算（Relational Calculus）不具有關聯完整性"], "e": "關聯式計算與關聯代數的表達能力相同，同樣具有關聯完整性，(4) 錯。關聯完整性就是以關聯代數的能力為衡量基準。"}, {"n": 124, "code": "1-124", "ans": "1", "multi": false, "q": "關聯代數當中，下列哪一個運算子可以從關聯當中挑選出符合條件的值組（Tuple）？", "o": ["選擇（Selection）", "投影（Projection）", "合併（Join）", "除法（Divide）"], "e": "選擇（σ）依條件挑出「列」（值組 Tuple），相當於 SQL 的 WHERE；投影（π）挑出「欄」（屬性）。"}, {"n": 125, "code": "1-125", "ans": "2", "multi": false, "q": "關聯代數當中，下列哪一個運算子可以從關聯當中挑選出特定的屬性（Attribute）？", "o": ["選擇（Selection）", "投影（Projection）", "合併（Join）", "除法（Divide）"], "e": "投影（π）挑選特定「欄位/屬性」，相當於 SQL 的 SELECT 欄位清單。"}, {"n": 126, "code": "1-126", "ans": "1", "multi": false, "q": "資料庫的每個交易（Transaction）都應該具備四項特性，下列何者錯誤？", "o": ["自動性（Automaticity）", "一致性（Consistency）", "隔離性（Isolation）", "持續性（Durability）"], "e": "交易的 ACID 特性：A 是不可分割性（Atomicity，原子性，全部完成或全部不做），不是 Automaticity；C 一致性、I 隔離性、D 持久性。"}, {"n": 127, "code": "1-127", "ans": "3", "multi": false, "q": "關於「資料庫程序（Database Procedure）」之敘述，下列何者錯誤？", "o": ["觸發（Trigger）是事件驅動的資料庫程序，當指定的事件發生時會自動執行", "需要處理的資料量很大、而資料庫伺服器的負載很小時，是考慮使用資料庫程序的適當時機", "Microsoft SQL Server 純量函數（Scalar User-Defined Function）的回傳值可以是 TABLE 型態", "Microsoft SQL Server 純量函數的回傳值可以是 INT 型態"], "e": "純量函數只回傳「單一值」（如 INT、VARCHAR）；回傳 TABLE 的是資料表值函數（Table-Valued Function），故 (3) 錯。"}, {"n": 128, "code": "1-128", "ans": "4", "multi": false, "q": "下列何者不是「資料倉儲（Data Warehouse）」的主要特性？", "o": ["主題導向", "整合性", "時間變動性", "揮發性（Volatile）"], "e": "資料倉儲四大特性：主題導向、整合性、時間變動性、「非揮發性」（Non-volatile，資料載入後不常修改刪除）。"}, {"n": 129, "code": "1-129", "ans": "4", "multi": false, "q": "下列何者不是「資料倉儲」的主要資料模型（Data Model）？", "o": ["星狀模型（Star Schema）", "雪花狀模型（Snowflake Schema）", "星座模型（Constellation Schema）", "階層模型（Hierarchical Schema）"], "e": "資料倉儲的維度模型有星狀、雪花狀、星座（事實星座）模型；階層模型是早期的資料庫模型。"}, {"n": 130, "code": "1-130", "ans": "1", "multi": false, "q": "關於「資料探勘（Data-Mining）」之敘述，下列何者錯誤？", "o": ["通常直接對交易型資料庫（Transactional Database）進行資料探勘", "統計方法、人工智慧技術、資料庫技術是核心基礎", "關聯法則分析可以用來瞭解哪些商品經常被一起購買", "序列探索可以依據客戶的訂購歷史來預測客戶即將購買的商品"], "e": "資料探勘通常在經過整合、清理的資料倉儲上進行，避免影響線上交易系統效能，「直接對交易型資料庫」錯。"}, {"n": 131, "code": "1-131", "ans": "2", "multi": false, "q": "針對題目所附之實體關聯圖（ER Diagram：學生、家長、成績、課程、項目及得分、項目及配分）所規劃之資料庫，下列敘述何者不正確？", "o": ["資料庫有六個資料表", "資料庫有三個關係（Relationship）", "家長資料表有五個欄位", "課程資料表與成績資料表之間的關係是一種一對多的關係"], "e": "圖中有 6 個實體（矩形＝6 個資料表），菱形代表關係：學生-成績、學生-家長、成績-課程、成績-項目及得分、課程-項目及配分、項目及配分-項目及得分，共 6 個關係，不是 3 個，故 (2) 錯。家長有手機、電話、地址、E-Mail、學號 5 個欄位。"}, {"n": 132, "code": "1-132", "ans": "1", "multi": false, "q": "撰寫 SQL 的 DELETE 陳述式進行資料刪除作業時，如果沒有加上適當的 WHERE 子句將會造成何種結果？", "o": ["目標資料表的所有資料均被刪除", "只有第一筆資料被刪除", "只有最後一筆資料被刪除", "只有前五筆資料被刪除"], "e": "DELETE FROM 表格; 沒有 WHERE 條件時，代表所有資料列都符合，整張表的資料都會被刪除（結構仍保留）。"}, {"n": 133, "code": "1-133", "ans": "4", "multi": false, "q": "以客戶資料表中的「住址」欄位保存完整住址。若希望撰寫非巢狀 SELECT 查詢居住在「南投縣」或「台中市」之客戶資料，下列敘述何者不正確？", "o": ["SELECT 陳述式當中應該加上 WHERE 子句", "WHERE 子句當中應該使用 LIKE 運算子", "WHERE 子句當中應該出現 OR 運算子", "WHERE 子句當中應該使用 = 運算子"], "e": "住址是完整地址，只能比對「部分字串」，要寫 WHERE 住址 LIKE '南投縣%' OR 住址 LIKE '台中市%'。用 = 必須完全相同，查不到，故 (4) 不正確。"}, {"n": 134, "code": "1-134", "ans": "1", "multi": false, "q": "針對 SQL 陳述式「SELECT * FROM A LEFT OUTER JOIN B ON A.pk=B.pk」的查詢結果，下列敘述何者正確？", "o": ["A 資料表的每一筆資料在查詢結果中，最少會出現一次", "查詢結果的資料筆數等於 A 與 B 筆數之和", "查詢結果的資料筆數等於 A 與 B 筆數之積", "查詢結果的欄位數目與 A 資料表相同"], "e": "左外部合併會保留左表 A 的所有資料，B 沒有對應資料時補 NULL；若 B 有多筆對應，A 的該筆會出現多次，所以「最少一次」。欄位數為 A＋B 欄位數。"}, {"n": 135, "code": "1-135", "ans": "1", "multi": false, "q": "A 表有 N 筆資料、X 個欄位；B 表有 M 筆資料、Y 個欄位，「SELECT * FROM A CROSS JOIN B」查詢結果的資料筆數為？", "o": ["N×M", "X×Y", "N＋M", "X＋Y"], "e": "CROSS JOIN 是笛卡兒積，A 的每一筆都與 B 的每一筆配對，筆數＝N×M。"}, {"n": 136, "code": "1-136", "ans": "4", "multi": false, "q": "承上題，「SELECT * FROM A CROSS JOIN B」查詢結果的欄位數目為？", "o": ["N×M", "X×Y", "N＋M", "X＋Y"], "e": "合併後每一列包含 A 的所有欄位加上 B 的所有欄位，欄位數＝X＋Y（筆數相乘、欄位相加）。"}, {"n": 137, "code": "1-137", "ans": "1", "multi": false, "q": "小明家裡有十台電腦，但電信公司只配給了三個 IP，如果希望這十台電腦能夠同時間上網，小明還需要使用何種網路設備？", "o": ["寬頻分享器（Internet Broadband Router）", "集線器（Hub）", "路由器（Router）", "MOD 機上盒"], "e": "寬頻分享器具 NAT（網路位址轉換）與 DHCP 功能，內部電腦使用私有 IP，經由一個公有 IP 共同上網。Hub 只是集線，無法分享 IP。"}, {"n": 138, "code": "1-138", "ans": "3", "multi": false, "q": "小明希望在家裡架設無線上網環境，下列敘述何者不正確？", "o": ["沒有內建無線上網功能的電腦應該添加無線網路卡", "應該在適當地點配置無線基地台（Access Point）", "無線基地台之間無法做無線連接", "印表機可以透過無線網路來遠端使用"], "e": "無線基地台之間可以透過 WDS（無線分散系統）以橋接或中繼方式無線連接，(3) 錯。"}, {"n": 139, "code": "1-139", "ans": "4", "multi": false, "q": "小明家裡的電腦突然無法上網，下列敘述何者最不可能是問題所在？", "o": ["ADSL Modem 故障", "IP 分享器故障", "電信公司的機房設備故障", "MOD 機上盒故障"], "e": "Modem、分享器、電信機房都在上網路徑上；MOD 機上盒只負責電視節目，不在電腦上網的路徑上。"}, {"n": 140, "code": "1-140", "ans": "4", "multi": false, "q": "小明無法從學校使用行動電話連結家裡的資料庫，下列敘述何者最不可能是問題所在？", "o": ["行動電話無法順利連結學校的無線基地台", "行動電話從學校配得的 IP 被家裡的寬頻分享器封鎖", "資料封包被學校的防火牆過濾掉", "家裡的 FTP Server 無法正常運作"], "e": "連結的是「資料庫」伺服器，與 FTP Server 是否運作無關；其他三項都在連線路徑上，可能造成失敗。"}, {"n": 141, "code": "1-141", "ans": "2", "multi": false, "q": "關於「無線分散系統（WDS）」之敘述，下列何者錯誤？", "o": ["區分成無線橋接（Bridge）與無線中繼（Repeater）兩種應用", "相互連結的無線基地台應該將 SSID 設為不同", "相互連結的無線基地台應該使用相同的無線網路頻道", "相互連結的無線基地台應該將安全機制設為相同"], "e": "WDS 互連的 AP 要使用相同頻道、相同加密設定，通常也設相同 SSID 以便漫遊；「SSID 應設為不同」錯。"}, {"n": 142, "code": "1-142", "ans": "4", "multi": false, "q": "在 W3C（World Wide Web Consortium）所制定的標準中，未包含下列何者？", "o": ["超文字標籤語言（HTML）", "文件物件模型（DOM）", "JavaScript", "結構化查詢語言（SQL）"], "e": "W3C 制定網頁相關標準（HTML、CSS、DOM、XML 等）。SQL 是資料庫查詢語言，由 ANSI/ISO 制定，不是 W3C 標準。"}, {"n": 143, "code": "1-143", "ans": "3", "multi": false, "q": "主要功能為電子書閱讀的設備為何？", "o": ["iPod", "iPhone", "iPad", "IEEE"], "e": "依題庫答案為 iPad：平板電腦螢幕大，適合閱讀電子書。iPod 是音樂播放器、iPhone 是手機、IEEE 是電機電子工程師學會。"}, {"n": 144, "code": "1-144", "ans": "4", "multi": false, "q": "一個單層的藍光光碟（Blu-ray Disc）容量約為？", "o": ["800MB", "4.7GB", "10GB", "25GB"], "e": "藍光光碟單層 25GB、雙層 50GB。CD 約 700～800MB；DVD 單面單層 4.7GB。"}, {"n": 145, "code": "1-145", "ans": "2", "multi": false, "q": "在高速公路收費站以攝影機拍攝車牌影像，再經由電腦軟體處理，將車牌影像轉換為車牌文字，此為何種應用？", "o": ["影像處理", "樣式識別（Pattern Recognition）", "人工智慧", "電腦圖學"], "e": "從影像中辨識出字元、圖樣並轉成文字，屬於樣式（圖形）識別，如 OCR、車牌辨識、指紋辨識。"}, {"n": 146, "code": "1-146", "ans": "3", "multi": false, "q": "CAI 是下列何者的英文縮寫？", "o": ["電腦輔助設計", "電腦輔助製造", "電腦輔助教學", "電腦軟體能力成熟度"], "e": "CAI＝Computer Assisted Instruction（電腦輔助教學）。CAD＝輔助設計、CAM＝輔助製造、CMM＝能力成熟度模型。"}, {"n": 147, "code": "1-147", "ans": "3", "multi": false, "q": "一張 4 吋×6 吋大小、300dpi 全彩照片檔案，考量不壓縮情形，約佔用多少儲存空間？", "o": ["2.5KB", "350KB", "6.5MB", "20MB"], "e": "像素：(4×300)×(6×300)=1200×1800=2,160,000 點；全彩每點 24 位元＝3 Bytes，2,160,000×3＝6,480,000 Bytes ≈ 6.5MB。"}, {"n": 148, "code": "1-148", "ans": "3", "multi": false, "q": "由黑到白間不同明亮度的顏色所組成的電腦影像圖檔屬於？", "o": ["全彩圖", "點陣圖", "灰階圖", "黑白圖"], "e": "灰階圖以不同亮度的灰色（常見 256 階）表現影像；黑白圖（單色圖）每點只有黑或白兩種。"}, {"n": 149, "code": "1-149", "ans": "1", "multi": false, "q": "Dreamweaver 屬於哪一類軟體？", "o": ["網頁設計與編輯軟體", "影像處理與編輯軟體", "聲音與影像播放軟體", "簡報編輯與播放軟體"], "e": "Adobe Dreamweaver 是網頁設計與編輯工具，提供所見即所得與程式碼編輯。"}, {"n": 150, "code": "1-150", "ans": "2", "multi": false, "q": "下列何者所開發之程式，需要虛擬機器（Virtual Machine）才能正常執行？", "o": ["C++", "Java", "Assembly", "COBOL"], "e": "Java 編譯成 Bytecode，必須在 Java 虛擬機器（JVM）上執行，因此能跨平台。"}, {"n": 151, "code": "1-151", "ans": "3", "multi": false, "q": "下列何者不屬於高階程式語言？", "o": ["C++", "Java", "Assembly", "C#"], "e": "Assembly（組合語言）是以助憶符號對應機器指令的低階語言，與硬體相關；C++、Java、C# 為高階語言。"}, {"n": 152, "code": "1-152", "ans": "4", "multi": false, "q": "下列何者不是音訊檔案格式？", "o": ["wav", "mp3", "wma", "cpp"], "e": ".cpp 是 C++ 原始程式檔；wav、mp3、wma 都是音訊格式。"}, {"n": 153, "code": "1-153", "ans": "4", "multi": false, "q": "關於「藍光光碟」之敘述，下列何者錯誤？", "o": ["英文名稱是 Blu-ray Disc，簡稱 BD", "可用於大量或高畫質影像的儲存", "因為使用藍色雷射光進行讀寫，因此稱為藍光光碟", "容量至少 8.5GB"], "e": "藍光光碟單層就有 25GB；8.5GB 是 DVD 單面雙層（DVD-9）的容量，「至少 8.5GB」的描述錯誤。"}, {"n": 154, "code": "1-154", "ans": "4", "multi": false, "q": "關於「萬國碼（Unicode）」之敘述，下列何者錯誤？", "o": ["使用 32 位元來代表每個字母、數字或符號", "與 ASCII 編碼相容", "國際字元符號編碼標準之一", "可以容納無限多個字元符號"], "e": "Unicode 的編碼空間是有限的（目前定義到 U+10FFFF，約 111 萬個碼位），不是無限多。"}, {"n": 155, "code": "1-155", "ans": "3", "multi": false, "q": "下列何種設備具有「儲存指令以協助電腦啟動」的功能？", "o": ["螢幕", "中央處理器（CPU）", "唯讀記憶體（ROM）", "隨機存取記憶體（RAM）"], "e": "ROM 斷電資料不消失，存放 BIOS/UEFI 開機程式，負責開機自我測試（POST）與載入作業系統。"}, {"n": 156, "code": "1-156", "ans": "4", "multi": false, "q": "赫茲（Hertz，Hz）是用來標示螢幕【 】的單位？", "o": ["大小", "解析度", "可顯示色彩數目", "畫面更新率（Refresh Rate）"], "e": "畫面更新率是每秒重繪畫面的次數，單位 Hz（如 60Hz、144Hz）。大小用吋、解析度用像素。"}, {"n": 157, "code": "1-157", "ans": "2", "multi": false, "q": "「互動式軟體」的「互動」是指？", "o": ["電腦軟體與電腦軟體間的互動", "使用者與電腦軟體間的互動", "使用者與使用者間的互動", "電腦硬體與電腦軟體間的互動"], "e": "互動式軟體會依使用者的操作或輸入即時給予回應，指使用者與軟體之間的互動。"}, {"n": 158, "code": "1-158", "ans": "2", "multi": false, "q": "關於「點陣圖」之敘述，下列何者錯誤？", "o": ["與向量圖比較，需較多的記憶體容量", "放大縮小不會失真", "由一群像素點所組成", "可以是黑白圖，也可以是彩色圖"], "e": "點陣圖由像素組成，放大後會出現鋸齒（失真）；放大縮小不失真的是向量圖。"}, {"n": 159, "code": "1-159", "ans": "4", "multi": false, "q": "一個十進位固定點數表示法，總位數為 7、小數位數為 3，下列哪一個數值無法以此法精確表示？", "o": ["12.345", "123.456", "1234.567", "12345.67"], "e": "總 7 位、小數 3 位 → 整數部分最多 4 位（最大 9999.999）。12345.67 整數有 5 位，超出範圍。"}, {"n": 160, "code": "1-160", "ans": "2", "multi": false, "q": "依照 IEEE 754 單倍精準數（1 位符號、8 位指數、23 位尾數），1640.625 的表示法應為？", "o": ["00000101000000000001001101000101", "01000100110011010001010000000000", "11000100110011010001010000000000", "10000101000000000001001101000101"], "e": "1640＝11001101000₂，0.625＝0.101₂，合為 11001101000.101＝1.1001101000101×2^10。符號 0（正數）；指數 10＋127（偏移值）＝137＝10001001；尾數取小數點後 1001101000101 再補 0 到 23 位。組合：0 10001001 10011010001010000000000，即 (2)。(3) 符號位為 1，是負數。"}, {"n": 161, "code": "1-161", "ans": "1", "multi": false, "q": "下列何者將網站與使用者的立場對調，讓使用者從資訊搜尋者變成資訊接受者，當網站有資訊更新時，會主動寄發最新資訊給使用者？", "o": ["RSS", "Blog", "News", "BBS"], "e": "RSS 訂閱讓使用者不必逐站查詢，網站更新時，閱讀器自動取得最新內容。"}, {"n": 162, "code": "1-162", "ans": "4", "multi": false, "q": "P(x) 的陳述為「x=x²」，其定義域是所有的整數，則下列邏輯何者錯誤？", "o": ["P(0) 為真", "P(1) 為真", "∃xP(x) 為真，表示存在有一個 x 滿足 P(x) 陳述", "∀xP(x) 為真，表示所有的 x 滿足 P(x) 陳述"], "e": "x=x² 只有 x=0 或 1 成立，所以 P(0)、P(1) 為真，∃xP(x)（存在某個 x）為真。但 x=2 時 2≠4，並非所有整數都滿足，∀xP(x)（對所有 x）為假，故 (4) 錯。"}, {"n": 163, "code": "1-163", "ans": "3", "multi": false, "q": "邏輯假設：(a) 假設今天下午我們去游泳，就表示天氣放晴。(b) 假使今天下午我們沒去游泳，我們會去泛舟。(c) 假使今天下午我們去泛舟，會在日落前回家。已知：「今天下午不是晴天，且比昨天下午還冷」，則我們無法確定的結論是？", "o": ["我們會去泛舟", "我們會在日落前回家", "我們會去游泳", "今天下午比昨天下午還冷"], "e": "由 (a) 游泳→晴天，取逆否命題：不是晴天→沒去游泳；由 (b) 沒游泳→泛舟；由 (c) 泛舟→日落前回家；「比較冷」是已知。所以 (1)(2)(4) 都能推得，「我們會去游泳」無法成立。"}, {"n": 164, "code": "1-164", "ans": "2", "multi": false, "q": "在 8 個位元的所有組合中，有幾種組合是「從 1 開始」或是「以 00 結尾」？", "o": ["120", "160", "192", "200"], "e": "用排容原理：從 1 開始：剩 7 位任意＝2^7＝128；以 00 結尾：剩 6 位＝2^6＝64；兩者皆是：剩 5 位＝2^5＝32。128＋64－32＝160。"}, {"n": 165, "code": "1-165", "ans": "4", "multi": false, "q": "「有效碼」由 0 到 9 的數字組成，必須包含偶數個 0（例如 0204 有效，0928 無效）。下列何者不正確？", "o": ["0-9 共有 9 個有效碼", "00-99 共有 82 個有效碼", "000-999 共有 756 個有效碼", "0000-9999 共有 7050 個有效碼"], "e": "n 位數中 0 的個數為偶數的組合數＝(10^n＋8^n)/2。n=1：(10＋8)/2＝9；n=2：(100＋64)/2＝82；n=3：(1000＋512)/2＝756；n=4：(10000＋4096)/2＝7048，不是 7050，故 (4) 錯。"}, {"n": 166, "code": "1-166", "ans": "1", "multi": false, "q": "IPv4 中 Class A 類別共擁有幾個可供實際配置的 IP 位址？", "o": ["2,130,706,178", "16,777,214", "2,158,576,178", "12,316,214"], "e": "Class A 第一個位元組為網路位址，每個網路的主機位址有 24 位元，扣掉全 0（網路位址）與全 1（廣播）後為 2^24－2＝16,777,214。題庫以 127 個網路計算：127×16,777,214＝2,130,706,178。"}, {"n": 167, "code": "1-167", "ans": "3", "multi": false, "q": "IPv4 中 Class B 類別共擁有幾個可供實際配置的 IP 位址？", "o": ["16384×65536", "16386×65536", "16384×65534", "16386×65534"], "e": "Class B 開頭為 10，網路位址剩 14 位元＝2^14＝16384 個網路；主機位址 16 位元，扣掉全 0、全 1 為 2^16－2＝65534。共 16384×65534。"}, {"n": 168, "code": "1-168", "ans": "2", "multi": false, "q": "小明班上共有 100 位同學，下列何者保證正確？", "o": ["至少有五位同學是一月份生日", "至少有九位同學是同一個月份生日", "至少有兩位同學同一天生日", "不可能全班同學都是同一天生日"], "e": "鴿籠原理：100 人分到 12 個月，100÷12＝8 餘 4，所以至少有一個月有 ⌈100/12⌉＝9 人。(3) 一年有 365（366）天 > 100 人，不保證同天；(1) 一月可能沒人。"}, {"n": 169, "code": "1-169", "ans": "3", "multi": false, "q": "邏輯式 (A+B)' 可用下列哪個邏輯式取代？", "o": ["AB", "A'+B", "A'B'", "B+A'"], "e": "狄摩根定理：(A+B)'＝A'·B'；(AB)'＝A'+B'。"}, {"n": 170, "code": "1-170", "ans": "4", "multi": false, "q": "1TB 的記憶容量等於多少 Bytes？", "o": ["2 的 50 次方", "2 的 20 次方", "2 的 30 次方", "2 的 40 次方"], "e": "1KB＝2^10、1MB＝2^20、1GB＝2^30、1TB＝2^40、1PB＝2^50 Bytes。"}, {"n": 171, "code": "1-171", "ans": "2", "multi": false, "q": "十六進位數 (AB) 和 (99) 作 OR 運算後，其十六進位數之值為何？", "o": ["AB", "BB", "FB", "BF"], "e": "AB＝1010 1011，99＝1001 1001，逐位元 OR（有 1 即 1）：1011 1011＝BB。"}, {"n": 172, "code": "1-172", "ans": "2", "multi": false, "q": "二進位數字「11100101」和「01010101」做 AND 運算後，其十六進位數之值為何？", "o": ["A5", "45", "F5", "55"], "e": "逐位元 AND（兩者皆 1 才 1）：11100101 AND 01010101＝01000101＝0100 0101＝45₁₆。"}, {"n": 173, "code": "1-173", "ans": "1", "multi": false, "q": "二進位數的「00111011」和「10100001」做 XOR 運算後，其十六進位數之值為何？", "o": ["9A", "BF", "30", "B7"], "e": "XOR（相同為 0、不同為 1）：00111011 XOR 10100001＝10011010＝1001 1010＝9A₁₆。"}, {"n": 174, "code": "1-174", "ans": "1", "multi": false, "q": "假設電腦的主記憶體有 129KB，則記憶體位址暫存器（MAR）中有？", "o": ["18 位元", "15 位元", "16 位元", "17 位元"], "e": "2^17＝128K 不夠存放 129K 個位址，必須用 2^18＝256K，所以 MAR 需要 18 位元。"}, {"n": 175, "code": "1-175", "ans": "3", "multi": false, "q": "若 CPU 可直接存取 1G Bytes 的記憶體，則最少需要幾條位址線？", "o": ["10", "20", "30", "40"], "e": "1G＝2^30，需要 30 條位址線。"}, {"n": 176, "code": "1-176", "ans": "1", "multi": false, "q": "英文字母「F」的 ASCII 值以十進位表示是 70，其在電腦內被儲存方式是？", "o": ["01000110", "01100010", "01001100", "10001010"], "e": "70＝64＋4＋2＝2^6＋2^2＋2^1 → 01000110。"}, {"n": 177, "code": "1-177", "ans": "3", "multi": false, "q": "「193.170.1.11」是屬於哪個 Class 的 IP？", "o": ["A", "B", "C", "D"], "e": "依第一個數字判斷：A 1～126、B 128～191、C 192～223、D 224～239（群播）。193 屬 Class C。"}, {"n": 178, "code": "1-178", "ans": "1", "multi": false, "q": "「十六進位數的 CF.4」換算成十進位數為何？", "o": ["207.25", "281.4", "193.25", "201.4"], "e": "C×16＋F＝12×16＋15＝207；小數 .4＝4×16^-1＝4/16＝0.25。合計 207.25。"}, {"n": 179, "code": "1-179", "ans": "1", "multi": false, "q": "若以 19200bps 的傳輸速度傳送 6000 個 Big-5 碼中文字，則需花多少時間？", "o": ["5 秒", "10 秒", "0.3125 秒", "0.625 秒"], "e": "Big-5 一個中文字 2 Bytes＝16 位元。6000×16＝96000 bits，96000÷19200＝5 秒。"}, {"n": 180, "code": "1-180", "ans": "4", "multi": false, "q": "下列四組專有名詞對照，何者錯誤？", "o": ["電子郵件：E-Mail", "區域網路：LAN", "辦公室自動化：OA", "都會型網路：WIMAX"], "e": "都會型網路是 MAN（Metropolitan Area Network）。WiMAX 是一種無線寬頻存取技術（可用於建構無線都會網路），不是都會型網路的名稱。"}, {"n": 181, "code": "1-181", "ans": "3", "multi": false, "q": "下列為布林代數的基本關係，何者錯誤？", "o": ["X+1=1", "X+X'=1", "(X+Y)'=X'Y+XY'", "(X')'=X"], "e": "依狄摩根定理 (X+Y)'＝X'Y'。X'Y+XY' 是 X⊕Y（XOR），故 (3) 錯。"}, {"n": 182, "code": "1-182", "ans": "3", "multi": false, "q": "「十進位數之 0.875」以二進位數表示時應為何？", "o": ["0.11011", "0.0111", "0.111", "0.1101"], "e": "小數乘 2 取整數：0.875×2＝1.75→1；0.75×2＝1.5→1；0.5×2＝1.0→1。得 0.111₂（0.5＋0.25＋0.125＝0.875）。"}, {"n": 183, "code": "1-183", "ans": "4", "multi": false, "q": "若採用奇同位（Odd Parity）檢查法傳輸資料，下列接收端所收到的各筆資料中，何者會被判定在傳輸時有錯誤發生？", "o": ["11100011", "10011011", "10000110", "10101010"], "e": "奇同位要求資料中 1 的個數為奇數。(1) 5 個、(2) 5 個、(3) 3 個都是奇數；(4) 10101010 有 4 個 1，是偶數，判定有錯。"}, {"n": 184, "code": "1-184", "ans": "4", "multi": false, "q": "若有一大小為 800×600 之圖片，每個像素以 3 個 Bytes 的全彩影像儲存於電腦中，則此圖片約需佔用多少儲存空間？", "o": ["1.57MBytes", "1.17MBytes", "1.77MBytes", "1.37MBytes"], "e": "800×600×3＝1,440,000 Bytes；÷1024÷1024 ≈ 1.37MB。"}, {"n": 185, "code": "1-185", "ans": "3", "multi": false, "q": "某公司欲將內部電腦以 30 部為單位分割成不同之子網域，試問其內部電腦最小網路遮罩應該設為？", "o": ["255.255.255.128", "255.255.255.192", "255.255.255.224", "255.255.255.248"], "e": "每個子網要容納 30 台主機：主機位元 h 需滿足 2^h－2 ≥ 30 → h=5（32－2＝30）。32－5＝27 位網路位元，最後一組為 11100000＝224，遮罩 255.255.255.224（/27）。"}, {"n": 186, "code": "1-186", "ans": "1", "multi": false, "q": "二進位資料 10010100101001.11110101 若以十六進位表示，下列何者正確？", "o": ["2529.F5", "94A1.5F", "94A1.F5", "2529.5F"], "e": "整數部分由小數點往左每 4 位一組：10│0101│0010│1001 → 2 5 2 9；小數部分由小數點往右每 4 位一組：1111│0101 → F 5。得 2529.F5。"}, {"n": 187, "code": "1-187", "ans": "2", "multi": false, "q": "氣泡排序法是利用相鄰資料兩兩相比而完成排序，假設有六個整數資料要做排序，最少要做幾次相鄰資料相比較的工作？", "o": ["10", "15", "20", "25"], "e": "標準氣泡排序 n 筆資料要做 n－1 回合，比較次數為 (n－1)＋(n－2)＋…＋1＝n(n－1)/2。n=6：5＋4＋3＋2＋1＝15 次。"}, {"n": 188, "code": "1-188", "ans": "1", "multi": false, "q": "目前所使用的 IPv6 的長度是多少 bits？", "o": ["128", "64", "32", "256"], "e": "IPv6 位址長度 128 位元，以 8 組 16 進位表示（如 2001:db8::1）；IPv4 為 32 位元。"}, {"n": 189, "code": "1-189", "ans": "4", "multi": false, "q": "有一個 Class C 網域，今欲切成 32 個子網路，則其網路遮罩應為？", "o": ["255.255.255.0", "255.255.255.128", "255.255.255.192", "255.255.255.248"], "e": "32＝2^5，需向主機位元借 5 位當子網路位元：最後一組 11111000＝248，遮罩 255.255.255.248（/29）。"}, {"n": 190, "code": "1-190", "ans": "3", "multi": false, "q": "假設 X=1001，Y=0101，下列何者錯誤？", "o": ["Y+XY=0101", "XY'+Y=1101", "(X+Y)X'=0110", "X'Y+XY'=1100"], "e": "X'=0110、Y'=1010。(3)：X+Y=1101，再與 X'=0110 做 AND 得 0100，不是 0110，錯誤。驗證其他：(1) XY=0001，Y+XY=0101；(2) XY'=1000，+Y=1101；(4) X'Y=0100，XY'=1000，OR 得 1100。"}, {"n": 191, "code": "1-191", "ans": "4", "multi": false, "q": "已存在公式「Y(n+1)＝(7Y(n)＋1) mod 6」，假設 Y0=3，下列何者錯誤？", "o": ["Y2=5", "Y3=0", "Y1=4", "經此公式，Yn 永遠不會等於 2"], "e": "逐步計算：Y1＝(21＋1) mod 6＝4；Y2＝(28＋1) mod 6＝5；Y3＝(35＋1) mod 6＝0；Y4＝1；Y5＝(7＋1) mod 6＝2。Y5 就等於 2，所以 (4) 錯。"}, {"n": 192, "code": "1-192", "ans": "2", "multi": false, "q": "在 8 個位元的所有組合中，有幾種組合是「從 1 開始」且「以 00 結尾」？", "o": ["16", "32", "64", "128"], "e": "第 1 位固定 1、最後 2 位固定 00，中間 5 位任意：2^5＝32。"}, {"n": 193, "code": "1-193", "ans": "3", "multi": false, "q": "下列哪一個數字使用 IEEE754 浮點表示法儲存時會有誤差？", "o": ["0.5", "0.625", "0.815", "0.5625"], "e": "0.5＝0.1₂、0.625＝0.101₂、0.5625＝0.1001₂ 都是 2 的負次方之和，可精確表示。0.815 轉成二進位是無限位數，只能取近似值，會有誤差。"}, {"n": 194, "code": "1-194", "ans": "2", "multi": false, "q": "處理大數據（Big Data）會使用到資料計量單位 PB。1PB 約等於多少 GB？", "o": ["1,000", "1,000,000", "1,000,000,000", "1,000,000,000,000"], "e": "GB→TB→PB 每級約 1000 倍，1PB＝1000TB＝1,000,000GB（以 2 進位算為 2^20＝1,048,576GB）。"}, {"n": 195, "code": "1-195", "ans": "1", "multi": false, "q": "EB、PB、TB 及 ZB 是大數據經常使用的資料計量單位。這些計量單位之間的大小排列，下列何者正確？", "o": ["ZB＞EB＞PB＞TB", "PB＞EB＞ZB＞TB", "ZB＞TB＞PB＞EB", "TB＞EB＞PB＞ZB"], "e": "由小到大：KB＜MB＜GB＜TB＜PB＜EB＜ZB＜YB（口訣：K M G T P E Z Y）。"}, {"n": 196, "code": "1-196", "ans": "1", "multi": false, "q": "大數據增長的挑戰和機遇有三個方向，合稱 3Vs。這三個方向為何？", "o": ["速度（velocity）、數量（volume）、多樣性（variety）", "多樣性、真實性（veracity）、可視性", "可視性、合法性、速度", "數量、真實性、合法性"], "e": "大數據 3V：Volume（資料量大）、Velocity（產生與處理速度快）、Variety（格式多樣）。後來有人再加上 Veracity（真實性）、Value（價值）成為 5V。"}, {"n": 197, "code": "1-197", "ans": "2", "multi": false, "q": "從大數據的觀點來看，關於資料價值之敘述，下列何者正確？", "o": ["政府公開的資料沒有價值", "臉書（Facebook）表情符號的點擊數是有價值", "資料擺久一定不會貶值", "資料廢氣（Data Exhaust）沒有價值"], "e": "大數據觀點認為各種行為資料（按讚、表情符號點擊）都能分析出使用者偏好，具有價值。政府開放資料與資料廢氣（使用過程產生的副產品資料）同樣有價值；資料也可能隨時間失去時效而貶值。"}, {"n": 198, "code": "1-198", "ans": "2", "multi": false, "q": "在 Hadoop 的 MapReduce 工具中使用外部執行檔來建立及執行 Map-Reduce 工作，需要使用下列哪一種技術？", "o": ["Virtual Machine", "Streaming", "Pipeline", "Filter"], "e": "Hadoop Streaming 讓使用者以任何可執行檔或腳本（Python、Shell 等）當作 Mapper 與 Reducer，透過標準輸入輸出傳遞資料。"}, {"n": 199, "code": "1-199", "ans": "4", "multi": false, "q": "關於 Hadoop 運作之敘述，下列何者正確？", "o": ["Hadoop 的 NameNode 會將整個資料，直接轉移到任意一個 DataNode 中", "如果資料檔案太大，Hadoop 就不會儲存資料備份", "與關聯式資料庫相比，Hadoop 輸出的結果比較精準", "資料檔案一旦建立，就不允許修改"], "e": "HDFS 採「一次寫入、多次讀取」（write-once-read-many）設計，檔案建立後不允許隨機修改。NameNode 只管理中繼資料，資料切成區塊分散存放於多個 DataNode，且預設保留 3 份副本。"}, {"n": 200, "code": "1-200", "ans": "4", "multi": false, "q": "有關 Apache Spark 之敘述，下列何者正確？", "o": ["Streaming 中的互動式命令列介面，可以降低橫向擴展資料探索的反應時間", "不支援 SQL", "Python 對即時資料串流的處理具有可擴充性及可容錯性等特點", "MLlib 是機器學習演算法和 GraphX 圖形處理演算法的高階函式庫"], "e": "Spark 生態系包含 Spark SQL（支援 SQL）、Spark Streaming（串流）、MLlib（機器學習函式庫）、GraphX（圖形運算）。題庫答案為 (4)。"}, {"n": 201, "code": "1-201", "ans": "1", "multi": false, "q": "存取大數據經常採用 NoSQL，下列何者是 NoSQL 的特點？", "o": ["採用非同步的複製", "只能使用結構化查詢語言", "資料表的模式須固定", "不能 Scale out 儲存容量"], "e": "NoSQL（Not only SQL）特點：不需固定綱要（Schema-free）、可水平擴充（Scale out）、採非同步複製、追求最終一致性；不限定使用 SQL。"}, {"n": 202, "code": "1-202", "ans": "2", "multi": false, "q": "有關 R 程式語言的敘述，下列何者正確？", "o": ["尚未開放程式原始碼", "主要用於統計分析、資料探勘", "源自於 B 程式語言", "不具圖形使用者介面"], "e": "R 是開放原始碼的統計語言，源自 S 語言，常用於統計分析、資料探勘與繪圖，可搭配 RStudio 圖形介面。"}, {"n": 203, "code": "1-203", "ans": "4", "multi": false, "q": "下列何者是大數據（Big Data）的分析技術？", "o": ["Encounter", "Angular 2", "Catia", "Data Mining"], "e": "資料探勘（Data Mining）從大量資料中找出規則與模式，是大數據分析技術。Angular 是網頁前端框架；Catia 是 3D 設計軟體。"}, {"n": 204, "code": "1-204", "ans": "1", "multi": false, "q": "大數據分析工具中，常用一些統計分析、繪圖軟體，下列何者屬於開放原始碼軟體？", "o": ["R", "SPSS", "SAS", "MINITAB"], "e": "R 為免費開放原始碼；SPSS、SAS、MINITAB 都是商業付費軟體。"}, {"n": 205, "code": "1-205", "ans": "1", "multi": false, "q": "Hadoop 家族成員中，下列何者是專做分散式儲存系統？", "o": ["HDFS", "Hive", "Ambari", "MapReduce"], "e": "HDFS（Hadoop Distributed File System）負責分散式儲存；MapReduce 負責分散式運算；Hive 提供類 SQL 查詢；Ambari 是叢集管理工具。"}, {"n": 206, "code": "1-206", "ans": "1", "multi": false, "q": "大數據分析分為兩階段，第一階段為全數據分析，提取指標數據；第二階段將指標數據進行測試、優化、建模、分析。下列何項工具適合使用在第一階段？", "o": ["Hadoop", "R", "Python", "Mathlab"], "e": "第一階段要處理巨量的全部資料，需用 Hadoop 這類分散式平台；提取出的指標資料量較小，第二階段再用 R、Python、Matlab 做建模分析。"}, {"n": 207, "code": "1-207", "ans": "2", "multi": false, "q": "大數據分析工具 Hadoop 之資料處理採用映射歸納（Map/Reduce）方式，下列何者是屬於映射（Mapping）工作？", "o": ["將所有資料集中做計算", "把工作分散到各節點", "把各節點運算結果收回來歸納整合", "各節點獨立運算"], "e": "Map（映射）階段把工作與資料切分、分派到各節點平行處理；Reduce（歸納）階段再把各節點結果收回彙整。(3) 屬 Reduce。"}, {"n": 208, "code": "1-208", "ans": "2", "multi": false, "q": "下列何者為大數據分析工具 Hadoop 中類似 SQL 的查詢工具？", "o": ["Pig", "Hive", "HBase", "Mahout"], "e": "Hive 提供類 SQL 的 HiveQL，把查詢轉成 MapReduce 執行。Pig 用 Pig Latin 腳本；HBase 是 NoSQL 資料庫；Mahout 是機器學習函式庫。"}, {"n": 209, "code": "1-209", "ans": "4", "multi": false, "q": "大數據分析工具 Spark 框架之重要特色為所有的運算都在記憶體中執行，這樣的技術稱為？", "o": ["Build-In Computing", "Ubiquitous Computing", "Distributed Computing", "In-Memory Computing"], "e": "In-Memory Computing（記憶體內運算）把資料放在記憶體中運算，減少磁碟讀寫，因此 Spark 比 Hadoop MapReduce 快很多。"}, {"n": 210, "code": "1-210", "ans": "3", "multi": false, "q": "Spark 框架的核心將資料抽象化成資料集，以直接在多台機器的記憶體處理資料，這樣的資料集稱為？", "o": ["Distributed In-Memory Dataset", "In-Memory Distributed Dataset", "Resilient Distributed Dataset", "In-Memory Dataset"], "e": "RDD（Resilient Distributed Dataset，彈性分散式資料集）是 Spark 的核心資料結構，分散於多台機器記憶體中，並可在節點失效時依血統（lineage）重建。"}, {"n": 211, "code": "1-211", "ans": "1", "multi": false, "q": "大數據分析的數據多屬於非結構化全數據（Raw Data），因此大多採用 NoSQL 工具。下列何者是 NoSQL 工具？", "o": ["BigTable", "Sybase", "MariaDB", "Access"], "e": "BigTable 是 Google 的分散式 NoSQL 資料庫；Sybase、MariaDB、Access 都是關聯式資料庫。"}, {"n": 212, "code": "1-212", "ans": "2", "multi": false, "q": "大數據很難做到大量資料 Schema 的規劃及異動資料庫的擴展，因此大多採用 NoSQL 工具。NoSQL 工具使用哪一種模式來解決這樣的問題？", "o": ["Row Based", "Key-Value", "Column Based", "Multi-Level Fields"], "e": "NoSQL 常以鍵值對（Key-Value）存放資料，不需事先定義固定綱要，容易擴充。"}, {"n": 213, "code": "1-213", "ans": "3", "multi": false, "q": "MIT App Inventor 2.0 中，List 的第一個元素的索引值（index）為何？", "o": ["-1", "0", "1", "可以自行指定"], "e": "App Inventor 的清單索引從 1 開始（與 C、Java、Python 從 0 開始不同）。"}, {"n": 214, "code": "1-214", "ans": "4", "multi": false, "q": "SQL Server 中，何種資料型別支援地理資料的儲存？", "o": ["varbinary", "varchar", "float", "geography"], "e": "SQL Server 的空間資料型別有 geography（經緯度、地球曲面）與 geometry（平面座標）。"}, {"n": 215, "code": "1-215", "ans": "1", "multi": false, "q": "SQL Server 中，下列哪個方法可以判斷兩個 geography 型別的圖資之間是否具有交集？", "o": ["STIntersects", "STUnion", "STIsEmpty", "STIsValid"], "e": "STIntersects() 判斷兩個空間物件是否相交，回傳 1 或 0。STUnion 求聯集；STIsEmpty 判斷是否為空；STIsValid 判斷是否有效。"}, {"n": 216, "code": "1-216", "ans": "1", "multi": false, "q": "透過 JavaScript 程式的撰寫，可以在 HTML5 的哪一種標籤上繪製一個指定圓心和半徑的圓形？", "o": ["<canvas>", "<img>", "<div>", "<span>"], "e": "HTML5 的 <canvas> 提供畫布，以 JavaScript 呼叫 getContext('2d') 後用 arc() 等方法繪製圓形與圖形。"}, {"n": 217, "code": "1-217", "ans": "1", "multi": false, "q": "在智慧裝置開發 Web-Based Apps 時，使用下列哪一個 HTML5 標籤，可以讓網頁的版面配置隨著裝置的螢幕大小及功能來做變動？", "o": ["<meta name=\"viewport\">", "<meta name=\"description\">", "<meta name=\"keywords\">", "<meta name=\"author\">"], "e": "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> 設定網頁可視區域依裝置寬度縮放，是響應式網頁（RWD）的基礎。description、keywords、author 只是網頁描述資訊。"}, {"n": 218, "code": "1-218", "ans": "1", "multi": false, "q": "Android APIs 中，下列哪一個套件提供相機裝置的操控介面？", "o": ["android.hardware.camera2", "android.camera2", "android.app.hardware.camera2", "android.app.camera2"], "e": "Android 硬體相關 API 位於 android.hardware 之下，Camera2 API 的套件名稱為 android.hardware.camera2。"}, {"n": 219, "code": "1-219", "ans": "1", "multi": false, "q": "Google APIs for Android 中，下列何種套件提供高精確度及低功耗的智慧裝置定位介面？", "o": ["com.google.android.gms.location", "com.android.gms.location", "android.location", "android.hardware.location"], "e": "Google Play 服務（gms）的定位 API（Fused Location Provider）位於 com.google.android.gms.location，整合 GPS、Wi-Fi、行動網路，兼顧精準與省電。"}, {"n": 220, "code": "1-220", "ans": "3", "multi": false, "q": "對於社群媒體及網路輿情分析，下列何者是延伸的分析項目？", "o": ["庫存資料", "產品組合資料", "結合企業外部社群和新聞資料", "公司會計進出貨資料"], "e": "網路輿情分析是蒐集企業「外部」的社群貼文、新聞、評論來了解輿論；庫存、產品、會計都是企業內部資料。"}, {"n": 221, "code": "1-221", "ans": "4", "multi": false, "q": "下列哪一項技術可以應用於電子支付感應？", "o": ["全球定位系統（GPS）", "磁條感應", "磁帶讀取感應", "無線射頻識別（RFID）"], "e": "RFID（含 NFC）以無線電波非接觸感應讀取晶片資料，用於悠遊卡、感應式信用卡、手機支付。"}, {"n": 222, "code": "1-222", "ans": "3", "multi": false, "q": "下列何者以語意網為核心技術之一？", "o": ["Web 1.0", "Web 2.0", "Web 3.0", "Web 4.0"], "e": "Web 1.0 單向瀏覽；Web 2.0 使用者參與、互動分享；Web 3.0 以語意網（Semantic Web）為核心，讓電腦能理解資料意義。"}, {"n": 223, "code": "1-223", "ans": "4", "multi": false, "q": "下列何者是第三方支付工具？", "o": ["悠遊卡", "Apple Pay", "Google Wallet", "Paypal"], "e": "第三方支付是由獨立的第三方機構在買賣雙方之間代收代付款項（如 PayPal、支付寶）。悠遊卡是電子票證；Apple Pay、Google Wallet 是行動支付（綁定信用卡）。"}, {"n": 224, "code": "1-224", "ans": "2", "multi": false, "q": "下列何者屬於智慧穿戴式裝置？", "o": ["手機", "智慧衣", "自動駕駛車", "悠遊卡"], "e": "穿戴式裝置是可穿戴在身上的智慧裝置，如智慧手錶、手環、智慧眼鏡、智慧衣。"}, {"n": 225, "code": "1-225", "ans": "4", "multi": false, "q": "下列何者是無人駕駛車最需要的配備？", "o": ["車內娛樂設備", "駕駛使用的方向盤", "後照鏡子", "電子導航地圖"], "e": "無人車要靠高精度電子地圖搭配 GPS 與感測器決定路線與定位；方向盤與後照鏡是給人類駕駛用的。"}, {"n": 226, "code": "1-226", "ans": "1", "multi": false, "q": "在智慧校園應用中，下列何者是最需要使用的行動裝置？", "o": ["智慧型手機", "桌上型電腦", "大容量儲存設備", "伺服器主機"], "e": "選項中只有智慧型手機屬行動裝置，可隨時連線使用點名、繳費、查詢等校園服務。"}, {"n": 227, "code": "1-227", "ans": "1", "multi": false, "q": "無所不在的 4.0 智慧生活（例如：銀行 4.0、零售 4.0 等）需要下列哪一項資料傳輸技術來搭配使用？", "o": ["無線網路存取技術", "ATM 提款機", "傳真機", "電傳打字機"], "e": "「無所不在」需透過無線網路（4G/5G、Wi-Fi）讓使用者隨時隨地以行動裝置存取服務。"}, {"n": 228, "code": "1-228", "ans": "2", "multi": false, "q": "開發 Fintech 智慧科技應用，主要分析資料來源為下列哪一項？", "o": ["上游供應商進料資料", "銀行存款資料", "製造現場的機器設備狀態紀錄", "傳送與接收的私人電子郵件"], "e": "Fintech（金融科技）是金融與科技的結合，主要分析金融相關資料，例如銀行存款、交易紀錄。"}, {"n": 229, "code": "1-229", "ans": "3", "multi": false, "q": "在物聯網的概念中，下列何者屬於網路層的技術？", "o": ["遠端醫療", "智能電網", "雲端運算技術", "射頻辨識標籤"], "e": "物聯網三層：感知層（RFID、感測器）、網路層（通訊網路、雲端運算、資料傳輸與處理）、應用層（遠端醫療、智慧電網等服務）。雲端運算屬網路層。"}, {"n": 230, "code": "1-230", "ans": "1", "multi": false, "q": "下列何者為感知層的感測元件？", "o": ["三軸加速器", "IEEE 802.11", "Intel 8051", "智慧門票"], "e": "三軸加速度感測器偵測移動與傾斜，是感知層元件。IEEE 802.11 是 Wi-Fi 通訊標準（網路層）；8051 是微控制器；智慧門票屬應用。"}, {"n": 231, "code": "1-231", "ans": "3", "multi": false, "q": "感測器（Sensor）在物聯網三層級中主要發揮的功能為下列何者？", "o": ["偵測通訊情況，確保訊息傳遞無誤", "偵測物聯網機房情況，確保系統正常運作", "偵測物體所處環境各項資訊，結合網路實現感知層", "蒐集各項資訊，建構物理模型實現應用層"], "e": "感測器負責感測溫度、濕度、位置、動作等環境資訊，是物聯網「感知層」的核心。"}, {"n": 232, "code": "1-232", "ans": "3", "multi": false, "q": "關於智慧電網，下列敘述何者正確？", "o": ["可利用資通訊技術收集供應端與使用端的電力供應狀況，但無法達到節約能源、降低損耗為目的", "包含一個智慧型電表基礎建設（AMI），僅能紀錄系統部分電能的流動", "智慧電網可改善現有輸電網路的效能，且能整合風能、太陽能等新能源", "智慧電網之目的是回歸人工監測，以降低機具故障之風險"], "e": "智慧電網以資通訊技術雙向監控電力供需，可提升輸電效率、節能降損，並整合再生能源。(1) 能節能；(2) AMI 可記錄完整用電；(4) 目的是自動化監測，不是回歸人工。"}, {"n": 233, "code": "1-233", "ans": "3", "multi": false, "q": "關於智慧社區系統，下列敘述何者正確？", "o": ["已包含地價、房價等交易資訊", "管委會及各住戶可以透過智慧社區系統，確實掌握各戶人員進出情形", "智慧社區系統可以透過智慧物件的資訊交換及互動，將不必要的電燈關閉，以節省不必要的浪費", "智慧社區系統可以取代社區守衛"], "e": "智慧社區透過感測器與智慧物件互動，自動控制照明、空調來節能。它不包含房價交易資訊，也不應讓住戶掌握他戶隱私，且只能輔助而非完全取代守衛。"}, {"n": 234, "code": "1-234", "ans": "1", "multi": false, "q": "下列何者是現階段智慧型手機在近場通訊（NFC）的主要應用？", "o": ["在行動支付可縮短交易時間", "在交通運輸過程，可搜尋目的地的確切位置", "在規劃交通路徑，縮短行車時間", "可知餐廳食材之產品履歷，提昇食品安全"], "e": "NFC 是約 10 公分內的近距離感應通訊，手機主要用於感應支付（如 Apple Pay、悠遊卡功能），快速完成交易。找位置、規劃路徑靠 GPS。"}, {"n": 235, "code": "1-235", "ans": "1", "multi": false, "q": "藍芽 4.0 可達成的有效傳輸距離為下列何者？", "o": ["200 英呎", "300 英呎", "400 英呎", "500 英呎"], "e": "藍牙 4.0（含低功耗 BLE）有效傳輸距離約 60 公尺，約 200 英呎。"}, {"n": 236, "code": "1-236", "ans": "4", "multi": false, "q": "IBM 提出下列何種概念，可視為物聯網的雛型？", "o": ["感知城市", "感知地球", "智慧城市", "智慧地球"], "e": "IBM 於 2008 年提出「智慧地球（Smarter Planet）」，把感測器嵌入各種物體並連網，被視為物聯網雛型。「感知中國」則是中國提出的概念。"}, {"n": 237, "code": "1-237", "ans": "3", "multi": false, "q": "下列何者為物聯網之感測器發揮的主要功能？", "o": ["偵測通訊情況，確保訊息傳遞無誤", "確保網路正常運作，實現網路層", "偵測物體所處環境之資訊，結合網路實現感知層", "蒐集各項資訊，建構物理模型實現實體層"], "e": "與第 231 題相同觀念：感測器偵測環境資訊，屬物聯網感知層。"}, {"n": 238, "code": "1-238", "ans": "2", "multi": false, "q": "有關物聯網的特性敘述，下列何者正確？", "o": ["物件必須有高移動性", "注重跨領域的異質訊流動", "愈多人使用，訊息價值愈低", "物件與物件之間無法互相通訊"], "e": "物聯網連結各種不同領域、不同格式的裝置，讓異質資訊互相流通。物件不一定要移動；使用者越多資訊價值越高（網路效應）；物件之間可以互相通訊（M2M）。"}, {"n": 239, "code": "1-239", "ans": "1", "multi": false, "q": "下列何者為 RFID 標籤類別？", "o": ["Active, Passive, Semi-Passive", "Passive, Semi-Passive, Hyper-Active", "Active, Semi-Active, Passive", "Active, Passive, Hyper-Active"], "e": "RFID 標籤依電源分為：主動式（Active，自帶電池主動發射）、被動式（Passive，靠讀取器電波供電）、半被動式（Semi-Passive，有電池供晶片運作但靠讀取器啟動回應）。"}, {"n": 240, "code": "1-240", "ans": "2", "multi": false, "q": "歐洲電信標準協會（ETSI）將物聯網分成三個階層，智慧交通系統的使用者介面屬於下列哪一層？", "o": ["感知層", "應用層", "傳輸層", "網路層"], "e": "直接提供使用者服務與介面的是應用層，例如智慧交通、智慧醫療、智慧家庭的 App 與系統。"}, {"n": 241, "code": "1-241", "ans": "4", "multi": false, "q": "有關歐洲電信標準協會（ETSI）之物聯網三個階層的敘述，下列何者正確？", "o": ["條碼資訊傳播架構屬於感知層", "無線射頻識別屬於應用層", "移動通訊裝置屬於傳輸層", "次世代網路屬於網路層"], "e": "ETSI 的三層為感知層、網路層、應用層（沒有「傳輸層」）。次世代網路（NGN）是通訊網路，屬網路層。RFID 屬感知層；條碼資訊傳播架構、移動通訊等與網路傳輸相關，不屬感知層。"}, {"n": 242, "code": "1-242", "ans": "3", "multi": false, "q": "有關物聯網的敘述，下列何者正確？", "o": ["IBM 提出的感知地球概念為物聯網之雛型", "美國提出的感知美國概念為物聯網之雛型", "物聯網可賦予物件擁有與其他物件或人溝通的能力", "GPRS 最適合用於物聯網的物件進行資料通訊"], "e": "物聯網讓物件具備感知與連網能力，可與其他物件或人溝通。IBM 提出的是「智慧地球」；GPRS 是舊式 2.5G 行動數據，並非最適合。"}, {"n": 243, "code": "1-243", "ans": "4", "multi": false, "q": "下列何種儲存媒體沒有靠機械旋轉來進行讀取？", "o": ["磁碟", "光碟", "磁帶", "固態硬碟"], "e": "固態硬碟（SSD）以快閃記憶體晶片儲存，沒有馬達與讀寫臂等機械結構，速度快、抗震。磁碟與光碟要旋轉碟片；磁帶要轉動捲軸。"}, {"n": 244, "code": "1-244", "ans": "1", "multi": false, "q": "下列何種記憶體在電腦關機後資料即消失？", "o": ["RAM", "隨身碟", "ROM", "固態硬碟"], "e": "RAM 是揮發性記憶體，斷電資料消失。隨身碟、SSD（快閃記憶體）與 ROM 都是非揮發性。"}, {"n": 245, "code": "1-245", "ans": "2", "multi": false, "q": "下列何者不是路由交換器所要支援的功能？", "o": ["連結二個區域網路", "支援不同傳輸媒介", "提供資料轉送", "延長傳輸距離"], "e": "依題庫答案，路由交換器負責連結網路、轉送資料並具中繼（延長距離）效果；轉換不同傳輸媒介（如光纖轉雙絞線）屬媒體轉換器（Media Converter）的功能。"}, {"n": 246, "code": "1-246", "ans": "1", "multi": false, "q": "有關網路傳輸之敘述，下列何者正確？", "o": ["Wi-Fi 在不同頻道上傳輸只達到半雙工傳輸模式", "5G 支援全雙工傳輸模式", "居家使用的 ADSL 採全雙工傳輸模式", "光纖傳輸採全雙工傳輸模式"], "e": "Wi-Fi 在同一頻道上以 CSMA/CA 輪流收發，屬半雙工傳輸，為題庫答案 (1)。"}, {"n": 247, "code": "1-247", "ans": "4", "multi": false, "q": "有關乙太網路傳輸之敘述，下列何者正確？", "o": ["可使用於跨區域網路傳輸", "使用交換器傳輸仍有碰撞問題", "可獨立於高速移動中連接網際網路", "定義於 OSI 七層的傳輸層（Transport Layer）"], "e": "本題以刪去法：(1) 乙太網路是區域網路技術；(2) 交換器每個埠是獨立的碰撞網域，全雙工下不會碰撞；(3) 乙太網路是有線網路，無法在高速移動中連線。題庫答案為 (4)。（補充：嚴格來說乙太網路規範的是 OSI 實體層與資料鏈結層，考試時依題庫答案作答。）"}, {"n": 248, "code": "1-248", "ans": "3", "multi": false, "q": "有關 HDMI 之敘述，下列何者正確？", "o": ["是一種傳送類比聲音及影像的介面", "可直接播放壓縮的視訊檔", "支援熱插拔模式", "沒有傳輸距離限制"], "e": "HDMI 是傳輸「數位」影音訊號的介面，支援熱插拔。它只是傳輸介面，不負責解碼播放檔案；一般線材有效距離約 10～15 公尺。"}, {"n": 249, "code": "1-249", "ans": "3", "multi": false, "q": "下列何者不是 Windows 作業系統之「網路和共用」具有的功能？", "o": ["共用資料夾", "共用印表機", "共享網路連結", "共用網路串流"], "e": "Windows 的進階共用設定包含檔案（資料夾）及印表機共用、媒體串流等；依題庫答案，「共享網路連結」不屬於「網路和共用」中的項目。"}, {"n": 250, "code": "1-250", "ans": "2", "multi": false, "q": "有關動態網頁執行之敘述，下列何者正確？", "o": ["PHP 程式下傳到用戶再執行產生動態網頁", "JavaScript 可於用戶端執行網頁的程式", "執行 SQL 資料庫查詢是在用戶端", "網頁只能處理文字表單，不支援圖片處理"], "e": "JavaScript 是在瀏覽器（用戶端）執行的程式語言。PHP 在伺服器端執行後只傳回 HTML；SQL 查詢也在伺服器端執行。"}, {"n": 251, "code": "1-251", "ans": "2", "multi": false, "q": "下列哪一項工具可以下載檔案？", "o": ["Ping 指令", "FTP 用戶端程式", "SQL 指令", "記事本程式"], "e": "FTP 用戶端（如 FileZilla）透過檔案傳輸協定上傳、下載檔案。Ping 只測試連線；SQL 查詢資料庫；記事本編輯文字。"}, {"n": 252, "code": "1-252", "ans": "3", "multi": false, "q": "有關 SQL 關聯資料庫之敘述，下列何者正確？", "o": ["若資料長度差異很大，則欄位宣告成 char 資料型態", "連外鍵資料不可以重複", "主鍵值一定要唯一", "主鍵值可以為空值（NULL）"], "e": "主鍵（Primary Key）必須唯一且不可為 NULL（實體完整性）。長度差異大應用 varchar（可變長度）；外來鍵的值可以重複（一對多）。"}, {"n": 253, "code": "1-253", "ans": "4", "multi": false, "q": "有關網際網路（Internet）之敘述，下列何者正確？", "o": ["使用乙太網路來連結全球網路", "使用 VPN 可以追蹤到每個封包的去向", "網際網路的每一段傳輸完全免費", "社群網路是網際網路的應用之一"], "e": "社群網路（Facebook、IG 等）是建立在網際網路上的應用服務。網際網路以 TCP/IP 連結各種網路，不限乙太網路；VPN 是加密通道，目的是保護而非追蹤；網路線路與頻寬需付費。"}, {"n": 254, "code": "1-254", "ans": "4", "multi": false, "q": "下列何者現有儲存體所能儲存的資料容量最大？", "o": ["光碟", "固態硬碟（SSD）", "GPU 晶片上的快取記憶體", "磁式硬碟（HDD）"], "e": "依題庫答案，傳統磁性硬碟（HDD）單顆容量最大（可達 20TB 以上）、每 GB 成本最低；光碟最多 100GB 左右；GPU 快取只有 MB 級。"}, {"n": 255, "code": "1-255", "ans": "4", "multi": false, "q": "在個人電腦中，下列何者無法透過傳輸介面來連結網際網路？", "o": ["乙太網路介面", "Wi-Fi 無線網路介面", "5G 傳輸介面", "快取儲存介面"], "e": "快取記憶體是 CPU 內部的高速儲存，不是網路介面，無法用來連網；其餘三者都是網路連線介面。"}, {"n": 256, "code": "1-256", "ans": "1", "multi": false, "q": "下列何者是建構 TCP/IP 四層的應用層協定？", "o": ["HTTP（超文本傳輸協定）", "Ethernet 存取協定", "使用者資料包協定 UDP", "TokenRing 協定"], "e": "TCP/IP 四層：應用層（HTTP、FTP、SMTP、DNS）、傳輸層（TCP、UDP）、網際網路層（IP）、網路存取層（Ethernet、Token Ring）。"}, {"n": 257, "code": "1-257", "ans": "1", "multi": false, "q": "下列何者可以加速瀏覽網頁下載的速度？", "o": ["使用 Proxy 伺服器", "設定網站病毒掃描機制", "設定網站加密處理", "設定成我的最愛"], "e": "Proxy（代理）伺服器會快取（Cache）使用者瀏覽過的網頁，其他人再瀏覽時直接由 Proxy 提供，加快速度並節省頻寬。"}, {"n": 258, "code": "1-258", "ans": "4", "multi": false, "q": "有關 USB（通用序列匯流排）的敘述，下列何者正確？", "o": ["只能支援隨身碟傳輸", "不適用於裝置充電", "傳輸速率比鍵盤慢", "具有隨插即用功能"], "e": "USB 支援隨插即用（Plug and Play）與熱插拔，可接各種周邊並供電充電。"}, {"n": 259, "code": "1-259", "ans": "1", "multi": false, "q": "有關 Wi-Fi 敘述，下列何者正確？", "o": ["採用 CSMA/CA 的碰撞處理", "只支援單人連線傳輸", "用於無線傳真機", "採用雙絞線作為網路傳輸媒介"], "e": "無線網路無法在傳送時偵測碰撞，所以採 CSMA/CA（載波感測多重存取／碰撞「避免」）；有線乙太網路則用 CSMA/CD（碰撞「偵測」）。"}, {"n": 260, "code": "1-260", "ans": "1", "multi": false, "q": "下列何種儲存裝置是透過驅動馬達旋轉以執行讀取動作？", "o": ["磁性硬碟（HD）", "隨身碟（USB）", "固態硬碟（SSD）", "隨機存取記憶體（RAM）"], "e": "傳統硬碟以馬達帶動碟片高速旋轉（如 7200rpm），由讀寫頭讀取。隨身碟、SSD、RAM 都是電子式，沒有機械旋轉。"}, {"n": 261, "code": "1-261", "ans": "1", "multi": false, "q": "全球資訊網 WWW 無法連接時，下列何種作法可以偵測原因？", "o": ["使用 Ping 指令", "使用 HTTP 網頁傳輸", "試著使用 FTP 上傳檔案", "使用 Telnet 遠端登入程式"], "e": "Ping 送出 ICMP 封包測試與目標主機是否連通及回應時間，是最基本的網路偵錯工具。"}, {"n": 262, "code": "1-262", "ans": "2", "multi": false, "q": "下列何者屬於輸入裝置？", "o": ["印表機", "麥克風", "喇叭", "耳機"], "e": "麥克風把聲音輸入電腦。印表機、喇叭、耳機都是輸出裝置。"}, {"n": 263, "code": "1-263", "ans": "3", "multi": false, "q": "下列哪一個網際網路應用層協定被用來傳輸網頁？", "o": ["SMTP", "SNMP", "HTTP", "POP"], "e": "HTTP 傳輸網頁；SMTP 寄信、POP 收信、SNMP 用於網路設備管理。"}, {"n": 264, "code": "1-264", "ans": "2", "multi": false, "q": "在 Windows 作業系統中，下列何種程式會在電腦開機時自動執行？", "o": ["放在「桌面」的執行程式", "設定在「啟動」內的執行程式", "放在固態硬碟上的執行程式", "設定在「Windows 附屬應用程式」的程式"], "e": "放入「啟動（Startup）」資料夾或在工作管理員「啟動」中啟用的程式，會在使用者登入時自動執行。"}, {"n": 265, "code": "1-265", "ans": "4", "multi": false, "q": "下列何者無法作為網路資料傳輸的媒介？", "o": ["光纖", "家中的電線", "檯燈的光線", "塑膠線"], "e": "光纖以光傳輸；家中電線可用電力線網路（PLC）；燈光可用可見光通訊（Li-Fi）。一般塑膠線不導電也不導光，無法傳輸資料。"}, {"n": 266, "code": "1-266", "ans": "1", "multi": false, "q": "有關 CPU 處理速度敘述，下列何者正確？", "o": ["一般時脈速度愈高，處理速度愈快", "CPU 速度以每秒執行的指令數來測量", "一般執行的指令集愈複雜，處理速度愈快", "速度 3.2GHz 是每毫秒執行 32 億個指令集"], "e": "在相同架構下時脈越高，每秒週期數越多，速度越快。CPU 速度一般以時脈（Hz）表示；指令越複雜通常越慢；3.2GHz 是每「秒」32 億個時脈週期。"}, {"n": 267, "code": "1-267", "ans": "2", "multi": false, "q": "下列何者是透過「光纖網路」傳輸？", "o": ["藍芽耳機", "骨幹網路", "無線滑鼠", "CPU 匯流排"], "e": "骨幹網路（Backbone）需要大頻寬、長距離傳輸，多使用光纖。藍牙耳機、無線滑鼠是無線傳輸；CPU 匯流排是主機板上的電路。"}, {"n": 268, "code": "1-268", "ans": "1", "multi": false, "q": "下列何者支援網路多媒體邊傳邊播放功能？", "o": ["串流（Streaming）", "儲存與轉發", "檔案下載", "檔案傳輸協定"], "e": "串流技術讓影音資料一邊下載一邊播放，不必整個檔案下載完成，如 YouTube、Netflix。"}, {"n": 269, "code": "1-269", "ans": "1", "multi": false, "q": "下列何者支援網路分散存取的檔案系統？", "o": ["IPFS（InterPlanetary File System）", "FAT 32", "NTFS", "APFS"], "e": "IPFS（星際檔案系統）是點對點分散式的網路檔案系統，以內容雜湊值定址。FAT32、NTFS（Windows）、APFS（Apple）都是本機磁碟檔案系統。"}, {"n": 270, "code": "1-270", "ans": "1", "multi": false, "q": "下列何者是作業系統名稱？", "o": ["Android", "Mobile Phone", "MPEG", "Smart Contract"], "e": "Android 是 Google 的行動作業系統。Mobile Phone 是手機；MPEG 是影音壓縮標準；Smart Contract 是區塊鏈上的智慧合約。"}, {"n": 271, "code": "1-271", "ans": "4", "multi": false, "q": "下列何者不是多媒體播放和儲存的格式？", "o": ["MPEG", "AVI", "WMV", "ZIP"], "e": "ZIP 是檔案壓縮封裝格式；MPEG、AVI、WMV 都是影音格式。"}, {"n": 272, "code": "1-272", "ans": "34", "multi": true, "q": "下列何者為網路的安全裝置？", "o": ["ATM（Asynchronous Transfer Mode）", "LBS（Location Based Service）", "IDS（Intrusion Detection System）", "IPS（Intrusion Prevention System）"], "e": "答案 (3)(4)。IDS（入侵偵測系統）監控並警示可疑行為；IPS（入侵防禦系統）偵測後還會主動阻擋。ATM 是非同步傳輸模式網路技術；LBS 是適地性服務。"}, {"n": 273, "code": "1-273", "ans": "12", "multi": true, "q": "下列何者可保護網路裝置的組態檔案，可降低外部網路安全威脅？", "o": ["使用 SSH 傳輸協定來存取裝置組態檔", "使用防火牆限制外部對網路裝置的存取", "允許主控台進行不受限制的存取", "利用 Telnet 自動加密功能，作為存取裝置的命令列"], "e": "答案 (1)(2)。SSH 會加密連線內容；防火牆可限制外部存取。主控台不受限制存取會增加風險；Telnet 以明文傳輸，沒有加密功能。"}, {"n": 274, "code": "1-274", "ans": "14", "multi": true, "q": "下列何者屬於私有 IP？", "o": ["172.20.14.36", "12.0.0.1", "168.172.20.40", "192.168.32.24"], "e": "答案 (1)(4)。私有 IP 範圍：10.0.0.0～10.255.255.255、172.16.0.0～172.31.255.255、192.168.0.0～192.168.255.255。172.20.x.x 在 172.16～172.31 之間；192.168.x.x 也是私有。12.0.0.1、168.172.x.x 是公有 IP。"}, {"n": 275, "code": "1-275", "ans": "123", "multi": true, "q": "下列通訊協定哪些屬於 OSI 模型的應用層？", "o": ["TFTP", "Telnet", "FTP", "TCP"], "e": "答案 (1)(2)(3)。TFTP、Telnet、FTP 都是直接提供使用者服務的應用層協定；TCP 屬傳輸層。"}, {"n": 276, "code": "1-276", "ans": "34", "multi": true, "q": "有關 ICMP 封包敘述，下列何者正確？", "o": ["ICMP 保證資料封包能確實送達", "ICMP 封裝在 UDP 資料封包內", "ICMP 提供網路問題的資訊給主機", "ICMP 封裝在 IP 資料封包內"], "e": "答案 (3)(4)。ICMP（網際網路控制訊息協定）回報錯誤與診斷資訊（如 ping 的 Echo、目的地無法到達），直接封裝在 IP 封包中，不經 TCP/UDP；它不負責保證送達。"}, {"n": 277, "code": "1-277", "ans": "12", "multi": true, "q": "下列服務，何者使用 TCP 協定來傳送？", "o": ["SMTP", "FTP", "SNMP", "TFTP"], "e": "答案 (1)(2)。SMTP（25）、FTP（20/21）需可靠傳輸，使用 TCP；SNMP（161）、TFTP（69）使用 UDP。"}, {"n": 278, "code": "1-278", "ans": "12", "multi": true, "q": "下列服務，何者使用 UDP 協定來傳送？", "o": ["DHCP", "TFTP", "HTTP", "FTP"], "e": "答案 (1)(2)。DHCP（67/68）、TFTP（69）使用 UDP；HTTP、FTP 使用 TCP。"}, {"n": 279, "code": "1-279", "ans": "14", "multi": true, "q": "IEEE 乙太網路的訊框標頭中包含哪些欄位？", "o": ["FCS 欄位", "來源與目的 MAC 及 IP 位址", "來源與目的 IP 位址", "來源與目的 MAC 位址"], "e": "答案 (1)(4)。乙太網路訊框包含前置碼、目的 MAC、來源 MAC、類型/長度、資料、FCS（訊框檢查序列，CRC 錯誤檢查）。IP 位址屬第 3 層，放在 IP 封包表頭中。"}, {"n": 280, "code": "1-280", "ans": "23", "multi": true, "q": "乙太網路在發生碰撞後如何才能再傳送？", "o": ["偵測到碰撞的工作站有最高優先權重送遺失的資料", "所有工作站會執行一個隨機的 Backoff 演算法，待 Backoff 的延遲時段終了後，所有工作站均有相等的優先權來傳送資料", "在 CSMA/CD 的碰撞網域中，工作站須待媒介沒在使用時才能傳送資料", "所有工作站會執行一致的 Backoff 演算法，然後彼此協調後才能傳送資料"], "e": "答案 (2)(3)。CSMA/CD 碰撞後，各站等待「隨機」的退避（Backoff）時間再重新偵聽，線路空閒才傳送，大家優先權相同。若退避時間一致，會再次碰撞。"}, {"n": 281, "code": "1-281", "ans": "124", "multi": true, "q": "下列何者為路由器的功能？", "o": ["交換封包", "過濾封包", "轉送廣播封包", "選擇路徑"], "e": "答案 (1)(2)(4)。路由器依路由表選擇路徑、交換（轉送）封包，並可依存取清單過濾封包；路由器預設「不轉送」廣播封包，可隔離廣播網域。"}, {"n": 282, "code": "1-282", "ans": "123", "multi": true, "q": "當防火牆日誌檔顯示有人嘗試攻擊網路時，下列何者不是阻擋 DoS 攻擊的方法？", "o": ["增加更多路由器", "設定 Naggle", "使用 Auto Secure 命令", "建置 IDPS（入侵偵測與防禦系統）"], "e": "答案 (1)(2)(3)。阻擋 DoS（阻斷服務）攻擊要靠 IDPS 偵測並阻擋異常流量。增加路由器無法擋攻擊流量；Nagle 演算法是合併小封包提升效率的 TCP 機制；依題庫答案 Auto Secure 也不列為阻擋方法。"}, {"n": 283, "code": "1-283", "ans": "234", "multi": true, "q": "以橋接器或交換器來分割網路，將產生下列何種結果？", "o": ["增加網域內的廣播主機數目", "減少封包碰撞的機率", "增加網域的數目", "產生較小的網域"], "e": "答案 (2)(3)(4)。橋接器/交換器每個埠是獨立的碰撞網域，切割後碰撞網域數目增加、每個網域變小，碰撞機率降低；它們會轉送廣播，不會增加廣播主機數目。"}, {"n": 284, "code": "1-284", "ans": "23", "multi": true, "q": "交換器在轉送訊框到目的地之前先予以儲存再轉送（Store and Forward），對於網路效能有何影響？", "o": ["減少延遲", "增加延遲", "可濾掉所有的訊框錯誤", "增加交換器的運作速度"], "e": "答案 (2)(3)。儲存轉送要先收完整個訊框並做 CRC 檢查才轉送，能過濾錯誤訊框，但等待時間使延遲增加。直通式（Cut-Through）則延遲小但不檢查錯誤。"}, {"n": 285, "code": "1-285", "ans": "124", "multi": true, "q": "第二層乙太網路交換器比集線器優越的地方在於？", "o": ["根據 MAC 位址來過濾訊框", "允許同時的訊框傳輸", "減少碰撞封包的數目", "減少廣播網域的規模"], "e": "題庫答案 (1)(2)(4)。交換器依 MAC 位址表只把訊框送往目的埠（過濾），不同埠可同時傳輸；集線器則把訊號送到所有埠。"}, {"n": 286, "code": "1-286", "ans": "1234", "multi": true, "q": "即時通訊軟體的功能包含哪些？", "o": ["文字通訊", "檔案傳送", "語音對談", "視訊交流"], "e": "答案 (1)(2)(3)(4)。LINE、Teams 等即時通訊軟體都提供文字訊息、傳檔、語音與視訊通話。"}, {"n": 287, "code": "1-287", "ans": "34", "multi": true, "q": "下列何者為影片檔之副檔名？", "o": [".wma", ".wmf", ".wmv", ".rm"], "e": "答案 (3)(4)。.wmv（Windows Media Video）、.rm（RealMedia）是影片。.wma 是音訊；.wmf 是 Windows 中繼檔（向量圖形）。"}, {"n": 288, "code": "1-288", "ans": "124", "multi": true, "q": "下列何者為圖形檔之副檔名？", "o": [".tif", ".ai", ".pdf", ".raw"], "e": "答案 (1)(2)(4)。.tif（TIFF 點陣圖）、.ai（Illustrator 向量圖）、.raw（相機原始影像）都是圖形檔；.pdf 是可攜式文件格式。"}, {"n": 289, "code": "1-289", "ans": "1234", "multi": true, "q": "有關網路網址敘述，下列何者正確？", "o": ["DHCP 伺服器可讓多台電腦共用有限的 Public IP", "一台主機可以擁有多個網域名稱（Domain Name）", "理論上，IPv6 位址可容許的位址個數是 IPv4 位址的 2^96 倍", "在 Windows 之命令提示字元視窗中輸入 ipconfig 可檢視電腦的 IP 位址"], "e": "答案 (1)(2)(3)(4)。DHCP 動態分配可讓有限 IP 輪流使用；一個 IP 可對應多個網域名稱（虛擬主機）；2^128÷2^32＝2^96 倍；ipconfig 可查看 IP 設定。"}, {"n": 290, "code": "1-290", "ans": "124", "multi": true, "q": "有關 SATA 與 IDE 的比較，下列何者正確？", "o": ["SATA 硬碟屬於序列介面，但 IDE 不是", "e-SATA 硬碟支援熱插拔但 IDE 不支援", "SATA 硬碟轉速優於 IDE 硬碟，故傳輸速率較高", "SATA 硬碟排線較 IDE 硬碟為細"], "e": "答案 (1)(2)(4)。SATA 是序列傳輸、排線細、支援熱插拔；IDE（PATA）是並列傳輸、40/80 pin 寬排線。傳輸速率差異來自介面，與碟片轉速無關，(3) 錯。"}, {"n": 291, "code": "1-291", "ans": "23", "multi": true, "q": "下列敘述何者正確？", "o": ["「CPU 2.5GHz，2GB DDR3」，意指此 CPU 時脈週期為 0.5ns", "最新的 BIOS ROM 允許資料複寫", "SSD 硬碟是採用 Flash Memory 製作", "藍芽（Bluetooth）建構於 IEEE 802.11 無線區域網路技術標準"], "e": "答案 (2)(3)。新 BIOS 存於快閃 ROM，可更新複寫；SSD 使用快閃記憶體。(1) 週期＝1/2.5GHz＝0.4ns；(4) 藍牙是 IEEE 802.15.1，802.11 是 Wi-Fi。"}, {"n": 292, "code": "1-292", "ans": "124", "multi": true, "q": "下列何種網頁程式於伺服器端執行？", "o": ["PHP", "Active Server Page", "Dynamic HTML", "Common Gateway Interface"], "e": "答案 (1)(2)(4)。PHP、ASP、CGI 在伺服器端執行，只把結果送回瀏覽器；DHTML（HTML＋CSS＋JavaScript）在用戶端執行。"}, {"n": 293, "code": "1-293", "ans": "134", "multi": true, "q": "下列何種網頁程式於用戶端執行？", "o": ["VBScript", "JSP", "Java Applet", "JavaScript"], "e": "答案 (1)(3)(4)。VBScript、Java Applet、JavaScript 由瀏覽器執行；JSP（Java Server Pages）在伺服器端執行。"}, {"n": 294, "code": "1-294", "ans": "134", "multi": true, "q": "CPU 運作的機器週期中，包含下列哪些步驟？", "o": ["擷取（Fetch）", "編碼（Encode）", "解碼（Decode）", "執行（Execute）"], "e": "答案 (1)(3)(4)。機器週期：擷取 → 解碼 → 執行 →（儲存）。沒有「編碼」。"}, {"n": 295, "code": "1-295", "ans": "13", "multi": true, "q": "電腦硬體結構可分為五大單元，下列哪些敘述正確？", "o": ["算術邏輯單元負責 AND、OR、NOT 運算", "記憶單元負責協調電腦各單元的運作", "滑鼠屬於輸入單元", "鍵盤屬於控制單元"], "e": "答案 (1)(3)。ALU 負責算術與邏輯運算；滑鼠、鍵盤都是輸入單元。協調各單元運作的是控制單元。"}, {"n": 296, "code": "1-296", "ans": "24", "multi": true, "q": "有關光纖的敘述，下列哪些正確？", "o": ["只能傳送數位信號", "可使用的頻寬比同軸電纜高", "由銅線所組成，不受電磁干擾", "傳輸速率比雙絞線高"], "e": "答案 (2)(4)。光纖頻寬與速率都高於同軸電纜、雙絞線。它由玻璃纖維（不是銅線）組成；類比與數位信號都能傳。"}, {"n": 297, "code": "1-297", "ans": "123", "multi": true, "q": "DVD 的相關產品中，下列哪些可以重複讀寫？", "o": ["DVD-RAM", "DVD-RW", "DVD+RW", "DVD-ROM"], "e": "答案 (1)(2)(3)。RAM、RW（ReWritable）都可重複寫入；ROM 是唯讀（Read Only）。"}, {"n": 298, "code": "1-298", "ans": "34", "multi": true, "q": "有關 RAM 的敘述，下列哪些正確？", "o": ["又稱為非揮發性記憶體", "速度比 ROM 慢", "可分為 SRAM 與 DRAM 兩種", "電源關閉後資料會消失"], "e": "答案 (3)(4)。RAM 是揮發性記憶體，斷電資料消失；分為 SRAM（靜態，用於快取）與 DRAM（動態，用於主記憶體）；速度比 ROM 快。"}, {"n": 299, "code": "1-299", "ans": "12", "multi": true, "q": "有關通訊媒體的敘述，下列哪些正確？", "o": ["Wi-Fi 是以 802.11x 協定進行無線傳輸", "紅外線是以直線傳輸的方式傳送資料", "微波在傳送資料時，可以隨著地表曲線而彎曲進行", "微波是以藍芽技術進行無線傳輸"], "e": "答案 (1)(2)。Wi-Fi 依 IEEE 802.11 系列標準；紅外線需直線對準、不能穿牆。微波也是直線傳播，遇地表曲率需中繼站；藍牙是另一種短距離技術。"}, {"n": 300, "code": "1-300", "ans": "13", "multi": true, "q": "有關網路傳輸設備的敘述，下列哪些正確？", "o": ["集線器（Hub）可連接多個網路節點", "中繼器（Repeater）主要用於連接兩個區域網路", "路由器（Router）可連接多個網路", "防火牆主要是用於增強傳輸訊號，延伸訊號的傳輸距離"], "e": "答案 (1)(3)。中繼器的功能是放大訊號、延長傳輸距離（不是連接兩個區域網路）；防火牆用於安全過濾。"}, {"n": 301, "code": "1-301", "ans": "14", "multi": true, "q": "有關暫存器（Register）的敘述，下列哪些正確？", "o": ["暫存器是 CPU 暫存資料的地方", "CPU 對暫存器的存取速度比主記憶體慢", "暫存器的容量是無限的", "CPU 內有多種暫存器，各有其不同的功能"], "e": "答案 (1)(4)。暫存器位於 CPU 內部，是速度最快但容量很小的儲存單元，如 PC、IR、累加器等各有功能。"}, {"n": 302, "code": "1-302", "ans": "234", "multi": true, "q": "下列哪些是電腦使用的匯流排？", "o": ["運算匯流排", "資料匯流排", "位址匯流排", "控制匯流排"], "e": "答案 (2)(3)(4)。系統匯流排分為資料、位址、控制三種，沒有運算匯流排。"}, {"n": 303, "code": "1-303", "ans": "23", "multi": true, "q": "下列哪些是屬於電腦的輸出設備？", "o": ["掃描器", "螢幕", "印表機", "光筆"], "e": "答案 (2)(3)。掃描器、光筆是輸入設備。"}, {"n": 304, "code": "1-304", "ans": "12", "multi": true, "q": "下列哪些十進位轉二進位的結果為正確？", "o": ["(48.625)₁₀=(110000.101)₂", "(6.75)₁₀=(110.11)₂", "(7.5)₁₀=(1110.010)₂", "(5.75)₁₀=(101.011)₂"], "e": "答案 (1)(2)。48＝110000、0.625＝0.101；6＝110、0.75＝0.11。(3) 7.5 應為 111.1；(4) 5.75 應為 101.11。"}, {"n": 305, "code": "1-305", "ans": "13", "multi": true, "q": "下列哪些屬於無線傳輸？", "o": ["紅外線", "光纖", "微波", "雙絞線"], "e": "答案 (1)(3)。光纖、雙絞線都是有線（導向）傳輸媒介。"}, {"n": 306, "code": "1-306", "ans": "1234", "multi": true, "q": "中央處理單元（CPU）中包含下列哪些項目？", "o": ["暫存器", "控制單元", "算術邏輯單元", "快取記憶體"], "e": "答案 (1)(2)(3)(4)。現代 CPU 內含控制單元、ALU、暫存器，以及 L1/L2/L3 快取記憶體。"}, {"n": 307, "code": "1-307", "ans": "134", "multi": true, "q": "有關硬碟的儲存容量大小，下列哪些相同？", "o": ["0.5TB", "512PB", "512GB", "512×1024×1024KB"], "e": "答案 (1)(3)(4)。0.5TB＝0.5×1024GB＝512GB；512×1024×1024KB＝512×1024MB＝512GB。512PB 大得多。"}, {"n": 308, "code": "1-308", "ans": "123", "multi": true, "q": "有關 Modem 的功能敘述，下列哪些正確？", "o": ["它是調變解調器", "可將數位信號轉為類比信號", "可將類比信號轉為數位信號", "可透過網路平行式傳送資料到遠端的電腦"], "e": "答案 (1)(2)(3)。Modem 送出時把數位訊號「調變」成類比、接收時「解調」回數位；它是以序列方式傳輸，不是平行式。"}, {"n": 309, "code": "1-309", "ans": "234", "multi": true, "q": "硬碟的存取時間（Access Time）包含下列哪些？", "o": ["讀取時間（Read Time）", "旋轉時間（Rotation Time）", "資料傳輸時間（Data Transfer Time）", "搜尋時間（Seek Time）"], "e": "答案 (2)(3)(4)。存取時間＝搜尋時間（讀寫頭移到磁軌）＋旋轉延遲時間（磁區轉到讀寫頭下）＋資料傳輸時間。"}, {"n": 310, "code": "1-310", "ans": "34", "multi": true, "q": "有關硬碟的敘述，下列哪些正確？", "o": ["磁軌是硬碟儲存資料的最小單位", "每個磁碟只有一個磁面", "硬碟是透過讀寫頭來讀取磁碟上的資料", "SATA 介面硬碟較 IDE 介面硬碟的傳輸速度快"], "e": "答案 (3)(4)。硬碟存取的最小單位是磁區（Sector），不是磁軌；每片碟片通常上下兩面都能存資料。"}, {"n": 311, "code": "1-311", "ans": "124", "multi": true, "q": "電腦主機板沒有安插任何介面卡就能瀏覽網頁及播放音樂，是因為主機板已內建下列哪些介面卡？", "o": ["網路卡", "音效卡", "電視卡", "顯示卡"], "e": "答案 (1)(2)(4)。上網需要網路卡、播放音樂需要音效卡、看畫面需要顯示卡，現今主機板/CPU 多已內建。電視卡不是必要的。"}, {"n": 312, "code": "1-312", "ans": "1234", "multi": true, "q": "個人電腦中的 USB 連接埠，可以連接下列哪些週邊設備？", "o": ["隨身碟", "鍵盤", "滑鼠", "數位相機"], "e": "答案 (1)(2)(3)(4)。USB 是通用介面，幾乎所有周邊都能連接。"}, {"n": 313, "code": "1-313", "ans": "123", "multi": true, "q": "有關硬碟的儲存容量大小，下列哪些相同？", "o": ["122880 TB", "120×1024×1024 GB", "120×2^50 Bytes", "0.1 EB"], "e": "答案 (1)(2)(3)。三者都等於 120PB：122880TB÷1024＝120PB；120×2^20 GB＝120×2^50 Bytes＝120PB。0.1EB＝0.1×1024PB＝102.4PB。"}, {"n": 314, "code": "1-314", "ans": "24", "multi": true, "q": "某台電腦的資料匯流排有 24 條排線，位址匯流排有 30 條排線，請問此台電腦之 CPU 的定址記憶體空間為何？", "o": ["2^24 bits", "2^30 Bytes", "256MB", "1GB"], "e": "答案 (2)(4)。定址空間只看位址匯流排：2^30 個位址，每個位址 1 Byte＝2^30 Bytes＝1GB。資料匯流排寬度與定址空間無關。"}, {"n": 315, "code": "1-315", "ans": "23", "multi": true, "q": "文數字的 ASCII Code 大小之比較，下列哪些正確？", "o": ["a＞1＞A", "c＞b＞a", "3＞2＞1", "1＞g＞p"], "e": "答案 (2)(3)。ASCII 順序：數字（48～57）＜大寫字母（65～90）＜小寫字母（97～122），同類依序遞增。(1) 應為 a＞A＞1；(4) p＞g＞1。"}, {"n": 316, "code": "1-316", "ans": "12", "multi": true, "q": "有關頻寬單位的說明，下列哪些正確？", "o": ["bps 為每秒傳輸 1 個位元", "Kbps 為每秒傳輸 1024 個位元", "Mbps 為每秒傳輸 100 個位元", "Gbps 為每秒傳輸 2^20 個位元"], "e": "答案 (1)(2)。依題庫以 2 進位計：Kbps＝2^10、Mbps＝2^20、Gbps＝2^30 位元/秒。(3)(4) 數值錯誤。（實務上網路速率多以 1000 為進位。）"}, {"n": 317, "code": "1-317", "ans": "234", "multi": true, "q": "下列哪些是個人電腦使用的輔助記憶體？", "o": ["快取記憶體", "硬碟機", "軟碟機", "光碟機"], "e": "答案 (2)(3)(4)。輔助記憶體是可長期保存資料的外部儲存裝置；快取記憶體屬於主記憶體階層，在 CPU 附近。"}, {"n": 318, "code": "1-318", "ans": "234", "multi": true, "q": "下列哪些元件直接內建於主機板上？", "o": ["光碟機", "晶片組", "BIOS ROM", "擴充槽"], "e": "答案 (2)(3)(4)。晶片組、BIOS ROM、擴充槽（PCIe 等）都焊在主機板上；光碟機是外接的週邊裝置。"}, {"n": 319, "code": "1-319", "ans": "234", "multi": true, "q": "銷售員介紹筆記型電腦的 4 項規格中，下列哪些規格是描述其 CPU？", "o": ["8GB DDRIII", "雙核心", "8MB 快取記憶體", "處理器為 Intel 的 Core i5"], "e": "答案 (2)(3)(4)。8GB DDR3 是主記憶體（RAM）的規格。"}, {"n": 320, "code": "1-320", "ans": "124", "multi": true, "q": "有關個人電腦 BIOS 的敘述，下列哪些正確？", "o": ["BIOS 的全名為 Basic Input Output System", "BIOS 是一種韌體（Firmware）", "BIOS 是使用 RAM 製造，具有揮發性", "當電腦開機時，BIOS 會檢查電腦的相關設備是否正確"], "e": "答案 (1)(2)(4)。BIOS 存於 ROM（快閃記憶體），非揮發性；開機時執行 POST 檢查硬體。"}, {"n": 321, "code": "1-321", "ans": "14", "multi": true, "q": "有關記憶體的敘述，下列哪些正確？", "o": ["SRAM 可被讀取資料，也能寫入資料", "DRAM 的速度比硬式磁碟慢", "當電腦關機後，DRAM 中的資料不會消失", "SRAM 的速度比硬式磁碟快"], "e": "答案 (1)(4)。SRAM、DRAM 都可讀寫，速度都比硬碟快很多，且都是揮發性，關機資料消失。"}, {"n": 322, "code": "1-322", "ans": "124", "multi": true, "q": "下列哪些是電腦的輸入設備？", "o": ["數位相機", "光筆", "繪圖機", "掃描器"], "e": "答案 (1)(2)(4)。繪圖機（Plotter）是輸出設備，用來輸出大型工程圖。"}, {"n": 323, "code": "1-323", "ans": "23", "multi": true, "q": "下列哪些是屬於單向傳輸的匯流排類型？", "o": ["記憶匯流排", "位址匯流排", "控制匯流排", "資料匯流排"], "e": "答案 (2)(3)。依題庫，位址匯流排（CPU→記憶體）與控制匯流排為單向；資料匯流排可雙向傳送資料。"}, {"n": 324, "code": "1-324", "ans": "134", "multi": true, "q": "有關同軸電纜及光纖傳輸媒介之比較，下列哪些正確？", "o": ["光纖是以光脈衝信號的形式傳輸訊號", "光纖的傳輸距離最短", "光纖抗雜訊力較同軸電纜為佳", "光纖的頻寬最寬"], "e": "答案 (1)(3)(4)。光纖傳輸距離長、衰減小，不是最短。"}, {"n": 325, "code": "1-325", "ans": "123", "multi": true, "q": "我國行政院生產力 4.0 發展方案涵蓋了哪些生產力 4.0？", "o": ["製造業生產力 4.0", "農業生產力 4.0", "商業服務業生產力 4.0", "教育事業生產力 4.0"], "e": "答案 (1)(2)(3)。行政院生產力 4.0 方案涵蓋製造業、商業服務業、農業三大領域。"}, {"n": 326, "code": "1-326", "ans": "134", "multi": true, "q": "下列哪
